# --- hook-guard-canon-readonly.py -------------------------------------------------------------------------

[[row]]
hook = "hook-guard-canon-readonly.py"
branch = "stdin is not JSON, or JSON that is not an object"
location = "main"
field = "stdin"
fed_by = "stdin"
reachable_from_claude = false
disposition = "left"
reason = "not a tool argument; Claude Code always sends a JSON object, and the bridge serialises a dict"
bridge_note = "opencode_events.build_payload returns a dict that the bridge dumps as JSON"

[[row]]
hook = "hook-guard-canon-readonly.py"
branch = "tool_input is not an object, or a Bash command is missing or not a string"
location = "decide"
field = "tool_input, tool_input.command"
fed_by = "tool_argument"
reachable_from_claude = false
disposition = "refused"
reason = "Claude Code's Bash tool requires a string command and every tool input is an object"
fixture = "unreadable/canon_bash_no_command.json"

[[row]]
hook = "hook-guard-canon-readonly.py"
branch = "an Edit or Write file_path is missing, not a string or empty"
location = "decide"
field = "tool_input.file_path"
fed_by = "tool_argument"
reachable_from_claude = false
disposition = "refused"
reason = "Edit and Write require a string file_path"
fixture = "unreadable/canon_edit_no_file_path.json"

[[row]]
hook = "hook-guard-canon-readonly.py"
branch = "an Edit or Write file_path is relative"
location = "decide"
field = "tool_input.file_path"
fed_by = "tool_argument"
reachable_from_claude = false
disposition = "refused"
reason = "the tool schemas of Edit and Write require an absolute path; the hook never resolved a relative one against cwd"
fixture = "unreadable/canon_edit_relative_path.json"

[[row]]
hook = "hook-guard-canon-readonly.py"
branch = "shlex cannot split the command, so no git commit and no write target is seen"
location = "_is_git_commit, bash_write_targets.segments"
field = "tool_input.command"
fed_by = "tool_argument"
reachable_from_claude = true
disposition = "left"
reason = "a command shlex rejects but the shell runs reaches the hook from Claude Code, so refusing would change a Claude verdict (fixture claude/canon_bash_commit_unbalanced_quote.json)"
bridge_note = "the bridge passes a string command through as it is, as Claude Code does"

[[row]]
hook = "hook-guard-canon-readonly.py"
branch = "cwd is not a directory that exists, so a git commit is not placed in any checkout"
