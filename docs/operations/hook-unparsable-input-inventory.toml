# Allow-on-unreadable-input inventory of the PreToolUse hooks that scripts/install-reminder-hooks.sh wires.
#
# Difficulty removed: a denying hook that lets a call pass because it could not read the call turns the
# OpenCode adapter's refusal into a pass. The adapter builds the hook payload itself (scripts/lib/opencode_events.py
# claude_input) and refuses a call whose required argument is absent or of the wrong type, so a branch fed by a tool
# argument is not reached from OpenCode. This file lists every such branch, so a hook that gains one is seen.
#
# [[hook]]   one per hook wired on PreToolUse; denies = false names a hook that has no way to refuse a call
#            (test_inventory_covers_every_denying_hook checks its source for one).
# [[row]]    one per branch of a denying hook that allows because input could not be read:
#   hook, branch, location (file and function; lines drift, names do not), field (what could not be read),
#   fed_by (tool_argument | payload | stdin | state | environment),
#   reachable_from_claude (can Claude Code send an input that takes the branch),
#   disposition = "refused" (the hook now refuses at it; fixture names the unreadable/ payload that proves it)
#               | "left" (the branch stays as it is; reason says why),
#   bridge_call (left, tool_argument, not reachable: an OpenCode call that would build such a payload; the
#   bridge refuses it, test_left_inventory_rows_refused_by_bridge) or bridge_note (any other left row).
# Hooks changed by this stage: hook-guard-canon-readonly.py, hook-guard-permission-surface.py (user decision
# 2026-11-25). Every other row is left, because refusing there is not the stage's to change.

[[hook]]
script = "hook-guard-canon-readonly.py"
denies = true

[[hook]]
script = "hook-guard-permission-surface.py"
denies = true

[[hook]]
script = "hook-state-gate.py"
denies = true

[[hook]]
script = "hook-scope-conflict.py"
denies = true

[[hook]]
script = "hook-guard-destructive-rm.py"
denies = true

[[hook]]
script = "hook-guard-subagent-destructive-action.py"
denies = true

[[hook]]
script = "hook-guard-agent-specialist-stand-in.py"
denies = true

[[hook]]
script = "hook-guard-bash-source-edit.py"
denies = true

[[hook]]
script = "hook-multi-mount-search-guard.py"
denies = true

[[hook]]
script = "hook-plan-delivery-gate.py"
denies = true

[[hook]]
script = "hook-escalation-diagnosis-gate.py"
denies = true

[[hook]]
script = "hook-deferring-disposition-gate.py"
denies = true

[[hook]]
script = "hook-resolution-reminder.py"
denies = true

[[hook]]
