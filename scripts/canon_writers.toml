# Registry of scripts that can write files: where each one's writes land when
# it runs from the canonical checkout. Checked by verify-canon-writers.py
# (a candidate without an entry, a dangling entry, a bad disposition or empty
# reason, or a `routed` entry that does not import lib.worktree_route fails).
#
# disposition / category:
#   routed     / routed              writes tracked files; goes through lib/worktree_route.py
#   exempt     / exempt-maintenance  edits tracked files; run by a maintainer inside a worktree
#   exempt     / exempt-landing      is itself the landing / sync path
#   exempt     / exempt-config-root  installs into the config root or machine, not into tracked files
#   not-canon  / not-canon           writes only outside the repo (state, logs, /tmp, linked worktrees)
#   deferred   / deferred            writes tracked files and is not routed yet (issue #353 scope)
#
# Classify a new writer: `python3 scripts/verify-canon-writers.py --list-candidates`
# shows what the picker matched; read the file, then add one line here.

[writers]

# --- routed: write tracked files, reach the repo through worktree_route ---
"scripts/record-experience.py" = { disposition = "routed", category = "routed", reason = "creates and extends experience leaves and MEMORY.md indexes under memory-global/" }
"scripts/stamp-memory-dates.py" = { disposition = "routed", category = "routed", reason = "rewrites created/last_verified frontmatter of memory leaves" }
"scripts/gen_crutch_registry.py" = { disposition = "routed", category = "routed", reason = "regenerates scripts/crutch_registry.toml and the crutch docs" }
"scripts/permissions-cli.py" = { disposition = "routed", category = "routed", reason = "edits permissions/*.json grant files" }
"scripts/verify-readme.py" = { disposition = "routed", category = "routed", reason = "--fix rewrites the README inventory tables" }

# --- exempt-maintenance: edit tracked files, run by a maintainer in a worktree ---
"scripts/verify-judge-prose-numbers.py" = { disposition = "exempt", category = "exempt-maintenance", reason = "--repin rewrites its own allowlist file; a deliberate maintainer action, reviewed in the diff" }
"scripts/verify-config-root-refs.py" = { disposition = "exempt", category = "exempt-maintenance", reason = "--repin rewrites its own allowlist file; a deliberate maintainer action, reviewed in the diff" }

# --- exempt-landing: the sync / landing path itself ---
"scripts/land-branch.py" = { disposition = "exempt", category = "exempt-landing", reason = "advances main from a branch; the route calls it, so it cannot be routed through itself" }
"scripts/land-on-main.sh" = { disposition = "exempt", category = "exempt-landing", reason = "applies and commits a change onto main; the landing primitive" }
"scripts/sync-instructions-repo.sh" = { disposition = "exempt", category = "exempt-landing", reason = "pull/push sync of the canonical checkout; ff-merges origin/main by design" }
"scripts/lib/worktree_route.py" = { disposition = "exempt", category = "exempt-landing", reason = "the route itself: creates and removes its own worktrees and ff-pulls the canonical checkout" }

