# Defaults of the historical causes fixture (lib/telemetry/fixtures/replan_causes_2026_11_03.*).
# A hand row whose replan could not be aligned, or whose aligned text names no single registry
# entry, still needs a place and (for the machinery flag) a baseline. Per category:
#   machinery_induced - the majority value of the 235 hand rows; a row that differs is stored with
#                       machinery_override = true.
#   place             - the place given to a machinery-induced row whose mechanism is `unknown`.
# A row that is not machinery-induced gets `non_machinery_place`.

non_machinery_place = "none"

[[categories]]
name = "check_authoring_defect"
machinery_induced = false
place = "verification"

