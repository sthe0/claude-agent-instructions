# Digest-bound repo-script effects registry.
#
# Each [[script]] entry names a REVIEWED script, the exact sha256 of the
# bytes reviewed, and the resolver (in scripts/agentctl/script_effects.py's
# `_RESOLVERS`) that knows the script's argument grammar well enough to
# compute its resources ahead of execution. A live file whose sha256 no
# longer matches is untrusted (script-digest-mismatch) until this entry is
# re-reviewed and re-pinned — an edit to the script never silently keeps the
# old trust.
#
# `op = "land"` effects are never declared here (or anywhere else — see
# tool_contracts.py / plan.py): landing is decided ONLY by the separately
# checkpointed landed-spec resolver, not by this registry.

[[script]]
path = "scripts/land-branch.py"
sha256 = "f3284eccee976f1da296a1398eff878eadf9c45812d7dd87e151328cca525637"
resolver = "land_branch"

[[script]]
path = "scripts/instruction-smoke-gate.py"
sha256 = "e8905bebf9e3f1af494ca4ea2f175bdad0f92286e3e3f87ba6f4aa99cdc1faf7"
resolver = "instruction_smoke_gate"
