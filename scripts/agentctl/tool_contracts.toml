# Reviewed per-tool effect contracts (REQ3).
#
# One [[program]] entry per program NAME (agentctl/tool_contracts.py's loader
# refuses a duplicate name). `effect` is one of:
#   "none"       - the program's own documented contract never writes to the
#                  filesystem or an external resource. A generic shell output
#                  redirect (`>`, `>>`) on the SAME segment still resolves to
#                  a file write regardless of this entry -- that is the
#                  shell's own effect, not the program's, and is decided by
#                  lib/bash_write_targets, not by this table.
#   "writes-operands" - the program's own contract writes a file named by its
#                  arguments; the target(s) are located by the shared
#                  lib/bash_write_targets lexer (already reviewed there for
#                  the canon-readonly guard), never by pattern-matching this
#                  entry's own text.
#   "unresolved" - the effect is not decidable from the command line alone
#                  (an unbounded DSL, an argument-dependent target this table
#                  does not attempt to resolve, or a form this plan
#                  deliberately leaves unresolved e.g. a delete/force push).
#   "resolver"   - argument-dependent; resolved by the matching Python
#                  function in `agentctl/tool_contracts.py`'s
#                  `_CUSTOM_RESOLVERS` table, cited per program below.
#
# `source` names where the contract was verified (man page / --help output /
# an in-repo module this plan already reviews for the same lexing).

# --- read-only (effect = "none") --------------------------------------------

[[program]]
name = "ls"
effect = "none"
safe_flags = ["*"]
source = "GNU coreutils ls(1): lists directory entries; no write. safe_flags=[\"*\"]: no flag in ls(1) writes anywhere."

[[program]]
name = "cat"
effect = "none"
safe_flags = ["*"]
source = "POSIX cat(1): concatenates and prints files; no write. safe_flags=[\"*\"]: no flag in cat(1) writes anywhere."

[[program]]
name = "head"
effect = "none"
safe_flags = ["*"]
source = "GNU coreutils head(1): prints the first part of files; no write. safe_flags=[\"*\"]: no flag in head(1) writes anywhere."

[[program]]
name = "tail"
effect = "none"
safe_flags = ["*"]
source = "GNU coreutils tail(1): prints the last part of files; no write. safe_flags=[\"*\"]: no flag in tail(1) writes anywhere."

[[program]]
name = "less"
effect = "none"
safe_flags = ["-N", "-S", "-X", "-F", "-R", "-r", "-i", "-I", "-M", "-m", "-c", "-e", "-P"]
source = "less(1): a pager; no write absent -o/-O/--log-file (excluded from safe_flags -- each writes the input to a log file)."

[[program]]
name = "more"
effect = "none"
safe_flags = ["-N", "-S", "-X", "-F", "-R", "-r", "-i", "-I", "-M", "-m", "-c", "-e", "-P"]
source = "more(1): a pager; no write absent -o/-O/--log-file (excluded from safe_flags, same as less)."

[[program]]
name = "wc"
effect = "none"
safe_flags = ["*"]
source = "GNU coreutils wc(1): counts lines/words/bytes; no write. safe_flags=[\"*\"]: no flag in wc(1) writes anywhere."

[[program]]
name = "stat"
effect = "none"
safe_flags = ["*"]
source = "GNU coreutils stat(1): displays file status; no write. safe_flags=[\"*\"]: no flag in stat(1) writes anywhere."

[[program]]
name = "file"
effect = "none"
safe_flags = ["-b", "-i", "-L", "-z", "-k", "-N", "-s", "-h", "-r", "-n", "-0"]
source = "file(1): determines file type; no write absent -C/--compile (excluded from safe_flags -- writes a compiled magic file)."

[[program]]
name = "tree"
effect = "none"
safe_flags = ["-a", "-d", "-f", "-i", "-L", "-P", "-I", "--dirsfirst", "-h", "-s", "-p", "-u", "-g", "-D", "-F", "--noreport", "-C", "-n", "-A"]
source = "tree(1): lists directory contents as a tree; no write absent -o (excluded from safe_flags -- writes output to a file)."

[[program]]
name = "du"
effect = "none"
safe_flags = ["*"]
source = "GNU coreutils du(1): estimates file space usage; no write. safe_flags=[\"*\"]: no flag in du(1) writes anywhere."

[[program]]
name = "df"
effect = "none"
safe_flags = ["*"]
source = "GNU coreutils df(1): reports filesystem disk usage; no write. safe_flags=[\"*\"]: no flag in df(1) writes anywhere."

[[program]]
name = "grep"
effect = "none"
safe_flags = ["*"]
source = "GNU grep(1): prints matching lines; no write (absent -l/--include write flags -- grep has none). safe_flags=[\"*\"]: no flag in grep(1) writes anywhere."

[[program]]
name = "rg"
effect = "resolver"
source = "ripgrep --help: no write flag exists, but --pre runs an arbitrary preprocessor command on every searched file -- resolved by _resolve_rg, which is unresolved iff --pre/--pre= is present."

[[program]]
name = "printf"
effect = "none"
safe_flags = ["*"]
source = "POSIX printf(1): writes to stdout only; a `>` redirect is the shell's effect, resolved separately. safe_flags=[\"*\"]: no flag in printf(1) writes anywhere on its own."

[[program]]
name = "echo"
effect = "none"
safe_flags = ["*"]
source = "POSIX echo(1): writes to stdout only; a `>` redirect is the shell's effect, resolved separately. safe_flags=[\"*\"]: no flag in echo(1) writes anywhere on its own."

[[program]]
name = "jq"
effect = "none"
safe_flags = ["*"]
source = "jq(1): a JSON filter writing to stdout only (no -o); a `>` redirect is the shell's effect. safe_flags=[\"*\"]: no flag in jq(1) writes anywhere on its own."

[[program]]
name = "realpath"
effect = "none"
safe_flags = ["*"]
source = "GNU coreutils realpath(1): prints a resolved path; no write. safe_flags=[\"*\"]: no flag in realpath(1) writes anywhere."

[[program]]
name = "readlink"
effect = "none"
safe_flags = ["*"]
source = "GNU coreutils readlink(1): prints a symlink target; no write. safe_flags=[\"*\"]: no flag in readlink(1) writes anywhere."

[[program]]
name = "which"
effect = "none"
safe_flags = ["*"]
source = "which(1): locates a program in PATH; no write. safe_flags=[\"*\"]: no flag in which(1) writes anywhere."

[[program]]
name = "whoami"
effect = "none"
safe_flags = ["*"]
source = "GNU coreutils whoami(1): prints the effective user; no write. safe_flags=[\"*\"]: no flag in whoami(1) writes anywhere."

[[program]]
name = "date"
effect = "resolver"
source = "GNU coreutils date(1): prints the date and has no file-write flag, but -s/--set changes SYSTEM clock state -- resolved by _resolve_date, which is unresolved iff -s/--set is present."

[[program]]
name = "pwd"
effect = "none"
safe_flags = ["*"]
source = "POSIX pwd(1): prints the working directory; no write. safe_flags=[\"*\"]: no flag in pwd(1) writes anywhere."

[[program]]
name = "env"
effect = "none"
safe_flags = ["*"]
source = "POSIX env(1) run bare (no command operand): prints the environment; no write. A command operand makes `env` a wrapper, stripped before program identification ever sees it. safe_flags=[\"*\"]: defensive backstop only -- `_strip_closed_wrappers` already refuses any flag on env's wrapper form before this generic check would see one, and the bare no-args form never has a `-`-prefixed operand."

[[program]]
name = "printenv"
effect = "none"
safe_flags = ["*"]
source = "GNU coreutils printenv(1): prints environment variables; no write. safe_flags=[\"*\"]: no flag in printenv(1) writes anywhere."

[[program]]
name = "shasum"
effect = "none"
safe_flags = ["*"]
source = "Perl shasum(1): prints a digest to stdout only; no write absent -o (not offered by this program). safe_flags=[\"*\"]: no flag in shasum(1) writes anywhere."

[[program]]
name = "sha256sum"
effect = "none"
safe_flags = ["*"]
source = "GNU coreutils sha256sum(1): prints a digest to stdout only; no write flag exists. safe_flags=[\"*\"]: no flag in sha256sum(1) writes anywhere."

# --- read-only git subcommands (dispatched via the "resolver" entry below,
# listed here only for the loader's one-entry-per-program review) ----------

# --- write-target verbs resolved via lib/bash_write_targets -----------------

[[program]]
name = "sed"
effect = "resolver"
source = "GNU sed(1): -i/--in-place rewrites its file operand(s) in place, resolved by lib/bash_write_targets.segment_write_target (already reviewed for the canon-readonly guard); absent -i, sed writes stdout only UNLESS its own script contains an embedded w/W/e command (each of which writes/executes regardless of -i) -- resolved by _resolve_sed, which is unresolved whenever a w/W/e command cannot be proven absent from the script text."

[[program]]
name = "tee"
effect = "writes-operands"
source = "POSIX tee(1): writes each non-flag operand as a file; resolved by lib/bash_write_targets.segment_write_target."

[[program]]
name = "cp"
effect = "resolver"
source = "POSIX cp(1): writes its destination operand; the ordinary case (directory destinations expanded to per-source targets) is resolved by lib/bash_write_targets.segment_write_target, still consulted unconditionally by resolve_command -- _resolve_cp only refuses --parents, whose actual write path (each source's own directory structure preserved under the destination) that shared computation does not model."

[[program]]
name = "mv"
effect = "resolver"
source = "POSIX mv(1): writes its destination operand (resolved by lib/bash_write_targets.segment_write_target, as for cp) AND removes its source operand(s), which that shared computation does not model -- _resolve_mv adds each source as its own write resource under a closed flag grammar."

[[program]]
name = "install"
effect = "resolver"
source = "GNU coreutils install(1): writes its destination operand in the ordinary case (resolved by lib/bash_write_targets.segment_write_target, as for cp); -d/--directory mode instead creates EVERY positional as its own directory, a shape that shared computation does not model -- _resolve_install computes dir-mode's targets itself under a closed flag grammar."

[[program]]
name = "patch"
effect = "unresolved"
reason = "patch's actual write target is named inside the patch body/headers (or derived from -p's strip count against those headers), not decidable from the command line alone; a positional FILE operand or any of -o/-d/-r/-b/-B changes or adds to that target in ways this table does not attempt to resolve."
source = "POSIX patch(1): writes the file(s) named by the patch body it is given."

# --- always unresolved (effect not decidable from the command line) --------

[[program]]
name = "dd"
effect = "unresolved"
reason = "dd's of= target is not resolved by lib/bash_write_targets (no verb dispatch for it); treated as unresolved rather than silently missed."
source = "GNU coreutils dd(1): writes its of= operand."

[[program]]
name = "rsync"
effect = "unresolved"
reason = "rsync's destination argument and --delete/-a semantics are not resolved by this table."
source = "rsync(1): writes/deletes at its destination argument."

[[program]]
name = "ln"
effect = "unresolved"
reason = "ln's link-target semantics (and -f overwrite) are not resolved by this table."
source = "POSIX ln(1): creates a link at its destination operand."

[[program]]
name = "truncate"
effect = "unresolved"
reason = "truncate's target argument is not resolved by this table."
source = "GNU coreutils truncate(1): writes (truncates) its file operand."

[[program]]
name = "touch"
effect = "unresolved"
reason = "touch's operand(s) are not resolved by this table (also creates missing files, not only mtimes)."
source = "POSIX touch(1): creates/updates its file operand(s)."

[[program]]
name = "curl"
effect = "unresolved"
reason = "curl's -o/-O/--upload-file targets and outbound network effect are not resolved by this table."
source = "curl(1): can write a local file (-o/-O) and/or call an external service."

[[program]]
name = "wget"
effect = "unresolved"
reason = "wget's -O target and outbound network effect are not resolved by this table."
source = "wget(1): can write a local file (-O) and/or call an external service."

[[program]]
name = "kill"
effect = "unresolved"
reason = "signals an external process; not a resource this table types."
source = "POSIX kill(1): sends a signal to a process."

# --- argument-dependent, resolved by a named Python function ---------------

[[program]]
name = "awk"
effect = "resolver"
source = "POSIX awk(1): `print > \"file\"` inside an awk program can write anywhere the script names, decided by data the command line does not show -- always unresolved (matches grants.py's _UNCONDITIONALLY_REFUSED_PROGRAMS bias)."

[[program]]
name = "find"
effect = "resolver"
source = "POSIX find(1): -exec/-execdir/-ok/-okdir run an arbitrary command per matched file -- unresolved; absent those flags find itself never writes."

[[program]]
name = "git"
effect = "resolver"
source = "git-push(1) / git(1): a read-only subcommand (log, status, diff, show, rev-parse, ls-files, blame) with no --output= target resolves to no effect -- branch/remote/config are excluded from this set since each can write (create/delete a branch or remote, change repo config); `push` with a literal remote and literal, non-force, non-delete refspec(s), from an allowed flag set, with -C/--git-dir/--work-tree (if given) equal to the venue, resolves to a vcs_ref push resource per refspec destination; a force/delete/mirror-equivalent form, a `+`-prefixed refspec, a zero-refspec push, any flag outside the allowed set, or any other subcommand is unresolved."

[[program]]
name = "pytest"
effect = "resolver"
source = "pytest writes cache/coverage artifacts under its invocation cwd (.pytest_cache, coverage files); resolved to a write on the whole venue subtree -- a known over-broad residual (a test could theoretically write further out via an absolute path in its own body, not decidable from the command line)."

[[program]]
name = "python3"
effect = "resolver"
source = "An interpreter's effect is entirely a property of the script it runs, not decidable from the command line; resolved to 'unresolved' with a content-bound identity (REQ3) unless a future script-effects registry entry covers the exact script by digest (checkpoint b)."

[[program]]
name = "python"
effect = "resolver"
source = "Same as python3."
