# Reviewed per-tool effect contracts (REQ3).
#
# One [[program]] entry per program NAME (agentctl/tool_contracts.py's loader
# refuses a duplicate name). `effect` is one of:
#   "none"       - the program's own documented contract never writes to the
#                  filesystem or an external resource. A generic shell output
#                  redirect (`>`, `>>`) on the SAME segment still resolves to
#                  a file write regardless of this entry -- that is the
#                  shell's own effect, not the program's, and is decided by
#                  lib/bash_write_targets, not by this table.
#   "unresolved" - the effect is not decidable from the command line alone
#                  (an unbounded DSL, an argument-dependent target this table
#                  does not attempt to resolve, or a form this plan
#                  deliberately leaves unresolved e.g. a delete/force push).
#   "resolver"   - argument-dependent; resolved by the matching Python
#                  function in `agentctl/tool_contracts.py`'s
#                  `_CUSTOM_RESOLVERS` table, cited per program below.
#
# `source` names where the contract was verified (man page / --help output /
# an in-repo module this plan already reviews for the same lexing).

# --- read-only (effect = "none") --------------------------------------------

[[program]]
name = "ls"
effect = "none"
safe_flags = ["*"]
source = "GNU coreutils ls(1): lists directory entries; no write. safe_flags=[\"*\"]: no flag in ls(1) writes anywhere."

[[program]]
name = "cat"
effect = "none"
safe_flags = ["*"]
source = "POSIX cat(1): concatenates and prints files; no write. safe_flags=[\"*\"]: no flag in cat(1) writes anywhere."

[[program]]
name = "head"
effect = "none"
safe_flags = ["*"]
source = "GNU coreutils head(1): prints the first part of files; no write. safe_flags=[\"*\"]: no flag in head(1) writes anywhere."

[[program]]
name = "tail"
effect = "none"
safe_flags = ["*"]
source = "GNU coreutils tail(1): prints the last part of files; no write. safe_flags=[\"*\"]: no flag in tail(1) writes anywhere."

[[program]]
name = "wc"
effect = "none"
safe_flags = ["*"]
source = "GNU coreutils wc(1): counts lines/words/bytes; no write. safe_flags=[\"*\"]: no flag in wc(1) writes anywhere."

[[program]]
name = "grep"
effect = "none"
safe_flags = ["*"]
source = "GNU grep(1): prints matching lines to stdout; no write. safe_flags=[\"*\"]: no flag in grep(1) writes anywhere."

[[program]]
name = "rg"
effect = "none"
safe_flags = ["-n", "--line-number", "-N", "--no-line-number", "-i", "--ignore-case", "-s", "--case-sensitive", "-S", "--smart-case", "-v", "--invert-match", "-w", "--word-regexp", "-x", "--line-regexp", "-c", "--count", "--count-matches", "-l", "--files-with-matches", "--files-without-match", "-o", "--only-matching", "-A", "-B", "-C", "--context", "--after-context", "--before-context", "-e", "--regexp", "-f", "--file", "-F", "--fixed-strings", "-g", "--glob", "--iglob", "-t", "--type", "-T", "--type-not", "--hidden", "--no-ignore", "-u", "--unrestricted", "-m", "--max-count", "-q", "--quiet", "-a", "--text", "-H", "--with-filename", "-I", "--no-filename", "--color", "--heading", "--no-heading", "-p", "--pretty"]
source = "ripgrep --help: every flag in this list is read-only per its own doc; --pre/--pre-glob (runs an arbitrary preprocessor command per file) and --replace/-r (rewrites matched text, only meaningful combined with a write flag ripgrep does not have on its own but still excluded on principle) are deliberately absent. Residual this table does not resolve: the session environment variable RIPGREP_CONFIG_PATH can inject additional, unreviewed flags (including --pre) via an ambient config file."

# --- unresolved: outside the reviewed read-only table, not git-related -----

[[program]]
name = "date"
effect = "unresolved"
reason = "date is outside the reviewed read-only program table, and -s/--set changes SYSTEM clock state, which this table does not review at any flag grammar."
source = "GNU coreutils date(1): -s/--set changes system clock state; otherwise prints the date."

# --- unresolved: write target is named by an operand this table does not
# resolve --------------------------------------------------------------------

[[program]]
name = "sed"
effect = "unresolved"
reason = "sed's write target depends on -i's presence and its own script text (an embedded w/W/e command writes or executes regardless of -i); neither is decidable from a closed per-flag grammar alone, so every sed invocation is unresolved."
source = "GNU sed(1): -i/--in-place rewrites its file operand(s) in place; absent -i, an embedded w/W/e command can still write or execute."

[[program]]
name = "tee"
effect = "unresolved"
reason = "tee writes each non-flag operand as a file; a target named by an arbitrary operand is outside the reviewed closed command grammar."
source = "POSIX tee(1): writes each non-flag operand as a file."

[[program]]
name = "cp"
effect = "unresolved"
reason = "cp's destination -- and, under --parents, the source directory structure it preserves under that destination -- is outside the reviewed closed command grammar."
source = "POSIX cp(1): writes its destination operand."

[[program]]
name = "mv"
effect = "unresolved"
reason = "mv writes its destination operand and removes its source operand(s); neither is in the reviewed closed command grammar."
source = "POSIX mv(1): writes its destination operand and removes its source operand(s)."

[[program]]
name = "install"
effect = "unresolved"
reason = "install writes its destination operand in the ordinary case, or creates every positional as a directory under -d/--directory; neither is in the reviewed closed command grammar."
source = "GNU coreutils install(1): writes its destination operand, or creates directories under -d/--directory."

[[program]]
name = "patch"
effect = "unresolved"
reason = "patch's actual write target is named inside the patch body/headers (or derived from -p's strip count against those headers), not decidable from the command line alone; a positional FILE operand or any of -o/-d/-r/-b/-B changes or adds to that target in ways this table does not attempt to resolve."
source = "POSIX patch(1): writes the file(s) named by the patch body it is given."

# --- always unresolved (effect not decidable from the command line) --------

[[program]]
name = "dd"
effect = "unresolved"
reason = "dd's of= target is not resolved by this table; treated as unresolved rather than silently missed."
source = "GNU coreutils dd(1): writes its of= operand."

[[program]]
name = "rsync"
effect = "unresolved"
reason = "rsync's destination argument and --delete/-a semantics are not resolved by this table."
source = "rsync(1): writes/deletes at its destination argument."

[[program]]
name = "ln"
effect = "unresolved"
reason = "ln's link-target semantics (and -f overwrite) are not resolved by this table."
source = "POSIX ln(1): creates a link at its destination operand."

[[program]]
name = "truncate"
effect = "unresolved"
reason = "truncate's target argument is not resolved by this table."
source = "GNU coreutils truncate(1): writes (truncates) its file operand."

[[program]]
name = "touch"
effect = "unresolved"
reason = "touch's operand(s) are not resolved by this table (also creates missing files, not only mtimes)."
source = "POSIX touch(1): creates/updates its file operand(s)."

[[program]]
name = "curl"
effect = "unresolved"
reason = "curl's -o/-O/--upload-file targets and outbound network effect are not resolved by this table."
source = "curl(1): can write a local file (-o/-O) and/or call an external service."

[[program]]
name = "wget"
effect = "unresolved"
reason = "wget's -O target and outbound network effect are not resolved by this table."
source = "wget(1): can write a local file (-O) and/or call an external service."

[[program]]
name = "kill"
effect = "unresolved"
reason = "signals an external process; not a resource this table types."
source = "POSIX kill(1): sends a signal to a process."

# --- unresolved: an embedded DSL can write data the command line never shows

[[program]]
name = "awk"
effect = "unresolved"
reason = "`print > \"file\"` inside an awk program can write anywhere the script names, decided by data the command line does not show."
source = "POSIX awk(1): `print > \"file\"` inside an awk program can write anywhere the script names."

[[program]]
name = "find"
effect = "unresolved"
reason = "-exec/-execdir/-ok/-okdir run an arbitrary command per matched file, and a plain listing invocation is outside the reviewed read-only program table."
source = "POSIX find(1): -exec/-execdir/-ok/-okdir run an arbitrary command per matched file."

# --- argument-dependent, resolved by a named Python resolver function ------

[[program]]
name = "git"
effect = "resolver"
source = "git-push(1) / git(1): a read-only subcommand (log, status, diff, show, rev-parse, ls-files, blame) resolves to no effect only under its OWN closed, boolean-only flag set (agentctl/tool_contracts.py's _GIT_READONLY_SAFE_FLAGS) -- a flag outside that per-subcommand set (e.g. diff/show's --ext-diff/--textconv, which can invoke an external program via the config-driven diff.external or a configured filter driver; log/status's --show-signature, which invokes gpg; any flag touching the config-driven fsmonitor hook; or an abbreviated long option, since git supports unique-prefix abbreviation) is unresolved; `branch` resolves to no effect under its own closed boolean-flag set (any value-taking flag or positional branch name is unresolved, since each names a create/rename/delete or filters differently than plain listing) -- remote/config are excluded entirely since each can write (create/delete a remote, change repo config); `push` with a literal remote and literal, non-force, non-delete refspec(s), from an allowed flag set, with -C/--git-dir/--work-tree (if given) equal to the venue, resolves to a vcs_ref push resource per refspec destination -- the `push <remote> tag <name>` shorthand (a distinct grammar form, not two independent refspecs) is unresolved rather than misparsed; a force/delete/mirror-equivalent form, a `+`-prefixed refspec, a zero-refspec push, any flag outside the allowed set, or any other subcommand is unresolved. Residuals this table does not attempt to resolve: a configured `remote.<name>.push` refspec mapping and any pre-push hook can each change what a resolved push actually does on the remote, and ambient session environment variables (GIT_*, e.g. GIT_SSH_COMMAND) can redirect the transport -- all outside the command line this table reviews."

[[program]]
name = "pytest"
effect = "resolver"
source = "pytest writes cache/coverage artifacts under its invocation cwd (.pytest_cache, coverage files); resolved to a write on the whole venue subtree -- a known over-broad residual (a test could theoretically write further out via an absolute path in its own body, not decidable from the command line). Further residuals this table does not resolve: tmp_path-based tests write under the system temp dir rather than the venue subtree; an ini file above the venue can move pytest's own rootdir/.pytest_cache location; an ancestor conftest.py outside the venue still executes; and session environment variables such as PYTEST_ADDOPTS inject extra, unreviewed CLI flags."

[[program]]
name = "python3"
effect = "resolver"
source = "An interpreter's effect is entirely a property of the script it runs, not decidable from the command line; resolved to 'unresolved' with a content-bound identity (REQ3) unless a script-effects registry entry (agentctl/script_effects.py, consulted from _resolve_interpreter) covers the exact script by digest."

[[program]]
name = "python"
effect = "resolver"
source = "Same as python3."
