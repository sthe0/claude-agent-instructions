[meta]
armed = 2026-10-20
review_after_weeks = 8
enabled = true
max_items_per_run = 10
queue_cap = 100
max_external_calls_per_run = 30

# External sources read by `improvement-scan.py sources`.
# Adding, enabling or removing a source is the user's act; the scan only proposes candidates.

