# Slow tests and the paths they guard. scripts/tests/slow_selection.py reads this file;
# conftest.py marks every listed test `slow` and decides at collection whether it runs.
#
# When the slow set runs:
#   - by default, a slow test runs only if one of its `guards` globs matches a changed
#     path: `git diff` against the base (committed, staged and unstaged) plus untracked,
#     non-ignored files. Otherwise it is skipped (a skip, never a deselect), and the
#     skip reason names this rule.
#   - the base is AGENTCTL_SLOW_BASE when set, else the merge base of HEAD with
#     origin/main. When that merge base cannot be computed (no origin/main, a git error,
#     a timeout) or equals HEAD (e.g. right after landing), every slow test runs.
#     An explicit AGENTCTL_SLOW_BASE is taken as given: AGENTCTL_SLOW_BASE=HEAD on a
#     clean tree skips them all.
#   - `pytest --run-slow` or AGENTCTL_SLOW_TESTS=all runs every slow test.
#   - a plan check that must stay discriminating after its branch lands pins
#     AGENTCTL_SLOW_BASE to the commit it was planned against, because the implicit
#     merge base then equals HEAD and the check would no longer see its own change.
#
# Preview the decision: python3 scripts/tests/slow_selection.py [--base REF | --changed FILE]
#
# Each [[slow]] group lists node ids (a prefix also matches its parametrized ids) sharing
# one guard set. A mutation catalogue declares `catalogue_targets`: the control module
# whose catalogue names the files its mutants are applied to and the tests that catch
# them; test_slow_selection.py checks that each of those paths matches a guard glob.
# Paths and globs are relative to the repo root; `*` also matches across `/`.

[[slow]]
nodes = ["scripts/tests/test_review_exhaustion_reflection.py::test_rx_mutation_catalogue_kills_every_mutant"]
guards = [
    "scripts/agentctl/gates.py",
    "scripts/agentctl/cli.py",
    "scripts/agentctl/task_accumulator.py",
    "scripts/tests/test_review_exhaustion_reflection.py",
    "scripts/tests/rx_mutation_control.py",
    "config.md",
    "docs/operations/review-backstop-arming.json",
]
catalogue_targets = { module = "scripts/tests/rx_mutation_control.py", kind = "mutants", relpath_root = "scripts", ids_root = "scripts" }

