material = "the current baseline (traces to R1)"
material_refs = [".ccgram/relay-health-baseline.json"]
knowledge_refs = ["/home/the0/.ccgram/monitor_state.json"]
knowledge = "the relay's monitor state"
means = "a JSON writer"
method = "read the monitor state, write the baseline"
procedure = "1. read the monitor state. 2. write the baseline. 3. parse it back"
invariants = "nothing outside the baseline file changes"
capability_required = "write the baseline file"
conditions = "the relay is idle"
preconditions = "the monitor state exists"
verify_command = "python3 -m json.tool .ccgram/relay-health-baseline.json"
negative_control = "false"

[stage.principle]
