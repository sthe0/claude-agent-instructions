# The v37 shape, minimal: a developer stage spells one directory absolute in
# knowledge_refs (DR-R: read add_dir -> Edit deny on the whole directory) and
# venue-relative in material_refs (DR-E: Edit allow on one file inside it).
# `agentctl plan-grants --plan <this file>` must exit non-zero and name both
# derived:DR-E and derived:DR-R. Nothing reads or writes the paths it names.

[meta]
task_id = "known-bad-grant-collision"
goal = "Refresh the relay health baseline"
done_criterion = "baseline file rewritten"
criterion_type = "measurable"
weight_class = "substantive"
external_research = "n/a"
repo_root = "/home/the0"

[meta.order]
customer_id = "user"
customer = "the authoring-time grant check's negative control"
functional_place = "a plan whose own refs void its own write grant"

[[meta.order.requirements]]
id = "R1"
text = "the baseline is rewritten"
derivation = "fixture-derivation"

[meta.order.coverage]
R1 = ["stage 1 verify_command"]

[[stage]]
