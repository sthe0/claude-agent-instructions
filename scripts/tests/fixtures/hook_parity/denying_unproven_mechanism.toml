fired = true
can_refuse = false

[[probe_mechanisms]]
mechanism = "Stop"
fired = true
can_refuse = false

[[probe_mechanisms]]
mechanism = "SubagentStop"
fired = true
can_refuse = false

[[probe_mechanisms]]
mechanism = "permission.evaluate"
fired = true
can_refuse = true

