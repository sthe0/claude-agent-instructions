# Hook parity table of the Core layer: one row per hook that scripts/install-reminder-hooks.sh wires.
#
# Difficulty removed: on OpenCode a gate is lost silently unless something says, per wired hook, which
# OpenCode mechanism takes it over and on which execution paths that mechanism was seen to refuse.
# Class is computed, not declared: only PreToolUse and PermissionRequest can refuse a tool call.
# Rules, row format and refresh: integrations/opencode/README.md; checker: scripts/hook-parity.py.
#
# The probe_paths / probe_mechanisms blocks below are the output of `hook-parity.py probe-header`
# on the mechanisms record pin.toml names (run 20261123T144516Z, OpenCode 2.3.2); a test pins them
# equal to that record. The record names mechanisms by Claude-style labels (PreToolUse = tool.execute.before,
# PostToolUse = tool.execute.after, UserPromptSubmit = session.prompt, SessionStart = session.created,
# SessionEnd = session.deleted, Stop = experimental.idle).

[plugin_tools]
ids = []

[[probe_paths]]
id = "root:shell"
refused_by = ["PreToolUse", "permission.evaluate"]
fired_by = ["PreToolUse", "PostToolUse", "permission.evaluate"]

[[probe_paths]]
id = "root:write"
refused_by = ["PreToolUse", "permission.evaluate"]
fired_by = ["PreToolUse", "PostToolUse", "permission.evaluate"]

[[probe_paths]]
id = "root:edit"
refused_by = ["PreToolUse", "permission.evaluate"]
fired_by = ["PreToolUse", "PostToolUse", "permission.evaluate"]

[[probe_paths]]
id = "root:read"
refused_by = ["PreToolUse", "permission.evaluate"]
fired_by = ["PreToolUse", "PostToolUse", "permission.evaluate"]

[[probe_paths]]
id = "root:glob"
refused_by = ["PreToolUse", "permission.evaluate"]
fired_by = ["PreToolUse", "PostToolUse", "permission.evaluate"]

[[probe_paths]]
id = "root:grep"
refused_by = ["PreToolUse", "permission.evaluate"]
fired_by = ["PreToolUse", "PostToolUse", "permission.evaluate"]

[[probe_paths]]
id = "root:webfetch"
refused_by = ["PreToolUse", "permission.evaluate"]
fired_by = ["PreToolUse", "PostToolUse", "permission.evaluate"]

[[probe_paths]]
id = "subagent:task"
refused_by = ["PreToolUse", "permission.evaluate"]
fired_by = ["PreToolUse", "PostToolUse", "permission.evaluate"]

[[probe_paths]]
id = "root:execute"
refused_by = ["PreToolUse"]
fired_by = ["PreToolUse", "PostToolUse", "permission.evaluate"]

[[probe_paths]]
id = "root:execute-inner"
refused_by = ["PreToolUse"]
fired_by = ["PreToolUse", "PostToolUse", "permission.evaluate"]

[[probe_paths]]
id = "root:skill"
refused_by = ["PreToolUse", "permission.evaluate"]
fired_by = ["PreToolUse", "PostToolUse", "permission.evaluate"]

[[probe_paths]]
id = "mcp:probesrv:touch"
refused_by = ["PreToolUse", "permission.evaluate"]
fired_by = ["PreToolUse", "PostToolUse", "permission.evaluate"]

[[probe_paths]]
id = "plugin-tool:probe_tool"
refused_by = ["PreToolUse"]
fired_by = ["PreToolUse", "PostToolUse"]

[[probe_paths]]
id = "child-run"
refused_by = ["PreToolUse", "permission.evaluate"]

[[probe_paths]]
id = "root:question"
refused_by = ["PreToolUse", "permission.evaluate"]
fired_by = ["PreToolUse", "PostToolUse", "permission.evaluate"]

[[probe_mechanisms]]
mechanism = "PreToolUse"
fired = true
can_refuse = true

[[probe_mechanisms]]
mechanism = "PostToolUse"
fired = true
can_refuse = false

[[probe_mechanisms]]
mechanism = "UserPromptSubmit"
fired = true
can_refuse = true

[[probe_mechanisms]]
mechanism = "SessionStart"
fired = true
can_refuse = false

[[probe_mechanisms]]
