means = "scripts/land-branch.py, the sanctioned landing path — ref-only and fast-forward-only, so it preserves ancestry and refuses (exit 2) rather than forcing — invoked as scripts/land-branch.py -C /Users/the0/claude-agent-instructions --branch smd-act --remote-only --keep-branch, every argument load-bearing rather than cautious. --branch smd-act because this stage's conditions order the landing from the canonical checkout, and run there with no --branch the script's _resolve_branch falls through to git symbolic-ref --short -q HEAD, which at repo_root answers main: assess then takes its branch == trunk arm, _do_land prints NOT-LANDABLE and exits 2, and nothing is pushed at all — a refusal the suite documents in its own test_land_refuses_branch_equals_trunk. -C names the same repository from the other side, so the invocation no longer depends on which directory it is typed in. Both were omitted from an earlier draft that argued the next two flags across several hundred words while leaving out the argument without which the operation does not run, which is the defect below one level down and in the same field. --remote-only because the plain path advances local trunk with git branch -f main, which git refuses whenever main is checked out in any worktree of the repo — and repo_root, the canonical checkout, IS on main; this repository already records that fact in test_land_branch.py, in landing-discipline.md and in its experience leaves, and every landing test IN WHICH TRUNK IS THE CHECKED-OUT BRANCH passes the flag. The wider claim would be false: five of the eight land invocations in the suite omit it, and two of those assert exit 0 with local trunk advanced, because in those clones the feature branch is checked out and trunk is not, so git branch -f trunk succeeds. The narrower statement is the one this argument needs, and the wider one is refuted by the first test a reader opens. --keep-branch because the script otherwise deletes the remote branch, the local branch and the linked worktree as part of landing, and the venue must survive until the repo_root run on the landed tree has passed, so that a red there leaves somewhere to act; note that it is THAT run the flag protects and not the in-venue merged-but-unpushed run, which is ordered earlier and which the script's defaults cannot reach — an earlier draft gave the in-venue run as the reason, which is false in the direction that invites an executor to drop the flag as redundant. And because --remote-only means nothing advances the canonical checkout's own main, one operation no script performs here is ordered explicitly: git -C <repo_root> merge --ff-only origin/main. git merge origin/main in the delivery branch, which is what makes that fast-forward possible once trunk has moved, and is the true merge these invariants are written about. Never hand-rolled into checkout/reset/clean; the engine's typed landing check. NOT scripts/land-on-main.sh, which an earlier draft named: that script lands the STAGED diff as a single new commit built by git apply onto a detached origin/main, which is a squash by construction — stage 11's commit would not be an ancestor of the result and the typed check, asserting ancestry, would fail; and the index it reads is empty here, stage 11's work being already committed. The draft had appointed as its means the one operation this stage's own derivation names as failing this stage's own control, and seven review rounds passed over it, because every round was reading the prose about the exception set and none was reading the means against the criterion."
method = "Requirement: the terminal state is trunk, and the assertion of that state must be the engine's typed one, not a shell command that happens to look at git. The distinction is not pedantry — the loader carries a survivability lint that fires when a plan asserts landing while leaving delivery-venue checks unqualified, and it recognises landing only in the typed form, so a plan asserting landing as a shell string silently disables the one protection built against the exact failure it is about to commit. An earlier draft did precisely that, and its stage checks would all have refused at final verification. Two clauses added under review. The landing must PRESERVE REACHABILITY: the typed check asks whether the delivered commit is an ancestor of main, so a squash or a rebase — which produce a main containing the same content under a different commit — makes the check fail while the work is in fact landed, and the confusing failure is worse than the tidy history is worth. And the recovery path must be stated, because after this stage the delivery venue no longer exists: any stage re-run then resolves verify_venue to delivery and is refused for a missing working directory, so the sanctioned recovery is to re-create the worktree from the landed commit before re-running anything, never to edit the canonical checkout. Acceptable: landing is a separate stage rather than the tail of the documentation stage, because a stage whose own check runs in a venue it destroys cannot verify itself."
procedure = "Optional. FIRST, before anything is landed, re-read the trunk baseline exactly as stage 13 does for its own merge: fetch origin/main and run the full suite in this venue against it, recording the exact set of reds. A red the exception set does not already name is a finding AT THIS POINT and not at the end, and the ordering is the whole reason the step exists: discovered here it is observable while the plan can still be replanned, the prose widened and the snapshot re-taken as an ordinary commit on the delivery branch before landing, which is what makes the widening obligation in this stage's invariants performable rather than decorative; discovered after the landed run it could only ever be DISCLOSED, since by then the landing commit is on origin/main and folding a re-taken snapshot into it would mean rewriting published trunk, which this stage forbids for its own reachability reasons. The replan such a finding triggers is the root's act on the live plan, so this stage still touches no file under ~/.claude-agent/plans/ itself. Then, since land-branch.py is fast-forward-only and trunk has moved since stage 13, run git merge origin/main IN THE DELIVERY BRANCH and resolve: this is the true merge these invariants are written about, and ordering it explicitly is what makes the following fast-forward possible at all — an earlier draft asserted the scenario in its invariants and ordered nowhere the operation that produces it. Run the unfiltered test tree in the delivery venue on that MERGED-BUT-UNPUSHED tree, with the two trunk-red tests — hook_wiring's unsearchable-chain-member test and hook_import_blindness's poisoned-import test — named as its allowed exceptions: a red produced by the INTERACTION of trunk's new commits with this branch is green on each side taken alone, so a trunk-only baseline cannot see it and this is the only run that can, while nothing has yet been published. Stop here if it is red. Then run scripts/land-branch.py -C /Users/the0/claude-agent-instructions --branch smd-act --remote-only --keep-branch, in that exact form: without --branch the script infers the branch from HEAD, which in the canonical checkout this stage's conditions name as the venue is trunk itself, and it refuses with exit 2 before pushing anything. Then advance the canonical checkout's own trunk with git -C <repo_root> merge --ff-only origin/main: --remote-only leaves local main where it was, no script does this for us, and the typed check asserts ancestry against BOTH main and origin/main at repo_root, so without it the criterion goes red. No fetch precedes that merge and none is needed: the push in the previous step updates refs/remotes/origin/main in the same ref store, this remote's fetch refspec covering trunk — and merging that ref rather than pulling is the stronger instrument, since without a fetch it pins the canonical checkout to EXACTLY the landed commit rather than to whatever trunk may have become, so the repo_root run covers the delivered tree and nothing else. If the merge nonetheless refuses — a dirty canonical tree, or a local main that is not an ancestor of origin/main — the stage stops there and is a difficulty rather than a pass; nothing downstream may be run over an unadvanced canon, and because --keep-branch has left worktree, local branch and remote branch all standing, the refusal is recoverable and not terminal. The deeper reason is that a red check would be the lucky outcome: with canon's main unmoved its working tree is still the PRE-LANDING tree, so the repo_root run this stage's invariants call load-bearing — and final_check[0] and final_check[1] with it — would execute against the old trunk and pass vacuously, reporting green over a tree containing none of this work. That is a false green on precisely the invariant this ordering exists to protect. The range is exactly those two, and it is MEASURED rather than reasoned to, two successive wordings having placed it wrong: [0] is the disjunctive run over scripts/tests, which exists at trunk, and [1] is scripts/verify-all.py, present at trunk and green there. Both greens were measured by execution on a local CLONE of the canonical checkout at trunk rather than in the canonical checkout itself, which at the moment these run still has the delivery worktree registered; any difference the venue makes runs toward redness and therefore toward a NARROWER range, which does not disturb the instruction, since canon must be advanced either way and a red is the safe outcome. [2] through [5] instead name at least eleven artifacts this task itself creates — at least, because what follows is a hand enumeration inside the very passage that argues against recall-based sweeping, and it is not exhaustive: [3] additionally reads the fixtures/submission/ directory and [5] passes the plan snapshot to both enumerator scripts, neither present at trunk either, each a further cause of the same redness — test_frozen_plan_compat.py, test_operative_surface_behaviour.py, test_acceptance_verdict.py, test_renormalization.py, test_prefilter_recall.py, test_contract_coverage.py, test_rejected_shapes.py, test_order_coverage_map.py, test_exception_set_enumeration.py, check-order-coverage.py and check-exception-set-enumeration.py, plus agentctl/submission.py which [3] imports — none of them present on the pre-landing tree, so those four go LOUDLY RED rather than silently green, as does [6], the typed landed check. The first wording ran the range to [6] and so asserted of one check both that it fails and that it silently passes; its correction to [5] moved the boundary one step instead of to where measurement puts it, and thereby asserted of four further checks the exact thing this passage exists to distinguish. Neither error touched the ordering obligation itself — canon must still be advanced — so both were a false justification for a right instruction, which is the failure mode re-reading is least able to catch. Then confirm main and origin/main contain stage 11's commit by ancestry; run the unfiltered test tree at repo_root on the landed tree with those same two allowed exceptions, and stop here if it is red; only then perform, explicitly, all three deletions --keep-branch suppressed — git worktree remove for the linked worktree, git branch -D for the local branch, and git push origin --delete for the remote branch — since landing-discipline.md requires all three as part of landing and final_check[7] — the last of the eight blocks, which this plan indexes from zero as it does everywhere else — checks only worktree deregistration, so a surviving remote branch would otherwise pass every check this plan makes; re-run the final checks in the canonical checkout."
preconditions = "Stage 11 landed in the worktree; every stage 1-11 declares verify_venue_at_final, and so does stage 13, so re-verification has somewhere to run for all twelve of the stages that are not this one. And stage 10's two reporting channels have had their full output READ and every entry dispositioned, on the same terms as stage 11's precondition and for the reason this stage's conditions record: after this stage the delivery worktree is gone, so a list still undispositioned at landing becomes unactionable."
conditions = "The landing is performed from the canonical checkout against the delivery branch, so the act that removes the delivery venue is not itself executed inside it. After the removal the delivery venue is gone for every consumer, so any subsequent re-run of a stage 1-11 check must use its verify_venue_at_final; a re-run needing the delivery venue itself requires re-creating the worktree from the landed commit first. This is a spawn:developer stage, so the code-review gate mandates a passing review here too, and its tier is deliberately NOT raised to large — the asymmetry with stages 8-11 and 13 is stated rather than left for a reader to notice and doubt. What this stage's review has to read is a merge to trunk, a worktree removal and a branch deletion performed by a sanctioned script: no engine code, no tests and no documentation, so the implement-review-fix loop that made large the honest acknowledgement for a code-producing stage does not arise here, and medium matches both the work and the single mandated review the estimator actually charges. The three-attestation regime stays: control observation, code review, tests. The premise sweep this stage's criterion rests on was performed and recorded before the stage was dispatched, rather than left to execution to discover by failing: its measured verdicts are in this stage's knowledge field, so a reader can tell a measured premise from an assumed one. What that sweep actually saw is stated exactly, because an earlier wording of this clause claimed more than had been measured: it read the PRE-MERGE delivery branch, 61 commits behind trunk, so every verdict it recorded was provisional on a re-measurement over the merged tree. That clause named stage 13 as the discharger, and stage 13 is now PASSED without having re-measured these premises, so the obligation is carried HERE, on the same terms and with the same three re-measured verdicts recorded in stages 8, 9 and 10; this stage's knowledge field had already re-attested its own premise locally, which is why the repair is smaller here than in the four stages that had not. And the same root-level precondition that binds stage 11 binds this stage: it is dispatched only after stage 10's two reporting channels have had their full output READ and every entry dispositioned, because a landing stage that lands an undispositioned list makes the list unactionable — after this stage the delivery worktree is gone."
invariants = "Landing uses the sanctioned script — never a hand-rolled checkout/reset/clean. The delivered commit stays REACHABLE from main: fast-forward or a true merge only, never squash and never rebase, since the typed check asserts ancestry and not content equality. The branch is deleted only after main contains the work. And, added after stage 8's difficulty and after the review of that correction: the delivery worktree is removed only after an unfiltered run of the test tree has passed at repo_root ON THE LANDED TREE, with the two known-red trunk tests — hook_wiring's unsearchable-chain-member test and hook_import_blindness's poisoned-import test — named as its allowed exceptions. The ordering is load-bearing, not ceremonial. Symmetrically, and as an ordering obligation rather than a procedural suggestion: the trunk baseline is re-read BEFORE anything is landed, and the unfiltered run is taken on the merged-but-unpushed tree in the delivery venue before anything is pushed. And the canonical checkout's own main is advanced to origin/main, by an explicit ff-only merge, BEFORE the repo_root run on the landed tree — because --remote-only advances no local ref and an unadvanced canon still holds the pre-landing working tree, on which that run and final_check[0] and final_check[1] would pass vacuously over a tree containing none of this work — and only those two, measured against trunk rather than inferred: [2] through [5] name eleven artifacts this task itself creates, none present at trunk, so those four go loudly red there, as does [6], the typed landed check. Vacuity and not redness is the danger, and what carries it is the load-bearing repo_root run together with those two checks alone. All three belong here and not in the procedure alone, on exactly the grounds this stage states two clauses down and stage 13 states of its own reading — stage 9 makes a procedure deviable by an executor's own renormalization, so an obligation living only there is one an executor discharges by not performing: they could land first and read after, which restores verbatim the post-publication discovery these clauses exist to prevent. This stage may land by a true merge — and since such a merge can bring a further trunk-red node, forcing exactly the prose widening the fifth enumerator exists to catch AFTER that enumerator's snapshot was taken, a widening at this point re-takes scripts/tests/fixtures/plan_snapshot_smd-act-defects-8.toml as an ordinary commit ON THE DELIVERY BRANCH PRECEDING THE LANDING, which the fast-forward then carries onto main unchanged — and not, as an earlier draft said, 'in the landing commit itself', a locus that exists under no instrument this stage sanctions: a fast-forward creates no commit at all to fold anything into, and hand-folding a file into a merge commit is the hand-rolled path these same invariants forbid — or the check is knowingly reporting on a superseded file and this stage says so in its result rather than leaving a green to imply otherwise —, so against a trunk that has moved since stage 13 the merge produces a tree no green run has covered, while the typed landing check asserts ancestry alone and would record the stage PASSED over it. final_check[0] is exactly that unfiltered run — but it runs after this stage, and by then the only venue in which a failure could still have been acted on is gone, which is verbatim the failure this plan created stage 13 to avoid. So the run happens here, before the removal; if it is red, the venue stays, nothing is deleted, and the stage is a difficulty rather than a pass. What R1 forbids this stage is a verify_command, not an ordering obligation on its own procedure, so the hole the loader leaves open is closed where the loader does not look. No file under ~/.claude-agent/plans/ is touched. The canonical checkout is never edited directly by this stage. And carried verbatim from the stage-10 difficulty, as a further property of the control whose others are stated in stage 10's invariants: One more inherited red than the exception set names still fails the control loudly — the property final_check[0] states as 'nothing is hidden by it' survives the widening."
capability_required = "The landing procedure; git worktree removal."
knowledge = "The engine models landing as a typed check whose payload names a target ref, a remote and the stage whose commit must be contained — never SHA equality and never a live-resolved head, and containment is decided by ancestry, which is why a history-rewriting land breaks it. The related lint fires only when landing is asserted in that typed form: a plan that asserts landing as shell content is invisible to it, and therefore keeps no protection against its own delivery-venue checks refusing after the worktree is gone. Re-measured at the stage-7 effort-divergence diagnosis, since this stage's preconditions assert a universally-quantified property of the plan itself and of a script it does not create: scripts/land-branch.py is present, and is read here rather than assumed — the sweep recorded in this clause was taken when the means named scripts/land-on-main.sh, and stage 13, which re-measures this list, is already PASSED, so the corrected premise is attested at this stage instead of being re-measured by a mechanism that has already run; all eleven stages 1-11 declare verify_venue_at_final, none missing — and so does stage 13, which was added after that sweep was taken and is measured here with it, so the property holds of twelve of this plan's thirteen stages; and stage 12 alone declares none, which is the shape the loader requires of a stage asserting landing."

