statement = "An architectural change is not delivered until the canonical read-first surface reflects it, and the record must state what was deliberately not done, how the system behaves in its degraded mode, and on what evidence any claim about the environment rests — or a later reader cannot distinguish an omission from a decision, a designed behaviour from a fault, or an observation from a law."
source = "memory-global/leaves/docs-accompany-architectural-change.md; experience leaf 2026-07-16-onboarding-drift-after-crosscutting-refactor-needs-mechanical-guard.md; this task's own history of mistaking deliberate additions for divergences and of describing an existing engine cycle as absent."
derivation = "The positive half is already a stated delivery criterion. The negative half follows from this task's history: several apparent divergences proved to be deliberate additions, and one claimed absence proved to be a mechanism the engine already had — recovering both took re-reading two texts, a cost that recurs for every future reader unless recorded once. The degraded-mode half follows from the same argument applied to behaviour: a gate that blocks because its judge is unreachable is indistinguishable, to a reader without the record, from a gate that is broken. The evidence-base clause follows from it applied to the record itself: a one-observation claim written as a property is how this plan came to describe its own environment three drafts running."
confidence = "medium"
refutation = "If the ADR is never cited by a later task while the ontology leaf is read instead, the ADR was redundant and the record belonged in the leaf as a section."

