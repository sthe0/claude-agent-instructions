  "scripts/agentctl/advisor.py:judge_binary_ask",
]
means = "advisor.judge_binary_ask as the prefilter-then-fail-open-judge template; the committed corpus fixture as the population against which reach is measured; a spawned thinker as the independent labeller, supplied to the CONTROL side of this stage rather than to its transformation — the same shape as the code-reviewer the engine itself requires inside a spawn:developer stage without that reviewer being the stage's executor; pytest with a stubbed judge runner."
method = "Requirement: the engine must TELL AN AUTHOR when an image answers 'did the check pass' in place of 'what is the result', and it must do so on the instances that actually occur. The strength of that telling is set by the measurement rather than by the plan's prior — refusing a submission is earned by a defect the material carries broadly, and the labelling found 11 in 200 concentrated in two lineages — so what this stage builds warns and does not refuse. Detection is untouched by the resizing. Five constraints follow. (1) The decision is about MEANING, so a regex or an equality test may serve only as a high-recall prefilter and never as the thing that decides; the deciding judge fails open, because an author wedged by an unreachable advisor is a worse failure than an echoed image. (2) The judge is a subprocess, so it belongs on the submission seam and not in parse_plan, whose docstring promises purity and which seven in-session call sites invoke. (3) Reach must be measured against a stated NUMBER, because a threshold chosen after seeing the result is not a threshold: the floor is 0.70, and it is neither arbitrary nor degenerate — on the earlier reading roughly four echoes in five OPEN with the outcome formulation, which a sentence-position prefilter reaches, so 0.70 sits below what the structural half can plausibly achieve and well above the 0.0 that string equality achieves. That ratio is a prior estimate the ROOT recomputes from the frozen labels once the labelling is done — never the labeller, since opening position is the detection heuristic and naming it in a brief is the contamination invariant 7 exists to prevent. 0.70 is fixed HERE, in the plan, before the labelling runs, so the recount can only confirm the floor or refute it — never set it. A floor met only by flagging everything is excluded not by the accept-a-genuine-image case, which excludes only flagging LITERALLY everything, but by the 0.25 false-positive ceiling over the labeller's genuine set, fixed here on the same terms as the floor and measured by the same committed test. (4) The labelling is produced by an actor who is NOT the prefilter's author, and it is produced BEFORE the prefilter exists. The requirement is independence of labeller from scorer — a scorer who owns the labels meets any floor by relabelling, so the score would measure the mechanism's agreement with itself. Temporal inheritance was one mechanism for that independence and it is not available: the earlier reading that produced the 58-echo figure left no per-instance artifact anywhere, so there is nothing to inherit. A separate actor labelling now still satisfies the requirement, but NOT equally well, and the difference is named here rather than glossed because it is what the rest of this clause is buying back: inheritance secured independence STRUCTURALLY, since labels made before a mechanism exists cannot encode it, whereas in-stage labelling makes independence contingent on disciplines someone keeps — two of them kept by the party whose stage passes or fails on the score. Concretely: the root spawns a thinker which reads all 200 images of the committed fixture read-only, before any prefilter code is in the tree, and its labels are committed as a fixture in a commit of their own; the developer who then writes the prefilter is scored against labels it did not author and cannot revise. Independence has a second half that the authorship rule alone does not cover: the labeller's BRIEF must state what an echo is — an image that answers whether the check passed instead of saying what the result is — and must not state how the prefilter will detect one, must not name the opens-with-the-formulation heuristic, and must not include this stage's method or procedure. A labeller told the detection rule labels to it, and every authorship guarantee still reads as satisfied while the score has gone back to measuring the mechanism against itself. Because both halves are disciplines kept by the party whose stage passes or fails on the result, neither stays a promise: the brief is committed with the labels so it can be read afterwards, and the ordering is asserted by a test that reads the repository's own history rather than by anyone's word. (5) The consequence of a hit is a warning on the submission result and the seams still accept the plan, so nothing this stage builds can wedge an author at all — which makes the fail-open judge cheaper still, and moves the pair of numbers from a safety guarantee to an honesty one: they now bound how much noise an author is asked to read rather than how often work is blocked. NOT acceptable: the prefilter's author producing or amending the labels; labels committed in the same commit as prefilter code; a labeller brief that names a detection rule; a prefilter whose conditions enumerate literal strings lifted from the labelled echoes rather than structural properties an image outside the fixture could also have — which clears both numbers by memorizing the sample and reaches nothing, and is the one route to a green suite the two numbers do not close; NOT acceptable either: a hard block driven by pattern matching on free text; a mechanism whose reach over the justifying corpus is never computed; a threshold introduced after the measurement; and, now that the remedy has been resized once on evidence, re-tightening it into a refusal without a new measurement, or moving either number in response to labels it was fixed before."
procedure = "Optional. First sub-step, performed by the ROOT before this stage's executor is dispatched and NOT by that executor — an executor that spawns and briefs its own scorer satisfies every check this stage can run, including the ordering test, while breaking the one invariant nothing downstream can detect, since a repository records who committed and not which context produced the bytes. So: the root spawns a thinker as independent labeller, read-only over scripts/tests/fixtures/plan_corpus/, briefed with the echo DEFINITION only and with neither the detection heuristic nor this stage's method, to classify each result image in that fixture as echo or genuine with a one-line reason — the domain being the set the machine enumerates from the fixture at labelling time, which is 200 images across 55 plans and is stated here as an enumeration the labeller's own tooling reproduces rather than as a count either party carries in, emitting result_image_echo_labels.json — and NOTHING else: the labeller is not asked how many echoes open with the outcome formulation, because opening position IS the detection heuristic, and a labeller told to tally it has been told what the mechanism looks at before it labels anything. That share is not an input to either score; it only arms the early refutation. So the root computes it, and the echo count, from the FROZEN labels plus the corpus, after the labelling is done — then writes both, and a continue-or-stop decision, into the labels file in the commit that lands it. Two recounts can arm that decision, not one: the share landing below 0.70 of the echoes, which takes away the floor's justification, and the ECHO COUNT itself landing materially below the 58-of-200 prior, which takes away the prevalence this stage's whole remedy is sized by — the second is the one no earlier draft named, and a count of, say, a dozen turns the floor into 'nine of twelve' and the gate into a mechanism justified by a defect that is not there. That is what happened, at eleven: the second trigger fired, the first did not, and the decision it armed was taken and written into the labels file — continue, with the remedy resized from a refusal to a warning. That commit carries the labels, the figures and the brief the labeller was given, and lands alone before any prefilter code exists — the stage whose root cause was a reading nobody wrote down does not get to produce a second one. Then add the prefilter as a module of its own, scripts/agentctl/result_image.py — not as a block inside the submission seam, so that the commit which introduces it is an addition event a one-line history query can find — with conditions authored against those labels — sentence-level scanning rather than whole-string exhaustion, plus the degenerate cases (image contains the verify_command, image opens with a backticked command). Add test_prefilter_recall.py asserting the 0.70 recall floor and the 0.25 false-positive ceiling over the labeller's genuine set, both computed from the same labels file, and — before either number — asserting that the labels file's keys are exactly the set the fixture glob yields, so a labelling that ran over a stale or partial domain fails loudly instead of scoring well on a subset. The same test also refuses a labels file whose classifications changed after the commit that landed it, comparing the working copy against the blob at that commit. Call the judge from validate_submission on a prefilter hit and, on an explicit echo verdict, attach a warning naming the offending stage to the submission result while the submission itself proceeds — the warning travels on the accepting path, so validate_submission gains a way to return advice and not only to raise, and every existing caller keeps its behaviour when there is nothing to say. Add a purity test asserting parse_plan spawns no subprocess. Tests for all four judge paths."
preconditions = "Stage 2 landed, so the submission seam exists to hang the judge on."
conditions = "The check runs at submission over a plan not yet accepted, and its outcome is a warning rather than a refusal, so the most it costs an author is a line to read and it never interrupts work in flight; that is what makes fail-open the right trade here and would not hold for a gate sitting mid-execution. One condition of this stage is not yet established and is stated as a conditional rather than assumed away: whether the advisor runner is durably unavailable in this environment or was observed absent once. Neither answer changes what any of stages 3, 5 or 8 must build — a fail-open refusal simply never fires when the judge is unreachable, and stage 8's acceptance stays passable through the unassisted path that never stands alone — so nothing here is designed on the guess. What the answer does change is what may be CLAIMED: if the advisor is usually unreachable, R3 and R5 stay partial permanently and the only honest record of their judged half is the ADR's degraded-mode section; if it is usually reachable, stage 5's confidence may rise, and the coverage marks still may not, because they are about what a control decides and not about how often the judge answers. A second condition is borrowed from a stage nine steps away and is stated here because the borrowing is invisible from either end: the ordering test reads the repository's own history, so it survives re-verification at repo_root after landing only as long as the landing preserves two distinct commits, and what guarantees that is stage 12's invariant forbidding squash and rebase — written there for the typed landing check's ancestry semantics, with no idea this test would come to depend on it. Two stages now rest on one clause; only one of them said so. A third condition is left open rather than quietly settled, and it is the one the difficulty behind this refinement actually exposed. The normalization it produced — that a material with no repo home must have a producing stage named, so the projection is complete by construction — is discharged HERE by declaring the produced set in output_artifacts, which is the projection that names what a stage makes, and by hand — for this stage only. Nothing enumerates a stage's prose material items and demands each have a home, and nothing can: enumerating items out of free-form prose is reading text for meaning, which this plan's own governing principle forbids a hard gate to do. What IS structurally decidable is narrower — that every entry in a projection resolve in the repository or appear among some stage's output_artifacts — and it is deliberately not added, for two reasons. It is a new requirement on the plan format rather than one of the eight defects this plan was approved to remove; and it is not as simple as it sounds, because stage 12's own material_refs are absolute machine-local paths that such a rule would reject, so the rule would have to admit at least three shapes — repository symbol, self-produced artifact, machine path — which is a design question and not a fold-in. It is carried to the user as an open question instead of being folded in silently, which is the whole difference between a scope the user set and a scope the author widened."
invariants = "No hard refusal is ever driven by the prefilter alone. parse_plan spawns no subprocess and performs no I/O, asserted by a test symmetric with the existing gate-purity assertion. Judge unavailable means the plan is accepted — and therefore, whenever the advisor is unreachable, this defect's refusal half is inert and only the structural field requirements remain in force. Whether that state is the environment's NORMAL one is an assumption, not a fact: it was observed once in this task, while config.md sets advisor-mode to substantive, which intends the opposite. The stage must therefore ship a check that reports advisor reachability rather than a claim about it, and the ADR records the observation with its n. Six invariants carry through from the difficulty that sent this stage back, and are stated in the words the critique fixed them in so that what the plan preserves can be read against what the diagnosis demanded, without a translation step in between. The 0.70 recall floor is stated BEFORE the measurement and lives as a committed test, not a one-time report. The labels are committed in their own commit, before any prefilter code exists in the tree. The labeller is not the author of the prefilter being scored. The prefilter alone never hard-refuses; the judge behind it fails open. parse_plan spawns no subprocess; the judge lives on the submission seam, not the loader path. A genuine (non-echo) corpus result image is accepted by the same test suite that measures recall. That sixth one is necessary and, on its own, close to worthless: with roughly 142 of the 200 images genuine, a prefilter that flags 141 of them and every echo satisfies both it and the 0.70 floor, so a single accepted image excludes flagging LITERALLY everything and nothing weaker. The precision side therefore gets a number of its own, on the same terms as the recall floor — stated here, before the labelling runs, and living as a committed test: the prefilter flags no more than 0.25 of the images the labeller classified as genuine. 0.25 is not a quality target and is deliberately generous, because a false positive costs one judge call and no refusal; what it does is make the pair of numbers unsatisfiable by a mechanism that decides nothing, since flagging everything scores 1.00 here and flagging nothing scores 0.00 recall. Both numbers are computed over the same labelling by the same committed test. A seventh is added by the review of this refinement, because the six above are all satisfiable while the property they exist for is destroyed: the labeller's brief states what an echo IS and never how the prefilter will detect one, and the labeller is not shown this stage's method or procedure. Independence by authorship survives being written down; it does not survive telling the labeller the answer. Three of the seven are promises rather than facts an artifact carries, and they are not all kept by the same party — a distinction worth making, because it is what decides whether converting them is possible at all. Invariant 3, that the labeller is not the prefilter's author, is kept by the ROOT, which dispatches both actors, and it cannot be converted: the repository records who committed, not which context produced the bytes, so no artifact can distinguish a thinker's labelling from a developer's. It stands as a promise, and it is named as one here rather than folded into a count that would imply otherwise. The other two are kept by the interested party — the executor whose stage passes or fails on the resulting score — and those are exactly the ones that must not stay promises, so they are converted: the commit ordering — labels before prefilter — is asserted by a test reading the repository's own history, not by the executor's word for it, and the labeller's brief is committed alongside the labels so that what it did and did not say is readable afterwards. And the recall floor's scope is stated where the floor is: 0.70 is IN-SAMPLE, over the same 200 images the prefilter is tuned against, so a green suite establishes reach over these instances and not over result images in general. A ninth is added by the difficulty that sent this stage back a second time, and it is about the DOMAIN rather than the mechanism: the labelled set is the machine-enumerated set of expected_result_image values in the committed fixture, and its size is re-derived from the fixture by the labelling itself rather than carried in from any figure this plan states. The plan's own figure — 200 images across 55 plans — is written here for the reader and is not what the labeller or the tests read; if the two ever disagree, the fixture wins and the plan is wrong, which is the whole content of this invariant. It exists because the previous draft named a domain of 192, a true count of the live plans directory taken two plans before stage 1 copied it, and briefed the labeller on a set the fixture does not contain. Concretely: the labels file covers every image the glob returns and the recall test asserts that coverage, so a labelling that silently ran over a subset cannot produce a green suite. A tenth group is added by the difficulty that RESIZED this stage rather than sending it back, and it carries the four items that difficulty's critique fixed, in the words the critique fixed them in. The 0.70 recall floor and the 0.25 false-positive ceiling stay exactly as fixed before the labelling; no threshold moves in response to labels it was meant to be scored against. The labels and the labeller's brief stay committed alone, before any prefilter code, and a test reads the repository's history to assert that ordering. parse_plan and load_plan are not touched, so every plan already written keeps loading exactly as it does today. The mechanism keeps both halves: a structural prefilter and a fail-open model judge, never a regex deciding meaning by itself. To those four the resizing adds one of its own, stated positively because the negative form is what a later re-tightening would silently satisfy: no echo verdict refuses a submission, asserted by a test that offers an echo-bearing plan and expects it to be ACCEPTED carrying a warning. The stage-1 harness stays green; fixture plans load non-strict and are untouched."
capability_required = "For the transformation: agentctl CLI and submission-seam work; familiarity with the advisor's fail-open contract and with stubbing it in tests. For the control side, held by the root and not by the stage's executor: the ability to dispatch an independent labeller and to keep it read-only and prior to the prefilter, which is what makes the recall figure a measurement rather than a self-report."
knowledge = "Measured mechanically and reproducible on demand: normalize_string is casefold plus whitespace collapse, so an equality test between image and done_criterion matches 0 of 200 corpus stages. Read rather than computed, and therefore NOT reproducible from any artifact: 58 of those 200 images (29.0%) carry a check-outcome formulation, and 46 of the 58 (79%) open with one. Those two came from a reading during this task's corpus critique whose per-instance list was never written down — the difficulty that sent this stage back — so they are carried here as a prior ESTIMATE with its provenance stated, and both are recomputed within this stage — the echo count by the independent labeller, the opens-with share by the root afterwards from the frozen labels, since that second figure names the detection heuristic and must not reach the labeller. What survives the recount unchanged is the shape of the gap: an equality test provably reaches none of the instances a semantic reading finds, and that gap is the whole content of this stage. What the recount may change is whether 0.70 is reachable — which is the stage's declared refutation, not its calibration. One more thing was checked rather than assumed, and it is what makes the open question in conditions an ADDITION rather than a repair: every consumer of material_refs was read — parse_plan's construction, the change-decision signature tuple, the Subject dataclass and its from_dict, the submission grade's non-emptiness row, and cli's refinement carry — and none of them resolves a ref against the filesystem or assumes the referent pre-exists. Nothing today would catch a projection entry naming a file that does not exist, which is why this stage's produced set is declared where a produced thing belongs, in output_artifacts, and not smuggled into a projection on the argument that nothing would notice. The general law is recorded in the memory leaf regex-not-for-semantic-classification: a pattern match over free-text MEANING may prefilter but must not decide. Where the judge is INSERTED is a design question the primary source does not answer and no external source can: it was settled from this repository's own evidence — parse_plan's purity docstring and its seven strict call sites on one side, cmd_submit_plan's existing role as the acceptance point on the other."

[stage.principle]
statement = "A gate justified by the prevalence of a defect must have its own reach over that same population measured against a floor stated before the measurement, by a committed control and not a one-time report; the labels that floor is computed against must not be produced by the same actor who writes the mechanism being scored; and the STRENGTH of what the gate does on a hit — refuse, or warn — is fixed by that same measurement and not by the estimate that motivated it, so a defect the population turns out to carry rarely earns a warning however well the mechanism detects it."
source = "The corpus measurement, whose two halves have UNEQUAL standing and are marked so here rather than averaged into one word: 0 of 200 equality matches is mechanical and reproducible on demand, while 58 of 200 real instances and 46 of those 58 opening with the formulation come from a reading that left no per-instance artifact and are therefore a prior estimate this stage recomputes, not a finding it rests on; memory-global/leaves/regex-not-for-semantic-classification.md; plan.py's parse_plan docstring and the seven in-session strict call sites."
derivation = "Prevalence justifies the STRENGTH of a remedy — a hard requirement rather than a convention — and strength is warranted only if the remedy reaches the instances counted. Since the counted instances are semantic echoes and the first proposal was string equality, the two quantities were about different populations and the justification transferred by name alone. Measuring the mechanism against the corpus that justifies it closes that gap; requiring the measurement to be a committed control closes the second gap, that a number computed once is not a property maintained. The independence clause closes a third: a scorer who also owns the labels can meet any floor by relabelling, so the score would measure agreement with itself. That clause is weaker here than in the plan's first draft and the difference is stated rather than glossed: independence was to have come from the labels PREDATING the prefilter, which guarantees it structurally — labels made before a mechanism exists cannot encode it — and it now comes from a different actor labelling within the same stage, which makes independence contingent on two disciplines the interested party executes, the commit ordering and the labeller's brief. Both are therefore lifted out of prose into things the suite checks, which is the only reason the weaker mechanism is accepted. The purity clause is independent of all three: a documented-pure function is relied on by every caller, so the cost of breaking it is paid at call sites the author does not see."
confidence = "high"
refutation = "If no prefilter can reach 0.70 over the labelling this stage produces without also flagging most genuine images — if the floor is met only at a precision that floods the judge — the structural half is not available at this granularity, and the honest remedy moves upstream into how images are authored, which is stage 10's material and not a loader's. This is refutable in the ordinary sense, and it is the false-positive ceiling and not the accept-one-genuine-image case that makes it so: 0.70 recall and 0.25 false-positive rate are two numbers over the same labelling, fixed before it, and the flooding failure mode this refutation names is precisely the one the second number measures — so a prefilter that clears the floor only by flagging most of the corpus produces a suite that cannot be made green, which is what a refutation has to mean if it is to be one. Two limits on what a green suite would prove, stated here because a floor whose scope is left unsaid gets read as broader than it is. First, 0.70 is measured IN-SAMPLE: the 200 images are the same ones the developer can read while tuning the prefilter's conditions, so a green recall test establishes that the structural half reaches these instances, and NOT that it reaches result images in general. The out-of-sample claim is not made here and is not this stage's to make — it belongs downstream, where the authoring contract changes what images get written in the first place. Second, an early refutation is available before any prefilter exists: if the recount over the frozen labels puts the opens-with-the-formulation share materially below the ~79% prior — below 0.70 of the echoes — then the reasoning that made 0.70 reachable by a sentence-position prefilter no longer holds, and the stage must record that and decide explicitly whether to continue, rather than discovering it later as a recall test that will not go green. The same clause covers the other recounted figure, and for a different reason: an echo count materially below the 58-of-200 prior refutes not the floor's reachability but the remedy's SIZE, since prevalence is what justifies a hard requirement over a convention — this stage's own statement says so — and a gate whose justifying defect turns out to be rare is over-built even when its recall test is green. That clause fired, and this stage records what it cost and what it left: the labelling returned 11 of 200, the remedy was resized from a refusal to a warning on that evidence, and the detection — the part the numbers govern — was not touched, which is the division the clause predicted. What would now refute the WARNING is different in kind from anything measurable here: an author population that reads it and changes nothing. Only a later reading of plans written after this lands can show that, so the refutation is deferred rather than absent, and it is named as deferred so a green suite is not mistaken for evidence that the warning worked. The gap between the 58-of-200 prior and the 11 is largely definitional and is recorded as such in the labels file — the prior counted images that CONTAIN a verdict formulation, the labelling counted images that are nothing but one — which is why the correct response was to resize the remedy and not to abandon the defect."

