delivery_worktree = "/Users/the0/claude-agent-instructions-smd-act"
external_research = "Primary source read in full and cited by line: activity_as_is.md from github.com/sthe0/activity-theory, MMK (Shchedrovitsky) / MMPK (Anisimov) tradition, explicitly NOT Leontiev-Engestrom CHAT (repo README). Corpus measured mechanically three times (author, reviewer, author again after the denominators were challenged); the figures below EXCLUDE this plan itself, which an earlier draft wrongly counted, producing the 199/155 denominators now retired: 55 substantive plans, 200 stages, 200 non-empty expected_result_image, 148 depends_on edges, 3 supply edges (all element-bearing, in 2 files: ghost-scope-fix.toml:56 and agentctl-gate-quality.toml:75/:98) — so 3 of 151 declared edges carry an element, 2.0%; conditions non-empty in 200/200. The plan-count and stage-count figures here are the fixture's own, re-derived from scripts/tests/fixtures/plan_corpus/ after stage 1 froze it; an earlier draft carried 53/192, which was a true reading of ~/.claude-agent/plans/ taken two plans before the copy and is retired for staleness rather than for miscounting (the equality count is unchanged at 0; the edge counts were NOT unchanged and were re-derived here too — an earlier draft of this very correction asserted them unaffected without recounting, which is the same carry-forward the correction exists to remove, caught by the review of it: 142/145/2.1% became 148/151/2.0%). Two figures are perception, not arithmetic, and are labelled as such: 58 of the 200 result images (29.0%) contain a check-outcome formulation and 46 of those 58 (79%) open with one, classified by reading; and roughly half of all conditions values restate a dependency (98 counted over the 199-stage set that then included this plan's own stages — not re-derived over the corrected 200 denominator, and used only as an order-of-magnitude claim). In-repo prior art located and REUSED rather than reinvented: (a) the acceptance-review observation gate in cli.py cmd_record_result — widened, not duplicated, by stage 8; (b) Stage.control with its gate, and gates.code_review_blockers — the second and third attestations already on the spawn:developer path, surveyed by stage 8 so it adds no fourth; (c) the resolution gate's own acceptance act, `resolve --by` with its quality rating — extended by stage 8 rather than paralleled; (d) advisor.judge_binary_ask as the canonical prefilter-then-fail-open-judge template; (e) schema 23/24 — CheckKind.LANDED with its typed [*.landed] table, and Criterion.verify_venue_at_final with the survivability lint in plan.py. Four adversarial reviews of earlier drafts changed this plan's structure; their load-bearing findings are recorded where they act rather than here (see the note on parking below): a normalized-equality gate cannot detect a semantic echo (stage 3); strict loading runs INSIDE live sessions, which is what moved every new requirement off the loader and onto the submission path (stage 2 method); a semantic judge does not belong in parse_plan (stage 3 method); an enumerator keyed on machine-local ~/.claude-agent state is red on every other machine (stage 1 method); and a migration that 'only adds keys' still invalidates every digest taken over the file, which is why no migration is performed (stage 7 knowledge). On external research: web and wiki search were NOT run, and the honest reason differs by question. For the SMD distinctions the primary source was read verbatim and is sufficient. For two design questions it is not — the recall floor a structural prefilter can reach over free text, and the record shape an acceptance verdict should take — the governing evidence is this repository's own practice and this corpus's own measurements, which no external source can supply; those are decided from in-repo evidence and their assumptions are declared at the stages that rest on them, not asserted as settled here."

