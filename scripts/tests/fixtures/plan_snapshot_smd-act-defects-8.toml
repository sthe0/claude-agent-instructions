[[stage]]
index = 4
title = "Defect 4: a re-selected material becomes observable to the coverage gate"
executor = "spawn:developer"
expected_result_image = "A stage declares its material twice over — as prose and as a structured list of paths and symbols — and it is the STRUCTURED list, not the prose, that enters the coverage gate's operative surface. A replan that re-selects the material therefore registers as a change, while a replan that merely rewrites narrative still does not: the exclusion of prose from that surface is preserved, not traded away. The gate purity of gates.py is untouched. The residual is stated rather than hidden: the list can be extended without any re-selection actually happening, so the projection makes re-selection observable but does not make it compulsory."
criterion_type = "measurable"
done_criterion = "tests pass covering: two plans differing only in material_refs are distinguished by the operative surface; two differing only in material prose are NOT; the PRESERVE half of replan_coverage_blockers still firing on a plan that drops a preserve item, asserted AFTER the surface is widened — the invariant says no existing blocker is weakened and this is the case that executes it; the same for knowledge_refs; and gates.py acquires no subprocess, socket or network reach — which is the purity verify-agentctl.py actually asserts over that module. Stated exactly, because an earlier draft made this criterion say \"free of I/O\" and that criterion is RED ON HEAD before a line is changed: gates.py already reads files and hashes their bytes (plan_review_blockers and plan_presentation_blockers both do), and the module docstring says so in as many words; what it never does is shell out or open a socket"
verify_command = "python3 -m pytest scripts/tests/test_operative_surface_behaviour.py -q && python3 -m pytest scripts/tests/test_frozen_plan_compat.py -q && python3 scripts/verify-agentctl.py"
verify_venue = "delivery"
verify_venue_at_final = "repo_root"
expected_exit = 0
depends_on = [2]
supplies = [{ on = 2, element = "material", artifact = "Subject carrying the material_refs and knowledge_refs fields stage 2 introduced — the typed projections this stage admits into the gate surface, and which do not exist before it. Typed material although this stage READS Subject and does not change it, for the same forced reason recorded at stage 11: the element that fits is knowledge, and HEAD's edge vocabulary has no knowledge member until stage 2 of this plan adds it, so a plan submitted against HEAD cannot name on its own edges the place it exists to create" }]
output_artifacts = ["scripts/tests/test_operative_surface_behaviour.py"]
material = "gates.py _operative_surface with its docstring stating that prose is excluded so no amount of narrative rewriting can satisfy the CHANGE half; state.py Subject as stage 2 leaves it, carrying material_refs and knowledge_refs — both fields created there, together with their entry into all four change-decision functions, so this stage receives them already known to the mechanisms that decide what counts as a change and READS them without changing Subject at all: the only thing transformed here is the operative surface, which is why Subject is knowledge to this stage and only _operative_surface is its material."
material_refs = ["scripts/agentctl/gates.py:_operative_surface"]
knowledge_refs = ["scripts/agentctl/gates.py:replan_coverage_blockers", "scripts/agentctl/state.py:Subject"]
means = "The existing operative-surface tuple and its normalization; pytest."
method = "Requirement, and the reason the obvious fix is rejected: the engine classifies a failure as 'resourceful', meaning material or means, and a classification the coverage gate cannot see is not a classification. But the gate's docstring excludes prose deliberately — so that no amount of narrative rewriting satisfies the CHANGE half — and admitting free-text material would re-open exactly that hole while leaving the blocker nominally intact. The requirement is therefore that a re-selected material be observable STRUCTURALLY: a typed list of paths and symbols, whose change is a change and whose rewording is not. Acceptable, and written into the stage's own refutation rather than left for a reviewer to find: material_refs is a DECLARATION, so the gate can be satisfied by appending a path without re-selecting anything — the projection makes re-selection observable, it does not make it compulsory, and it is coarse, so two different transformations over one file are indistinguishable to it. NOT acceptable: putting subject.material prose into the surface, which trades a real property for the appearance of one."
procedure = "Optional. Add the normalized material_refs and knowledge_refs to the operative-surface tuple; amend the docstring to record that prose stays excluded and why a typed projection does not violate that. Write test_operative_surface_behaviour.py with the four cases (refs differ / prose differs, for each of material and knowledge). Re-run the gate-purity check."
preconditions = "Stage 2 landed. Stage 4 and stage 3 both descend from stage 2 and may run concurrently, but they touch different files by construction — this stage edits gates.py and state.py only, while stage 3 edits submission.py and otherwise only ADDS files — scripts/agentctl/result_image.py, two fixtures and a test — so the disjointness holds on the file names as they now stand and not on an earlier draft's scope; if either scope widens, they serialize."
conditions = "The surface is widened by exactly one typed tuple entry per projected field and by nothing else, so at no moment does a surface exist that admits prose; the guarantee is a property of what is added, not of the order of edits."
invariants = "Gate purity holds in the sense the repository actually defines and asserts: gates.py acquires no reach to subprocess, socket, urllib, requests or http — file reads and hashing are permitted there and already used, so the invariant is about SHELLING OUT, not about I/O. The semantic judge lives on the submission seam, never in a gate. No existing blocker is removed and none is WEAKENED: the CHANGE half must remain unsatisfiable by rewording, and a test asserts precisely that. The stage-1 harness stays green."
capability_required = "Reading agentctl gate code; holding the distinction between the coverage gate and the operative surface."
knowledge = "The gate's docstring states its own purpose in the terms that decide this stage: prose is excluded so the CHANGE half cannot be satisfied by rewording. That sentence is not incidental — it is the property being protected, and it is what rules out the direct fix and selects the projection."

[stage.principle]
statement = "When a gate deliberately excludes free text to stay unsatisfiable by rewording, the way to make an excluded element observable is to give it a typed projection and admit the projection — admitting the prose itself restores the property's appearance while destroying the guarantee."
source = "gates.py _operative_surface, whose docstring names the exclusion's purpose in those terms."
derivation = "The exclusion exists because a narrative field can be rewritten at will, so any gate reading it is satisfiable without any real change. Admitting subject.material would restore that satisfiability for the CHANGE half; the blocker would still fire, so the loss would be invisible in tests. A typed projection has the opposite property: it cannot be reworded, only re-declared, which is nearer the event the gate should observe. The property the gate needs is not 'sees material' but 'sees material changes and not material rewording', and only the projection has it."
confidence = "medium"
refutation = "If authors keep material_refs stale — editing prose and leaving the paths untouched — the projection stops tracking re-selection and the gate observes nothing; observable as replans that change material_refs never occurring while material prose changes do. The opposite failure is equally real and equally observable: refs edited without any re-selection, visible as a replan whose refs change while no cited file's role in the stage does."

