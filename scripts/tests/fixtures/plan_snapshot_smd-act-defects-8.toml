done_criterion = "the documentation validators pass, and the ADR names all eight defects with their source lines, contains a deliberately-not-done section that records the stage-8 control-criterion difficulty with its open residual — anchored on the measurement itself, 139 of 4226 and the named deselection, because those cannot arrive in the text for any other reason, whereas a check for the words 'stage 8' and 'verify_command' would have gone green on an ADR that omits the difficulty entirely, the defect-to-requirement map supplying both words on its own — and, on the same principle, names verify_command_scope_warnings, so that the paragraph the ADR most easily drops is the one held by a token that can arrive from nowhere else: the tension with the engine's existing advisory lint, which today counsels the opposite of this correction. Both anchors were added because review observed that the material added latest to this stage's method was asserted nowhere, which is this plan's own subject reappearing one level up. It states the no-advisor degraded behaviour of both the fail-open and the fail-closed judge, and records the submission-versus-load seam decision with the migration it declines and why. And, added after stage 8 failed on exactly this point: the WHOLE test tree is green except the two tests that are red on trunk independently of this branch — hook_wiring's unsearchable-chain-member test and hook_import_blindness's poisoned-import test, the second admitted into the exception set at the stage-10 difficulty — a documentation stage is not exempt, because the ADR's own checks read files this repository's code also reads, and because the property being asserted is that this stage broke nothing, not that it wrote what it meant to write. The ADR also records that second control-criterion difficulty, anchored on the merge sha b90bade that carried the node onto this branch, because that token cannot arrive in the text for any other reason. And, added at the effort-divergence diagnosis that followed stage 13, it records the ORDERING fault by which this plan's own five enumerators arrived tenth by index and eleventh in execution order — the order being stages 1-7, then 13, then 8, 9 and 10 — downstream of every repair stage they would have fed; and it records with it the BOUND on what that fault's remedy reaches, namely that enumeration covers a defect class whose site set is derivable from an artifact the plan holds and does not cover the cost-tier case, whose object is a judgement no enumerator over this plan's artifacts can decide. The anchor is the position measurement, the phrase 'eleventh in execution order', which can arrive in the text only from stating where the enumerators sat. An earlier wording anchored this clause on effort-replan-absolute and claimed parity with the two anchors above; that claim was false and is retracted here rather than quietly dropped, because this stage's own knowledge field already obliges an effort-history section that would cite the config key of the scale that fired whether or not the ordering fault were ever stated — so the token could arrive for another reason and the anchor decided nothing, which is this plan's own subject committed in the clause that repairs it. The strength the surviving anchor buys is stated exactly and no higher: it makes a silent OMISSION of the fault impossible, and it does not make a thin statement of it impossible — that half is the acceptance-review's and is not claimed by a measurable check. And the trunk-red tests this criterion has just enumerated by name are FILED as a Core difficulty rather than merely described as such — enumerated, not counted, because a sentence repairing an obligation of this class must not introduce a cardinality of its own: stage 13 identifies them as Core defects in a knowledge field, and until this clause no stage and no final check made the filing a deliverable anyone observes — an obligation an executor discharges by not performing