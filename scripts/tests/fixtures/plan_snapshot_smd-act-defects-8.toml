statement = "A requirement on an artifact class binds what is OFFERED, not what was already accepted; and a migration that 'only adds keys' is not a cheap alternative to that rule but an expensive one, because every attestation computed over the file's bytes must then be re-signed by someone who never saw the new bytes."
