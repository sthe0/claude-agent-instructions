means = "git merge — the ordinary three-way kind, wielded from the delivery branch against origin/main — and nothing else in the reconciliation family: not rebase, not squash, not cherry-pick, for the reason stage 12 already carries as an invariant and this stage inherits rather than restates. The merged tree's instruments of judgement are the ones the repository already has and this plan already trusts: pytest over scripts/tests, scripts/verify-all.py as the aggregate lint, and the engine's own loader and submission seam invoked directly. And the attestation itself is a means this stage wields, not an event that happens to it: an independent code-reviewer spawn plus the fix pass that answers its verdict, which tests-accompany-code and review-accompanies-code make part of the stage rather than of its aftermath."
method = "Requirement: a plan's stages transform a TREE, so a plan executing 61 commits behind trunk is a norm addressed to material that will not exist by the time the work lands — and every premise those stages measured was measured on that vanishing tree. Reconciling is therefore an act with its own before and after, which is what the engine models as a stage, and not a chore performed between stages. Four clauses. First, the operation is fixed by a downstream control and not by taste: stage 12's typed landing check decides containment by ANCESTRY, so a rebase or a squash produces a trunk that holds this work under different commits and a check that reports it unlanded — the confusing failure is worse than the tidy history is worth, and stage 12 says so already. Second, the control must decide the MERGED TREE and not the merge operation: 'the merge completed without conflict' is an observation about the act, which is defect 2 committed by the stage that exists to stop the rest of the plan from being measured against the wrong material. So the criterion is three conjuncts over the tree — the suite, the aggregate lint, and a merge-integrity assertion — of which the FIRST is itself disjunctive: the suite is attempted unexcluded, and only if it is red are the inherited reds this stage's baseline ENUMERATES consulted, each pinned by a guard that re-runs that node alone and requires pytest exit code exactly 1 before deselecting it. That shape rather than the guard-first chain an earlier draft used, because a guard-first chain fails in exactly the worlds where trunk has REPAIRED or renamed a named test — the guard's exit-code-1 test is then false — turning a good outcome into a failed control; and since this stage re-verifies at repo_root, where final check 1 runs the same suite, a guard-first stage control beside a bare final check leaves NO world in which both can pass: either a named node is still red and the bare check fails, or it has been fixed and the guard fails. Final check 1 therefore carries the identical disjunctive command, and the two now agree by construction rather than by luck. The last conjunct is written so that it is RED on the pre-merge tree, since Actor.cost_tier exists only on trunk; the executor runs that conjunct BEFORE merging and confirms it fails, which is this plan's own two-directional standard applied to its newest control and is also the only way to find a typo in a one-liner the author could not execute. This control deliberately trips the loader's advisory unscoped-aggregate lint, and the reason is recorded so the trip is not read as the authoring miss that lint exists to catch: every other stage scopes its check to the paths it touches because a whole-suite run there would take an unrelated red hostage, whereas this stage's material IS the whole tree and a scoped run would decide nothing about a merge that reaches 60 files. The argv_text red this suite shows on the pre-merge branch is therefore handled by MEASURING it rather than by scoping or excluding it: it was taken for a machine artifact of TMPDIR length until a plan-review should-fix forced the measurement, which found branch staleness that this very merge repairs — so that test is NOT excluded and must go green. Applying the same measuring discipline one step further then found the identical error committed in the opposite direction: the plan demanded an absolutely green suite on the merged tree without anyone having measured whether trunk's own suite is green in this venue. It is not — one node was red at trunk's tip when this stage was authored, and a re-reading on 2026-08-12 against 836fc21 found a second — so the criterion is baseline-relative rather than absolute, and each inherited red the baseline enumerates is deselected by exact node id. What keeps the exclusion from growing silently is not prose but a conjunct: each deselected node is re-run alone and pytest's exit code must be exactly 1, so the deselection can never widen in silence. What that buys under the disjunctive form the control finally took is narrower, and better, than the expires wording an earlier draft used: when the suite goes green for any reason at all — trunk repairing the named tests among them — the fallback is never reached and the deselections are simply INERT, signalling nothing; and when the suite is red for any reason OTHER than the pinned nodes, the control goes red loudly rather than deselecting a red it has not proved — by a guard exiting 0 or 4 where the pinned nodes are not the reason, and by the deselecting run itself going red where the pinned nodes ARE red and a red the exception set does not name stands beside it. Naming only the guards' 0-or-4 would miss that second case, which final check 1 states in its accurate form: an inherited red the exception set does not name fails both branches. Inert on a good outcome, loud on a bad one. Not expiring, which claimed a signal on the good outcome that this form deliberately does not produce. Two words, separated by measurement rather than by fiat, because an earlier draft let one word name two things and then defined it as a third: the GUARD is the single-node re-run alone, whose exit code is what the control tests; the FALLBACK is the brace group the guard sits inside, guard and then the deselecting suite run; and the rejected guard-first ORDERING is always named as such, in those words. The distinction is load-bearing rather than tidy, and it was measured: the guard exits 0, 1 or 4, whereas the group's own exit is 1 whenever the guard is not 1, so an exit code read off the group says nothing about which node failed. The guard is itself a measured design rather than an assumption, because --deselect naming a stale node was measured to be ignored by pytest in silence, printing neither an error nor a deselection count. Third, the question the review raised — whether the plan's own tightened submission check refuses any plan-shaped fixture trunk has added — is answered here in the only honest way available. It is not answered by submission-checking the corpus: the 55 frozen plans predate the tightening, are deliberately not migrated, and would go red for a reason this plan has already decided is not its business. It is answered by the merged SUITE, which runs trunk's own tests over trunk's own fixtures, so a fixture that a landed requirement refuses surfaces as a test failure rather than as a judgement someone has to remember to make. Note precisely how much of the question that closes: the four submission fields stages 2-7 landed are decided HERE; the field stage 9 adds re-opens the same question at stage 9, and the answer will have the same shape, because a submission requirement binds what is OFFERED and never what is stored, so only a fixture some test actually submits is ever in scope. Fourth, the re-measurement. Eleven premise claims are owed here, not ten: the ten recorded in the knowledge fields of stages 8-12, measured on the pre-merge branch and each re-measured on the merged tree with the outcome recorded, plus the trunk baseline, read immediately before the merge because it cannot be read after it, and until that is done those stages' recorded verdicts are provisional — which their conditions now say in those words. On cost: the tier is raised to large in ACKNOWLEDGEMENT of the review loop, and it does not price it. The estimator charges reviews on a separate _mandated_reviews term — one for the approved plan, one per spawn:developer stage, one per replan since arming — each at a flat medium, so a stage's own tier cannot reach an iteration count at all; stage 7 needed three review rounds and the estimator models one. The measured gap is recorded rather than papered over: large is 8 USD and 60 minutes against stage 7's measured ~28 USD across three rounds, and raising stages 8, 9, 10 and 11 moves the whole-plan estimate from 84 USD to 99 and from 300 to 405 active minutes, still roughly 2.5 times under. The tier ladder in config.md is deliberately not changed by this plan; recording the known under-pricing is what is in scope."
procedure = "Optional. Run the merge-integrity conjunct — the last of the three — on the pre-merge tree and confirm it fails on the absent Actor.cost_tier. git fetch origin; from the delivery branch, git merge origin/main. Resolve every conflict by keeping BOTH sides' behaviour — trunk's additions and this branch's schema work are independent changes to the same files, not competing versions of one change — and where they cannot both stand, stop and record the case rather than choosing. Where the merged suite goes red on a trunk-side fixture or test literal that a landed requirement of this plan refuses, apply the third repair this stage's invariants define — conform the fixture to the requirement, as fixtures/plan_two_stage.toml was already conformed — and record it as that; a red which cannot be repaired that way is a finding, not a licence. Before merging, take TWO readings and not one. First, on the pre-merge branch as it stands, run the first conjunct in this venue and record the exact set of reds — the reading this stage's conditions require, and the one no earlier draft ordered. Second, re-measure the trunk baseline: fetch origin/main and run the full suite in this venue against it, recording the exact set of reds. If that set is anything other than the set of nodes this stage's knowledge enumerates, the difference is a finding to record and NOT a licence to widen the deselection in passing: the exception set grows only through the difficulty cycle, which is what admitting the second inherited red — test_hook_import_blindness.py::test_poisoned_import_exit_code_and_stderr_unchanged_vs_pre_fix, on 2026-08-12 — actually cost. Then run the three conjuncts. Re-measure against the merged tree the ten premises this stage's knowledge field places there — every one but the eleventh, the trunk baseline, which was read before this stage's merge and cannot be read at this point in it — and record each verdict in the stage result; a verdict that has moved is a finding for the stage that recorded it, handled through the difficulty cycle and not by editing the claim in passing. Re-run the effort estimator, which exists only on trunk's side and is live in this tree for the first time, and record what it now says for this plan. Spawn the independent code-reviewer and answer its verdict. Push the merge to the delivery branch."
preconditions = "Stage 7 landed on the delivery branch and its commit is reachable from the branch head; origin is fetchable from the delivery worktree; no stage after this one has begun, since each of them transforms the tree this stage replaces."
conditions = "The reconciliation runs BEFORE stages 8-12 and after stage 7, and the position is not schedule preference: trunk's side of the divergence reaches scripts/agentctl/ and scripts/tests/, which is the material of every remaining stage, so a merge performed afterwards would re-open each of them and a merge performed earlier would have had nothing to reconcile. The merge is executed from inside the delivery worktree against a fetched origin/main, so the canonical checkout — read-only to a live session — is neither read as a working tree nor written. The review loop this stage runs is priced by the same broken unit as stages 8-11: the tier acknowledges the loop and under-prices it by roughly the factor recorded in this stage's method, and that is a statement about the ESTIMATE, not a property of the material this stage transforms. One reading is required before the merge, and it is placed here rather than in the procedure: on the pre-merge branch as it stands, the first conjunct is run once in this venue and its exact set of reds recorded. It belongs among the conditions because it is what LICENSES the partition this stage's knowledge field asserts — that the pre-merge chain is venue-conditional, and that exactly one pre-merge reason is unconditional — and because stage 10 makes the procedure deviable by design, so the same sentence sitting there would be satisfied by an executor who never took the reading. If the recorded set is anything other than the argv_text node alone, the partition does not hold: the difference is a finding recorded BEFORE the merge, not a discovery made after it, and not a licence to widen anything."
invariants = "The 24 delivered commits are neither rewritten nor dropped: the reconciliation adds a merge commit and resolves conflicts, and every commit stage 7 delivered stays reachable — never a rebase, never a squash, never a force-push, because stage 12's typed check asserts ancestry rather than content equality and a history rewrite fails it while the work is in fact landed. No requirement of this plan is relaxed to make the merged tree green: a conflict inside scripts/agentctl/ is resolved by keeping both behaviours, and a fixture trunk has added that a landed submission requirement refuses is a finding to record, never a licence to widen load_plan or to loosen validate_submission. There is exactly one legitimate third repair, and naming it is what keeps the previous sentence from being read as a ban on every trunk-side edit: conforming a trunk-side test literal or fixture to a requirement this plan has ALREADY landed — which this branch has already done once, setting weight_class = 'small_change' in scripts/tests/fixtures/plan_two_stage.toml. That is not relaxing a requirement; it is finishing that requirement's own migration on material which arrived after it landed. The line between repair and licence is whether the change makes the fixture SATISFY the requirement or makes the requirement stop asking: the first is the repair, the second is what this invariant refuses. That test alone under-determines two cases this plan's own subject matter makes likely, so it carries a second clause: a repair must leave the trunk-side test asserting exactly what it asserted before, and where conforming the fixture changes what the test PROVES, it is a finding and not a repair. The two cases are named because they are the ones that pass the first clause and fail the second. A fixture whose role is to be MINIMAL or NEGATIVE — present precisely to show that some element may be absent — is satisfied by adding the element and thereby stops proving the thing it existed to prove. And a fixture feeding a signature or golden assertion over _structural_signature, stage_carry_key or diff_plans, all three of which this plan changes, cannot be conformed without also editing the expected literal, which is the licence side's characteristic move wearing the repair's clothes. The 55 frozen corpus plans are not touched by the reconciliation and no attestation is re-stamped. The stage-1 harness stays green. This stage declares verify_venue_at_final for the same reason stages 1-11 do — its control must survive the removal of the delivery venue at stage 12 — and its check is written so that it decides the tree rather than the operation, which is why it can be re-run in the canonical checkout at all."
capability_required = "git merge and conflict resolution across an engine and its test suite; enough reading of the merged result to tell a conflict resolved by keeping both behaviours from one resolved by silently dropping a side; running the repository's own validators and reading their failures."
knowledge = "Measured before this stage was authored, by the plan review and confirmed independently: the delivery branch is 61 commits behind origin/main and 24 ahead; trunk adds roughly 10 000 lines across 60 files including scripts/agentctl/ and scripts/tests/. Measured on this branch: grep for cost_tier over scripts/agentctl/ returns nothing, and scripts/agentctl/effort.py does not exist — both are trunk-only, Actor.cost_tier living at state.py:578 on trunk and read at plan.py:1151, plan.py:1178 and cli.py:228. Two consequences are recorded because they are easy to get wrong in both directions. The cost_tier values this plan writes on stages 8, 9, 10, 11 and 13 are inert to the engine AS IT EXISTS ON THIS BRANCH and become live in the branch's own copy only once this stage merges; they are NOT inert to the running session, whose engine is the canonical checkout and already reads Actor.cost_tier for the estimate and for diff_plans. A reader must therefore not take a tier declared here for a tier the delivery branch can act on, nor mistake it for one the session ignores. And Actor.cost_tier is deliberately absent from _structural_signature and from stage_carry_key while present in diff_plans' _prose tuple, for the reason trunk states at plan.py:1151 — which makes it a required member of the named-exclusions list stage 10's change-decision enumerator must carry, or that enumerator goes red on a correct delivery the moment this merge lands. Measured at plan-review round three, after two rounds had carried the opposite claim unchecked: scripts/tests/test_argv_text.py::test_a_realistically_long_path_is_named_in_full fails in the delivery worktree and passes in the canonical checkout, same machine and same TMPDIR — 1 failed 19 passed on the branch against 23 passed on trunk. The cause is the 200-character ceiling — this branch's staleness — and TMPDIR length only decides whether that ceiling is crossed. Measured here rather than estimated: with TMPDIR at 49 characters the constructed path is 207 against the 200 ceiling, a margin of SEVEN characters, so a shorter tmp root (Linux's /tmp is four) leaves the same branch code green. The original characterisation was therefore incomplete rather than baseless, and this correction must not overshoot into denying TMPDIR any role. The branch caps the echoed reference at _REF_SNIPPET_CHARS = 200 and trunk replaced that ceiling with _PATH_MAX_CHARS = 4096. Be exact about which side owns what, because the loose version of this sentence is what the previous draft got wrong: the failing test is NOT trunk-only. It exists at the merge base ae72d3af and on this branch as the SAME BLOB e7b78ca5, and it was red at the base too; trunk changed the file to blob 17bbc5cd, taking the test count from 20 to 23 by adding exactly three — test_a_path_at_the_largest_platform_path_max_is_named_in_full, test_a_payload_far_above_path_max_is_still_truncated and test_the_two_bounds_are_separate_and_derived. What is trunk-only is the 4096 BEHAVIOUR, not the test that fails without it. An executor sanity-checking the pre-merge tree must therefore expect the test present and red, never absent. This stage's merge is therefore what turns that test green, which is why that test is not excluded. Measured in the same round and forced by the same review concern: the full suite at TRUNK'S OWN TIP is not green in this venue. Run on 2026-08-10 in the canonical checkout against origin/main at eadd312 it reported 1 failed, 3980 passed, 3 skipped in 271 s, the single failure being test_hook_wiring.py::test_an_unsearchable_chain_member_is_unaccounted_for_not_absent, introduced by trunk's own head commit 5a3c737 and reproducible standalone in 0.09 s. Two checks keep that from being an artifact of the reader rather than of trunk: the five commits this checkout is behind origin/main touch neither hook_wiring nor agentctl, so the red stands at trunk tip; and a direct probe confirmed the filesystem here does enforce a mode-000 directory (PermissionError 13), so what fails is the probe not reporting what the filesystem refuses, not a permissive filesystem. It is a finding about trunk to report, not this plan's business to fix, and reporting it has a named venue rather than a good intention: it is a Core defect, so it goes to this repository's difficulty channel — GitHub Issues, filed with scripts/file-difficulty.py — and not into a stage result where nobody outside this plan will read it. The guard's own two-directional behaviour was measured rather than reasoned: in the canonical checkout the node exists and is red, so the guard exits 1 and the chain continues, and the deselection is counted (42 passed, 1 deselected); on the pre-merge delivery branch the node does not exist at all, so the guard exits 4. Under the disjunctive form the control finally took, that measurement lands more strongly than when it was taken: pre-merge the suite is red on argv_text, which the fallback cannot rescue because argv_text is not among the deselected nodes; each guard then exits 4 on a node that is not there; and the merge-integrity assertion fails on the absent Actor.cost_tier. The honest count of pre-merge reasons is therefore smaller than the tally of failing conjuncts. Those first reasons — the suite red on argv_text, and each guard's exit 4 on a node that is not there — are ONE chain and not independents of one another, since the fallback is consulted only because the suite is red on argv_text: were argv_text green, the fallback would never run and no exit 4 could arise. That counterfactual carries an UNMEASURED premise, named here rather than left implicit in the field whose whole purpose is to retire unmeasured premises — that argv_text is the SOLE red in the pre-merge branch's full suite. What was actually measured is 1 failed of 20 inside test_argv_text.py, and separately the full suite at trunk's tip; the pre-merge branch's own full suite was never run. The direction is conservative for the TOTAL count — a second pre-merge red would ADD reasons and could not remove the unconditional one — but the total is not what the gap threatens, and an earlier draft protected the wrong sentence by saying only that. What the unmeasured premise actually carries is the PARTITION asserted immediately below: a second pre-merge red that is NOT itself venue-conditional would leave the suite red on every venue, so the fallback would run there too and the absent pinned node would still exit 4 — falsifying both the venue-conditionality of that chain and the claim that exactly one reason is unconditional, there being two. That same draft then closed the gap by pointing at a step that does not exist: nothing in this plan ran the pre-merge branch's full suite. What it ran pre-merge was the merge-integrity conjunct alone and the TRUNK baseline, and neither measures this branch's reds. The reading that does close it is therefore ordered as a CONDITION of this stage rather than as a procedure step, because stage 10 exists to make the procedure deviable and an obligation carried there would be discharged by grace rather than by norm. And that chain is venue-conditional by this same field's own measurement of a seven-character margin, so on a venue with a shorter tmp root it does not arise at all. Exactly ONE reason is unconditional — the merge-integrity assertion failing on the absent Actor.cost_tier — and in this venue a venue-conditional chain supplies the others. The same form dissolves the objection that the guard discards its own output: the unexcluded suite runs first and has already printed the failure before the guard is ever consulted, so silencing the guard costs the executor no visibility. Three pytest exit codes were measured to build the guard that keeps the resulting deselection honest — an existing failing node exits 1, a missing node exits 4, an existing passing node exits 0 — and the need for a guard was measured too, against the round-two recommendation that motivated --deselect in the first place: pytest silently ignores a --deselect naming a node that does not exist, printing neither an error nor a deselection count, so --deselect's real advantage over -k is exact-node targeting rather than substring matching, and NOT the loud failure on rename it was credited with. Recording how the error was made matters as much as the correction: two review briefs and two review rounds carried 'pre-existing, unrelated, TMPDIR-length' as a premise nobody measured, which is the very defect class this replan exists to remove — committed inside the stage added to cure it, and caught only because a reviewer asked which of two contradicting statements had to move. The eleven premise claims to re-measure on the merged tree — ten recorded as measured by stages 8-12 on the pre-merge branch, plus the trunk baseline this stage measured, listed last because it differs in kind: trunk moves, so a baseline measured today is a dated reading rather than a standing fact: resolve's five acceptance-relevant flags; gates.py reading plan bytes in exactly two guardians; state.py carrying PlanReview and JudgeBypass and no AcceptanceReview; planner/SKILL.md line 122 containing 'so execution is mechanical not design'; zero occurrences of 'the executor may replace the procedure' in that file; _apply_refined_stage_fields not copying criterion.verify_venue_at_final although stage_carry_key reads it; verify-doc-concepts.py, verify-cross-refs.py and verify-memory-index.py all present; scripts/land-on-main.sh present; all of stages 1-11 declaring verify_venue_at_final with stage 12 declaring none; tenth, stage 10's own claim that its enumerator goes red on a correct delivery the moment this merge lands, and final checks 1 and 6 with it, unless actor.cost_tier is in the named-exclusions list from the start — listed because stage 10 states in its own knowledge field that this claim inherits this stage's re-measurement obligation, and an obligation a stage accepts with no place on the list that discharges it is exactly the defect this plan exists to remove; and eleventh, the pre-merge trunk baseline itself — an ENUMERATED set of red nodes and never a count of them, read in this venue on 2026-08-10 against origin/main at eadd312 as the single node test_hook_wiring.py::test_an_unsearchable_chain_member_is_unaccounted_for_not_absent, and re-read on 2026-08-12 against 836fc21 as that node together with test_hook_import_blindness.py::test_poisoned_import_exit_code_and_stderr_unchanged_vs_pre_fix, whose file arrived on this branch with this stage's own merge b90bade — re-measured in this venue immediately before the merge, a baseline red the set does not already name being a finding rather than a licence to widen the deselection in passing. Eight of the first ten are properties of files trunk may have moved; the ninth is a property of this plan file, which trunk cannot move at all, and is re-measured here only because the merge is the moment the whole set is re-read; the tenth is a prediction about how the merged tree will behave, re-measurable in the same act and by the same run — what is actually observable is its antecedent, that actor.cost_tier is absent from _structural_signature and from stage_carry_key and present in diff_plans' _prose tuple on the merged tree; the eleventh is a property of trunk itself."

[stage.principle]
statement = "A plan executing on a branch that has diverged from trunk is a norm addressed to material that will not exist, so reconciling is a stage with its own control rather than a chore between stages; and the reconciliation's operation is fixed by a downstream typed check that decides by ancestry, not by the executor's taste in history."
source = "the plan review that measured this branch at 61 behind and 24 ahead of origin/main and found Actor.cost_tier present on trunk and absent here; stage 12's existing invariant that the delivered commit stays reachable; this plan's own standard that a control must be able to go red on a real mutation."
derivation = "Each of stages 8-12 declares its material and measures premises against it, and every one of those measurements was taken on the pre-merge branch — so the merge is a transformation of the material of five later stages, which is precisely the shape the engine models as a stage rather than as an operation inside one. The choice of operation then follows from stage 12 rather than from preference: its check computes containment by ancestry, so squash and rebase produce a trunk that holds this work and a check that denies it. And the control has to decide the tree rather than the act, because a criterion reading 'the merge completed' is an observation about the operation — defect 2 committed by the stage whose purpose is to stop the rest of the plan from being measured against the wrong material."
confidence = "high"
refutation = "Refutable by the merged tree itself: if the merge takes no hand-resolved conflict, the control passes first time, and all ten re-measured premises return exactly the verdicts stages 8-12 already recorded, then trunk and this branch were independent in fact, the reconciliation was bookkeeping rather than a change of material, and this stage was right to run but wrong to be priced at large. Observable directly: the conflict count from the merge, and the diff between the recorded verdicts and the re-measured ones."

