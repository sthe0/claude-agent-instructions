means = "The three existing entry points at which plan bytes enter a live session, as the places a submission-grade check may live; the engine's fix_plan Directive shape, which is how a refusal is expressed without wedging a session; the frozen-plan harness from stage 1, RUN by this stage's own check; the element-name vocabulary and its single validation site; the strict/non-strict split, left untouched; pytest."
method = "Requirement: knowledge must become a place a stage can be SHORT of, which needs three properties at once — nameable on an edge, demanded of a substantive stage, and satisfiable either locally or by supply. But WHERE the demand is made is the decision this stage actually settles, and it settles it for every later stage too. The loader is reached with strict=True from seven in-session call sites, so a requirement added there is applied retroactively to every plan any live session re-reads; the only ways to keep those sessions working are to migrate their plan files or to exempt them. Migration is rejected on evidence, not taste: the engine binds a recorded plan review and a delivery receipt to the plan's sha256, so adding keys to a live plan makes those attestations stale, and the only repair is to re-stamp them — writing a reviewer's signature over bytes that reviewer never saw. Exemption by a schema marker is worse: the marker is optional, so it is a switch an author flips to escape the norm. The remaining option is the correct one and is cheaper than both: the requirement is a SUBMISSION-time property, not a load-time one. A plan is checked when it is offered as a norm; once accepted it keeps loading under the rules in force when it was accepted. No bytes change, no digest is invalidated, no session breaks, and the seam is reused by every later stage instead of each one tightening the loader separately. That decision then makes the ENUMERATION of offering points load-bearing, and an earlier draft got it wrong by one — the one that mattered. Offering is not 'the author typed submit-plan'; it is any point where new bytes become the plan the session executes, and there are three. cmd_submit_plan is the obvious one. cmd_replan's NEW side is one call site, `_load(args.plan)` before diff_plans, so covering it covers all three of its outcomes — no_change, refinement and substantive all pour the new bytes into live state, and a reader who took 'the NEW branch' to mean the substantive branch would cover one of three. And cmd_approve calls _refresh_caches_from_plan_path, whose own docstring states the case exactly: PLAN_READY is deliberately plan-mutable because a REVISE verdict is answered by editing the file in place, so approve must absorb that edit — it rewrites stage fields, final_check and venue and resets PASSED on any changed carry key. That is offering, and it is the point at which THIS plan's own review cycle has been operating all along. How the third point refuses matters as much as that it does: raising a PlanError inside approve would wedge the session at PLAN_READY with the gate armed and no route out — the failure cmd_submit_plan's own comment warns against — so the refusal is the engine's fix_plan Directive, routing the author back to submit-plan with the violated requirement named. Checked and NOT a fourth point, twice over, recorded here so the next reader does not re-derive either. cmd_push_subplan sets plan_verified False, empties state.stages and moves the node back to CLASSIFIED, so a child plan must pass its own submit_plan. And cmd_present_plan reads the live bytes and stamps two bindings over them — plan_sha256 and rendering_sha256 — but moves nothing into executable state, so it is not an offering point; the sequence submit(ok), edit in place, present, approve is caught at the third point, which is why that point being the third and not merely a third matters. The seam decision has a consequence one round of review missed entirely, and it is stated here because it applies to every field any later stage adds: a field is not admitted to the engine when its dataclass parses, but when the four functions that decide what COUNTS AS A CHANGE to a stage know about it. stage_carry_key decides whether a substantive replan keeps the stage PASSED; _apply_refined_stage_fields decides which fields a re-materialization actually copies onto live state, and its own docstring binds it to cover everything the carry key reads; diff_plans' _prose tuple decides no_change versus refinement; stage_question_key decides whether a disposed question still targets the bytes it was answered against, and its docstring claims to cover every field a Question.target may legally name — a claim this task would break the moment it widens ELEMENT_NAMES and left unrepaired. Leaving any of the four behind produces failures that are all silent and all green: the third seam point pours in fresh bytes while the new fields keep their stale values; an edit to a new field alone classifies as no_change and never reaches the branch meant to handle it; a question about knowledge survives the knowledge being rewritten. The existing test pins the relation between the copied set and the carry key, so a field absent from BOTH passes it — which is why stage 10 adds an enumerator over the struct's own fields rather than another pinning test. Two acceptability clauses on the knowledge fix itself. The typed projection: introducing knowledge as prose while stage 4 establishes that prose is invisible to the coverage gate would fix defect 4 for material and re-commit it for knowledge on the day knowledge is born — so knowledge gets knowledge_refs exactly as material gets material_refs. The destination: adding knowledge as a fourth NORMALIZATION_LEVEL is a category error, because note/leaf/principle is a scale of DEPTH gated on generality while knowledge is a SPACE a factor is routed to. So the destination is its own axis — and it is a CLOSED tuple with its own field on the normalization record, because the negative half alone (the depth scale stays unpolluted) leaves a free-string destination that admits everything and controls nothing. Explicitly NOT claimed: this stage does not close the factor-discovery cycle; it supplies the cycle's terminal routing step."
procedure = "Optional. Create scripts/agentctl/submission.py with validate_submission(plan) raising PlanError, and call it from exactly three places: cmd_submit_plan; the NEW side of cmd_replan's diff (the single `_load(args.plan)` before diff_plans, which is why all three diff outcomes are covered by one call); and _refresh_caches_from_plan_path. At that third site three things must be arranged and none of them is automatic. The function today returns None and cmd_approve calls it as a statement, so it must be given a return value — the violated requirements, empty when there are none — and cmd_approve must branch on it. The branch must run BEFORE _log_gate records plan_approval, or the same command logs the gate as passed for a plan it is about to refuse; if that ordering is impossible for another reason, the refusal must be logged as its own event rather than left implicit. And the function's existing `except (OSError, PlanError): return` is inherited as a MODEL only in the narrow sense that the live caches stay untouched — the silence itself is a defect, not a precedent: after this change a submission violation refuses loudly while an unreadable or unparseable plan is still approved silently at the same call site, which is an inversion, so the load-failure branch must at minimum surface that it failed rather than count as normal. At all three sites, after the plan is accepted, stamp the sha256 of the accepted bytes into a new SessionState field — that field is the session's answer to \"which plan am I executing\", and stage 8's staleness check is a comparison against it rather than a recomputation. Extend, in the same commit as each field is introduced, all four members of the change-decision family: plan.stage_carry_key, cli._apply_refined_stage_fields, the _prose tuple inside plan.diff_plans, and plan.stage_question_key. The SCOPE of that last one is decided here once, for this stage and every later one, because two readings are possible and only one is right: it takes every field this plan introduces, not only the names added to ELEMENT_NAMES. A question targeting stage:N.material is answered against the material, and material_refs is that material's structural projection by stage 4's own finding — so leaving the refs out of the key would re-commit defect 4 inside the question gate, one stage after fixing it elsewhere. HOW each field is contributed is equally decided, and is not a detail: the value is persisted in Question.disposed_at_key and compared ACROSS PROCESSES, so a field contributes to the key only WHEN IT IS DECLARED, never as `... or \"\"` — the idiom the function already uses for verify_venue_at_final and states in a comment beside its own payload, and which _operative_surface uses for the same reason. Contributing unconditionally changes the digest of every already-accepted plan, including the ones where the new field is None, and lights two plan_approval blockers in every live session on this machine: the disposed-question comparison in premise.py and the folded _plan_content_digest. That is not a side effect to be weighed — it would refute this stage's own central claim that no digest is invalidated and no session breaks, which is the ground on which the corpus migration was declined. Commit the fixture scripts/tests/fixtures/submission/stage_without_knowledge.toml that final_check 4 loads — it must be declared by hand, because the reachability lint cannot see a path inside a `python3 -c` program (_reachability_path_tokens skips the token after -c), so this class of miss is invisible to every automatic check and was found only by reading. Add 'knowledge' to ELEMENT_NAMES with its cluster comment. Add Stage.knowledge, Subject.material_refs and Subject.knowledge_refs as optional dataclass fields. material_refs is named explicitly because it does NOT exist on HEAD — Subject carries exactly material, result and invariants — and every later reference to it (stage 4's edge and material, final_check 4's assertion, the change-decision obligation) presupposes this stage created it; a reader who took `knowledge_refs required and normalized like material_refs` for a reference to an existing field would build a Subject stage 4 cannot import. In validate_submission require both for substantive stages, evaluating the knowledge check AFTER supplies are built so the incoming-edge alternative is visible. Add NORMALIZATION_DESTINATIONS to state.py and a destination field to the normalization record; add the --destination argument to cmd_normalize, validated against the tuple and orthogonal to --level; extend the FAILURE_ADDRESS_VALUES comment. Rewrite the Principle docstring. Tests, including the assertion that the same plan loads strict without error."
preconditions = "Stage 1 harness green in the worktree."
conditions = "The vocabulary, the field pair, the seam and the requirement are transformed in one commit: an element name and the requirement that gives it force are two halves of one change, and either alone leaves knowledge nameable but not required, or required but unfillable. The two projections carry a documented CONTRACT and not a refusal, and the reason sits here rather than in the done criterion because it is a rationale for a design choice, not a thing anyone can check: a criterion states what must be observed, and a paragraph of justification wedged into it is neither observable nor refutable. Three reasons the disjointness of material_refs and knowledge_refs is not enforced at submission. No requirement in this order asks for it, so the product would be mandating what nobody ordered. The comparison would be set intersection over unnormalized name granularities, so cli.py in one list and cli.py:cmd_approve in the other would pass while the same pair written consistently would fail — a refusal that punishes precision. And the property is a relation between two fields' values, outside the domain of both enumerators this plan builds. An earlier draft added a fourth claim, that the contract is 'warned about by the prose lint at ADVISORY level only': there is no such lint in this repository and no stage of this plan builds one, so the enforcement of this contract is exactly that a reader can find it written down. And a symbol appearing in BOTH projections is a smell the stage's own material prose must justify rather than a violation, since a stage that transforms F while relying on an invariant of F is legitimate and a refusal would make that case inexpressible."
invariants = "load_plan's behaviour is byte-for-byte unchanged for every fixture plan under both strict values — this is the invariant the whole seam decision exists to hold, and the stage-1 harness is what asserts it. Existing element names keep their spelling and meaning. NORMALIZATION_LEVELS keeps exactly its three depth values and shares no member with NORMALIZATION_DESTINATIONS. Two vocabularies meet in this stage and must not be collapsed, which is what an earlier draft of this stage's own verify_command did: the destination axis names its members in the vocabulary of its axis-sibling FAILURE_ADDRESS_VALUES, while ELEMENT_NAMES names its members in the vocabulary of the plan fields an author types in TOML; these are two different vocabularies and no criterion may assert a spelling from one against the other. The English word 'knowledge' denotes a place on BOTH sides of that boundary, which is exactly where the collapse happens, so this plan fixes the destination spelling explicitly rather than leaving the executor to invent it: the destination members are the SMD analytic categories of обеспечение, written as its sibling axis already writes them, and the axis is exactly ('материал', 'средство', 'норма', 'способ', 'знание') — all five fixed here so the norm and not only a delivered test carries the set, and 'знание' appearing in this stage's verify_command is that fixed spelling and not an exception to the repository's English default. One literal, one fixing site: a spelling a control asserts is fixed in exactly ONE place in this plan, and every other statement of the same property agrees with it or is spelling-free — the permission form ('you may assert a literal if the plan fixes it') does not forbid what actually happened here, which was the plan fixing one spelling in its reasoning and a different one in its criterion. Non-substantive plans are unaffected. No field added by this stage or by any later stage of this plan exists in a struct without existing in all four change-decision functions, and no name added to ELEMENT_NAMES exists without stage_question_key covering it — the docstring contract of that function is restored, not broken. Over the stage-1 corpus fixture, stage_question_key returns its schema-23 value byte-for-byte for every plan that declares none of the new fields — an identity load_plan's byte-for-byte invariant does NOT cover, because that one is about the loader's behaviour while this one is about a digest persisted in Question.disposed_at_key and compared between processes. The recorded plan digest is written at the three seam points and at no other place, so it cannot drift from the bytes the session executes. Out of scope and not to be implied by any artifact: the RE-ENTRY of the factor-discovery cycle. In scope and not to be denied: the cycle's terminal routing step."
capability_required = "Python dataclass and validation work in agentctl; ability to read the cited source lines and ADR-0004."
knowledge = "The source makes knowledge upstream of both the norm and the selection: on a mismatch the discovered factor is included in knowledge and the cycle re-enters; the selection of material and means is based on knowledge; an order may itself be an order to build knowledge. That is why an engine offering only note/leaf/principle routes the factor to the wrong place — and equally why the fix is a destination rather than a fourth level. The half-recognition already in the codebase is the FAILURE_ADDRESS_VALUES comment, which states that both addresses reduce reflexively to knowledge. Measured in the engine, and decisive for the seam choice: load_plan is reached with strict=True from seven in-session call sites, and gates.py binds both a plan review and a delivery receipt to the plan file's sha256."

[stage.principle]
statement = "A functional place exists in the engine only if it is simultaneously nameable on a provision edge and required of a substantive plan, and if its content is typed rather than narrated; and a new requirement over a corpus that live sessions re-read belongs at the moment the artifact is OFFERED as a norm, never at the moment it is read back, because only the first moment is one the author is present for."
source = "activity_as_is.md on the functional place, on the factor's inclusion in knowledge, and on selection based on knowledge; ADR-0004, which retired a-priori typing for exactly the depth/destination conflation; gates.py plan_review_blockers and plan_presentation_blockers, both computing sha256 over the plan file."
derivation = "A place is defined by its capacity to be EMPTY and thereby generate a need. An optional field can never be empty in that sense — its absence is indistinguishable from its irrelevance — so it generates no need and no supply; requiring it makes emptiness observable, naming it on the edge makes the emptiness fillable from outside. The typing clause follows from stage 4's finding: a narrated element is invisible to any gate that must stay unsatisfiable by rewording. The seam clause is separate and was forced by review: a load-time requirement is retroactive over a population the author cannot edit, so it must be paid for either by rewriting other people's files — which invalidates every attestation computed over their bytes — or by an opt-out marker, which is not a requirement at all. A submission-time requirement has neither cost, and the same seam then serves every later tightening. Rejected alternative, named because the derivation would otherwise overreach: the source is satisfied equally by making emptiness OBSERVABLE without refusing the plan. Refusal is chosen over observation not by derivation but by evidence — the corpus shows the cheaper untyped path wins whenever it exists (3 element-bearing edges in 151) — so that half is empirical and is defeated if the evidence is wrong."
confidence = "medium"
refutation = "If authored knowledge fields carry no content distinct from the stage's own principle or material, the field is a required box rather than a place. Observable without any string comparison: sample the next N authored plans and ask whether any stage's knowledge states something its principle and material do not. The seam half is refuted separately: if a plan is in practice re-submitted on every replan, submission-time and load-time requirements coincide and the distinction bought nothing."

