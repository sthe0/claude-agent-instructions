index = 2
title = "Defect 1: admit knowledge as a functional place, on a submission-time seam, with a destination not a level"
executor = "spawn:developer"
expected_result_image = "A submission-validation seam exists — one function carrying every requirement this task adds, called from all THREE points at which a plan's bytes are offered to a live session, with the loader itself left exactly as permissive as it is today. The three, named exactly because an earlier draft named two and the third is the one that matters most: cmd_submit_plan; the NEW side of cmd_replan's diff, which is the single `_load(args.plan)` before diff_plans and therefore covers all three of its outcomes; and cmd_approve, which calls _refresh_caches_from_plan_path — the path by which a plan edited in place at PLAN_READY, exactly as a REVISE verdict is answered, pours fresh bytes into stage fields, final_check, venue and the PASSED reset, today with no submission check at all. At that third point the seam refuses by DIRECTIVE — the engine's own fix_plan shape, routing back to submit-plan — never by a raised PlanError, which would wedge the session at PLAN_READY with the gate armed. On that seam, knowledge becomes a place a stage can be short of and another stage can fill: a name a provision edge may carry, a field demanded of a substantive stage unless an incoming edge supplies it, and — symmetrically with material — a typed list of references whose change is a change and whose rewording is not. Both projections are CREATED here: Subject on HEAD carries exactly material, result and invariants, so material_refs is added by this stage no less than knowledge_refs, and both enter all four change-decision functions in the same commit. A factor discovered at control gets a typed DESTINATION drawn from a named, closed tuple of admissible destinations, recorded as its own field on the normalization record, and distinct from the depth at which the factor is written down; routing a factor to knowledge is therefore expressible without pretending knowledge is deeper than a principle, and a free string cannot pass as a destination. The Principle docstring no longer denies that a principle can be knowledge. Adding a field to a stage is not finished when the field parses: the engine keeps a FAMILY of functions that decide what counts as a change to a stage — plan.stage_carry_key (does a substantive replan keep this stage PASSED), cli._apply_refined_stage_fields (which fields does a re-materialization actually copy onto live state), plan.diff_plans._prose (is an edit no_change, refinement or substantive) and plan.stage_question_key (is a disposed question still answered against these bytes) — and every field this stage introduces enters all four. Without that, the third seam point pours in bytes and leaves the new fields behind, an edit touching only a new field classifies as no_change, and a question targeting stage:N.knowledge survives a rewrite of the very knowledge it was answered against. Finally the session records the digest of the plan bytes it currently executes — stamped at the same three seam points and nowhere else, so \"the plan this session carries\" is a recorded fact rather than something a gate must recompute."
