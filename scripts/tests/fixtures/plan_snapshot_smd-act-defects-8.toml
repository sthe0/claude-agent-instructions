[[stage]]
index = 5
title = "Defect 6: conditions of the transformation separate from preconditions of starting"
executor = "spawn:developer"
expected_result_image = "Preconditions of starting are a field of their own, required of a substantive stage at submission, and a conditions value exhausted by dependency restatement is refused with a message naming the field it belongs in. The coverage gate keeps searching conditions as well as invariants, because a genuine condition of the transformation can be exactly the thing a replan must preserve — the incentive that emptied the field is removed by refusing the restatement, not by making the field unreadable."
criterion_type = "measurable"
