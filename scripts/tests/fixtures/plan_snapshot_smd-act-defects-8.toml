[[stage]]
index = 3
title = "Defect 5: the image of the result stops restating its own check"
executor = "spawn:developer"
expected_result_image = "A substantive plan whose stage merely names the outcome of its check is submitted WITH A WARNING that names the offending stage and what its image restates; no plan is ever refused on an echo verdict. That the remedy warns rather than refuses is not a softening of the discrimination but the size the material turned out to earn: the independent labelling this stage ordered found 11 echoes in the committed 200-image fixture, 5.5 percent, nine of them three revisions of a single plan, against the 58-of-200 prior on which a refusal had been sized — and prevalence is what justifies a hard requirement over a convention, as this stage's own principle says. The discrimination is unchanged, and neither number moves now that the labels are readable. It is a high-recall structural prefilter handing off to a fail-open model judge — not string equality, which was measured against the corpus and catches none of the 58 instances the mechanism exists for. The prefilter's reach is measured against a NUMBER, not a promise: run over the committed fixture it must flag at least 0.70 of the images an independent labeller — a different actor, briefed on what an echo is and not on how to find one, labelling before any prefilter exists — classified as echoes, and that floor is a committed test rather than a one-time report. The floor never travels alone: the same committed test holds the prefilter to flagging no more than 0.25 of the images that labeller classified as genuine, and it is that pair — not the floor by itself, which a mechanism flagging everything would clear — that a passing prefilter has to satisfy. The floor is in-sample and says so; the ordering that gives it its meaning is asserted from the repository's history rather than promised. The judge lives on the submission seam, never inside the parse function documented as pure, so an ordinary engine command spawns no subprocess. When the judge is unavailable the plan is accepted with no warning at all, and the stage's invariants say plainly what therefore stops being reported."
criterion_type = "measurable"
done_criterion = "tests pass covering: both corpus-derived echo fixtures SUBMITTED rather than refused, each carrying a warning that names the offending stage — an assertion stated positively, so a later re-tightening back into a refusal cannot pass this suite in silence; a genuine corpus-derived image submitted with no warning, and — the guard that actually binds — the prefilter's false-positive rate over the labeller's genuine set at or below 0.25, measured by the same committed test that measures recall; the prefilter alone with the judge stubbed unavailable warns about nothing, proving fail-open; the judge stubbed 'echo' produces the warning; parse_plan asserted to spawn no subprocess; a recall test over the labelled fixture meeting the 0.70 floor; and — in the same file, so the same -k selector reaches it — a test that reads the repository's own history and fails unless the commit that ADDED scripts/tests/fixtures/result_image_echo_labels.json precedes the commit that ADDED scripts/agentctl/result_image.py, so the ordering the floor's meaning depends on is an artifact rather than a promise. Both objects are whole files, so both commits are found by the same one-line query over addition events, and nobody has to decide what counts as the moment prefilter code first appeared inside a file that already existed — which is the reason the prefilter is a module of its own rather than a block appended to the submission seam, and why that module is declared in this stage's output_artifacts"
verify_command = "python3 -m pytest scripts/tests -q -k 'result_image or echo or prefilter_recall or loader_purity' && python3 -m pytest scripts/tests/test_frozen_plan_compat.py -q"
verify_venue = "delivery"
verify_venue_at_final = "repo_root"
expected_exit = 0
depends_on = [2]
supplies = [{ on = 2, element = "material", artifact = "the submission-validation seam itself — validate_submission and its three call sites — which this stage TRANSFORMS by adding the first semantic check to it, rather than wields unchanged; submission.py is in this stage's material_refs for that reason. Contrast the same edge at stage 5, correctly typed means: what stage 5 consumes is the prefilter-plus-judge helper as an instrument, not the module" }]
output_artifacts = ["scripts/tests/fixtures/result_image_echo_labels.json", "scripts/tests/fixtures/result_image_echo_labeller_brief.md", "scripts/agentctl/result_image.py", "scripts/tests/test_prefilter_recall.py"]
material = "The submission seam stage 2 established, where a semantic check may run — the one thing this stage TRANSFORMS, and therefore the one entry in material_refs. Three further things it relies on and leaves ALONE, which is why they sit in knowledge_refs and not beside the seam: plan.py's parse_plan, which stays pure and untouched and is asserted so by a test; text_shape.normalize_string, casefold plus whitespace collapse and nothing more, read for what an equality test can and cannot reach and not rewritten; and advisor.judge_binary_ask with its fail-open contract, called as a template and not amended. An earlier draft of this stage carried the last two in material_refs, which read the contract backwards in the very stage whose neighbours make that contract a submission requirement. And — named here for the reader, but deliberately in NEITHER structural projection — the labelled set itself, every one of the committed fixture's 200 result images classified echo or genuine, which this stage PRODUCES in its first sub-step rather than inherits. Its typing is the correction this stage's own difficulty taught: it is not in material_refs, because that projection names what the stage TRANSFORMS and the labels are not transformed by anything here; it is not in knowledge_refs, because that projection names what the stage relies on and leaves ALONE, and at the moment the stage starts the labels do not exist to be relied on. They are the control's yardstick, produced on the control side by the actor means names, and their structural home is output_artifacts — which is the projection for what a stage produces, and which is what discharges the demand that a material with no repo home have a producing stage named. The failed draft named this same set as a material and left it out of every projection, and that is exactly why nothing caught it: absence from a projection is indistinguishable from an element that needed none."
material_refs = [
  "scripts/agentctl/submission.py",
]
