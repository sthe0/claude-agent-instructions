[[stage]]
index = 8
title = "Defect 2: control compares result with goal at every stage; acceptance compares product with order once, and is recorded"
executor = "spawn:developer"
cost_tier = "large"
expected_result_image = "Passing a substantive stage requires that someone compared what was achieved against what was sought, whatever the criterion type: the check having exited as declared is retained as a conjunct and never stands alone. That is CONTROL, and it is a widening of the existing observation gate's key — not a third mechanism beside the control attestation and the code review. At plan level the distinct act is ACCEPTANCE, and it now has a CARRIER: a typed AcceptanceReview record, written by `agentctl accept` with one verdict per requirement id and an author field, persisted in the session state exactly as PlanReview and StageReview are. The resolution gate reads that record rather than recomputing anything, so it stays pure; it refuses a resolution with no record, with an incomplete record, or with any requirement carrying a negative verdict. The author defaults to and is checked against [meta.order].customer_id — the identifier half of the typed customer pair, not the prose that names the position — so acceptance is performed by the position the order came from and the check is actually executable. When the judge that assists the comparison is unreachable the acceptance is not silently granted, and the degraded path chooses explicitly between the deadlock and the silent grant rather than leaving the reader to guess: a bypass NEVER stands alone. `agentctl accept --bypass` still writes an AcceptanceReview with a per-requirement verdict the author supplies unassisted, PLUS an AcceptanceBypass carrying a non-empty reason and naming the requirement ids that were judged without assistance. The resolution gate therefore keeps exactly one blocking condition — a complete record with no negative verdict — and never inspects the bypass; the bypass count and its reasons are surfaced in verify-final's output so a degraded acceptance is visible rather than blocking. What a REACHABLE judge does is said here rather than left to be assumed: it ASSISTS the comparison — it does not verify the verdict and does not sign it. The author writes the per-requirement verdict in both modes; the only difference between `accept` and `accept --bypass` is the recorded fact that no assistance was available, and a reader must not take the unassisted path for the weaker one on any other ground. The acceptance record binds the plan bytes it accepted, and the staleness check names its mechanism instead of gesturing at one: the session records the digest of the bytes it currently executes, stamped at the three seam points stage 2 establishes, so the gate compares two recorded strings — the record's plan_sha256 against the session's — and still computes nothing and reads no file. A plan replaced by approve after an acceptance therefore leaves that record stale, and the gate treats a stale record as absent and says so."
criterion_type = "measurable"
done_criterion = "tests pass covering: a measurable substantive stage refused a pass with no observation; refused with an observation echoing subject.result; passed with a genuine observation and a green check; a session with all stages passed but no AcceptanceReview blocked at resolution; a session whose AcceptanceReview omits a declared requirement id blocked; a session whose AcceptanceReview carries a negative verdict on any requirement blocked; an AcceptanceReview whose author does not match [meta.order].customer_id refused at write time; an unreachable judge producing an AcceptanceReview PLUS a reasoned AcceptanceBypass and a resolution that PASSES, with the bypass surfaced in verify-final's output; a bypass written without an accompanying AcceptanceReview refused; and an AcceptanceReview whose plan_sha256 differs from the digest the session recorded at its last seam point treated as absent, the case constructed by accepting and then replacing the plan through approve. And, added when this stage failed its first attempt: the WHOLE test tree is green except the two tests named explicitly in the check above, both of which are red on trunk independently of this branch. That clause is not decoration on the list before it — the first attempt satisfied every item of that list and left 71 new failures standing, because the check that decided it selected 139 of 4226 tests and the failures lay outside the selection. A criterion assembled from the names of the tests a stage means to ADD measures the stage's intention; only the whole tree measures its effect. The stage's original narrow selection is kept after the unfiltered run, on the same footing stage 9 states for its own: pytest exits 5 on a selection that collects nothing, so the conjunct goes red if this stage's tests are renamed out from under it, and it cannot false-fail, since the first conjunct has already proved the tree green except the two deselected nodes the selector does not reach."
verify_command = "python3 -m pytest scripts/tests -q || { python3 -m pytest scripts/tests/test_hook_wiring.py::test_an_unsearchable_chain_member_is_unaccounted_for_not_absent -q > /dev/null 2>&1; a=$?; python3 -m pytest scripts/tests/test_hook_import_blindness.py::test_poisoned_import_exit_code_and_stderr_unchanged_vs_pre_fix -q > /dev/null 2>&1; b=$?; test $a -eq 1 && test $b -eq 1 && python3 -m pytest scripts/tests -q --deselect scripts/tests/test_hook_wiring.py::test_an_unsearchable_chain_member_is_unaccounted_for_not_absent --deselect scripts/tests/test_hook_import_blindness.py::test_poisoned_import_exit_code_and_stderr_unchanged_vs_pre_fix; } && python3 -m pytest scripts/tests -q -k 'record_result or observation or acceptance or resolution' && python3 -m pytest scripts/tests/test_frozen_plan_compat.py -q && python3 scripts/verify-agentctl.py"
verify_venue = "delivery"
verify_venue_at_final = "repo_root"
