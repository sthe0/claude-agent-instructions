owledge field records a margin of seven characters between the constructed path and the 200-character ceiling, so on a venue with a shorter tmp root the same branch code is green before the merge and witnesses nothing. That is a guarantee and not merely an observation, because both files are byte-identical between this branch's head and the merge base ae72d3af — the branch never touched either — so trunk's copies arrive unconflicted and no resolution decision can keep the 200-character ceiling; python3 scripts/verify-all.py passes every one of its checks; and a merge-integrity assertion passes stating that trunk's Actor.cost_tier is present, that Stage.knowledge, Stage.preconditions, Subject.material_refs and Subject.knowledge_refs are present, that the branch's element vocabulary still contains knowledge, that at least 69 fixture TOMLs are present and every one of them still loads, and that the knowledge-less submission fixture strict-loads while submission_violations still refuses it. Separately and not decidable by that command, three obligations. First, TEN of the eleven premise claims listed in this stage's knowledge field are re-measured on the merged tree and the result recorded, each either confirmed or turned into a finding; the eleventh, the trunk baseline, is by its nature read immediately BEFORE this stage's merge, since a baseline taken on the merged tree is not a trunk baseline at all, and the blanket on-the-merged-tree clause that once covered all eleven swallowed exactly the premise this stage's knowledge field flags as differing in kind. Second, that pre-merge reading is what LICENSES the deselection, and no command can establish it: the guard inside the control runs on the merged tree, so it decides that the node is red HERE, never that it is red because TRUNK is red - a node this very merge turned red would exit 1 just the same and be deselected in silence. The licence therefore comes from the pre-merge reading of the baseline SET and never from the post-merge guard, and if that pre-merge baseline shows anything the set does not already enumerate, the difference is a finding and the deselection stays where it is until a difficulty cycle widens it. Third, the reading this stage's conditions require: on the pre-merge branch as it stands, the first conjunct is run once in this venue and its exact set of reds recorded. It is enumerated here and not left to the conditions alone because this criterion is what a verifier judges the stage result against, and an obligation absent from it is an obligation an executor discharges by not performing — which is precisely how the earlier draft's false gap-closure survived. If the recorded set is anything other than the argv_text node alone, the partition this stage's knowledge field asserts does not hold, and that difference is a finding recorded BEFORE the merge rather than a discovery made after it"
