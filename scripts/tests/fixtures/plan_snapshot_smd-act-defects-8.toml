[meta]
task_id = "smd-act-defects-8"
goal = "Remove all eight categorical defects in how the agentctl engine models the act of activity (SMD tradition, MMK/MMPK), so that the plan the engine validates is a norm addressed to the functional places THIS plan targets — knowledge included — rather than an ordered program of operations checked by an exit code. Coverage of EVERY functional place is deliberately not claimed, and the earlier wording that claimed it was refuted by this plan's own stage 11, which records five source distinctions this task does not implement: the content half of the goal deriving from knowledge about the material; the object space and the selection of a material among candidates; forecast as a status of knowledge; the structural link between means and conditions; and the result/product distinction as a type."
done_criterion = "Every requirement R1-R11 in [meta.order] is met, and the map from each R to the control that decides it is declared in [meta.order.coverage] with each entry marked full or partial, so an uncovered half is visible rather than implied. The thirteen stage checks and the eight final_check blocks all pass, re-run in the canonical checkout after landing (every measurable stage 1-11 declares verify_venue_at_final, and so does stage 13, which was added after this clause was first written and which reconciles the delivery branch with trunk; stage 12 does not and must not — its control is the typed landing assertion, which the loader refuses to let carry a final venue, and stage 12's own preconditions state the quantifier in that corrected form), and the terminal state is trunk/main with the delivery worktree gone, asserted by a typed kind = \"landed\" check rather than by a shell string. Three honesty clauses about this criterion itself. First, the coverage map is machine-checked in TWO different senses that must not be conflated: final_check 6 runs test_order_coverage_map.py, whose domain is a FIXTURE plan — it proves the totality property is enforceable and that the resolver works, and it checks nobody's real map; the totality of THIS plan's map is checked by a second, one-shot invocation of the same resolver against a committed snapshot of this plan, and that is a check of one file at one moment, not a standing guard, and it binds the snapshot rather than the live file. Second, criterion_type stays \"measurable\" although R2, R5, R6 and the distinctness half of R3 are decided at runtime by a model judge — R3 is named here because an earlier wording of this clause listed only the first three, while stage 9 records in its own coverage row and principle that R3's distinctness refusal runs through stage 3's prefilter-and-judge helper and inherits its properties including fail-open, so the omission understated this leak by one requirement; R3's structural half — the field pair existing, both required, and the renormalization branch refusing to touch the requirement, the criterion or the result image — holds unconditionally and is not judge-decided: what the controls assert is the behaviour of the engine with the judge STUBBED to each verdict, and a pytest over a stubbed judge is measurable in the ordinary sense. What is not measurable, and is not claimed, is that the live judge classifies correctly. The same leak has a second mouth, named here rather than left implicit: the full/partial marks in the coverage map are perception — nothing measures whether a mark is honest, and the map's machine-checked totality says only that every requirement HAS an entry, never that its mark is right. Three marks in this very map read full through four review rounds and were corrected to partial in the fifth review round and further ones in the sixth and seventh, which is the evidence for the claim rather than an argument against it: the mark is decided by reading, so it is as good as the last reader and no better. Third, stage 13 counts in the stage total and appears in no row of the coverage map, which is correct rather than an omission: it decides no requirement of the order — it reconciles the delivery branch with trunk so that the stages which DO decide requirements transform the tree that will exist — and a coverage row naming its control would claim evidence about R1-R11 that the control does not carry. Its bearing on this criterion is recorded instead, since it is exactly the kind of thing a stage count hides. Every premise stages 8-12 record as measured was measured on the pre-merge delivery branch, 61 commits behind trunk, so those verdicts were provisional on a re-measurement over the merged tree — an obligation this sentence assigned to stage 13, which has since PASSED without performing it for them, so it is now carried by each of stages 8-12 in its own conditions, three of its verdicts already re-measured at the effort-divergence diagnosis and the rest re-attested by each stage's executor as its first act; the correction is recorded here rather than made silently, because a criterion that keeps naming a discharged stage as a future discharger is the same defect the plan repairs elsewhere; and stage 13's own control is the first check in this plan to run against a merged tree at all — before it was added, that first ran at final check 1, after stage 12 had landed the work and removed the delivery worktree, which is to say after the only venue in which a failure could still have been acted on was gone."
criterion_type = "measurable"
