riced a code-producing stage as one implementation pass while the repository's own norms make it an implement-review-fix-re-review loop, and stage 7 alone cost about 28 USD across three review rounds against an 84 USD estimate for twelve stages. That estimate has since moved twice and the ADR must take its current value from the estimator rather than from this sentence: raising the tiers of stages 8, 9, 10 and 11 carries the twelve-stage figure to 99 USD and 405 active minutes, and stage 13 adds a thirteenth stage whose contribution is recorded from an actual run of the estimator on the merged tree, since scripts/agentctl/effort.py is trunk-only and reaches this branch only with that merge. The shape matters more than any of the numbers and the ADR must state it: reviews are charged on a SEPARATE term at a flat medium — one for the approved plan, one per spawn:developer stage, one per replan since arming — so a stage's own cost tier cannot express an iteration count at all, and the three review rounds stage 7 actually needed are modelled as one. A raised tier is therefore an acknowledgement of the loop and not a price for it, which is the honest form of this record and the form every stage of this plan now uses."

