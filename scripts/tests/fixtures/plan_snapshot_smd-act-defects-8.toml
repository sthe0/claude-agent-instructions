]
output_artifacts = ["scripts/tests/test_acceptance_verdict.py"]
material = "cli.py cmd_record_result — the acceptance-review branch (observation required, normalized-distinct from subject.result, advisor judge, fail-closed gate, bypass recording), and the measurable path which reads only the verify_command exit code; gates.py resolution_blockers, today a conjunction over stage statuses; cli.py cmd_resolve, whose `--by` is the existing acceptance act; state.py's PlanReview and JudgeBypass, the record shapes this stage clones. Two objects this stage READS and deliberately leaves alone are knowledge here rather than material, and appear in knowledge_refs for exactly that reason: code_review_blockers, one of the three attestations already present, against which the new gate is positioned so that no fourth attestation mechanism appears — the control attestation is the second of the three and lives inside cmd_record_result, which this stage does transform, so it is named here as context and not as a separate reference; and SessionState, whose recorded plan digest as stage 2 leaves it is the other half of the staleness comparison and which this stage consumes without changing."
material_refs = [
  "scripts/agentctl/cli.py:cmd_record_result",
  "scripts/agentctl/cli.py:cmd_resolve",
  "scripts/agentctl/gates.py:resolution_blockers",
  "scripts/agentctl/state.py:PlanReview",
  "scripts/agentctl/state.py:JudgeBypass",
]
knowledge_refs = ["scripts/agentctl/gates.py:code_review_blockers", "scripts/agentctl/state.py:SessionState"]
means = "The acceptance-review observation gate itself — written, tested, judge-backed; advisor.acceptance_judge with its fail-open judge and fail-closed gate; PlanReview and JudgeBypass as the persisted-record templates; the existing resolution gate and its `resolve --by` act. And the attestation itself is a means this stage wields, not an event that happens to it: an independent code-reviewer spawn plus the fix pass that answers its verdict, which tests-accompany-code and review-accompanies-code make part of the stage rather than of its aftermath."
method = "Requirement: control is the comparison of the achieved result with the goal, so no stage path may report a pass without that comparison having been made and recorded. Reuse is mandatory — the mechanism exists and is tested, the defect is the condition it is keyed on, so the change is a change of scope. The analysis is conducted against all three attestations already present: the control attestation asks whether the executor attests a control criterion, the code review asks how the diff was reviewed, the observation asks whether the result matches the goal; no fourth mechanism may appear at stage level. At plan level the terminology is load-bearing: comparing the product with the ORDER and handing it to the customer is ACCEPTANCE, which follows a positive control. Three clauses, each fixing a specific earlier failure. First, the CARRIER: an earlier draft said the gate would 'read the verdict' without naming where a verdict lives, and a gate may not SHELL OUT — that, not an absence of file I/O, is the purity the module asserts — so a verdict it can read must be persisted state written by a command — hence a typed AcceptanceReview with `agentctl accept`, cloned from PlanReview rather than invented. Second, the AUTHOR: acceptance is an act of the customer, so the record's author is checked against [meta.order].customer_id — the identifier half of the pair, never the prose that names the position, since comparing an author against a paragraph is either vacuous or absurd — which stage 7 made readable as typed data; `resolve --by` remains the resolution act and now has a record to point at. Third, the DEGRADED PATH, and it must CHOOSE rather than describe: the judge is fail-open and this gate is fail-closed, and in a sustained no-advisor state that combination means no plan can ever be accepted in its own declared environment — a plan that cannot resolve is not a plan. But 'record a bypass' alone names neither outcome: if the bypass replaces the record, the gate still blocks on 'no record' and the deadlock survives under a new name; if it substitutes positive verdicts, that is the silent grant with paperwork. The choice made here is the third thing, and it works because the judge only ASSISTS a comparison a human position performs: the bypass never stands alone, the author still writes a per-requirement verdict unassisted, and the bypass records that it was unassisted and why. The gate then keeps one blocking condition — complete record, no negative verdict — and never reads the bypass at all, which also keeps it pure. Fourth, STALENESS: this record is the sixth thing bound to the plan's bytes (after PlanReview.plan_sha256; PlanPresentation.plan_sha256 and rendering_sha256 with the delivery stamp; plan_snapshot_hash; and the premise plugin's content digest — an earlier draft said 'two'), and stage 2 establishes that approve can replace those bytes, so an acceptance can outlive what it accepted. The gate treats a stale record as absent, which is the same fail-closed direction the delivery stamp already takes, rather than accepting a signature over bytes nobody signed. How it can tell was the question a whole review round turned on, and the answer is a design constraint, not a detail: resolution_blockers is registered in GUARDIANS and dispatched through gates.blockers(state, name) with a single argument, and verify-agentctl.py requires a covering hook per GUARDIANS key — so widening its signature to take a plan path, symmetric though that would be with the two content-binding guardians, ripples into the dispatch contract and the hook suite. The cheaper and more honest option is taken instead: the CURRENT digest is recorded in the session at the three seam points, which is exactly where the bytes the session executes are decided, so the gate compares the record's binding against a field beside it. That keeps 'reads the record and computes nothing' literally true rather than aspirational, and it puts the digest where any other consumer can also read it. Finally, the way of acting here is a LOOP, not a pass: implement, spawn an independent code-reviewer, apply the verdict's should-fix items, re-review, and repeat until the verdict is pass — the stage is done when a reader who did not write the code has attested it, not when the code is written. The cost tier does NOT price that loop, and an earlier wording of this clause said it did, which is false against the live estimator: effort.estimate charges reviews on a SEPARATE term, _mandated_reviews — one for the approved plan, plus one per spawn:developer stage, plus one per replan since arming — each at a flat _REVIEW_TIER of medium, so raising a stage's own tier cannot reach an iteration count at all. Stage 7 needed three review rounds; the estimator models one. Large is therefore chosen in ACKNOWLEDGEMENT of the loop rather than as a price for it, and the residual is recorded instead of papered over: large is 8 USD and 60 minutes against stage 7's measured ~28 USD across three rounds, and raising stages 8, 9, 10 and 11 moves the whole-plan estimate from 84 USD to 99 and from 300 to 405 active minutes — still roughly 2.5 times under. The tier ladder in config.md is deliberately not changed by this plan; recording the known under-pricing is what is in scope, and a reader must not take a raised tier for a solved estimate. SECOND ATTEMPT, added after the first failed: the production code delivered by cda97b6 stands and is not to be reverted — an independent reviewer passed it and it does what the image above describes. What is left is the cost the widening imposed on everything that used the old rule, which the first attempt did not pay because its check could not see it. Two mechanical debts and no third: first, every test helper that drives a substantive session to a passed stage calls record_result with no observation and is now refused — 68 failures across 24 files, all of them the same edit, and the right shape is to give the shared helpers an observation rather than to sprinkle one per call site, so that the next widening of this gate does not reopen the same 24 files; second, three assertions pin SCHEMA_VERSION to the literal 25 while this stage's added records made it 26, and they are to be bound to the constant so that no future bump breaks them again. The KeyError on rejected_stages the first attempt reported as unexplained is the first debt observed two frames downstream and needs no separate work. Nothing else is in scope: the two remaining failures, in test_hook_wiring and in test_hook_import_blindness, are red on trunk independently of this branch and are the exclusions the check names."
procedure = "Optional. cli.py: lift the observation branch out from under its criterion_type condition, gating on substantive weight class, retaining the exit-code conjunct on the measurable path; document at the call site how it differs from the control attestation and the code review. Add state.AcceptanceReview (author, per-requirement verdicts, note, plan_sha256 — the sixth plan-byte binding, counted with the other five in the ADR) and state.AcceptanceBypass (reason, the requirement ids judged unassisted). Add cmd_accept writing the record, validating the author against meta.order.customer_id and the id set against meta.order.requirements; --bypass writes both records and refuses to write a bypass alone. Extend resolution_blockers to read the record and refuse on absent, incomplete, negative, or stale — stale meaning the record's plan_sha256 differs from the digest the session recorded at its last seam point, a comparison of two persisted strings that needs neither the plan path nor a hash computation, so the guardian keeps its single-argument signature and the GUARDIANS dispatch and hook coverage are untouched. Never read the bypass, so the gate stays pure. Surface the bypass count and reasons in verify-final's output. Correct the substantive-validation message that reads as if a measurable criterion needs no observation. Tests, including the negative-verdict and bypass cases."
preconditions = "Stage 7 landed, so the order's requirements and customer exist as typed data to compare against and to check the author against."
conditions = "The stage-level widening is applied at the point where the engine already decides PASSED, and the plan-level extension at the point where it already decides RESOLVED, so both comparisons run on the same material and at the same moments as today's decisions; nothing new is scheduled, two existing decisions are widened and one new record is written between them. The premise sweep this stage's criterion rests on was performed and recorded before the stage was dispatched, rather than left to execution to discover by failing: its measured verdicts are in this stage's knowledge field, so a reader can tell a measured premise from an assumed one. What that sweep actually saw is stated exactly, because an earlier wording of this clause claimed more than had been measured: it read the PRE-MERGE delivery branch, 61 commits behind trunk, so every verdict it recorded was provisional on a re-measurement over the merged tree. That clause named stage 13 as the discharger, and stage 13 is now PASSED without having re-measured these premises, so the obligation is carried HERE rather than left pointing at a stage that cannot perform it — a dangling discharger being exactly the kind of defect this plan's own subject predicts. Its extent is stated exactly rather than as the reader of this stage alone would infer it: the clause stood in FIVE stages — 8, 9, 10, 11 and 12 — and in the plan's own top-level done_criterion, and all six were repaired in one pass. Review reported it in two stages; a grep found it in six, which is this plan's general claim demonstrated on the plan itself, since a report names where a defect was noticed and only an enumeration names where it stands. Three verdicts were re-measured at the effort-divergence diagnosis that followed the merge, and are recorded so the executor re-attests from them rather than from scratch: the merge moved documentation only, `git diff --stat 5c282b8 68ab003` reporting 4 files and +49/-1 entirely under memory-global/leaves/experience/; stage 9's two grep anchors HAVE flipped on the merged tree, but at d73d84f, which is stage 9's own committed edit and therefore its designed effect rather than a premise movement; and the committed snapshot fixture scripts/tests/fixtures/plan_snapshot_smd-act-defects-8.toml is stale against the live plan, 726 lines against 729, which stage 10's re-take rule already covers and which is named here so no executor rediscovers it. The premises this stage rests on that are not among those three are re-attested by the executor as its first act, and a verdict that moves is a finding for this stage rather than a correction to be made in passing. The three-attestation regime stays: control observation, code review, tests. The review loop is what the estimate must PRICE, never what it may cut to fit. That last sentence is recorded here as a NORM ON THE ESTIMATE and not as a property of the material this stage transforms — nothing in the tree makes it true, and the estimator as it stands does not obey it, charging reviews on the separate flat term this stage's method records; it is kept in this field because it is the invariant the critique preserved, and it is marked as a norm so a reader does not take it for a measured property of the stage."
invariants = "The judge stays fail-open and the resolution gate stays fail-closed, but the combination never becomes unpassable: the sanctioned exit is an unassisted human verdict accompanied by a reasoned bypass — never a bypass standing in place of a verdict, never a silent grant, never a deadlock. The gate's blocking condition is exactly one thing (a complete, current, non-negative record) and the bypass is never part of it, so the escape cannot drift into the gate. gates.py stays pure — it reads the record and computes nothing. Existing acceptance-review behaviour is unchanged. No fourth attestation at stage level and no parallel acceptance gate at plan level. The stage-1 harness stays green. The submission-seam-only architecture: every new requirement lands in validate_submission / submission_violations and never in load_plan / parse_plan, so the 55 frozen corpus plans keep loading byte-for-byte and no stored attestation is re-stamped. This held through stage 8 and must keep holding. Four further invariants the failed first attempt establishes rather than assumes, each stated in the words the difficulty record uses, so that what this plan carries and what the critique demanded can be compared side by side instead of taken on trust. The code stage 8 delivered is correct and reviewed -- the widened observation key, the typed AcceptanceReview and AcceptanceBypass carrier, the recorded-digest staleness comparison, gates.py computing nothing. The correction touches criteria and test helpers, not that design; nothing in cda97b6's production code is to be reverted. The demonstrated-correct criterion form, which this plan already contains twice: an unfiltered run of the whole tree, with any known-red test named explicitly as an allowed exception rather than silently deselected. Stage 13's verify_command and final_check[0] both have it; it is to be generalised, not invented. The three-attestation regime at stage level -- control observation, code review, tests -- is unchanged; this adds no fourth attestation and no parallel gate. Retrospective scope stays bounded by measurement, not assumption: stage 13 ran the unfiltered tree at 6df3c12 and found only the pre-existing failure, so stages 1-7 are cleared by that measurement and are not reopened. That word 'cleared' is exact about what the decision rests on and about nothing more, and review was right to press it: the measurement establishes that no SUITE-VISIBLE breakage survives, which is the entire ground for not reopening — and the qualifier costs the argument nothing, since a breakage the suite cannot see is equally invisible to a reopened stage 1-7. It does not establish that each of those stages' narrow criteria was adequate at its own boundary — a stage could have exited green over a red tree and had the breakage repaired downstream, and no run at 6df3c12 can see that. The weaker claim is the one being made, and it is enough."
capability_required = "cli.py record-result, resolve and gates work; understanding of the advisor's fail-open contract, of the three existing attestations, and of how PlanReview is persisted."
knowledge = "The source distinguishes the two acts: control is the comparison of the result with the goal, and on mismatch a factor is identified; the correspondence of the PRODUCT to the order, and the hand-off to the customer, is a further act that a positive control makes possible. An exit code is an observation about the CHECK, not about the material, so a path reading only the exit code has verified that the check ran. Measured in the engine, and RE-measured against the live parser at the stage-7 effort-divergence diagnosis rather than carried from the draft: `resolve` accepts --by, --quality, --quality-by, --quality-note and --cost-log — five ACCEPTANCE-RELEVANT flags, not the four an earlier wording of this clause and of the principle's source line claimed, and the qualifier is load-bearing rather than decorative: the parser takes a sixth, --session at cli.py:4333, which addresses the session and says nothing about acceptance, so the enumeration above is exact for what this clause is about while the bare word 'five' is not a count of the command's flags — and none of them is a place for a per-requirement verdict, which is why a record type is added rather than a flag. The correction changes nothing this stage does; it is recorded because the false figure was the same shape of defect (a plan clause asserting an unmeasured property of an artifact that already exists) that cost stages 2, 3 and 7 a failure cycle each. The reason the verdict must be WRITTEN before the gate runs rather than computed inside it is not that gates.py does no I/O — it reads plan bytes in exactly two guardians already, re-measured at the same moment (gates.py lines 261 and 440, both hashing Path(target_plan).read_bytes()) — but that the cognition producing a verdict is a SUBPROCESS, and subprocess reach is exactly what the module forbids and what verify-agentctl.py asserts. Also re-measured for this stage: state.py carries PlanReview (line 393) and JudgeBypass (line 571) as the record shapes to clone, and carries no AcceptanceReview, which is this stage's to add."

[stage.principle]
statement = "When a correct mechanism exists but is keyed on too narrow a condition, the defect is the key and the minimal correct fix widens it; and a gate that reads a verdict must name the record, the writer and the author of that verdict, or 'the gate reads the verdict' is a sentence with no referent."
source = "The observation gate contrasted with the measurable path; the control attestation and code_review_blockers, found only under review; the resolution gate's `resolve --by` and its five acceptance-relevant flags — four when this line was first written, and corrected against the live parser rather than left standing; the command's own flag count is six, the sixth being --session, which addresses the session rather than the acceptance; gates.py's purity as the module actually defines it — no subprocess/socket/network reach, file reads permitted; activity_as_is.md on control and on hand-off to the customer."
derivation = "Both stage paths answer one question and one already answers it with a tested, judge-backed, fail-closed mechanism; a second implementation would duplicate the judge contract, the bypass recording and the blocker wiring, each a place they could drift. Since the mechanism's body is independent of criterion_type and only its guard names it, changing the guard is necessary and sufficient. The second clause was forced by review rather than derived: a draft that said 'the gate reads the verdict' was checked against cmd_resolve's actual flags and against gates.py's purity, and neither could produce or hold a verdict — so the sentence named no mechanism at all, and naming the carrier is what converts it into one."
confidence = "medium"
refutation = "Directly refutable and stated as an existence claim: the principle fails if there exists a resolution that passed while carrying a negative verdict on a declared requirement, or one that passed with no AcceptanceReview at all. Both are decidable from the session ledger by reading the recorded records against the resolutions. A second, softer refutation: if requiring an observation on every measurable stage yields perfunctory observations restating the check output, the widening adds friction without control and the remedy lies upstream in how result images are authored."

