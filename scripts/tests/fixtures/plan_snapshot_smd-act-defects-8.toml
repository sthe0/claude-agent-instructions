[stage.principle]
statement = "An assertion the engine models as a typed check must be made in that typed form; making the same assertion as free-form shell content produces the same green while disabling every protection keyed on the type — and a typed check that decides by ancestry constrains how the landing may be performed, not only that it was."
source = "state.py LandedSpec and the survivability lint in plan.py, which recognises landing only via the typed check kind; an earlier draft of this plan, which asserted landing as a shell string and thereby suppressed the warning it most needed."
derivation = "A lint keyed on a type is invisible to content of the same meaning in another form, so the two forms are equivalent in what they claim and unequal in what they enable. Since the protection exists precisely for plans that assert landing, choosing the untyped form is self-defeating in the exact case the type was introduced for. The second clause follows from what the typed check actually computes: ancestry, not equality of content — so an operation that preserves content while replacing the commit satisfies every human sense of 'landed' and fails the check, which makes the choice of landing operation part of the plan rather than an executor's preference."
confidence = "high"
refutation = "If the delivery worktree is deliberately kept after landing, the survivability concern does not arise and the typed form buys only uniformity; observable as a landing performed with the branch-keeping option, in which case verify_venue_at_final is redundant rather than load-bearing."

