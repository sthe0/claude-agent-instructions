method = "Requirement: a reader who has not seen this task must be able to recover from the repository both what the model now is and which parts of the source it deliberately does not implement — the negative record matters as much as the positive one, since several apparent divergences turned out to be deliberate additions and distinguishing them cost a full re-reading. Measurements go in with denominators and method, because a bare percentage inherited by a future reader is unverifiable. Four honesty clauses, each correcting an earlier draft. The exclusion list must be ACCURATE, and three entries earlier drafts got wrong are named here so they are not repeated: the fixed-instrument / way-of-use distinction is IMPLEMENTED by stage 9; the result/product distinction is USED by stage 8; and the factor-discovery cycle's re-entry is NOT missing from the engine at all — the engine already runs FAILED to DIAGNOSING through declare, investigate, critique and normalize back to replan, so what is genuinely absent is only the LINK between that cycle and the new destination axis, and the exclusion list must say that and not the wider false claim. The list must also drop the entry claiming no typed hand-off to the customer exists, which stage 8's AcceptanceReview and its author check now contradict. Second, the list must NAME the source distinctions this task genuinely does not implement: the content half of the goal deriving from knowledge about the material; the object space and the selection of a material among candidates; forecast as a status of knowledge; the structural link between means and conditions, so that 'conditions are secured by the means' is representable rather than merely stated in prose; and the result/product distinction as a TYPE, which stage 8 uses in its reasoning without the engine ever distinguishing the two. Third, the degraded modes go in with their evidence base: with no advisor reachable the fail-open checks of stages 3 and 5 are inert while stage 8's fail-closed gate drives acceptance into a recorded bypass — and the claim that this is the environment's normal state rests on ONE observation from this task against a config that sets advisor-mode to substantive, so the ADR records it as an observation with its n and not as a property of the environment. Fourth, the seam decision itself is recorded: why every new requirement binds at submission rather than at load, and why the corpus is not migrated. Fifth, added after the fact: the deliberately-not-done section records the control-criterion difficulty this plan hit at stage 8, and records it as a finding about the plan rather than about the executor. Eleven of the thirteen stages declared a verify_command that ran a named subset of the test tree — the tests the stage meant to add — so a stage could exit green while leaving the tree red; the two exceptions were stage 13, which ran the whole, and stage 12, which declares no verify_command at all because R1 forbids one on a landed criterion. After the correction seven are still DECIDED BY a subset alone — the phrasing matters, because stages 8 to 11 keep a narrow selector as a trailing conjunct and a reader counting commands that merely contain a selection would get eleven again — and all seven are among stages 1-7, which are PASSED and deliberately not reopened. The figure is stated this way because an earlier draft of this very clause said 'eight of the thirteen', which is 13 minus the 5 corrected stages and silently counts stage 12 as declaring a command it cannot declare — an unmeasured count inside the sentence whose subject is unmeasured criteria, caught in review; stage 8 did exactly that, passing its own check with 71 new failures standing. Three facts belong in the record together. The defect surfaced on the stage whose own subject is the control criterion, which is what makes it worth writing down rather than merely fixing. The correct form was in this same file from the start, at stage 13 and at final_check[0] — an unfiltered run naming its known-red exclusions — so what the repair generalises was already demonstrated and was simply not carried across. And the fix is a plan edit, not a mechanism, which the ADR states as an open residual rather than as a thing already closed — but it states the residual in its true and more uncomfortable form, because 'nothing in the engine refuses a narrowing verify_command' understates it twice. First, the surface is not missing: plan.py already carries verify_command_scope_warnings, an advisory lint over exactly these strings, with the same decidable-rule / left-to-perception split a converse check would need, so what is absent is a predicate inside an existing function and not new machinery. Second, and this is the part worth recording, that lint today counsels the OPPOSITE — it warns when a command runs an unscoped aggregate suite and advises scoping it to the paths the stage touches, on the ground that an unrelated pre-existing red should not take a stage hostage, a rule with some twenty accumulated contexts behind it. Both rules are right about their own failure and each is the other's failure mode: scope too wide and an unrelated red false-fails a correct stage; scope too narrow and a real break passes unseen, which is what happened here. An author who follows the engine's own current advice reproduces this defect. The ADR records the tension and the two conditions that separate the cases — a known-red test is named with its reason rather than deselected by a pattern, and the widening is bounded by what the stage can actually reach — and does not pretend the resolution is a single lint waiting to be written. The stage-10 difficulty goes in beside it as the second instance of this stage's own subject, and it is recorded as what it was: the control worked — final_check[0] says in its own label that an unnamed inherited red must fail both branches so that nothing is hidden, and that is exactly what it did — while the plan had no cheap way to RECONCILE one. The exception set was written as a count as well as a list, one node id repeated across six command sites — five verify_commands and final_check[0]'s command, named exactly because this sentence is what stage 11 turns into the ADR record and across prose sentences scattered through the plan asserting there is exactly one, so a routine event — trunk acquiring a second red, carried onto this branch by merge b90bade — could be admitted only through a full declare-investigate-critique cycle and a prose correction whose own extent had to be DISCOVERED rather than known: four review rounds, each finding sites the previous round's recall-based sweep had missed, until the sweep was replaced by a mechanical enumeration. The correction the ADR states is the one actually made: the node admitted by exact id with its cause, under the same still-red proof the first one carries, and the count removed from the prose that carried it. One further correction belongs in the same record rather than in the stage that carries it: stage 13's method says every other stage scopes its check to the paths it touches, which this correction has just made false for stages 8 to 11. Stage 13 is PASSED and is not reopened to fix a sentence, so the ADR carries the correction. Sixth, added at the effort-divergence diagnosis that followed stage 13, and the most expensive lesson of the task: the ADR records the ORDERING fault this plan's own structure carried. Three replans landed inside one effort window while the plan's five mechanical enumerators sit tenth by index and eleventh in execution order, downstream of every repair stage they would have fed — so the enumerators certify work already done instead of guiding work not yet done. What the three replans have in common is stated at the strength the evidence carries and not one degree higher, because an earlier wording of this very clause said they were 'each a SECOND instance of a defect the plan had already repaired at a first instance', and its own enumeration falsifies it: only the first fits — the criterion assembled from a stage's intended tests, whose mirror end the plan's own stage 3 had already removed. The second, the redness tolerance written as a count and repaired across fourteen sites, is a defect the plan AUTHORED rather than one it had repaired anywhere. The third, the cost tier pricing a code stage as one pass, stood wrong in every code stage at once with no first instance at all. This is the same unmeasured universal the clause four sentences up already records being caught in review — 'eight of the thirteen' — committed a second time in the paragraph whose subject is honest recording, which is why the correction is written into the record rather than applied silently. What IS true of all three is narrower: a defect of this kind stands at N sites simultaneously, is noticed at one, and its remaining instances are then discovered by FIRING rather than by listing. The ADR states the general form together with its bound, because both halves are load-bearing. Where the site set is derivable from an artifact the plan holds — the --deselect sites in a plan file, the fields of a dataclass — the remedy is a mechanical enumerator, and it belongs FIRST among the stages repairing instances of that class; where the enumerator must itself be built first and so cannot precede, the obligation converts rather than disappears, and its first act on landing is a reporting sweep whose instance list is read before the remaining repair stages are dispatched — which is the obligation now split between stage 11's control, which re-runs the enumerator, and the preconditions of stages 11 and 12, which carry the reading. And where the site set is a JUDGEMENT the remedy does not reach it at all: no enumerator over any artifact this plan holds can decide a cost tier, and this plan states why in the same field — effort.estimate charges reviews on a separate flat _REVIEW_TIER, so a tier cannot express an iteration count. An ADR claiming one shape across all three would be selling the remedy past its evidence, on the one page where that is least affordable. It states the cost honestly rather than as a lament: the two ratio scales stood at 1.80x spend and 1.89x active wall-clock against a 5.0x trigger, so the overrun was never size but CURRENCY, the same work paid for by failing. And it records the narrower engine finding beside it — that a difficulty's normalization has no forward reach inside the plan being repaired, since normalize routes its factor to a destination for future sessions while nothing asks whether the plan in hand still contains further instances of the factor just named, a gap that was benign here only by the author's diligence and not by construction."
