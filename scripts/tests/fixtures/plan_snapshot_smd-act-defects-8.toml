# ---------------------------------------------------------------------------
# Stage 1 - non-regression harness, over a repo fixture, not over machine state.
# ---------------------------------------------------------------------------
[[stage]]
index = 1
title = "Frozen-plan non-regression harness over a committed corpus fixture"
executor = "spawn:developer"
expected_result_image = "An isolated worktree on its own branch, holding a copy of the plan corpus committed into the repository as a fixture, and a test that discovers that fixture by directory glob and fails on any divergence from a recorded baseline of per-plan load outcomes — including the appearance of a fixture plan the baseline does not know. The domain is the fixture, so the test is deterministic on every machine and does not turn red when the next task writes a new plan into the author's home directory; a separate, advisory-only scan reports drift between the fixture and that live directory without failing. The harness's enumerating character is itself asserted: a plan file added to the fixture at test time is reported as a divergence, so a hand-written list of names could not pass in its place."
criterion_type = "measurable"
done_criterion = "the compat test passes; its baseline covers exactly the fixture's file count with no hard-coded number in the assertion; a test asserting a newly-introduced fixture plan is reported as a divergence passes; and the live-directory scan is advisory, proven by a test that a live-only plan does not fail the suite"
verify_command = "python3 -m pytest scripts/tests/test_frozen_plan_compat.py -q && python3 -c \"import json,glob;b=json.load(open('scripts/tests/fixtures/plan_corpus_baseline.json'));f=glob.glob('scripts/tests/fixtures/plan_corpus/*.toml');assert len(b)==len(f), (len(b), len(f));assert f, 'empty fixture';print('baseline covers', len(f), 'fixture plans')\""
verify_venue = "delivery"
verify_venue_at_final = "repo_root"
expected_exit = 0
depends_on = []
supplies = []
output_artifacts = [
  "/Users/the0/claude-agent-instructions-smd-act",
  "scripts/tests/test_frozen_plan_compat.py",
  "scripts/tests/fixtures/plan_corpus/",
  "scripts/tests/fixtures/plan_corpus_baseline.json",
]
material = "The plan snapshots under ~/.claude-agent/plans/ (this plan excluded), which are COPIED into the repository as a fixture rather than read in place; and the pytest suite under scripts/tests/, which today holds no corpus-wide plan-load assertion. The material's extent is stated as the copy actually made and not as the reading that preceded it: 55 substantive files, 200 stages, 200 non-empty expected_result_image, re-derived from the fixture at commit 5f07504 rather than from the live directory. An earlier draft of this stage declared 53 files and 192 stages, a count taken from ~/.claude-agent/plans/ at critique time; two plans were authored between that reading and the copy, and the directory has since grown to 66. That is why the extent is re-derived HERE, at the freeze: this stage is the event that turns a directory which keeps moving into an artifact of fixed content, and therefore the only point at which a statement about its extent can be true. The figure is recorded for the plan's own downstream use — stage 3 labels exactly this set — and never as a load-bearing assertion of the harness, whose claim is about behaviour."
material_refs = ["~/.claude-agent/plans/", "scripts/tests/"]
knowledge_refs = ["scripts/agentctl/plan.py:load_plan", "memory-global/leaves/plan-activity-ontology.md"]
means = "scripts/session-isolate.sh (canon is read-only from a live session, so all work happens in a linked git worktree); pytest and its tmp_path fixture; load_plan's strict=False read-only baseline mode."
method = "Requirement, not a script: after this stage the claim 'tightening validation broke no already-authored plan' must be decidable by one command, the domain of that claim must be generated by the machine rather than recalled by a person, and the command must give the same answer on any checkout. The third clause is what dictates the fixture. A test whose domain is the author's home directory is red on every other machine (the directory is absent) and turns red on this one the moment the next unrelated task writes a plan there — so it would be a permanent tax paid by innocent changes, and a tax that is paid is a tax that gets disabled. Copying the corpus in makes the domain versioned, reviewable and deterministic; the live directory is still worth watching, so it is scanned advisory-only, which is the honest split between a claim the repository can carry and an observation only this machine can make. Acceptability: (a) the harness globs the fixture and fails on ANY divergence including an unknown plan appearing; (b) that enumerating character is asserted by a test that introduces a fixture plan and requires the harness to notice — because a hard-coded list of the current names would satisfy (a) alone, which is the substitution of an existential check for a universal one this stage exists to prevent; (c) the baseline's size assertion is derived from the fixture, never a literal, so it cannot rot into a number nobody can source. When a deliberate incompatibility is introduced later, the baseline is re-recorded in the SAME commit as the change that caused it, with the reason in the commit message."
procedure = "Optional sequence; the executor may replace it. Run scripts/session-isolate.sh smd-act from canon. Copy the substantive plans into scripts/tests/fixtures/plan_corpus/ and record, in this stage's material, the count actually copied rather than the count read beforehand. Write test_frozen_plan_compat.py with three tests: test_baseline_matches (glob the fixture, load_plan(strict=False) each inside try/except, build {name: 'ok'|'PlanError'}, compare to the baseline with a diff-shaped message); test_harness_enumerates (copy the fixture to tmp_path, add one extra plan, assert a divergence is reported); test_live_scan_is_advisory (a plan present live but absent from the fixture produces a report, not a failure). Generate and commit the baseline."
preconditions = "The canon checkout is clean and synced with origin/main; scripts/session-isolate.sh is available; ~/.claude-agent/plans/ is readable."
conditions = "The corpus is copied once and thereafter treated as immutable input: the harness reads the fixture bytes and never rewrites them, and it never writes to ~/.claude-agent/plans/ at all, so the whole transformation is confined to the test tree while the corpus supplies its material unchanged."
invariants = "No file under ~/.claude-agent/plans/ is modified, moved or deleted at any point in this task — the fixture is a copy. No change to plan.py, state.py, gates.py or cli.py in this stage: the harness must go green BEFORE any engine change, or it cannot serve as a baseline. No assertion in the suite depends on a path outside the repository."
capability_required = "git worktree operations; pytest authoring; reading the agentctl plan loader."
knowledge = "load_plan is reached from seven in-session call sites plus plugins_premise.py, and it is reached with strict=True at most of them — so the population that a validation change can break is not 'plans being submitted' but 'every plan any live session re-reads'. That single fact is the reason this harness exists at all, and it is also the fact that, one stage later, moves every new requirement off the loader entirely; the harness's job is to make the resulting claim 'no already-authored plan stopped loading' decidable rather than asserted. The corpus AS FROZEN is 55 substantive plans and 200 stages, re-derived from the fixture itself; the earlier 199/155 denominators are retired because they counted this plan's own stages, and the 53/192 pair is retired for a different reason worth distinguishing from that one — it was not miscounted but taken before the copy, of a directory that kept growing, and so was a true statement about a set that is not this fixture."

[stage.principle]
statement = "A universally-quantified non-regression claim needs a mechanical enumerator of a VERSIONED domain plus a recorded baseline, and evidence that the enumerator enumerates; keying the domain on machine-local mutable state buys the same claim at the price of a test that is red everywhere else and red here on the next unrelated change."
source = "planner/SKILL.md § Understand the problem first (universally-quantified done criteria); experience leaf 2026-07-16-onboarding-drift-after-crosscutting-refactor-needs-mechanical-guard.md."
derivation = "The claim is 'for all p in plans, p still loads'. A plan that silently keeps loading with degraded meaning produces no symptom, so symptom-driven checking is existential evidence for a universal claim, and only a domain generated independently of what broke discharges a for-all. That argument fixes the enumerator but not the domain; the domain follows from a second consideration — a test is a shared artifact, so its domain must be reproducible by whoever runs the suite, and a home directory that grows with every future task is neither shared nor stable. The third clause is the first argument applied to the harness itself: a hard-coded list also produces no symptom while the corpus happens to match it."
confidence = "high"
refutation = "If no live code path re-reads the plan corpus — if snapshots are only consumed from state.json and never re-parsed — the non-regression claim is vacuous and this stage is overhead. Checked and NOT refuted: load_plan is called from cli.py at seven sites plus plugins_premise.py."

