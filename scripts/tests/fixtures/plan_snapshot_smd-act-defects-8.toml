obligation is carried HERE, on the same terms and with the same three re-measured verdicts recorded in stages 8, 9 and 10; the premises not among those three are re-attested by the executor as its first act. And one precondition binds the ROOT rather than this stage's actor, which is why it is carried by this stage and not by stage 10 where the sweep runs; the obligation itself is stated in this stage's preconditions field, where a reader following the word finds it, and what this clause records is the reason it sits there. This stage is dispatched only after stage 10's two reporting channels — the semantic half of check-exception-set-enumeration.py and the named-exclusion list the change-decision enumerator forces — have had their full output READ and every entry dispositioned as fixed in stage 10, carried into this stage's ADR, or dismissed with its stated reason. The decidable half of that obligation is a conjunct of this stage's own control, which re-runs the enumerator against the same snapshot stage 10 does; the reading is what no shell can decide, and it sits here because the actor who must obey it is the one who dispatches."
