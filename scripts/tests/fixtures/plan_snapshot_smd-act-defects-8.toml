means = "The existing § Plan format section and its element table; pytest with parametrization over a code-derived set; lint-prose-length.py as the ceiling guard; tomllib and a sentence split for the enumerator whose audited artifact is the plan file, its domain therefore read from that file rather than typed beside the test, on the same rule as the other four. And the attestation itself is a means this stage wields, not an event that happens to it: an independent code-reviewer spawn plus the fix pass that answers its verdict, which tests-accompany-code and review-accompanies-code make part of the stage rather than of its aftermath."
method = "Requirement, two halves. First: after the submission check tightens, the norm by which a norm is written must state every requirement that check enforces — otherwise the next plan is refused and its author learns the contract from a PlanError, one field at a time — and the correspondence must be mechanically checked, because a documentation-follows-code rule kept by discipline is exactly the rule that lapses when someone adds a field in a hurry. Second: this plan's own done criterion is universally quantified over the order's requirements, and by its own stage-1 standard a universal claim needs a mechanical enumerator. One enumerator is not enough, because the requirements are not all of one kind: some are shapes the check refuses, and those the rejected-shape enumerator can decide; but control, the behavioural half of renormalization, the coverage-gate property and landing are not refusable shapes at all, so a second enumerator asserts a coverage map is TOTAL and that each control it names exists. Third, added AT the stage-10 difficulty and paid for by it: this plan's criterion is universally quantified over its own prose as well, because the control tolerates inherited redness and the set of tolerated nodes is asserted in sentences scattered across thirteen stages. That prose was swept four times by recall and each sweep missed sites the next one found — every one of them a site the previous sweep had passed over, three of them after a reviewer had been told the sweep was complete — which is this plan's own first principle violated one level up: a universal claim checked by remembering where to look. So a fifth enumerator builds that domain mechanically. It must not, however, pretend to decide more than it can. Whether a sentence ASSERTS a count or merely counts beside a full list is a reading, and a regex deciding it would be a hard block resting on a guess about meaning — the anti-pattern named in regex-not-for-semantic-classification. The enumerator therefore splits along exactly that seam: the structural property — every --deselect site naming an identical, individually guarded node set — is decidable and BLOCKS; the semantic half is a high-recall prefilter that reports a finite candidate list and exits 0. Its value is not that the machine judges, but that the machine fixes the size of what a reader must judge. Two clauses that earlier drafts got wrong. The rejected-shape enumerator must PARAMETRIZE over the required-field set read from the code, not over a list typed beside it, or the enumerator is itself a hand-written list wearing a test's clothes — the exact substitution stage 1 exists to prevent, committed one level up. And the coverage-map enumerator must have its domain stated: as a suite test its domain is a fixture, so it proves the property is enforceable and checks nobody's real map; the totality of THIS plan's map is a separate one-shot invocation of the same resolver against a COMMITTED SNAPSHOT of this plan. The snapshot is not a dodge and its residual is stated: a control may not name a path outside the repository, because such a control is unreproducible in the canonical checkout and on any other machine — the engine refuses it for exactly that reason, and it is right to. So this plan enters the repository as a fixture on the same terms the corpus does at stage 1, with the same residual: the check binds the copy, and the copy equals the live plan only at the moment it is taken. Conflating the fixture test with the snapshot check, or the snapshot with the live file, would each let 'machine-checked' mean less than it appears to. Finally, the way of acting here is a LOOP, not a pass: implement, spawn an independent code-reviewer, apply the verdict's should-fix items, re-review, and repeat until the verdict is pass — the stage is done when a reader who did not write the code has attested it, not when the code is written. The cost tier does NOT price that loop, and an earlier wording of this clause said it did, which is false against the live estimator: effort.estimate charges reviews on a SEPARATE term, _mandated_reviews — one for the approved plan, plus one per spawn:developer stage, plus one per replan since arming — each at a flat _REVIEW_TIER of medium, so raising a stage's own tier cannot reach an iteration count at all. Stage 7 needed three review rounds; the estimator models one. Large is therefore chosen in ACKNOWLEDGEMENT of the loop rather than as a price for it, and the residual is recorded instead of papered over: large is 8 USD and 60 minutes against stage 7's measured ~28 USD across three rounds, and raising stages 8, 9, 10 and 11 moves the whole-plan estimate from 84 USD to 99 and from 300 to 405 active minutes — still roughly 2.5 times under. The tier ladder in config.md is deliberately not changed by this plan; recording the known under-pricing is what is in scope, and a reader must not take a raised tier for a solved estimate. Fourth, added at the plan-approval enumeration cross-check that preceded this stage's replan: stage 9 built the renormalization branch to refuse an edit touching the requirement, the criterion or the result image, but material_refs and knowledge_refs appear nowhere in that stage — so a renormalization could re-select the material this stage transforms and the branch would accept it as procedure-only, which is stage 4's defect committed one level up, at the very seam stage 4 exists to make observable. Re-selecting the material is a replan and not a renormalization, so both fields join the protected set and the refusal becomes decidable on the same terms as the other three. What this does NOT close is stated rather than glossed: it catches a material_refs that MOVES, and cannot catch a procedure rewritten to touch different material while material_refs is left stale, because whether a procedure's new prose implies different material is a reading and not a comparison — the same structural/semantic seam this stage's fifth enumerator splits along, and it is left to the coverage gate and to review for the same reason."
procedure = "Optional. Extend § Plan format with the new fields, the order table and the coverage map; add the renormalization to the planner's vocabulary. Write check-order-coverage.py as a reusable resolver taking a plan path. Copy this plan into scripts/tests/fixtures/ as the snapshot the one-shot check runs against, taking the copy at the LAST edit of the live plan and not earlier; if the live plan changes after this stage, re-take the snapshot in that same commit. Write test_contract_coverage.py (walk the required-field set and the order's keys, assert each appears in the contract text, and assert the contract states the two projections' rule — what belongs in material_refs, what in knowledge_refs, that a symbol in both is a smell the stage's own prose must justify, and that this is a documented contract rather than a submission refusal — 'documented' and not 'with an advisory lint', because no such lint exists in this repository and no stage of this plan builds one, so the contract's only enforcement is that a reader can find it — because no requirement in the order asks for a refusal and the comparison would run over unnormalized name granularities) and, in the same file, the change-decision enumerator: derive the domain from the dataclass fields of Stage AND of every dataclass reachable from it, by RECURSIVE TRAVERSAL with dataclasses.fields and never by an inline list of struct names: at the time of writing the traversal reaches eight — Subject, Means, Actor, Criterion, Principle, Supply, Outcome and LandedSpec, the last three reached through supplies, outcome and Criterion.landed and each dropped by the five-name apposition an earlier draft used, which is the same substitution of a hand list for an enumerator this plan exists to remove. The traversal must be written so that a struct added later is picked up without editing the test. All of these are fields the engine holds on a stage, and stage_carry_key already reads criterion.verify_command, criterion.expected_exit, criterion.criterion_type, criterion.verify_venue, criterion.verify_kind, criterion.verify_venue_at_final and actor.executor, so an enumerator walking only Stage, Means and Subject would exclude from its domain the very structs where the contract is already broken. actor.capability_required is deliberately NOT in that list, and an earlier draft wrongly put it there: stage_carry_key does not read it, so an executor taking the draft's word would have looked for a covered field and found an uncovered one, and the enumerator's own red phase would have been argued against a false baseline. Assert every definition-bearing field appears in stage_carry_key AND in the set _apply_refined_stage_fields copies AND in diff_plans' prose tuple, with the deliberate exclusions named in one place rather than skipped silently; write the enumerator BEFORE fixing anything and confirm it goes RED on the violation that exists on HEAD — Criterion.verify_venue_at_final is read by stage_carry_key in plan.py and is NOT copied by _apply_refined_stage_fields, whose own docstring in cli.py says the copied set must cover every field stage_carry_key reads — cited by SYMBOL and not by line number, because an earlier draft's two anchors (plan.py:1056 and cli.py:201) had already drifted to 1095 and 203 by the time stage 2 landed, and this stage's own edit to cli.py moves them again — then close it by adding verify_venue_at_final to the copied set and confirm the enumerator goes green. This is the only way this plan can prove the enumerator on a live violation instead of a constructed one, and it is the second reason the domain cannot be a hand-named subset: on the narrow domain the enumerator is green while the contract is broken. But a one-off red phase leaves no trace — after the fix the enumerator is green whether or not anyone ran it red — so the red fact must also be made PERMANENT: add a standing case that constructs a violation artificially, a copy of the copied-field set with verify_venue_at_final removed, and asserts the enumerator reports it. That case survives the fix and is what a later reader can actually check; the live red phase is then evidence for this task, and the constructed case is the control. Note what the red phase does NOT prove on its own: on a structural domain the enumerator goes red at once on subject.material, principle fields, output_artifacts, control, index, supplies.element and outcome fields, all of them legitimate exclusions — and, once stage 13 merges trunk in, actor.cost_tier, which is a REQUIRED member of the exclusion list and not an optional one, since trunk deliberately keeps that field out of _structural_signature and out of stage_carry_key while keeping it in diff_plans' prose tuple for the reason trunk states at plan.py:1151, so an enumerator demanding membership in all three goes red on a correct delivery unless the exclusion is written down — so redness is a function of the exclusion list the same author writes in the same commit — which is why the exclusions are named in one place and reviewed as a list rather than discovered one failure at a time; assert that stage_question_key covers the same field domain, and every member of ELEMENT_NAMES in addition, since a question target is named from that vocabulary while a question is ANSWERED against the stage's fields; and assert the contribution is CONDITIONAL as well as present — a stage declaring none of the new fields must keep its schema-23 digest exactly, which is the property that leaves every live session's disposed questions valid, and an unconditional contribution passes a presence-only walk while breaking it. Fix the control-name grammar the resolver accepts while writing it, since the map already uses three forms and one of them exists for a structural reason: 'stage <n> verify_command', 'final_check <n>', and 'stage <n> landed assertion' — the third because stage 12 has no verify_command at all, so a resolver knowing only the first two would report the R10 entry unresolvable. A name outside the grammar is a failure, never a skip. This is what the existing test_refresh_covers_every_carry_key_field cannot do — it pins the relation BETWEEN two sets, so a field missing from both passes it, which is precisely how at least six fields were nearly added to this engine unnoticed — the five this plan adds, and a sixth, verify_venue_at_final, added before it and uncovered on HEAD right now; test_rejected_shapes.py (parametrized over the required-field set derived from the code, one asserting case per member, plus a guard test that the parametrization is non-empty and matches the field set exactly), and test_order_coverage_map.py (the resolver over a fixture plan). Write scripts/check-exception-set-enumeration.py on the shape check-order-coverage.py already establishes — a reusable resolver taking a plan path, so one implementation serves both the fixture test and the one-shot snapshot check. Structural half: parse with tomllib, collect every verify_command and every final_check command containing --deselect, extract the node ids each deselects, and assert the sets are identical across sites and that each site re-runs alone, with a test of exit code exactly 1, every node it deselects; a site deselecting a node it does not guard, guarding a node it does not deselect, or disagreeing with another site is a nonzero exit. Semantic half: split every string field into sentences, select those carrying exception-set vocabulary together with EITHER a cardinality word OR a bare definite singular reference to a member of the set ('the excluded node', 'the known-red test', 'that node') — which asserts the same thing without a numeral and is invisible to a cardinality filter alone; this half is report-only, so widening its recall costs reading and nothing else, and a narrow prefilter on a reporting channel buys nothing — and print each with its field and line NEVER TRUNCATED, because an earlier version of this very check cut its candidates at 300 characters for display and a site's cardinality word fell past the cutoff, so the machine reported the line and the reader cleared it on half a sentence; exit 0 whatever this half prints. Every number the report itself prints is DERIVED from the enumeration it prints and never written into a format string: the prototype this succeeds already announced 'seven command sites' above six rows, a hardcoded count going stale inside the very tool built to stop hardcoded counts going stale. Add test_exception_set_enumeration.py over fixtures: sites that agree; sites that disagree (nonzero asserted); a site that DESELECTS A NODE IT DOES NOT GUARD (nonzero asserted), and that site is a TWO-node one in which the other node IS properly guarded, so that an implementation scanning the whole command string for a literal exit-code-1 comparison without binding it to a particular node cannot pass it either, which is the load-bearing direction and was missing from an earlier draft of this list — deselecting without guarding IS the silent widening this gate exists to stop, while guarding without deselecting is its harmless inverse, and it is the only fixture that separates a real guard-recognizer from a degenerate one; that harmless inverse, a site guarding a node it does not deselect (nonzero asserted); a site whose guard compares the captured status to 0 rather than to 1 (nonzero asserted), which binds the enumerator to the exit-code-exactly-1 SEMANTICS and not merely to the presence of something guard-shaped — an implementation recognizing a guard by position alone passes every fixture above it while ignoring the very comparison the fails-loudly-on-partial-upstream-repair property rests on; and prose carrying a cardinality word, asserting exit 0 AND the sentence present in the output — that last case is what pins the report-only contract. Because that third fixture only discriminates if 'guarded' has a stated shape, state it here rather than leaving it to the implementer: a node is GUARDED when the command contains a single-node pytest invocation naming that node whose exit status is captured into a variable and compared to exactly 1 in a conjunct PRECEDING the deselecting run. An implementation that instead treats any appearance of the node id as a guard passes every other fixture in this list and blocks nothing in the one direction that matters — which is how a gate can be delivered green while gating nothing, and why the shape is written into the plan and not discovered in review. Run the resolver against the plan snapshot in this stage's own check and document its two roles exactly as the coverage-map resolver's are documented, for the same reason. Keep within the prose ceilings."
preconditions = "Stage 9 landed, so the field set and the refusable-shape set are final."
conditions = "The contract is written against the landed engine and validated by tests that read both, so the agreement between instruction and engine is machine-observable rather than asserted at the moment of writing. This stage's two REPORTING channels — the semantic half of check-exception-set-enumeration.py and the named-exclusion list the change-decision enumerator forces — are run as a SWEEP whose full output is read, never consumed as a pass/fail gate and discarded. This is the correction the effort-divergence diagnosis forced after stage 13, and it is split along exactly the seam this stage's own fifth enumerator is built on, because an earlier wording of this clause put both halves on the unenforceable side and justified it with a sentence implying neither half was decidable — which is this plan's own subject committed inside the correction for it. The DECIDABLE half is that the enumerated instance list exists and regenerates, and it is discharged as a CONJUNCT of stage 11's control, which re-runs check-exception-set-enumeration.py against the same snapshot this stage does; a control that merely ran here would leave nothing a later reader can re-perform, since record-result's --control is a text attestation written by the root and captures no command output. The UNDECIDABLE half is that the list was read and every entry dispositioned as fixed here, carried to stage 11's ADR, or dismissed with its stated reason — a shell control can decide that an enumerator ran and cannot decide that its list was read — and it is stated as a precondition of stages 11 and 12 rather than here, because it binds the ROOT at dispatch and this stage's actor is a spawned developer who cannot discharge an obligation about a later dispatch. The premise sweep this stage's criterion rests on was performed and recorded before the stage was dispatched, rather than left to execution to discover by failing: its measured verdicts are in this stage's knowledge field, so a reader can tell a measured premise from an assumed one. What that sweep actually saw is stated exactly, because an earlier wording of this clause claimed more than had been measured: it read the PRE-MERGE delivery branch, 61 commits behind trunk, so every verdict it recorded was provisional on a re-measurement over the merged tree. That clause named stage 13 as the discharger, and stage 13 is now PASSED without having re-measured these premises, so the obligation is carried HERE rather than left pointing at a stage that cannot perform it — a dangling discharger being exactly the kind of defect this plan's own subject predicts. Its extent is stated exactly rather than as the reader of this stage alone would infer it: the clause stood in FIVE stages — 8, 9, 10, 11 and 12 — and in the plan's own top-level done_criterion, and all six were repaired in one pass. Review reported it in two stages; a grep found it in six, which is this plan's general claim demonstrated on the plan itself, since a report names where a defect was noticed and only an enumeration names where it stands. Three verdicts were re-measured at the effort-divergence diagnosis that followed the merge, and are recorded so the executor re-attests from them rather than from scratch: the merge moved documentation only, `git diff --stat 5c282b8 68ab003` reporting 4 files and +49/-1 entirely under memory-global/leaves/experience/; stage 9's two grep anchors HAVE flipped on the merged tree, but at d73d84f, which is stage 9's own committed edit and therefore its designed effect rather than a premise movement; and the committed snapshot fixture scripts/tests/fixtures/plan_snapshot_smd-act-defects-8.toml is stale against the live plan, 726 lines against 729, which stage 10's re-take rule already covers and which is named here so no executor rediscovers it. The premises this stage rests on that are not among those three are re-attested by the executor as its first act, and a verdict that moves is a finding for this stage rather than a correction to be made in passing. The three-attestation regime stays: control observation, code review, tests. The review loop is what the estimate must PRICE, never what it may cut to fit. That last sentence is recorded here as a NORM ON THE ESTIMATE and not as a property of the material this stage transforms — nothing in the tree makes it true, and the estimator as it stands does not obey it, charging reviews on the separate flat term this stage's method records; it is kept in this field because it is the invariant the critique preserved, and it is marked as a norm so a reader does not take it for a measured property of the stage."
invariants = "Exactly one ENGINE-CODE edit is made in this stage — the one the enumerator forces, adding verify_venue_at_final to the set _apply_refined_stage_fields copies — and no other engine behaviour changes. 'Engine-code' means scripts/agentctl/ and nothing else — stated as a path rather than left to inference, because this stage's own output_artifacts already carried a standalone scripts/check-*.py under this invariant and because the stated consequence of misreading it is a REPLAN: — and not 'production' because the stage also writes tests, standalone check scripts and documentation, both of which are production artifacts in this repository; an executor reading the wider word would take the stage to forbid its own procedure. Stated in this shape deliberately: an earlier draft said 'no behavioural change to the engine in this stage', which this stage's own procedure, material and output_artifacts contradict, and an executor obeying that wording would skip the forced edit and leave the enumerator's red phase unperformed. What the executor does when the code review demands a SECOND engine edit is stated here rather than left as a contradiction between this invariant and the means clause that promises a fix pass answering the verdict: it neither silently widens the sanctioned edit nor discards the concern. A reviewer should-fix landing on engine code is a divergence between this stage's norm and what the work turns out to require, which is a plan-level difficulty, so the executor returns REPLAN: naming the concern and the edit it demands and lets the root decide whether this stage's scope moves. That is the expected case rather than a remote one: stage 7's verdict was a pass carrying one should-fix and six nits. skill-md-max-lines and policy-md-max-lines hold. No enumerator in this stage may take its domain from a literal collection written in the test file. The stage-1 harness stays green. And the snapshot obeys the same freshness rule as stage 1's corpus baseline: scripts/tests/fixtures/plan_snapshot_smd-act-defects-8.toml is re-taken in the SAME commit as any edit to the live plan it copies, for the reason that makes the rule non-optional here — this plan has been edited in every review round and will be again, and a stale snapshot leaves final_check 6 green over a coverage map that no longer describes anything — and, once the fifth enumerator is bound to that same snapshot, green over an EXCEPTION SET that no longer describes anything either, where the residual bites harder than it does on the map: a further prose site is produced by precisely the event a snapshot cannot see, an edit to the live plan made after this stage committed, and the live plan sits outside repo_root where by this plan's own rule no control may name it. So the gate reads a copy by construction, and what bounds it is the re-take rule, never the gate itself. Every stage keeps a measurable control with a declared venue, and stages 1-11 keep verify_venue_at_final so they can be re-run after the delivery worktree is removed. That sentence is preserved in the form the critique recorded it, and its quantifier is extended rather than rewritten: stage 13, added after it was written, carries verify_venue_at_final on exactly the same ground, so the property now holds of stages 1-11 and 13 — every stage of this plan except stage 12, which asserts landing and is refused a final venue by the loader. An earlier draft followed that sentence with a bridge claiming it was WHY the one engine edit this stage forces is the verify_venue_at_final omission; the bridge is deleted rather than reworded, because it misstated the causal chain this stage's own material and knowledge fields set out — the edit is forced by the enumerator going red on a violation that predates this plan, and the plan's venue declarations neither cause it nor bear on it. The submission-seam-only architecture: every new requirement lands in validate_submission / submission_violations and never in load_plan / parse_plan, so the 55 frozen corpus plans keep loading byte-for-byte and no stored attestation is re-stamped. It is written out here rather than inherited from stage 8 by cross-reference, for the reason it is written out in stage 9: an invariant that binds this stage has to be readable in this stage. Four properties of this stage's control are carried here, three of them verbatim from the stage-10 difficulty, and they bind every stage of this plan that has not yet run; a fifth is stated in stage 12's invariants, where the run on the landed tree lives. The control keeps running the WHOLE scripts/tests tree; it is never narrowed to the files the stage touched. Each stage's own conjuncts stay explicit and must stay green: the stage's named new tests, scripts/check-order-coverage.py against the plan snapshot, and scripts/lint-prose-length.py. That sentence is preserved exactly as the critique recorded it, and the fifth enumerator is added BESIDE it rather than inside it: scripts/check-exception-set-enumeration.py runs against that same snapshot as a further explicit conjunct of this stage's control, on the same terms and for the same reason as the two named before it. The suite is attempted UNEXCLUDED first, so every deselection stays inert while the tree is green; each excluded node is named by exact id with its cause and is admitted only after a guard re-runs it alone and proves pytest exit code exactly 1; no blanket suppression enters any verify_command. And one further property, of the ENUMERATED form as such rather than of any one command, which is why it is stated here and only echoed at final_check[0]: the exception set is tolerated only while EVERY node it names is still red, so if upstream repairs some of them but not all, the suite stays red, the fallback is entered, a repaired node's guard exits 0 instead of 1, and the control fails loudly rather than deselecting a node that is no longer inherited-red. A good upstream outcome therefore costs a reconciliation — the price this form pays for never widening in silence, and a world the single-node form did not have. Three further invariants are carried here verbatim from the effort-divergence critique, because they bind the three stages that have not yet run and a critique's preserved similarity that lives only in an engine record binds nothing. Every repair already delivered stays delivered: stages 1-9's committed work is not reopened, and the three replans in this window each removed a real defect whose content the corrected plan keeps verbatim. Stage 10's enumerators keep the two properties that make them enumerators rather than assertions: each derives its domain mechanically from the artifact it audits, never from a hand-written list, and at least one is shown RED on a violation really present on HEAD before that violation is fixed. Tolerance for inherited redness stays an ENUMERATION: every node the exception set names carries its own still-red guard, and no sentence ASSERTS a cardinality AS the set, while a count standing beside the full list of node ids is permitted and several live sentences of this plan carry one; the trunk baseline is re-read at each trunk merge as a dated reading rather than a standing fact. That invariant was recorded in a shorter form which said the count must be 'nowhere in prose', and the shorter form is not merely loose but false against the plan it binds: six live sentences count beside a full list — in stage 9, in this stage's own done_criterion two fields above, in stage 11, twice in stage 12 and at final_check[0] — so an executor obeying it literally would have to strip this stage's own criterion. It is restated in the plan's established distinction instead, which is the same seam the fifth enumerator splits along: a cardinality ASSERTED AS the set is the defect, a cardinality standing beside the enumeration is not, and only the first is what the reporting half exists to surface."
capability_required = "Editing the planner contract within its ceilings; pytest parametrization over code-derived domains."
knowledge = "This is tests-accompany-code and docs-accompany-architectural-change applied to the authoring contract, plus the plan's own stage-1 principle applied to its own criterion. The corpus supplies the reason the contract cannot be left implicit: every substantive plan so far was written against it — 55 of them in the frozen fixture alone — so its silence propagates to every future plan. And the reason the rejected-shape list must be derived rather than typed is this plan's own history: three review rounds each found a hand-maintained correspondence that had silently fallen out of step with the thing it described. The live violation this stage's enumerator is proven RED on was re-measured at the stage-7 effort-divergence diagnosis and is still present: cli.py _apply_refined_stage_fields copies its fields one assignment at a time and none of them is criterion.verify_venue_at_final, while plan.stage_carry_key does read that field — so the stage's red phase remains performable and its single forced engine-code edit remains the one the enumerator names. One field the enumerator will meet does not exist on this branch at all and is measured on trunk instead: Actor.cost_tier, at state.py:578 on origin/main, read by plan.py:1151 and :1178 and by cli.py:228, absent at the time of that measurement from every file under scripts/agentctl/ here — grep returned nothing — and arriving in this tree only when stage 13 merges trunk. That absence is SUPERSEDED and is marked here at the point of reading rather than only in the correction three sentences below, because an executor who stops mid-field would otherwise carry away a false current claim: stage 13 has merged, and the field is present in this tree now. Trunk keeps it out of _structural_signature and out of stage_carry_key on purpose, with the reason stated at plan.py:1151, while keeping it in diff_plans' prose tuple. So it is a deliberate exclusion of exactly the kind this enumerator must name rather than discover: an enumerator asserting that every definition-bearing field appears in all three functions goes red on a correct delivery the moment the merge lands, and final checks 1 and 6 with it, unless actor.cost_tier is in the named-exclusions list from the start. That was recorded as a measured fact about a tree this stage had not yet seen, inheriting stage 13's re-measurement obligation with the other nine premises; stage 13 has since merged trunk and PASSED, so the fact is now directly observable in this tree and has been re-measured — Actor.cost_tier is present under scripts/agentctl/, and it is cited from here by SYMBOL rather than by the state.py:578 the pre-merge measurement recorded, both because that line has already drifted to 697 in the merged tree and because this stage's own procedure states the rule that a code anchor is cited by symbol for exactly this reason."

[stage.principle]
statement = "When a validator tightens, the instruction that produces the validated artifact is part of the change; a universal claim over a heterogeneous requirement set needs one enumerator per kind of requirement plus a totality check over the map between them; and every such enumerator must derive its domain from the code, since an enumerator over a hand-written domain is the hand-written list it was introduced to replace."
source = "memory-global/leaves/docs-accompany-architectural-change.md; this plan's stage-1 principle applied reflexively; the corpus fact that every substantive plan so far was authored against one contract."
derivation = "The engine and the contract are two statements of one requirement set, maintained by different people at different times; two statements of one thing drift unless something compares them, and discipline is not that something — it is what fails under time pressure, which is when fields get added. The second clause follows from the first applied to this plan: a rejected-shape enumerator decides exactly the requirements a validator can refuse, so applying it alone to a set containing behavioural and landing requirements produces a green that means less than it appears to. The third clause is the same argument applied once more, to the enumerator itself: a test whose parametrization is a literal list has a domain that a new field does not enter, so it goes green while covering less — which is exactly the failure mode of the artifact it audits."
confidence = "high"
refutation = "If the contract is written so generically that the coverage test passes on a document teaching nothing — a field list with no guidance — the check is satisfied without the requirement being met, observable as new plans still failing on first submission."

