means = "The prefilter-plus-fail-open-judge helper from stage 3, on the submission seam — NOT the normalized-distinctness comparison, which this plan's own stage 3 measured as catching 0 of 200 and which an earlier draft of this stage named as its instrument; the existing replan command and its blocker set; lint-prose-length.py as the ceiling guard on SKILL.md. And the attestation itself is a means this stage wields, not an event that happens to it: an independent code-reviewer spawn plus the fix pass that answers its verdict, which tests-accompany-code and review-accompanies-code make part of the stage rather than of its aftermath."
method = "Requirement: a plan must be able to state a requirement on the way of acting WITHOUT thereby fixing the sequence of operations, so that an executing actor selects its own operations and is still judged against the norm. The renormalization's permission is exactly co-extensive with that distinction — it moves the sequence and nothing else — because a renormalization that could also move the criterion would let the executing position shift its own goalposts. Four acceptability clauses, each correcting a specific earlier error. The first is the one that cost this stage a review round: the distinctness refusal must NOT rest on normalized equality. An earlier draft named that comparison as this stage's instrument while stage 3 of the same plan was measuring it as catching 0 of 200 real cases — the plan would have refuted its own mechanism two stages earlier, and marked R3 'full' while doing so. So the refusal runs through stage 3's prefilter-and-judge helper and inherits its properties honestly, including fail-open: whenever the advisor is unreachable this refusal never fires, exactly as stage 5's does not, and the coverage mark and the principle's confidence say so rather than implying a guarantee. The structural half of R3 — the field pair existing, both required, and the renormalization branch refusing to touch the requirement, the criterion or the result image — holds unconditionally and is what the mark's remaining full component rests on. The second clause: the target in the planner contract is named precisely, since the checklist is prescribed by the 'Steps' bullet, while the words that actually remove the executor's selection are in the 'Means & method' bullet, and an executor deleting a checklist from a field that never held one would leave the operative prescription standing. Third, the sequence field belongs beside the requirement on the means struct, since that is where the colliding docstring lives. Fourth, the verification's positive half must be anchored on text absent from the file today — a grep for the bare word 'procedure' already passes, because the file uses the word in an unrelated sentence at line 73, and a control that cannot go red on an unedited file is not a control, by the standard this very file states. Acceptable: an empty sequence when the plan has no preferred one. Finally, the way of acting here is a LOOP, not a pass: implement, spawn an independent code-reviewer, apply the verdict's should-fix items, re-review, and repeat until the verdict is pass — the stage is done when a reader who did not write the code has attested it, not when the code is written. The cost tier does NOT price that loop, and an earlier wording of this clause said it did, which is false against the live estimator: effort.estimate charges reviews on a SEPARATE term, _mandated_reviews — one for the approved plan, plus one per spawn:developer stage, plus one per replan since arming — each at a flat _REVIEW_TIER of medium, so raising a stage's own tier cannot reach an iteration count at all. Stage 7 needed three review rounds; the estimator models one. Large is therefore chosen in ACKNOWLEDGEMENT of the loop rather than as a price for it, and the residual is recorded instead of papered over: large is 8 USD and 60 minutes against stage 7's measured ~28 USD across three rounds, and raising stages 8, 9, 10 and 11 moves the whole-plan estimate from 84 USD to 99 and from 300 to 405 active minutes — still roughly 2.5 times under. The tier ladder in config.md is deliberately not changed by this plan; recording the known under-pricing is what is in scope, and a reader must not take a raised tier for a solved estimate."
procedure = "Optional. state.py: add Means.procedure and rewrite the Means docstring so method no longer means procedure. validate_submission: require both for substantive stages and add the distinctness check. Two DIFFERENT functions, and conflating them is what an earlier draft did: plan.diff_plans' _prose tuple decides whether an edit is no_change at all, so procedure goes there or a renormalization — an edit touching procedure and nothing else — is classified no_change and never reaches the branch this stage adds; and gates._operative_surface decides the CHANGE half of replan_coverage_blockers, so procedure goes there too, for the separate reason that a replan justified by a difference must show a difference the engine executes on. Both, plus the rest of the standing obligation stage 2 sets — stage_carry_key, _apply_refined_stage_fields and stage_question_key — in the commit that introduces the field. cli.py: add the RENORM replan branch, refusing any renormalization that touches the requirement, the criterion, the result image, or the recorded-comparison obligation stage 8 introduced. Rewrite the 'Means & method' and 'Steps' bullets in planner/SKILL.md, introducing the sentence the positive grep anchors on. Tests both directions."
preconditions = "Stages 4 and 8 landed. This stage precedes the contract stage, which documents the field pair it creates, and it is the only stage before that one to edit planner/SKILL.md."
conditions = "The engine change and the contract change are made together, since the submission check's acceptance and the planner's prescription jointly determine what lands in the field — either alone leaves observed behaviour unchanged. The premise sweep this stage's criterion rests on was performed and recorded before the stage was dispatched, rather than left to execution to discover by failing: its measured verdicts are in this stage's knowledge field, so a reader can tell a measured premise from an assumed one. What that sweep actually saw is stated exactly, because an earlier wording of this clause claimed more than had been measured: it read the PRE-MERGE delivery branch, 61 commits behind trunk, so every verdict it recorded was provisional on a re-measurement over the merged tree. That clause named stage 13 as the discharger, and stage 13 is now PASSED without having re-measured these premises, so the obligation is carried HERE rather than left pointing at a stage that cannot perform it — a dangling discharger being exactly the kind of defect this plan's own subject predicts. Its extent is stated exactly rather than as the reader of this stage alone would infer it: the clause stood in FIVE stages — 8, 9, 10, 11 and 12 — and in the plan's own top-level done_criterion, and all six were repaired in one pass. Review reported it in two stages; a grep found it in six, which is this plan's general claim demonstrated on the plan itself, since a report names where a defect was noticed and only an enumeration names where it stands. Three verdicts were re-measured at the effort-divergence diagnosis that followed the merge, and are recorded so the executor re-attests from them rather than from scratch: the merge moved documentation only, `git diff --stat 5c282b8 68ab003` reporting 4 files and +49/-1 entirely under memory-global/leaves/experience/; stage 9's two grep anchors HAVE flipped on the merged tree, but at d73d84f, which is stage 9's own committed edit and therefore its designed effect rather than a premise movement; and the committed snapshot fixture scripts/tests/fixtures/plan_snapshot_smd-act-defects-8.toml is stale against the live plan, 726 lines against 729, which stage 10's re-take rule already covers and which is named here so no executor rediscovers it. The premises this stage rests on that are not among those three are re-attested by the executor as its first act, and a verdict that moves is a finding for this stage rather than a correction to be made in passing. The three-attestation regime stays: control observation, code review, tests. The review loop is what the estimate must PRICE, never what it may cut to fit. That last sentence is recorded here as a NORM ON THE ESTIMATE and not as a property of the material this stage transforms — nothing in the tree makes it true, and the estimator as it stands does not obey it, charging reviews on the separate flat term this stage's method records; it is kept in this field because it is the invariant the critique preserved, and it is marked as a norm so a reader does not take it for a measured property of the stage."
invariants = "A renormalization is reachable: an edit touching only procedure classifies as a change, asserted by a test over diff_plans and not inferred from the operative surface. The user-facing plan-approval gate is weakened for nothing except the sequence: substantive replans keep their gate, and a renormalization is refused the instant it touches the requirement, the criterion or the result image. Neither grep may be satisfiable by the file as it stands before the edit. skill-md-max-lines is not exceeded. The stage-1 harness stays green. The submission-seam-only architecture: every new requirement lands in validate_submission / submission_violations and never in load_plan / parse_plan, so the 55 frozen corpus plans keep loading byte-for-byte and no stored attestation is re-stamped. It is written out here rather than inherited from stage 8 by cross-reference, because an invariant that binds this stage has to be readable in this stage; and it applies to the procedure field with the same force it applies to the four fields already landed, since a submission requirement binds what is OFFERED and never what is stored."
capability_required = "agentctl replan and gate work; editing planner/SKILL.md within its ceiling."
knowledge = "The source places perception of the order, construction of the norm, possession of knowledge, selection of components, bringing them into interaction, control and hand-off in ONE position, and defines the norm as the aggregate of requirements on all components. It follows that this system's division — one position builds the norm, another executes it — is a methodological move of this system, defensible in the tradition but NOT derivable from those lines; what this stage restores to the executor is the selection of operations, not the construction of the norm. The source's observation that one object may be used in a particular way across several transformations is the same distinction drawn here between the fixed instrument and the way of using it. Verified on the live file: line 122 contains 'so execution is mechanical not design', and 'the executor may replace the procedure' is absent — so the negative grep can go red and the positive one currently fails, which is the property required of both. RE-MEASURED at the stage-7 effort-divergence diagnosis, after stages 2-8 had landed and could have moved the file: both facts still hold, at the same line 122 and at zero occurrences respectively, so this stage's control retains the property that it can go red on an unedited file."

[stage.principle]
statement = "Handing an executing position a program rather than a requirement removes its selection function; the engine preserves that function only by making requirement and program separately representable and permitting the executor to move the program alone — and a control over a documentation edit must be anchored on text the unedited file does not contain."
source = "activity_as_is.md on the single position and on the norm as requirements; planner/SKILL.md, which states the purpose of its own field as making execution mechanical rather than design, and which elsewhere states that a control is trustworthy only if it goes red on a real mutation."
derivation = "If the only field carrying 'how' holds an operation sequence, any deviation by the executor is a deviation from the norm, so the executor cannot select without a replan — and replanning is gated on the user, making selection structurally unavailable. Splitting the field distinguishes deviation-in-sequence from deviation-in-requirement, and only the latter needs the gate. That much is structural and holds unconditionally. The rest does not, and the confidence is set by the weaker half: separating requirement from program in AUTHORED TEXT is a semantic judgement, so the refusal rides stage 3's fail-open judge and is inert whenever the advisor is unreachable — this axis is protected exactly as weakly as stage 5's conditions axis, and less strongly than the six defects that got a structural refusal. The anchoring clause belongs to verification rather than to the argument: a grep for a common word is satisfied by the pre-edit file, so it measures nothing, and the file being edited is the same one that states this rule."
confidence = "low"
refutation = "Two refutations, and the confidence reflects the first. The mechanism half: the distinctness refusal is judge-decided and fail-open, so in any period when the advisor is unreachable it never fires — and this task's one observation of that environment is that the advisor WAS unreachable. If that is the steady state, R3's behavioural half is untested by practice rather than confirmed by it, and the honest reading is that method-versus-program is closed structurally and only nominally by refusal. The substantive half: if renormalization is used in practice to smuggle changes a reviewer would call requirement changes — the sequence rewritten so thoroughly the requirement is effectively different — the distinction is not machine-separable at this granularity and the gate must return to covering both. Observable: sample renormalizations and ask whether the stage's requirement still describes what was done."

