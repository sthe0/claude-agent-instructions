#    sub-plan's done criterion.
#
# NOTE on vacuity disclosure. The three-suite pytest conjunct in final_check 1 exits 0 today and is
# therefore vacuous on its own; it is kept deliberately as a no-regression guard. The discriminating
# power of final_check 1 rests on the two node-ids and the `active-stage pointer` grep, which are
# false today. `scripts/verify-all.py` is deliberately NOT a final_check conjunct: it is an unscoped
# 18-check aggregate, so an unrelated pre-existing red would false-fail the resolution gate long after
# the fact. It runs instead inside stage 3, in flight, as the pre-land gate.
#
# NOTE on the originating stage. This sub-plan is pushed with --originating-stage 1, the parent stage
# the first sub-plan already satisfied and which pop marks PASSED (idempotent here). Stage 2 must NOT
# be named as the originating stage: cmd_pop_subplan marks the originating stage PASSED
# unconditionally, which would falsely assert that the parent's unfinished stage 2 is done. Parent
# stage 1's TRUE control string was captured before the first pop and is re-stated verbatim when the
# parent's outcome is reported; the second pop overwrites it again, and no engine command can restore
# a control after a pop (cmd_record_result acts only on state.active_stage(), cli.py:2242-2246).
