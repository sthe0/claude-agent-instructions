[meta]
task_id = "agentctl-pop-pointer"
goal = "Second service sub-plan for the parent plan prune-dangling-hook-references-v7. After the first sub-plan (agentctl-venue-propagation, landed 7b3a624) fixed the venue fields, `pop-subplan` restored the parent at EXECUTING with its venue correct — but left parent stage 2 UNREACHABLE. cmd_pop_subplan restores the parent's stages in full, including a stage still marked ACTIVE, and then unconditionally sets state.current_stage = None (cli.py:3305). No engine verb re-enters that stage: next-stage selects only PENDING stages whose deps are PASSED (state.py:1092-1099) and so reports 'no ready stages'; dispatch and record-result both act only through active_stage(), which returns None when current_stage is None (cli.py:2129-2131, 2242-2246); replan re-arms only FAILED stages, and only inside DIAGNOSING (cli.py:3098-3101, 3118-3119), which cannot be entered because entering it requires record-result on an active stage. The parent stage is therefore unreachable by every ORDINARY verb. It is not literally unrecoverable: `replan --kind substantive` (cli.py:3140-3147) rebuilds `state.stages` from a new plan file and carries forward only PASSED stages, so the ACTIVE stage would return as PENDING and `next-stage` could pick it up. That escape is real and this plan does not pretend otherwise — it is rejected on COST, not impossibility: it re-arms the parent's plan-approval hard gate, spending a full user re-approval of an unchanged 5-stage plan plus a paid thinker plan-review, to work around an engine defect that will re-wedge the next sub-plan pop. This is the SAME structural family as the defect the first sub-plan closed: two representations of one fact that must move together are moved apart. Here the pair is the stage-status ACTIVE and the redundant pointer current_stage. PlanFrame even captures current_stage (state.py:720) and its docstring promises the parent 'resumes exactly where it left off' (state.py:701-704); cmd_pop_subplan contradicts its own frame contract by discarding the field it snapshotted."
done_criterion = "cmd_pop_subplan derives state.current_stage from the restored stages' own ACTIVE status through one named helper `_restore_current_stage`, instead of hardcoding None — so after a pop the active-stage pointer and the stage statuses agree, a stage left ACTIVE by the push is re-enterable by dispatch/record-result, and a pop whose originating stage was the active one correctly leaves no pointer (that stage is marked PASSED). Both properties are pinned by named regression tests, the agentctl README states the invariant, and the change is landed on origin/main AND local main so the canonical checkout this session invokes agentctl from runs the fixed code."
