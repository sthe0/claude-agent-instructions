## Final verification
# 1. Both named regression tests pass in the canonical checkout; the three touched agentctl suites stay
#    green; scripts/agentctl/README.md states the invariant.
# 2. _restore_current_stage is present in scripts/agentctl/cli.py on BOTH origin/main and local main,
#    so the agentctl this session invokes from the canonical checkout is the fixed code.
# 3. Operational observable, checked by the PARENT plan and not by this gate: after pop-subplan,
#    `agentctl status` for the parent session shows current_stage = 2 with stage 2 still ACTIVE, and
#    `agentctl dispatch` launches the parent's stage-2 developer in
