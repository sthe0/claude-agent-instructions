e-enterable rather than stranded. The existing coverage cannot substitute for it: scripts/tests/test_subplan.py:189 is the only assertion in the suite pinning post-pop current_stage, it uses originating == the ACTIVE stage, and so it stays green under a correct fix AND under a no-op; test_roundtrip_with_plan_stack (:194) never pops, and test_pop_subplan_rederives_venue_from_plan (:371) pops without asserting the pointer. The SECOND, `test_pop_subplan_clears_pointer_when_originating_stage_was_active`, pins the other direction — when the ACTIVE stage IS the originating one, the pop marks it PASSED and leaves current_stage None with no stage left ACTIVE — which is also what guards the ordering requirement, since a derivation placed before the PASSED marking fails exactly here."
