# Plan: isolated-install-audit — make every installer script correct for the
# isolated agent root (~/.claude-agent) so the system can be handed to
# colleagues; fix the discovered old-root hardcodes in core and in the arc
# project layer, and reconnect the state they orphaned.

[meta]
task_id = "isolated-install-audit"
goal = "A colleague's fresh install (and both existing machines) gets every symlink, settings file, and state directory under the isolated agent root; no installer silently writes to ~/.claude"
done_criterion = "Fresh-install simulation (tmp HOME + CLAUDE_AGENT_HOME) creates zero entries under $HOME/.claude; doctor.sh green on this Mac; on the0.klg.yp-c.yandex.net project-memory symlinks resolve under ~/.claude-agent/projects and the arc-layer scripts carry no ~/.claude hardcode"
criterion_type = "measurable"
weight_class = "substantive"
repo_root = "/Users/the0/claude-agent-instructions"
external_research = "Not warranted: all facts scouted directly (grep of installers, SSH inventory of the remote host, live symlink state on both machines)."

# ── Audit findings the stages fix ───────────────────────────────────────────
# F1 apply-settings.sh defaults TARGET to $HOME/.claude/settings.json (bit us:
#    AFK setting first landed in the dead root).
# F2 setup-project-memory.sh hardcodes $HOME/.claude/projects/$HASH — on any
#    isolated-root machine the sharing symlink lands in the dead root; on the
#    remote host project memory is disconnected right now.
# F3 agentctl state roots hardcoded: store.py DEFAULT_ROOT, cli.py GATE_LOG,
#    session_scope/registry.py DEFAULT_SCOPES_DIR (~/.claude/agentctl/...),
#    exempt_paths.py plan-path substring "/.claude/plans/". Mixed-root state on
#    this Mac; a colleague's install would re-create ~/.claude pollution.
# F4 setup-ccgram.sh:208 detects the install via $HOME/.claude/settings.json.
# F5 session-isolate.sh plugin dir defaults to $HOME/.claude/project-entry-plugins.
# F6 arc layer (Arcadia junk/the0/agents, on the remote host):
#    sync-cursor-cli-permissions.sh hardcodes ~/.claude/projects/<hash>/memory/**
#    in the generated cli.json; setup-local.sh prose references the old root.
# F7 prose drift: CLAUDE.md / docs / instructions-repo-layout leaf still name
#    ~/.claude paths for things that now (or after F3) live in ~/.claude-agent.

[[stage]]
index = 1
title = "Core installers resolve the isolated root (F1, F2, F4, F5)"
executor = "spawn:developer"
expected_result_image = "apply-settings.sh defaults TARGET to $CLAUDE_AGENT_HOME/settings.json via lib/config-root.sh (CLAUDE_SETTINGS override preserved); setup-project-memory.sh places the per-cwd memory symlink under $CLAUDE_AGENT_HOME/projects/<hash>/ and, when a legacy ~/.claude/projects/<hash>/memory symlink exists, re-points/moves it to the isolated root; setup-ccgram.sh detection checks $CLAUDE_AGENT_HOME/settings.json (falling back to the legacy path); session-isolate.sh plugin-dir default is $CLAUDE_AGENT_HOME/project-entry-plugins with legacy fallback when only the old dir exists. New/updated pytest coverage drives each script against a tmp HOME and asserts nothing is created under $HOME/.claude."
criterion_type = "measurable"
done_criterion = "Focused test files pass; grep finds no unguarded $HOME/.claude default in the four scripts"
verify_command = "bash -c 'cd /Users/the0/claude-agent-instructions/scripts && python3 -m pytest tests/ -q -k \"settings or project_memory or ccgram or isolate or plugin_dir or installer_root_hardcodes\" && grep -q \"CLAUDE_SETTINGS:-.CLAUDE_AGENT_HOME/settings.json\" apply-settings.sh && grep -q \"PROJECTS_DIR=..CLAUDE_AGENT_HOME/projects\" setup-project-memory.sh'"
expected_exit = 0
material = "scripts/apply-settings.sh, scripts/setup-project-memory.sh, scripts/setup-ccgram.sh, scripts/session-isolate.sh, scripts/lib/config-root.sh, scripts/lib/config_root.py, scripts/tests/"
means = "developer spawn dispatched via the agentctl spine (executor spawn:developer, the engine vocabulary — fixed in the 2026-07-02 replan); pytest; existing config-root resolvers as the single source of truth"
method = "source lib/config-root.sh (or import config_root.py) in each script; replace hardcoded defaults, keep env overrides and add legacy-path fallback/migration where existing installs depend on the old location; extend tests with tmp-HOME fixtures asserting isolated placement and zero old-root writes; verification anchors on the positive default assignments (not a blanket negative grep, which would falsely match the intentional legacy-migration references)"
conditions = "All edited files are inside scripts/ — nothing outside the spawn sandbox is assigned to the spawn (lesson: 2026-07-02-spawn-sandbox-excludes-declared-stage-material); manager reviews diff before record-result. Replan 2026-07-02 changed executor labels only: All other plan content byte-identical; user approval already given for this content"
invariants = "CLAUDE_SETTINGS / CLAUDE_SETTINGS_LOCAL env overrides keep working; a legacy in-place install (no ~/.claude-agent) keeps working via the resolver's fallback order; no script deletes user data — legacy symlinks are re-pointed, real dirs left in place"
capability_required = "python3 + pytest in repo"

[stage.principle]
statement = "An installer must resolve the config root through one shared resolver, never inline a home path: every literal ~/.claude default is a latent split-brain that surfaces only after the root moves."
source = "This audit: apply-settings.sh's dead-root default already produced a live defect (AFK setting applied to the wrong root); setup-project-memory.sh's hardcode disconnected project memory on the remote host."
confidence = "high"
refutation = "A path that is intentionally root-independent (the personal Claude Code root when the harness is not isolated) may legitimately reference ~/.claude — such mentions must be explicit, not a silent default."

[[stage]]
index = 2
title = "agentctl/scope/plan state under the isolated root (F3) + migration"
executor = "spawn:developer"
expected_result_image = "store.py DEFAULT_ROOT, cli.py GATE_LOG, registry.py DEFAULT_SCOPES_DIR resolve via config_root.py to $CLAUDE_AGENT_HOME/agentctl/...; exempt_paths.py recognizes plan artifacts under BOTH <agent-home>/plans/ and the legacy ~/.claude/plans/; migrate-to-isolated.sh (or a small dedicated step it calls) moves existing ~/.claude/agentctl/* and ~/.claude/plans/* into the isolated root; tests updated (registry/store/exempt_paths/gate tests parameterized over the resolved root). After migration this session's engine state is still found (agentctl status returns the current task)."
criterion_type = "measurable"
done_criterion = "Full scripts test suite passes; after running the migration on this Mac, agentctl still reports session state and the old dirs are empty/absent"
verify_command = "bash -c 'cd /Users/the0/claude-agent-instructions/scripts && python3 -m pytest tests/ -q'"
expected_exit = 0
material = "scripts/agentctl/store.py, scripts/agentctl/cli.py, scripts/agentctl/exempt_paths.py, scripts/session_scope/registry.py, scripts/migrate-to-isolated.sh, scripts/lib/config_root.py, scripts/tests/"
means = "developer spawn (scripts/ sandbox); pytest; config_root.py resolver"
method = "add an agent-home-resolved state root helper in config_root.py; thread it through store/cli/registry defaults; widen exempt_paths plan detection to both roots; extend migrate-to-isolated.sh to relocate agentctl state + plans; adjust affected tests; manager (not the spawn) runs the live migration on this Mac after review"
conditions = "Spawn edits only scripts/; the live migration run and any doc edits are the manager's steps, not the spawn's; migration is copy-then-verify-then-remove (never a bare move that can lose state)"
invariants = "The prewrite gate never opens up: during any transition window the gate must read whichever root holds the session state (legacy fallback read), so a half-migrated machine fails closed, not open; hook scripts stay fail-open as documented"
capability_required = "python3 + pytest in repo"

[stage.principle]
statement = "State a coordination engine reads to decide whether a write is allowed must fail closed across a root move: during any transition the gate reads whichever root holds the session state, never 'new root empty, therefore no gate'."
source = "This stage's design: the prewrite gate's state lookup moves roots; a naive cutover would make every half-migrated machine gate-less."
confidence = "high"
refutation = "If the gate were advisory rather than a security/consistency boundary, fail-open during migration would be acceptable."

