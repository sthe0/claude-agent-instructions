index = 3
title = "Prose/docs/leaf refresh to the isolated root (F7)"
executor = "in_thread"
expected_result_image = "CLAUDE.md, docs/operations/cross-session-scope-isolation.md, memory-global/leaves/system-knowledge/instructions-repo-layout.md (and any other doc naming ~/.claude/agentctl, ~/.claude/plans, ~/.claude/projects for system-owned state) updated to the isolated-root paths; instructions-repo-layout leaf re-verified (last_verified bumped) against the post-stage-2 reality"
criterion_type = "measurable"
done_criterion = "grep over CLAUDE.md + docs/ finds no reference to ~/.claude/agentctl or ~/.claude/plans as the live location"
