expected_exit = 0
material = "CLAUDE.md, docs/operations/*.md, memory-global/leaves/system-knowledge/instructions-repo-layout.md"
means = "manager in-thread edits (files already read this session)"
method = "sweep grep for old-root system paths; rewrite each to $CLAUDE_AGENT_HOME/... or ~/.claude-agent/..., keeping explicitly-historical mentions marked as legacy"
conditions = "runs after stage 2 lands so prose describes shipped reality"
invariants = "English-only repo text; no behavioral rule changes — path prose only"
capability_required = "none beyond repo write"

[stage.principle]
statement = "Documentation that names live system paths must be swept in the same task that moves the paths — stale path prose actively misleads (it caused the agent's own wrong-root settings mistake this session)."
source = "This session: CLAUDE.md/docs referencing ~/.claude led the agent to apply a setting to the dead root."
confidence = "high"
refutation = "Historical/changelog text describing the old layout as history is exempt — only present-tense location claims must move."

