[meta]
task_id = "complete-config-root-isolation"
goal = "Finish the config-root isolation the prior task started: it moved the install/write side to $CLAUDE_AGENT_HOME (~/.claude-agent) but left runtime readers/resolvers/verifiers hardcoding ~/.claude, several of which now break on a migrated machine (specialist spawning, agent-identity channel resolution, verify checks). Route every runtime config-root reader through one resolver, fix the readers, refresh stale docs."
done_criterion = "On the migrated machine (~/.claude-agent is the system root): (1) `scripts/verify-agentctl.py` passes; (2) `bash scripts/verify-layout-contract.sh` exits 0; (3) a specialist spawn resolves its SKILL.md from the system root; (4) `scripts/difficulty_channel/authority.py` reads the configured channel from ~/.claude-agent/agent-identity.local, not the ~/.claude default; (5) `python3 -m pytest scripts/tests/` green. Lands on branch isolate-agent-config-root together with the already-committed hook fix dfc5a94."
criterion_type = "measurable"
weight_class = "substantive"
repo_root = "/Users/the0/claude-agent-instructions"
external_research = "Not warranted: entirely an internal-consistency fix within this repo's own scripts. The reused mechanism (a single config-root resolver) already exists in shell form at scripts/lib/config-root.sh with tests in scripts/tests/test_config_root.py; this task adds the Python analog and applies the same discipline to readers. No external library or non-obvious best practice is involved; the design is grounded in the repo's own established resolver+structural-audit-test pattern."

# ─────────────────────────────────────────────────────────────────────────────
# EXECUTOR NOTE (read before dispatch): specialist spawning is BROKEN on this
# machine until Stage 2 lands (bug A — spawn-specialist.py resolves skills under
# ~/.claude/skills, which post-migration is empty of system skills). Therefore
# the bootstrap stages 1–2 run manager IN-THREAD after plan approval; once
# Stage 2 restores skill resolution, stages 3–6 may be spawned to developer
# (or continued in-thread at the user's discretion). This ordering is itself the
# removal of the difficulty "the tool that repairs the system cannot run because
# the system is broken".
# ─────────────────────────────────────────────────────────────────────────────

[[stage]]
index = 1
title = "Introduce a Python config-root resolver (service — mirrors config-root.sh)"
executor = "manager-in-thread"
expected_result_image = "Importing scripts/lib/config_root.py exposes agent_home()/skills_dir()/identity_file() returning the isolated root when CLAUDE_AGENT_HOME or CLAUDE_CONFIG_DIR is set or ~/.claude-agent exists, and ~/.claude only as the non-isolated fallback; new pytest cases in test_config_root.py cover default/env-override/CLAUDE_CONFIG_DIR/legacy-fallback and pass."
criterion_type = "measurable"
done_criterion = "pytest for the new resolver module passes"
verify_command = "python3 -m pytest scripts/tests/test_config_root.py -q"
expected_exit = 0
depends_on = []
output_artifacts = ["scripts/lib/config_root.py", "scripts/tests/test_config_root.py"]
material = "scripts/lib/config-root.sh exists (shell resolver, CLAUDE_AGENT_HOME only). No Python analog exists — readers each hardcode Path.home()/'.claude'."
means = "The existing config-root.sh contract + the structural-audit-test idiom already in test_config_root.py."
method = "Add scripts/lib/config_root.py with: agent_home() -> Path resolving env CLAUDE_CONFIG_DIR, else env CLAUDE_AGENT_HOME, else ~/.claude-agent if it exists, else ~/.claude (legacy non-isolated fallback); convenience skills_dir()=agent_home()/'skills' and identity_file() honoring env CLAUDE_AGENT_IDENTITY then agent_home()/'agent-identity.local'. Keep it dependency-free (pathlib+os). Add pytest cases mirroring the shell resolver tests (default -> ~/.claude-agent when it exists; CLAUDE_AGENT_HOME override; CLAUDE_CONFIG_DIR override; legacy fallback to ~/.claude when neither env set nor ~/.claude-agent present)."
conditions = "python3 available; tests use tmp HOME/env like the existing suite."
invariants = "Resolver never raises on a missing root; a non-isolated machine (no ~/.claude-agent, no env) still resolves ~/.claude so pre-migration installs keep working."
capability_required = "Python; familiarity with the existing resolver contract (developer-level, done in-thread as bootstrap)."

[stage.principle]
statement = "One resolver owns config-root location; every reader calls it instead of hardcoding a path — the rule part (where is the root) is determinized in a single structural home."
source = "scripts/lib/config-root.sh precedent + CLAUDE.md 'determinize the rule at its proper structural level'."
confidence = "high"
refutation = "Would fail only if different artifacts legitimately lived under different roots with no single answer; here install-artifacts share one root."

