means = "Agent (sonnet, web search), Skill destinations, Skill ground-transport"
method = "spawn 5 sonnet research sub-agents in parallel (A events, B walks/spots, C water, D day-trips, E Moscow↔SPb transit), each seeded with the specialization tactics; collect into research/ md files"
conditions = "web reachable; dates within ~2 weeks so recency matters"
invariants = "each non-trivial fact sourced+dated; anti-Atlas-Obscura-effect (prefer low-audience/local sources); name crowd/season risks explicitly; no guidebook top-10 passed off as a find"
capability_required = "domain web research with source discipline"

[stage.principle]
