done_criterion = "journeys/spb-2026-07/ exists with a non-template trip.md, a decision.md, and ≥1 alternative (a-slow) carrying a day-by-day itinerary.md + options.md; INDEX.md has the row; the plan is grounded in dated web research (events, local spots, water, окрестности, lodging), each non-trivial fact sourced; user accepts the itinerary on review"
criterion_type = "acceptance-review"
weight_class = "substantive"
repo_root = "/Users/the0/projects/trips"
external_research = "REQUIRED and central — the whole value is dated, non-guidebook, event-and-season-sensitive research (July 2026 concert/festival calendar, local-loved spots vulnerable to staleness, boat-charter operators, drivable day-trips, boutique lodging availability). Done inline via web search + delegated to sonnet sub-agents to keep the main thread lean."

