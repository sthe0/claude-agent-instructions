done_criterion = "four briefs returned, each with dated sources, non-trivial (not the guidebook top-10), season/crowд flags noted; enough to choose a week window and build a slow itinerary"
depends_on = [1]
output_artifacts = ["journeys/spb-2026-07/research/ (events.md, local-spots.md, water.md, day-trips.md)"]
