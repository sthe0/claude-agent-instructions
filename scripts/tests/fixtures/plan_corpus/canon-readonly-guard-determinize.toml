[meta]
task_id = "canon-readonly-guard-determinize"
goal = "Make it as deterministically impossible as the enforcement surface allows to edit the canonical Core checkout (~/claude-agent-instructions) from a live agent session — a user requirement after the coordinator edited canon reasoning 'no hook is wired, so it's allowed'. The enforcing mechanism hook-guard-canon-readonly.py already exists and provably DENIES Edit/Write/git-commit in the primary Core worktree (verified: canon edit->deny, worktree edit->allow, git commit in canon->deny). Two gaps: (G1 application) the guard is declared in install-reminder-hooks.sh (correct + idempotent, both Edit|Write and Bash chains, lines 76-77) but that installer only runs via setup-symlinks INSIDE sync pull's maybe_migrate_isolated() legacy-migration branch — never on a normal pull for an already-set-up machine — so any hook added after onboarding (the canon guard, commit 6fdc4d5) stays dead in live ~/.claude-agent/settings.json and nothing detects the absence. (G2 coverage) the guard's Bash branch only denies literal `git commit`; every other Bash in-place write into canon (sed -i, >>, tee, cp/mv dest, patch, git apply) bypasses it, so 'deterministically impossible' overreaches. Work: (B1) EXTEND the guard's Bash branch to best-effort deny common write verbs targeting a canon path, with an explicitly NAMED residual (interpreter one-liners like `python3 -c open(...,'w')` / `perl -e` cannot be deterministically detected and are documented, not claimed closed). (P1) wire the guard into live settings now (immediate Edit/Write guarantee), and make the apply-trigger recur (sync pull re-runs install-reminder-hooks after an applied pull, idempotent + fail-open). (P2) add a fail-loud SessionStart detector that the canon guard is wired in both live chains, closing the whole 'versioned-but-not-applied' class rather than only this instance."
done_criterion = "The guard's Bash branch denies not only `git commit` but also common in-place write verbs (sed -i, >>/>, tee, cp/mv dest, patch, git apply) whose target resolves under a canon root, while ALLOWING the same into a worktree; the residual (interpreter one-liners) is named in a hook comment and in this plan's honesty note, not claimed closed. Live ~/.claude-agent/settings.json wires hook-guard-canon-readonly.py in BOTH the PreToolUse Edit|Write and Bash chains, with the command pointing at the canonical scripts dir (not a cai-wt- worktree), so a real Edit into ~/claude-agent-instructions is DENIED and an Edit into a worktree is ALLOWED. sync-instructions-repo.sh re-runs the hook installer after an applied pull (idempotent, fail-open, env-seamed for tests). A new fail-loud SessionStart check reports when the canon guard is NOT wired in both live chains. All new behavior is covered by tests; verify-all.py stays green and the full pytest suite passes; committed on the worktree branch. Measurable gates resolution; the user gives final acceptance on review (an Edit AND a `sed -i` into canon are refused)."
criterion_type = "measurable"
weight_class = "substantive"
repo_root = "/Users/the0/cai-wt-canonguard"
external_research = "none"

[[stage]]
index = 1
title = "Wire the canon guard into live settings now (immediate Edit/Write guarantee) + empirically probe mid-session hot-reload"
executor = "in_thread"
expected_result_image = "Running the CANONICAL installer with CLAUDE_INSTRUCTIONS_REPO pinned to /Users/the0/claude-agent-instructions (so SCRIPTS_DIR = $REPO/scripts resolves to canon, never the temporary worktree) wires hook-guard-canon-readonly.py into live ~/.claude-agent/settings.json in BOTH the PreToolUse Edit|Write and Bash chains (both are declared, lines 76-77), idempotently. The verify then asserts, on the live file: the guard command is present in BOTH chains, every wired guard command contains '/Users/the0/claude-agent-instructions/scripts' and NO 'cai-wt-' path, and the guard BINARY, piped a real Edit payload, DENIES a canon file_path and ALLOWS a worktree file_path. IMMEDIACY IS NOT ASSUMED: PreToolUse hooks are loaded at session start, so wiring live settings mid-session MAY NOT protect THIS running session. I empirically probe it in-thread (attempt a real Edit into a canon scratch file /Users/the0/claude-agent-instructions/.canon-canary after wiring) and record the honest boundary: if the running session hot-reloads, Edit/Write enforcement is immediate; if not, it begins at the NEXT session start and the durable point is P2's detector + the next start. This stage mutates ONLY live settings (gate-exempt live config) and edits NO repo file. The installer also re-adds any other canonical hooks currently missing from live settings — its intended wholesale, idempotent job (it will re-add hooks a user may have intentionally removed; noted for transparency); the set actually wired is reported."
criterion_type = "measurable"
done_criterion = "live settings.json contains hook-guard-canon-readonly.py in BOTH the Edit|Write and Bash PreToolUse chains, every wired guard command points at the canonical scripts dir (no cai-wt-), and the guard binary denies a piped canon Edit payload while allowing a worktree one"
verify_command = "CLAUDE_INSTRUCTIONS_REPO=/Users/the0/claude-agent-instructions bash /Users/the0/claude-agent-instructions/scripts/install-reminder-hooks.sh && python3 -c \"import json; d=json.load(open('/Users/the0/.claude-agent/settings.json')); G=d['hooks']['PreToolUse']; cmds=lambda kw:[h.get('command','') for g in G if kw in (g.get('matcher','') or '') for h in g.get('hooks',[])]; ew=cmds('Edit'); ba=cmds('Bash'); gk='hook-guard-canon-readonly.py'; assert any(gk in c for c in ew), 'guard missing from Edit|Write chain'; assert any(gk in c for c in ba), 'guard missing from Bash chain'; allc=[c for c in ew+ba if gk in c]; assert all('/Users/the0/claude-agent-instructions/scripts' in c for c in allc), 'guard not pointing at canonical scripts dir: '+str(allc); assert all('cai-wt-' not in c for c in allc), 'guard points at a worktree: '+str(allc); print('WIRING_OK')\" && python3 -c \"import subprocess,sys,json; g='/Users/the0/claude-agent-instructions/scripts/hook-guard-canon-readonly.py'; mk=lambda p: json.dumps({'tool_name':'Edit','tool_input':{'file_path':p}}); run=lambda p: subprocess.run([sys.executable,g],input=mk(p),capture_output=True,text=True).stdout; dn=run('/Users/the0/claude-agent-instructions/CANARY'); al=run('/Users/the0/cai-wt-canonguard/CANARY'); assert 'deny' in dn.lower(), 'canon Edit NOT denied: '+dn; assert 'deny' not in al.lower(), 'worktree Edit wrongly denied: '+al; print('GUARD_OK')\" && echo GATE_OK"
expected_exit = 0
depends_on = []
output_artifacts = []
material = "the canonical install-reminder-hooks.sh (declares the guard in both chains, lines 76-77, idempotent line 147); live ~/.claude-agent/settings.json; the guard binary hook-guard-canon-readonly.py"
means = "Bash (run installer), python (assert wiring + pipe guard payloads), Edit (canon-canary hot-reload probe)"
method = "run the canonical install-reminder-hooks.sh with CLAUDE_INSTRUCTIONS_REPO pinned to canon so the wired command resolves to the canonical scripts dir; assert the guard is present in BOTH the Edit|Write and Bash live chains and points at canon (no cai-wt-); pipe a canon and a worktree Edit payload to the guard binary and assert deny/allow; then empirically attempt an Edit into a canon scratch file to observe whether the running session hot-reloads the new hook, and record the honest enforcement boundary either way; report the full set of hooks the installer wired"
conditions = "the guard is declared in both chains in the canonical install-reminder-hooks.sh (confirmed lines 76-77); the installer is idempotent (confirmed line 147); running a script from canon is a READ (allowed) and writing ~/.claude-agent/settings.json is live config (gate-exempt); this stage wires the CURRENT guard — the extended Bash-write coverage from stage 2 goes live only after landing + a re-run installer (stated in stage 2/3)"
invariants = "edit NO repo file in this stage except the throwaway /Users/the0/claude-agent-instructions/.canon-canary probe target, which if the guard is active will itself be DENIED (that denial IS the positive signal) and otherwise must be removed after probing (live-settings + probe only); the wired hook command must point at the canonical scripts dir, never the temporary worktree; do not hand-edit settings.json (go through the installer); state the hot-reload boundary honestly rather than asserting immediate whole-surface protection; report what was wired"
capability_required = "bash + python"

[stage.principle]
statement = "The immediate Edit/Write guarantee is delivered by applying the already-correct, already-declared mechanism to live state — run the existing idempotent installer (REPO pinned to canon) rather than hand-editing settings — and its immediacy for the RUNNING session is verified, not assumed"
source = "install-reminder-hooks.sh declares the guard in both chains (lines 76-77) and is idempotent (line 147); SCRIPTS_DIR is derived as $REPO/scripts from CLAUDE_INSTRUCTIONS_REPO (default $HOME/claude-agent-instructions), so pinning REPO to canon guarantees a canonical command path; PreToolUse hooks load at session start, so mid-session application may not bind to the live session"
derivation = "The mechanism and its declaration already exist and are correct; the only missing act is application to live settings. The installer is the authoritative, idempotent applier, so running it (REPO pinned to canon) is the minimal honest way to make the guarantee real without a hand-maintained divergence. Because hook loading is session-start-bound, the plan probes rather than asserts mid-session immediacy, and leans on P2 + the next session start for the durable guarantee."
confidence = "high"
refutation = "if install-reminder-hooks.sh derived SCRIPTS_DIR from something other than $REPO (so pinning CLAUDE_INSTRUCTIONS_REPO would not force a canonical command path), the verify's 'no cai-wt- / must contain canonical scripts dir' assertions would catch a wrong path and fail the stage"

[[stage]]
index = 2
title = "Extend the guard's Bash branch to deny canon writes (B1) + pull re-applies hook wiring (P1b) + fail-loud SessionStart canon-guard-wired detector (P2) + tests"
executor = "spawn:developer"
expected_result_image = "In the worktree /Users/the0/cai-wt-canonguard: (B1) hook-guard-canon-readonly.py's Bash branch is extended from 'deny only literal git commit' to also best-effort DENY common in-place write verbs whose resolved target path lands under a canon root: sed -i, output redirection >/>> to a canon path, tee canon-path, cp/mv with a canon destination, patch (default/-i/-p targeting canon), git apply into canon. Detection mirrors the existing tokenized _is_git_commit style and reuses the canon-root resolution already in the file; it is fail-open (unparseable command -> allow, never crash) and ALLOWS the identical verbs targeting a worktree path. A hook comment NAMES the residual honestly: interpreter one-liners (python3 -c / perl -e / eval'd strings / any program that opens a path for writing internally) CANNOT be deterministically detected and are out of scope. (P1b) sync-instructions-repo.sh, on a pull that APPLIED commits (the same reconcile path where the integrity gate already runs, NOT on behind==0), re-runs the hook installer (invoked with CLAUDE_INSTRUCTIONS_REPO=\"$REPO\") so hooks added after onboarding reach live settings automatically — idempotent, fail-open (a failure WARNs but never aborts the pull), env-seamed (e.g. CLAUDE_INSTALL_HOOKS_BIN) so tests can stub it. (P2) a new fail-loud SessionStart hook (hook-canon-guard-wired-check.py) reads live ~/.claude-agent/settings.json and, if hook-guard-canon-readonly.py is NOT present in BOTH the Edit|Write and Bash chains — OR is present but its resolved command path does not exist on disk (os.path.exists, catching a wired-but-broken worktree path) — emits a loud, unmissable stderr message naming the exact remediation (run install-reminder-hooks.sh); non-blocking and fail-open on any error; itself wired into install-reminder-hooks.sh's DESIRED list under SessionStart. New tests cover: (a) the guard denies each new canon write verb and allows it into a worktree, is fail-open on garbage, and still allows non-write Bash; (b) sync pull re-runs the installer after an applied pull and skips it on an up-to-date pull, fail-open on installer failure; (c) the detector is silent when the guard is wired in both chains with existing paths and warns loudly when absent or path-missing. All edits confined to the worktree; the canonical checkout stays untouched."
criterion_type = "measurable"
done_criterion = "the new/updated pytest files pass in the worktree: the guard denies canon sed -i/>>/tee/cp/patch/git-apply and allows them into a worktree and is fail-open on garbage; sync pull's applied-commit path invokes the installer seam and skips on behind==0; the detector warns iff the guard is absent from either live chain or its path is missing"
verify_command = "cd /Users/the0/cai-wt-canonguard && python3 -m pytest scripts/tests/test_guard_canon_bash_writes.py scripts/tests/test_sync_pull_rewires_hooks.py scripts/tests/test_canon_guard_wired_check.py -q && echo GATE_OK"
expected_exit = 0
depends_on = [1]
output_artifacts = ["scripts/hook-guard-canon-readonly.py", "scripts/sync-instructions-repo.sh", "scripts/hook-canon-guard-wired-check.py", "scripts/install-reminder-hooks.sh", "scripts/tests/test_guard_canon_bash_writes.py", "scripts/tests/test_sync_pull_rewires_hooks.py", "scripts/tests/test_canon_guard_wired_check.py"]
material = "hook-guard-canon-readonly.py Bash branch (_is_git_commit tokenizer + canon-root resolution, lines ~92-104,168-179); hook-guard-destructive-rm.py as a sibling tokenized-Bash-deny template; sync-instructions-repo.sh applied-pull integrity-gate insertion point (~line 232, after behind==0 early return); install-reminder-hooks.sh DESIRED list; a new SessionStart detector hook; new test files"
means = "Edit, Write, Bash (pytest)"
method = "in the worktree: (B1) extend hook-guard-canon-readonly.py's Bash branch with a best-effort _is_canon_bash_write helper covering sed -i/redirection/tee/cp/mv/patch/git-apply targeting a resolved canon path, reusing the file's canon-root resolution, fail-open, and add an honest residual comment; (P1b) add an env-seamed install-reminder-hooks invocation (CLAUDE_INSTRUCTIONS_REPO=\"$REPO\") to sync-instructions-repo.sh's applied-pull path, fail-open, mirroring the integrity-gate helper's style; (P2) write hook-canon-guard-wired-check.py (reads live settings, checks the guard in BOTH chains and that its command path exists, loud stderr + fail-open, never blocks), register it under SessionStart in install-reminder-hooks.sh; author the three test files"
conditions = "stage 1 done (current guard live); the integrity-gate applied-pull path exists in sync-instructions-repo.sh (confirmed); install-reminder-hooks.sh idempotent by basename (confirmed); the guard already resolves canon roots for the Edit/Write path (reuse that for Bash)"
invariants = "all edits confined to the worktree /Users/the0/cai-wt-canonguard; the canonical checkout stays read-only; the guard's new Bash-write detection is FAIL-OPEN (unparseable -> allow, never crash) and must ALLOW the same verbs into a worktree; the honest residual (interpreter one-liners uncloseable) is NAMED in a hook comment, never papered over; P1b is fail-open (pull rc unaffected) and runs only on an applied pull (not behind==0); P2 is non-blocking and fail-open (SessionStart cannot hard-block) and checks BOTH chains + path existence; both new mechanisms are env-seamed/hermetic in tests; English-only; no behavior change to fetch/rebase/merge logic or to the existing Edit/Write/git-commit deny paths"
capability_required = "bash + python + pytest"

[stage.principle]
statement = "Push determinism as far as the enforcement surface allows AND name what remains: extend the guard to the detectable Bash-write verbs, close the application/detection class (P1b+P2), and honestly document the interpreter-one-liner residual rather than claiming full impossibility"
source = "user requirement 'насколько возможно детерминированно'; the observed application gap (installer runs only on legacy migration) and coverage gap (Bash branch only catches git commit); hook-guard-destructive-rm.py precedent for tokenized best-effort Bash deny"
derivation = "A tool-level gate (Edit/Write) plus a tokenized best-effort Bash-write deny covers every write path an agent normally uses, and P1b+P2 guarantee the guard is actually live and self-checked. But arbitrary interpreters can open a file for writing without a detectable verb, so no PreToolUse hook can make canon writes truly impossible; the honest maximum is 'deny all detectable write surfaces + fail-loud detection + a named residual', which is what this delivers."
confidence = "high"
refutation = "if the harness exposed a deterministic pre-write filesystem gate (path-level, tool-agnostic) we could close the interpreter residual too and the 'named residual' framing would be unnecessarily weak"

