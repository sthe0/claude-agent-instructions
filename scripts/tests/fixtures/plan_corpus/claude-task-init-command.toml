index = 4
title = "Hermetic tests for --init (tests-accompany-code)"
executor = "spawn:developer"
expected_result_image = "test-enter-task.sh and test-launchers.sh exit 0 with new --init dry-run + stubbed-real assertions."
criterion_type = "measurable"
done_criterion = "both hermetic test scripts exit 0"
verify_command = "bash scripts/project_entry/tests/test-enter-task.sh && bash scripts/project_entry/tests/test-launchers.sh"
expected_exit = 0
depends_on = [3]
output_artifacts = ["scripts/project_entry/tests/test-enter-task.sh", "scripts/project_entry/tests/test-launchers.sh"]
material = "scripts/project_entry/tests/test-enter-task.sh and test-launchers.sh: hermetic harnesses with GIT_BIN/GH_BIN stubs + temp plugin dir."
means = "The existing *_BIN stub harness; CLAUDE_SETUP_PROJECT_MEMORY_BIN, CLAUDE_PROJECTS_LOCAL_DIR, CLAUDE_PROJECT_INIT_BASE seams to keep the run hermetic."
method = "Extend GIT_BIN stub to handle init/add/commit. Add to test-enter-task.sh a dry-run case (asserts target dir final line, no init/commit in git-calls log, no registry record) and a stubbed-real case (asserts git init+commit called, memory-setup stub ran, CLAUDE_PROJECTS_LOCAL_DIR/demo/agent-project.json exists with workspace_path=<base>/demo). Add to test-launchers.sh a CLAUDE_LAUNCH_DRYRUN case asserting `enter=<tmp>/demo profile=default` and a --help mentions --init assertion."
conditions = "No real git/gh/.claude/registry touched; all via seams."
invariants = "Tests exit 0 on all-pass matching existing harness convention; no real external state mutated."
capability_required = "Bash test-harness authoring with stub seams (developer)."

[stage.principle]
statement = "Every code change ships with tests; hermetic *_BIN seams are this repo's established pattern for entry-subsystem tests."
source = "memory-global/leaves/tests-accompany-code.md + existing test-enter-task.sh / test-launchers.sh."
confidence = "high"
refutation = "None."

