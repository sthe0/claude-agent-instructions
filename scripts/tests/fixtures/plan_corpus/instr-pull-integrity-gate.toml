[stage.principle]
statement = "Determinize a decidable norm structurally (wire the check into the pull command) rather than as prose the model may forget; fail-open so an integrity signal never strands the user without updated instructions"
source = "CLAUDE.md root principle 'Separate rule from perception; determinize the rule at its proper structural level'"
derivation = "The norm 'run integrity checks after updating instructions' is fully decidable from an observable input (a pull applied commits) — it has no perception part — so it qualifies for structural mechanization. Placing it inside cmd_pull makes it fire deterministically on every applied pull regardless of which session/model triggers it, which prose cannot guarantee. Fail-open follows from the objective: a failed check is a signal to surface, not a reason to withhold the (already-applied) update."
confidence = "high"
refutation = "if the check materially slows every pull or blocks updates on benign failures, the structural placement is wrong"

