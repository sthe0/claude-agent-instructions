output_artifacts = ["origin/main advanced", "worktree removed"]
material = "green branch from stage 1; the uncommitted leaf edit in the canonical checkout"
means = "scripts/land-branch.py; git commit/push"
method = "land-branch.py --branch hook-prune-two-file (ff-only, ref-only); then commit the leaf edit and push."
conditions = "User confirmed landing into main; no other live session claims this tree"
invariants = "Fast-forward only — no hand-rolled checkout/reset/clean on the shared tree; the leaf edit is committed as authored by the earlier session, not rewritten"
capability_required = "push rights to origin/main (trunk push — user-confirmed)"

[stage.principle]
statement = "The terminal state is trunk, and branch deletion is part of landing, not a separate ask"
source = "CLAUDE.md § On task resolution; memory-global/leaves/landing-discipline.md"
derivation = "Work parked on a personal branch keeps decaying against trunk — this branch was already 16 commits behind after five days and two checks went red on the rebase alone, so every further day of parking adds reconciliation cost to the same two commits. Leaving the branch and its worktree in place after the fast-forward would leave a second tree claiming the same scope, which is the state that produced the read-only-canon and parallel-session conflicts this repo already guards against."
confidence = "high"
refutation = "if the branch were review-gated by a distinct human reviewer, it would need a PR instead of a fast-forward — this repo is sole-maintained and the branch already carries its independent code review from 2026-07-29"

