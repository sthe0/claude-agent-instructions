capability_required = "none beyond local repo access"

[stage.principle]
statement = "A branch lands green or does not land; a check that goes red on rebase is a real signal, not friction to route around"
source = "CLAUDE.md § verify the right axis"
derivation = "The two checks that went red are line-number and enumeration bookkeeping that only main's 16 intervening commits could invalidate, so they were green on the branch tip before the rebase and red after it — which is exactly the class of breakage a rebase is supposed to surface. Landing without re-running them would move a red tip onto trunk while every local signal still read green from the pre-rebase run."
confidence = "high"
refutation = "if a failure is red on main too, it is baseline and out of scope — attribute, do not fix under this task"

[[stage]]
index = 2
title = "Land onto main and commit the pending leaf edit"
executor = "in_thread"
expected_result_image = "land-branch.py fast-forwards main to the branch tip and removes the remote branch, local branch and worktree; the working-tree edit to memory-global/leaves/experience/2026-07-20-agentctl-premise-gate-...md (4 lines recording that 7b3a624 fixed the root cause) is committed on main; both are pushed; origin/main == local main."
