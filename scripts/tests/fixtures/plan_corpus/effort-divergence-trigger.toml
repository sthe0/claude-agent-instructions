executor = "spawn:developer"
material = "scripts/agentctl/README.md (the Nodes table's DIAGNOSING row, and a new section beside § Plugins / § Check venue); config.md's new rows from stage 2; scripts/verify-doc-concepts.py's registered-concept list."
