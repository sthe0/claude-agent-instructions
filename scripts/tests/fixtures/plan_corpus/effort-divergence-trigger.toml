[meta]
task_id = "effort-divergence-trigger"
goal = """
When a task's ACTUAL effort diverges from the CURRENT plan's re-derived ESTIMATE by a \
significant multiple, the agentctl engine must automatically enter the existing \
declare -> investigate -> critique -> replan difficulty cycle, on the reasoning that the \
chosen norm is visibly missing something essential about the real situation. Four scales: \
spend, count of user interactions, wall-clock, replan count. The terminal is ALWAYS \
diagnose -- never block-and-ask -- because the standing requirement behind the order is \
that the user stop having to supervise the agent, and a breaker that asks for permission \
reinstates exactly the supervision it was built to remove.
"""
