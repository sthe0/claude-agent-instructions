# ---------------------------------------------------------------------------
[[stage]]
index = 2
title = "Declare the estimate: optional `Actor.cost_tier`, dispatch wiring, and the constants in config.md"
executor = "spawn:developer"
material = "scripts/agentctl/plan.py (Stage/Actor parsing, `_SUBSTANTIVE_STAGE_FIELDS`, `stage_carry_key`, `stage_question_key`, `_structural_signature`), scripts/agentctl/state.py (the `Actor` dataclass at state.py:569-572 and `Stage.from_dict` at state.py:798-817), scripts/agentctl/cli.py::cmd_dispatch (`budget=getattr(args, 'budget', 'medium')` at cli.py:2169 and the `--budget` argparse default at cli.py:4034) and cli.py::_apply_refined_stage_fields (cli.py:214-231), scripts/agentctl/config.py::budget_usd, and config.md's constants table. The brief ASSUMED a per-stage cost tier already exists; it does not — the tier is a dispatch-time CLI argument, so today's plans declare no estimate at all."
means = "The schema-24 `verify_venue_at_final` precedent for a tolerant optional field (parse it, default None, contribute to no identity key unless declared, so every existing plan and every persisted SessionState loads byte-identically); config.md's existing constants table with its one-basis-sentence-per-row house style; config.py's existing tier->dollar lookup and its `substantive_wall_clock_min` property."
method = """
(a) Add `cost_tier: str | None = None` to the `Actor` dataclass (state.py:569), values \
small|medium|large, and parse it in plan.py beside `executor`. It goes on `Actor` \
DELIBERATELY, for two reasons: semantically the tier is a property of the actor's \
engagement, and mechanically `Stage.from_dict`'s grouped branch rebuilds this group by \
SPLAT (`Actor(**d["actor"])`, state.py:806) rather than by keyword, so the field persists \
across a state reload with no from_dict edit — whereas a top-level Stage field would be \
silently dropped by the enumerated keyword branch and every subsequent estimate would be \
computed from the default. Verify that splat claim in code before relying on it; if it \
does not hold, add the field to `from_dict` explicitly. Undeclared stays None so \
`stage_carry_key`, `stage_question_key` and `_structural_signature` stay byte-identical \
for plans that omit it.
(b) Add `cur.actor.cost_tier = refined.actor.cost_tier` to `_apply_refined_stage_fields` \
(cli.py:214-231), which copies a FIXED field set; without this a replan that changes a \
declared tier reaches neither the carry key (by design, (a)) nor the live `state.stages` \
that the re-derivation reads, and the estimate would silently keep the old tier.
(c) Wire dispatch on BOTH paths: change the `--budget` argparse default (cli.py:4034) from \
"medium" to None AND change `budget=getattr(args, "budget", "medium")` (cli.py:2169) to \
`getattr(args, "budget", None)`, then resolve `tier = args.budget or stage.actor.cost_tier \
or "medium"`. The getattr fallback is the one that actually binds for every in-process \
Namespace caller, so changing only the argparse default would leave the declared tier \
unconsulted on that path.
(d) Bump SCHEMA_VERSION 24 -> 25 UNCONDITIONALLY and stamp every field this plan adds \
(`Actor.cost_tier` here; `effort_estimate`, `effort_actuals`, `effort_baseline`, \
`effort_fires`, `user_prompt_count`, `session_started_ts`, `last_active_stamp` in stage 3) \
in the schema-history comment style state.py already uses for `verify_venue_at_final`/24, \
`plan_presentations`/20 and `code_reviews`/21. One bump covers both stages; stage 3 adds \
its fields under the same version.
(e) Add the constants to config.md, each with a basis sentence:
  effort-divergence-multiple = 5.0 -- the low end of the user's stated 5-10x band. Taking
    the low end is deliberate because the terminal is a diagnosis, not a refusal; the honest
    cost of a false positive is one full difficulty cycle (declare/investigate/critique/
    normalize/failure-address plus a fresh plan review, and if the replan is substantive, a
    user approval at PLAN_READY), while the cost of a false negative is the entire remaining
    overrun. 5x, not 2x, precisely because that cycle is not free.
  effort-stage-minutes-small = 10, -medium = 25, -large = 60 -- the wall-clock companions of
    the existing dollar telemetry labels (single-file work / multi-file-with-tests / cross-
    cutting). Like the dollar labels these are declared expectations, not measurements; the
    calibration data lands in the quality ledger (stage 4), which is the mechanism's own
    correction path.
  effort-replan-absolute = 3 -- the Rule of Three already recorded as the basis for
    principle-promotion-threshold: two replans may be ordinary refinement, a third
    establishes that the plan's model of the situation is recurrently wrong. This scale has
    NO ratio: a plan's intended replan count is structurally 0, so the multiple is undefined
    and the trigger is an absolute count. State that asymmetry in the row itself.
  NO numeric floor rows are added, and the row for effort-divergence-multiple must say why,
    because the brief asked for "an absolute floor" and this is a disclosed deviation. The
    floor exists to stop a tiny estimate turning noise into a fire; but each scale's estimate
    is bounded below by construction, and 5x of that lower bound already IS the floor the
    brief wanted: spend 1 x budget-small-usd -> $5.00; interactions 2 -> 10 prompts;
    wall-clock 10 min -> 50 ACTIVE minutes. A separate constant would either restate those
    numbers or contradict them. What replaces the floor is a NON-DEGENERACY rule: a scale
    whose estimate is 0 is INAPPLICABLE and never fires (it is also the division-by-zero
    guard). The idle cap the wall-clock actual needs reuses the existing
    substantive-wall-clock-min rather than adding a row.
(f) Add `scripts/tests/test_effort_declaration.py`: a plan omitting cost_tier produces \
identical carry/question/signature keys to today; a plan declaring it round-trips through \
`Stage.from_dict` unchanged; `_apply_refined_stage_fields` carries a changed tier; dispatch \
resolves flag > declaration > default on BOTH the argparse path and the in-process \
Namespace path.
"""
conditions = "Runs in the delivery worktree. config.md here is the REPO copy — the live `~/.claude-agent/config.md` is a symlink into the canonical checkout, outside this session's write scope, and is picked up automatically once the branch lands."
