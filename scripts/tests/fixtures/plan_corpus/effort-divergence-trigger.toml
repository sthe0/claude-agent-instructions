source = "memory-global/leaves/docs-accompany-architectural-change.md; and README § Check venue's own precedent of shipping an Honest limits paragraph beside every gate."
derivation = "The docs-accompany rule makes the read-first surface part of delivery for a coordination-model change; a trigger that moves the node by itself changes the coordination model as the coordinator experiences it, so the undocumented case is precisely the one where the coordinator's model and the engine's diverge — which is a difficulty the mechanism itself would then fire on."
