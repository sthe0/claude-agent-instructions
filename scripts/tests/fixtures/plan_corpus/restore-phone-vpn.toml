done_criterion = "user explicitly confirms Instagram works on the phone with the0.fun VPN on"
verify_command = "echo 'acceptance-review: user phone Instagram confirmation'"
expected_exit = 0
depends_on = [2]
output_artifacts = ["user-confirmation"]
