[meta]
task_id = "restore-phone-vpn"
goal = "Restore the0.fun so the phone VLESS/Reality client can reach Instagram again. Scope stops at phone Instagram working on the existing Xray setup; transport migration (xHTTP/Hysteria2) only if Reality-TCP is up but Instagram still fails."
done_criterion = "User confirms Instagram feed/Stories load on the phone with the0.fun VPN connected; measurable side-checks: 81.22.132.183:443 reachable from ≥1 foreign check-host node AND ssh the0.fun shows xray listening on :443/:8443"
criterion_type = "acceptance-review"
weight_class = "substantive"
repo_root = "/Users/the0/Projects/the0.fun"
external_research = "Prior turn: check-host TCP:443 and ICMP to 81.22.132.183 timed out from 10 countries (not RU-only). Topology from .claude/agent-memory/vpn_topology.md (Xray VLESS/Reality host process on :443/:8443, SERVA ONE NL). Mid-2026 TSPU behavioral detection of VLESS+REALITY-over-TCP documented (MegaV Feb/Jun 2026); kept as contingency only — phone previously worked on this Reality setup, so primary difficulty is the dead host."

[[stage]]
index = 1
title = "Bring the VPS back onto the network via Serva One"
executor = "in_thread"
expected_result_image = "81.22.132.183 answers again from outside RU: check-host TCP to :22 or :443 succeeds from ≥1 non-RU node; local curl/nc to the0.fun no longer times out. Cause identified from Serva One panel (powered off / suspended / unpaid / host crash) and corrected (power-on, reboot, pay, or support ticket)."
criterion_type = "measurable"
done_criterion = "check-host TCP result for 81.22.132.183:443 OR :22 shows at least one node without Connection timed out"
verify_command = "curl -sS -H 'Accept: application/json' \"https://check-host.net/check-result/$(curl -sS -H 'Accept: application/json' 'https://check-host.net/check-tcp?host=81.22.132.183:443&max_nodes=5' | python3 -c 'import sys,json;print(json.load(sys.stdin)[\"request_id\"])')\" | python3 -c 'import sys,json; d=json.load(sys.stdin) or {}; ok=any(isinstance(v,list) and v and isinstance(v[0],dict) and \"time\" in v[0] for v in d.values()); print(\"OK\" if ok else \"DOWN\"); raise SystemExit(0 if ok else 1)'"
expected_exit = 0
depends_on = []
output_artifacts = ["serva-panel-status-note"]
material = "dead VPS 81.22.132.183 (SERVA ONE AS199058); BGP still announces 81.22.132.0/24"
means = "Serva One control panel (user login); optional provider VNC/console; check-host + curl/nc for verification"
method = "User opens serva.one panel → check VPS power/billing/status → power on or reboot or open support ticket; agent re-probes reachability until foreign nodes succeed. Agent cannot log into Serva without credentials the user supplies or performs themselves."
conditions = "user can access Serva One account for this VPS; no IP change assumed (DNS already points at 81.22.132.183)"
invariants = "do not change DNS or buy a new VPS in this stage; do not touch Xray config yet; no sudo on a still-unreachable host"
capability_required = "Serva One panel access (user) + public reachability probes (agent)"

[stage.principle]
statement = "Restore L3/L4 reachability before diagnosing the VPN application — a process check is meaningless while the host blackholes packets worldwide"
source = "prior probe: 10/10 foreign nodes Connection timed out on :443; vpn_topology.md"
derivation = "Application-layer health (xray ps, Reality handshake) requires IP packets to arrive; with worldwide TCP/ICMP timeout the only actionable layer is host/power/billing/null-route at the provider."
confidence = "high"
refutation = "if foreign nodes succeed but RU still times out, switch hypothesis to TSPU IP block and replan (new IP / relay), do not keep rebooting"

[[stage]]
index = 2
title = "Confirm Xray VLESS/Reality is running on the restored host"
executor = "in_thread"
expected_result_image = "ssh the0.fun works; ps shows bin/xray-linux-amd64 -c bin/config.json; ss shows listeners on :443 and :8443. If xray is down after reboot, restart it the same way it was run before (host process as root — need sudo or existing root method the user provides)."
criterion_type = "measurable"
done_criterion = "ssh health one-liner prints xray present AND ports 443/8443 listening"
verify_command = "ssh the0.fun 'ps -eo args | grep -E \"[x]ray\" | head -1; ss -tlnp 2>/dev/null | grep -E \":443|:8443\"'"
expected_exit = 0
depends_on = [1]
output_artifacts = ["xray-health-snippet"]
material = "restored host; known topology: Xray host process (not systemd), ports 443/8443"
means = "ssh the0.fun (BindInterface en0 per ~/.ssh/config); ps/ss; optional sudo to restart xray"
method = "ssh health check from vpn_topology.md; if process missing, restart with user-approved root/sudo path; do not rewrite Reality config in this stage"
conditions = "stage 1 reachability OK; SSH keys still accepted; the0 has no passwordless sudo — root restart may need user password or panel console"
invariants = "do not edit bin/config.json; do not touch /home/nick; do not migrate transport yet"
capability_required = "ssh + (if restart needed) root/sudo path"

[stage.principle]
statement = "Verify the existing Reality listeners before changing protocol — phone clients already hold the old link"
