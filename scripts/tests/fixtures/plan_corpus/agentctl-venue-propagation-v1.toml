## Final verification
# 1. All three named regression tests pass in the canonical checkout; the three touched agentctl suites
#    stay green; scripts/agentctl/README.md states the invariant; scripts/verify-all.py passes.
# 2. _sync_venue_from_plan is present in scripts/agentctl/cli.py on BOTH origin/main and local main,
#    so the agentctl this session invokes from the canonical checkout is the fixed code.
# 3. Operational observable, checked by the PARENT plan and not by this gate: after pop-subplan,
#    `agentctl status` for the parent session resolves the delivery venue to
#    /Users/the0/claude-agent-instructions-hook-prune, and the re-dispatched parent stage 2 is
#    launched there rather than in the canonical checkout. That is the parent's stage-2 result, not
#    this sub-plan's done criterion, and it is what will falsify or confirm the one hypothesis this
#    diagnosis could not falsify by reading alone — that the harness sandbox follows the child's
#    launch directory rather than the session's original cwd.
#
# NOTE on vacuity disclosure, completed after the second review. `python3 scripts/verify-all.py` in
# final_check 1 also exits 0 today (hand-run at the canon: 18 checks passed), so it is vacuous on its
# own in the same way the three-suite pytest conjunct is. Both are retained deliberately as
# no-regression guards; the discriminating power of final_check 1 rests on the three node-ids and the
# `venue re-derivation` grep, which are false today. Recorded here so the disclosure is complete
# rather than partial.
#
# NOTE for the parent cycle, not this plan. `cmd_pop_subplan` overwrites the originating stage's
# `control` string, and `control` is a runtime attestation absent from the plan schema and NOT among
# the fields `_apply_refined_stage_fields` copies — so the overwrite is unrecoverable by any later
# replan, and its replacement text asserts something false about parent stage 1. Capture parent
# stage 1's `control` verbatim BEFORE running pop-subplan. It cannot be restored afterwards by any
# engine command: `cmd_record_result` acts only on `state.active_stage()` (cli.py:2242-2246) and
# `cmd_pop_subplan` sets `state.current_stage = None` (cli.py:3305), so after the pop there is no
# stage to record a control against. The remedy is therefore capture-and-re-state, not restore: keep
# the true attestation in the session record and re-state it verbatim in the parent's stage-1 result
# when reporting the parent plan's outcome.
#
# NOTE on the second final_check's `git fetch`. It performs a network action inside an instrument
# that verify-final re-runs. This is accepted deliberately: the fetch only refreshes the remote-
# tracking ref, its failure direction is fail-safe (a failed fetch fails the check rather than
# passing it vacuously), and without it the origin/main conjunct would assert a possibly stale
# local view of the remote. The same trade-off is made by the parent plan's stage 5.
