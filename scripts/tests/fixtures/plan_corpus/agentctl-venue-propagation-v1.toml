ild's own submit-plan refills them — with a comment stating that reason, so a future reader does not 'fix' it. scripts/agentctl/README.md gains a short statement of the resulting invariant containing the literal phrase `venue re-derivation`. Tests, three binding names: scripts/tests/test_replan.py gains `test_replan_refresh_delivery_worktree`, covering a replan that INTRODUCES [meta] delivery_worktree where the submitted plan had none, one that CHANGES it, and one that removes it — for the refinement, substantive and no_change diff kinds — asserting state.delivery_worktree matches the new plan each time and that repo_root keeps its existing correct behaviour. scripts/tests/test_subplan.py gains `test_pop_subplan_rederives_venue_from_plan`, covering: a parent whose live delivery_worktree was lost to None before the push still gets the plan-declared value back after pop; and a parent whose plan file is unreadable at pop time falls back to the frame values without raising. scripts/tests/test_check_venue.py — the suite that already owns venue behaviour — gains `test_approve_rederives_venue_from_edited_plan`, driving the engine's designed plan-review cycle end to end: submit a plan with no [meta] delivery_worktree, edit that same plan file IN PLACE at PLAN_READY to add one, approve, and assert state.delivery_worktree now matches the edited file and that resolve_check_venue(DELIVERY) returns it rather than repo_root."
