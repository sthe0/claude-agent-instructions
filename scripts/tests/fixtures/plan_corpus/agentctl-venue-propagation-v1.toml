[meta]
task_id = "agentctl-venue-propagation"
goal = "Service sub-plan for the parent plan prune-dangling-hook-references-v7. Its stage 2 could not run: agentctl dispatched the spawned developer into the read-only canonical checkout instead of the delivery worktree the plan declares, so the child refused all work and returned PERMISSION-REQUEST. Root cause, read from the code: state.repo_root and state.delivery_worktree are meant to be derived from the [meta] of state.plan_path, but only cmd_submit_plan sets both (cli.py:1358-1359). cmd_replan refreshes repo_root on BOTH its branches (cli.py:3091 refinement, cli.py:3116 substantive) and delivery_worktree on NEITHER; its no_change branch refreshes final_check for the in-place-edit case but no venue field at all; cmd_pop_subplan restores both from the PlanFrame snapshot (cli.py:3290-3291) rather than re-deriving them from the parent plan file, so a frame captured while the value was already lost keeps it lost; and — found by the first review of this sub-plan, not by the original diagnosis — _refresh_caches_from_plan_path (cli.py:232-273, called from cmd_approve:1862) is a FIFTH route with the same hole, and a strictly worse one: it re-loads the plan and refreshes state.final_check and every live stage's criterion fields INCLUDING verify_venue, while refreshing neither repo_root nor delivery_worktree. Its own docstring names the hazard in these very words — 'the gate attests to a plan it never actually executes' — and it is reachable by the engine's DESIGNED cycle (submit-plan -> present -> plan-review revise -> edit plan_path in place at the deliberately plan-mutable PLAN_READY -> present -> approve), which is exactly how a plan acquires a delivery_worktree it did not have at submit time. Plan v7 introduced delivery_worktree after submit-plan, reaching the session by replan, so the value never propagated and resolve_check_venue fell back to repo_root (state.py:1011). The engine gave no refusal and no warning at dispatch time. This reintroduces, through the replan route, exactly the venue asymmetry resolve_check_venue exists to remove."
done_criterion = "Every route that sets or re-reads state.plan_path re-derives state.repo_root and state.delivery_worktree from that plan's [meta] through one shared helper named _sync_venue_from_plan; a replan that introduces or changes [meta] delivery_worktree propagates it into session state, an approve that follows an in-place plan edit propagates it too, and a pop-subplan restores the parent's venue from the parent plan file rather than from a stale frame snapshot; all three properties are pinned by named regression tests; the agentctl README states the invariant; the change is landed on origin/main AND local main, so the canonical checkout this session invokes agentctl from is running the fixed code."
criterion_type = "measurable"
weight_class = "substantive"
repo_root = "/Users/the0/claude-agent-instructions"
delivery_worktree = "/Users/the0/claude-agent-instructions-venue-sync"
authored_against = "origin/main = 7d0b9e0. Every claim about the defect was read from that tree at authoring time, not recalled: cli.py:1356-1364 (submit_plan sets both fields), 3032-3075 (replan no_change branch: refreshes stage fields and final_check, no venue field), 3077-3100 (refinement: repo_root only), 3102-3124 (substantive: repo_root only), 3200-3264 (push_subplan: snapshots both into PlanFrame, then nulls both for the child, and resets state.stages to [] at 3252), 3267-3315 (pop_subplan: restores both from the frame, and unconditionally marks the originating stage PASSED at 3301), 232-273 (_refresh_caches_from_plan_path: refreshes final_check and every stage criterion field including verify_venue, refreshes neither venue field; its only caller is cmd_approve at 1862 — re-read and confirmed independently by the root after the first review raised it), 2095-2117 (dispatch pins the child cwd to resolve_check_venue(DELIVERY)), state.py:996-1011 (delivery_worktree or repo_root), plan.py:831-841 (both keys parse correctly from [meta] — the defect is propagation, not parsing)."
