plicit-manifest sweep across the FULL check inventory) returned the first PASS after seven consecutive revises. It classified all 19 CHECKS members plus the three manifests reachable only through scripts/tests/ and the one advisory hook — 15 rows with a per-row ground — and found NO undeclared class-4 obligation: the four the plan does incur (crutch_registry.toml regeneration, the scripts/README.md sentinel row, the MEMORY.md index row, the config-root allowlist row) are each declared and each bounded to what its verifier actually enumerates. Four rows round 7 had missed were cleared with evidence rather than by assertion: test_no_semantic_unguarded's _KNOWN_UNGUARDED_HARD_SINKS is keyed by path+scope and never by content, so stage 5's docstring edit cannot disturb id 6b802bd6c3ae8553; gen_crutch_registry's CODE_ID_OVERRIDES exist only to contradict a partition and the partition table ends in a catch-all, so no new .py file needs a hand-authored row; lint-prose-length's GOVERNED set excludes scripts/README.md, scripts/agentctl/README.md and every memory leaf; and rule-salience-report --check-registry's domain is CLAUDE.md alone, which this plan forbids editing. It also settled the last open question by reading CODE_SUFFIXES: doc scope for verify-config-root-refs is the COMPLEMENT of .py/.sh, so every new .py file falls to the code-side enumerator whose allowlist-reason widening stage 1 already declares — no second manifest is implicated by the new code. Its five non-blocking refinements are folded above (A the missing type: key — the only one that would have produced a guaranteed red; B the deliberate stage-5-before-stage-6 regeneration order; C the why-safe ground of 6b802bd6c3ae8553 going stale silently as stage 4 widens gates.py's import closure; D preserve the three doc-bound headings; E use --repin rather than hand-computing a pin's sha8). All five were independently re-verified on disk before folding, as every round's claims have been: ALLOWED_TYPES and its hard failure at verify-memory-index.py:196-197; a grep returning ZERO allowlist pins for agentctl/README.md, principles/ or crutch_registry.toml; verify-onboarding-entrypoint's TARGETS being the REPO-ROOT README, not scripts/README.md; and doc-bindings.json's top-level concepts key. Eight rounds, ~$23. STRUCTURAL NOTE for the root, not a plan defect: a plan-review pass cannot bind without a --plan-digest the REVIEWER computed from its OWN read, and a spawned thinker can neither Read this path nor run shasum on it — so in this configuration a pass verdict can never be honestly recorded, and the user's override is the only truthful exit from the gate. That is the SAME defect class as this task's subject: a gate whose prover cannot reach the evidence it is asked to attest to."

# TASK-WIDE INVARIANT — STAGE BEFORE YOU VERIFY. This repo's verifiers enumerate their
# domain from the GIT INDEX while reading file CONTENT from the working tree. Verified in three
# independent places: crutch-inventory._list_py_files goes through `git ls-files` (its own
# docstring: an untracked working-tree file "never enters the enumeration domain") while
# _collect_file does path.read_text; verify-memory-index enumerates leaves from the index;
# lint-hooks-executable skips its git-mode check entirely when _git_mode returns None, which is
# exactly the untracked case. The consequence is one-directional and silent: EDITS to tracked
# files are seen unstaged, but a BRAND-NEW file is invisible — so a verifier reports OK, the
# stage goes green, and the obligation surfaces only at `git add` time, when githooks/pre-commit
# runs verify-all.py --staged. Therefore: EVERY stage that creates a new file runs `git add` on
# it BEFORE running any verifier, and re-stages any artifact a generator rewrites — AND re-stages a
# file it edits AFTER staging it, because --staged mode (what pre-commit runs) validates the STAGED
# BLOB via `git show :path` while full mode reads disk, so a full-mode green over a stale index entry
# does not imply pre-commit green. Staging is not a one-time act; it tracks the last edit.
# WHAT THE INVARIANT DOES NOT DO: it closes the index-enumerated class only. A checker can be
# index-ENUMERATED yet manifest-SATISFIED — verify-config-root-refs is exactly that — and for those
# staging SURFACES the obligation without ever DISCHARGING it. Discharging is a hand-authored
# manifest edit (see stage 6's allowlist row). Never read 'the file is staged' as 'the check is met'. The trap is
# actively baited — verify-readme globs the FILESYSTEM, so the new script's README obligation
# reds while untracked, handing the executor false confirmation that new-file obligations are
# being caught while the index-scoped checks stay green.

[[stage]]
index = 1
title = "Add the missing primitive: the harness config root"
executor = "in_thread"
expected_result_image = "lib/config_root.py gains harness_config_root() and harness_settings_file(). harness_config_root() resolves $CLAUDE_CONFIG_DIR else ~/.claude — the CLI's OWN default — and deliberately does NOT probe for ~/.claude-agent the way agent_home() does, because that probe answers 'where do the system's artifacts live', a different question from 'which settings.json will the running CLI load'. The module docstring gains a short section naming the two roots, when they coincide (the claude-agent / claude-task launchers export CLAUDE_CONFIG_DIR=$CLAUDE_AGENT_HOME, so under those launchers the roots are identical) and when they diverge (bare `claude` on a migrated machine)."
criterion_type = "measurable"
done_criterion = "pytest covers: CLAUDE_CONFIG_DIR set -> both roots equal it; CLAUDE_CONFIG_DIR unset with ~/.claude-agent present -> agent_home() is ~/.claude-agent while harness_config_root() is ~/.claude (the divergence this whole task is about, pinned as a test); CLAUDE_AGENT_HOME set but CLAUDE_CONFIG_DIR unset -> the roots differ; harness_settings_file() is harness_config_root()/settings.json"
verify_command = "set -o pipefail && python3 -m pytest scripts/tests/test_config_root.py -q 2>&1 | tail -3 && python3 scripts/verify-semantic-gates.py"
expected_exit = 0
depends_on = []
output_artifacts = ["scripts/lib/config_root.py", "scripts/tests/test_config_root.py"]
material = "scripts/lib/config_root.py (172 lines, re-counted; agent_home() at line 34 with its documented 4-step resolution order, and 14 derived accessors built on it) and scripts/tests/test_config_root.py, which already has the env-scrubbing harness (_reload_env, plus the CLAUDE_CONFIG_DIR / CLAUDE_AGENT_HOME scrub lists at lines 61 and 257) these tests need. That module also guards literal legacy-root references: _PY_ROOT_TARGET_RE matches `Path.home() / \".claude\"` and _LEGACY_REF_ALLOWLIST already exempts scripts/lib/config_root.py with the reason \"the canonical legacy_home() accessor\" — so stage 1's new literal is covered, but that reason text becomes incomplete and must be widened to name the harness-root accessor too."
means = "Edit + pytest in the delivery worktree"
method = "Add the two functions beside agent_home(); do not touch agent_home()'s resolution order — every existing caller asking 'where do system artifacts live' is still correct, and re-pointing it would silently move engine state. The new function answers a different question and gets a different name."
conditions = "All edits in the delivery worktree; the canonical checkout stays read-only"
invariants = "agent_home() semantics are unchanged, byte-for-byte in behaviour — this stage is purely additive. harness_config_root() must NOT fall back to ~/.claude-agent: a fallback would re-introduce exactly the conflation being removed and would make the false-green in stage 3 unfixable."
capability_required = "none beyond local repo access"

[stage.principle]
statement = "A system that spans two roots cannot police itself until it can NAME each root separately"
source = "lib/config_root.py's own docstring — 'this module is the single structural home every Python reader calls instead of hardcoding the path'"
derivation = "The module was built to end path-hardcoding by giving readers one accessor. But it modelled ONE root while the machine has two, so every reader asking 'will this hook run' was silently answered with 'where do artifacts live'. The false green in hook-canon-guard-wired-check is that substitution made visible: it is not a coding slip, it is the only answer the vocabulary allowed. Adding the second accessor is what makes the remaining stages expressible at all."
confidence = "high"
refutation = "if the CLI ever resolved its settings root by the same ~/.claude-agent probe agent_home() uses, the two functions would be redundant — but the launchers explicitly export CLAUDE_CONFIG_DIR to force the system root, which is only necessary because the CLI does NOT probe"

