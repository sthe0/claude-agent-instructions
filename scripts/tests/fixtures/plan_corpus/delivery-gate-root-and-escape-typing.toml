method = "Add escape_reason to BOTH the dataclass (defaulted) and from_dict (via d.get) — the pair is the fix; either alone is the bug. Register --escape-reason in _ARG_DO_NOT_WRAP with its one-line why (an enum token, never a narrative path). For the inventory, do NOT claim to derive hatches from argparse by pattern alone — a pattern scan is a heuristic and calling it mechanical would repeat this task's own blind spot at a smaller scale. Instead declare _ESCAPE_HATCH_ARGS explicitly, mirroring the argv partition's proven shape, and make the pattern scan the REVERSE-direction test that catches an unregistered hatch, exactly as stage 2 does for the hook registry. THEN, IN THIS ORDER: `git add` every new .py file (escape-hatch-report.py, test_confirm_delivery.py, test_escape_hatch_report.py) FIRST, because the generator enumerates from the index and would otherwise be a SILENT NO-OP over exactly the files that need it; then run `python3 scripts/gen_crutch_registry.py`, never a hand-edit (the file's own header forbids it); then `git add scripts/crutch_registry.toml`. If any further .py file appears afterwards, re-run and re-stage — re-running over an unchanged tree reproduces a byte-identical registry (the generator's own docstring), so doing it more than once is free. This is not optional bookkeeping: crutch-inventory enumerates every git-tracked *.py under the root INCLUDING scripts/tests/ (verified: crutch_registry.toml is 16550 lines with 557 references to scripts/tests/), a scope becomes a site if it merely CONSTRUCTS OR REFERENCES A REGEX — no hard sink required — or if its name shares a token with {dispatch, route, spawn, suppress, emit, block, blocked, blockers, deny, select}, and verify-semantic-gates' MISSING condition has NO hard-sink filter: every enumerated site must carry a registry id. This stage's two new test modules do regex matching by construction, and escape-hatch-report.py's natural names in this repo's idiom (emit_*, select_*) are themselves in that token set — so new ids are minted here, and without the regeneration verify-semantic-gates (check 19 of 19) reds inside stage 6's verify-all, AFTER all six stages of work. New files need no per-entry authorship: they fall into existing partitions automatically (scripts/tests/** -> not-a-gate; scripts/lib/** and scripts/*.py -> structural). The new top-level script carries TWO obligations beyond its own code, both of which turn verify-all red if skipped and neither of which is obvious from the diff: a row in scripts/README.md's sentinel region (verify-readme.py globs scripts/*.py at the TOP LEVEL and diffs that set against the README — note the asymmetry that makes stage 2 clean: scripts/lib/hook_wiring.py is NOT globbed), and the executable bit BOTH on disk and in git's recorded mode (lint-hooks-executable.py covers every shebang-bearing script under scripts/, not only hook-*). Set the mode with git add --chmod=+x (the linter's own remediation string) if chmod alone leaves git's mode at 100644. Note the same index asymmetry applies here: lint-hooks-executable SKIPS the git-mode check when the file is untracked, so a green stage 5 does not prove 100755 in the index — the mode clause is unexercised until the file is staged, which is one more reason the staging step comes first."
conditions = "stage 4 available in the worktree"
invariants = "read_stamp stays fail-OPEN and must keep returning a usable stamp for the 3 override and 2 hook sidecars already on disk — a stricter reader would retroactively invalidate the only evidence this task is built on. --escape-reason is required for a HUMAN escape only and must never become settable by the hook path, preserving the '--by hook is reserved' boundary. The SOURCE_OVERRIDE branch in gates.py (which today validates only that `by` and `note` are non-empty) is deliberately NOT extended to require escape_reason — the 5 stamps already on disk predate the field and a stricter gate would retroactively invalidate the only evidence this task rests on; stated here so the executor does not 'fix' the apparent omission. The escape is also spelled without --escape-reason in hook-plan-delivery-gate.py's module docstring, which is documentation drift rather than a printed remedy — update it in the same pass. The enum is closed but 'other' exists: a closed set with no residual class silently pushes real cases into the nearest wrong bucket and corrupts the very counts the field exists to produce."
