[stage.principle]
statement = "An escape hatch without a typed reason is an untracked policy change: it silently becomes the normal path"
source = "this machine's own delivery-stamp population — 3 of 5 stamps are `override`, and no field records why"
derivation = "The escape was designed as a rare exception for a dead hook. It is in fact the majority path, and that fact was invisible for as long as the reason went unrecorded, because a free-text note is not aggregable. A typed reason turns each escape into a datum: 'hook_not_installed x N' is a work item, whereas N free-text notes are an archive nobody reads."
confidence = "high"
refutation = "if escapes were genuinely rare the enum would be overhead — the 3-of-5 measurement is what refutes that, and the report is what will show whether the ratio drops once stage 4 makes the real cause legible"

[[stage]]
index = 6
title = "P1: the norm, the docs, and the full verify"
executor = "in_thread"
expected_result_image = "A principle/v1 leaf states the escape-hatch norm induced from this task: an engine escape hatch must (i) stay reachable, or a fail-closed gate bricks the spine; (ii) be preceded by a diagnosis that distinguishes a missing PROOF from an absent PROVER, decided mechanically wherever the engine can observe it; (iii) record a typed reason, not only free text; (iv) be counted, with a standing report making the count visible. The leaf also carries the second norm this task induced, which is about VERIFIERS rather than escapes and generalizes past this repo: when a checker enumerates its domain from one source (the git index) while reading content from another (the working tree), new artifacts are invisible to it and it answers OK for the wrong reason — a green that means 'not looked at' is worse than a red, and the fix belongs in the producing step (stage before you verify), not in the checker. And its sharper corollary, which is what the sixth and seventh review rounds cost between them: a checker can be index-ENUMERATED yet manifest-SATISFIED, so making an artifact visible to a checker is not the same act as satisfying it — surfacing an obligation never discharges it, and a plan that conflates the two produces a stage that is green precisely because nobody has looked. Pointer line added to the principles SUB-INDEX memory-global/leaves/principles/MEMORY.md under its matching Level heading — that is where principle leaves are indexed by convention; the top-level memory-global/MEMORY.md carries exactly one pointer, to the sub-index itself, and must not gain a second. scripts/agentctl/README.md gains a short ADDITIVE section on the two config roots — additive is a constraint, not a style note: doc-bindings.json binds three named headings in this exact file and verify-doc-concepts asserts they exist, so renaming or restructuring them reds check 19's neighbour, while adding a section is free (the verifier iterates the MANIFEST's concepts and has no reverse direction, so a new section incurs no registration obligation) and what the engine can and cannot enforce when they diverge — the doc an engine author reads before adding the next hook-backed gate. verify-all passes 19/19 and pytest sits at the main baseline."
criterion_type = "measurable"
done_criterion = "python3 scripts/verify-all.py exits 0 and prints 'all 19 check(s) passed' (exit code is the real gate; the printed string is quoted here so nobody greps for a '19/19' that the tool never emits); the full pytest run shows EXACTLY ONE failure, the pre-existing test_argv_text::test_a_realistically_long_path_is_named_in_full (count asserted, not just the name — see final_verification); the principle leaf is well-formed AGAINST THE SCHEMA, not merely accepted by the verifier — verify-leaf-structure GRANDFATHERS principle/v1 and adds no required field, so 'the verifier accepts it' is near-vacuous evidence. The real criterion: the leaf carries schema, generality and a NON-EMPTY induced_from in frontmatter; it has an '## Induced from' body section whose [[slug]] links resolve to files that exist; and its row exists in leaves/principles/MEMORY.md under the matching Level heading. It also carries type: (from the closed set {user, feedback, project, reference} — reference is the right one here; verify-memory-index hard-fails on a missing or out-of-set type, and the earlier enumeration omitted it, so an executor following that list literally would have taken a red) and created: and last_verified: — all required by verify-memory-index for every leaf — and it is `git add`-ed BEFORE verify-all runs, because that verifier enumerates leaves from the GIT INDEX: an unstaged new leaf is invisible to it, yielding a green stage 6 followed by a red pre-commit. verify-config-root-refs is green WITH any new doc-scope occurrence covered by an allowlist entry AUTHORED IN THIS CHANGE — not merely 'stays green', which presumed this change creates no occurrence and is false"
verify_command = "set -o pipefail && python3 scripts/verify-all.py 2>&1 | tail -5"
expected_exit = 0
depends_on = [3, 5]
output_artifacts = ["memory-global/leaves/principles/", "memory-global/leaves/principles/MEMORY.md", "scripts/agentctl/README.md", "scripts/config-root-refs-allowlist.txt"]
material = "memory-global/leaves/principles/ and its MEMORY.md sub-index with the principle/v1 schema; scripts/agentctl/README.md as the engine's own contract doc."
means = "Write + verify-all in the delivery worktree"
method = "PROVENANCE FIRST, because principle/v1's rule is that a principle is never rootless: induced_from names memory-global/leaves/ask-user-question-split-turn — the existing leaf that documents this very delivery gate and its residuals, of which the unreachable-prover case is one made concrete here — and the experience leaf this task records at resolution is APPENDED to induced_from at that point, not forward-referenced now. If neither link can be made honest, the norm is not yet a principle and belongs in the README section alone; write it there rather than manufacturing a root. File the norm as a principle leaf, not as a CLAUDE.md edit: it is a design rule for whoever builds the next engine gate, not a per-turn behaviour the coordinator must hold in context, and CLAUDE.md carries a hard line ceiling that generic rules should not consume. Run verify-all LAST and in full. THIS STAGE INCURS A CLASS-4 OBLIGATION THAT STAGING CANNOT DISCHARGE, and it must be handled while writing, not discovered at verify time. verify-config-root-refs scans DOC scope — every tracked file whose suffix is not .py/.sh, so both scripts/agentctl/README.md and the new principle leaf — for `~/.claude` and `$HOME/.claude` (negative lookahead on '-', so `~/.claude-agent` is exempt), and any uncovered occurrence is a HARD FAILURE. Verified: agentctl/README.md carries ZERO such occurrences today, so a section about 'the two config roots' that names the literal would create the repo's first one. Two admissible resolutions, choose deliberately: (i) write the prose without the literal — '$CLAUDE_CONFIG_DIR, else the CLI's own default root' — which costs some concreteness, or (ii) PREFERRED, name it and ship an allowlist entry in the SAME COMMIT (the allowlist header requires exactly that; an entry added ahead of its file reads as stale in every clean checkout, see 77ce06c), in anchored form `path:line:sha8` where sha8 is the first 8 hex of sha256 over the stripped line, with a mandatory reason carrying a category from the fixed taxonomy — `keep:harness-owned` is the honest one here, because the reference IS to the harness's own root. The file is `scripts/config-root-refs-allowlist.txt` (112 lines today) — the plan prescribed the row without ever naming it, which is the same declare-without-naming gap this stage's own criterion is about. Do NOT hand-compute the sha8: write the pin bare as `path:line` and run `verify-config-root-refs.py --repin`, which resolves a bare pin at a real occurrence to itself and mints its anchor automatically, staying consistent with the 85 pins already anchored — hand-computing invites a wrong anchor that reads as stale. Note also that stage 5 regenerates crutch_registry.toml BEFORE this stage writes the leaf, and that ordering is deliberate rather than an oversight: the registry's prose domain is outside verify-semantic-gates' code-only conditions so nothing reds, while regenerating AFTER the leaf landed would copy any bare legacy-path sentence into crutch_registry.toml — itself doc scope — and demand a SECOND pin there. The cost is that the registry ships without this leaf's prose rows; that is a known, harmless diff for whoever regenerates next. THEN, on reds: verify-config-root-refs (a red means either a genuine reference change to review OR, in this stage specifically, a new occurrence needing the row above — do not read it as a regression by default, which the earlier wording did), and verify-semantic-gates (check 19 — a MISSING/STALE red means the crutch registry drifted and the remedy is to RERUN gen_crutch_registry.py, never to hand-edit and never to 'fix' the implementation). The earlier version of this sentence predicted only the first and would have sent an executor hunting a nonexistent implementation bug; stage 5 now regenerates the registry precisely so this is a check, not a discovery."
conditions = "stages 3 and 5 complete"
invariants = "No CLAUDE.md edit in this task — an instruction-surface change is its own gated act via self-improvement, and folding it in here would smuggle a behavioural rule past that gate. Docs describe the divergence as DELIBERATE; nothing in this task installs hooks into the personal root."
capability_required = "none beyond local repo access"

[stage.principle]
statement = "The norm belongs where the next author of the same mistake will be standing"
source = "CLAUDE.md § Memory — 'a behavioral rule filed as a memory leaf is misplaced', and its converse"
derivation = "The rule this task induces is not something the coordinator applies every turn; it is a constraint on ENGINE DESIGN, applied when someone adds a gate whose satisfier is an external hook. Its reader is an author of agentctl, so it belongs in the engine's README plus a retrievable principle — filing it in CLAUDE.md would tax every session's context for a rule that fires a few times a year."
confidence = "medium"
refutation = "if the norm turns out to need enforcing per-turn rather than per-design, it would warrant promotion to the instruction surface — the principle leaf is the retrievable form that makes such a promotion cheap"

[final_verification]
command = "set -o pipefail && python3 scripts/verify-all.py 2>&1 | tail -5 && python3 -m pytest scripts/tests -q 2>&1 | tail -3"
expected = "verify-all exits 0 with 'all 19 check(s) passed'; pytest reports EXACTLY ONE failure and it is test_argv_text::test_a_realistically_long_path_is_named_in_full (pre-existing, red on clean main too — a macOS /private/var path-length artefact). The COUNT is load-bearing, not just the name: this task touches the same test family (stage 5 registers a new argument in the argv partition), so a second failure there would otherwise be waved through as 'the known one'. Two failures = the task is not done, whatever their names."
