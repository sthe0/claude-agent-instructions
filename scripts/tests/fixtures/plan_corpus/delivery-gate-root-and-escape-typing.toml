nt: hook-canon-guard-wired-check.py and lib/config_root.py carry ZERO registry entries today, so stage 3's renames cannot go stale, MISSING is genuinely the only condition in play, and the narrow justification matches the obligation. (a) PLACEMENT FAILED, on a fact I had not seen and verified myself before folding: this repo's verifiers enumerate their domain from the GIT INDEX while reading content from the WORKING TREE. crutch-inventory._list_py_files runs `git ls-files` and its own docstring says an untracked working-tree file 'never enters the enumeration domain', while _collect_file does path.read_text. So edits to tracked files are seen unstaged, but a BRAND-NEW file is invisible — meaning the regeneration I had just added would have been a SILENT NO-OP over precisely the five new files that needed it, verify-semantic-gates would have reported OK, stage 6 would have printed 'all 19 check(s) passed' FOR THE WRONG REASON, and the obligation would have surfaced at `git add` time when githooks/pre-commit runs verify-all.py --staged. The trap is actively baited: verify-readme globs the FILESYSTEM, so the new script's README obligation DOES red while untracked, handing the executor false confirmation that new-file obligations are being caught while the index-scoped check stays green. This is the THIRD independent instance of one underlying fact — round 4 already surfaced it for verify-memory-index and the principle leaf, and lint-hooks-executable skips its git-mode check entirely for untracked files, so the +x clause is likewise unexercised until staging. Folded accordingly, and NOT as three scattered sentences: a TASK-WIDE INVARIANT ('stage before you verify') now heads the stage list, stage 5's method fixes the order explicitly (git add the new .py files, THEN regenerate, THEN re-stage the registry; re-running is free because the generator is byte-stable), stages 2, 3 and 4 gained verify-semantic-gates so no stage can report green over an obligation it created, and the principle leaf gained the generalized second norm: a checker enumerating from one source while reading content from another answers OK for the wrong reason, and a green that means 'not looked at' is worse than a red. Six rounds, ~$16.3 and ~60 minutes. The trajectory is worth recording honestly: rounds 4, 5 and 6 each found a blocking defect of ONE class — an obligation to a repo-wide verifier that no stage declared — and round 6's was a refinement of round 5's within the same area, now closed structurally by the invariant rather than case-by-case. SEVENTH REVIEW round (2026-08-04, $2.35), narrowed to the invariant text itself, which was unreviewed because I wrote it after round 6's report. THE INVARIANT IS CONFIRMED SOUND: (b) HARM holds — every staging instruction names literal paths, there is no `git add -A` anywhere, so the parallel-session-WIP risk is closed by construction, and staging cannot mask a failure because full mode reads content from disk regardless; (c) PLACEMENT holds — every artifact-creating stage carries the step and no stage's Method contradicts the invariant. The round's real contribution was a CLASSIFICATION I did not have: the repo's checks fall into FOUR classes by enumeration source, not one — (1) git index via `ls-files`, (2) staged diff under --staged, which is what pre-commit runs, (3) filesystem glob, for which staging is a harmless no-op, and (4) EXPLICIT MANIFEST. The invariant closes 1 and 2 and is redundant for 3. It cannot close 4, and class 4 is where the remaining defect lived. B4, verified by me on disk before folding: verify-config-root-refs is the hybrid — index-ENUMERATED but manifest-SATISFIED. Doc scope is every tracked file whose suffix is not .py/.sh, so both scripts/agentctl/README.md and the new principle leaf are in it; TILDE_RE carries a negative lookahead on the hyphen so `~/.claude-agent` is exempt; and agentctl/README.md carries ZERO matching occurrences today, meaning stage 6's prescribed section about 'the