title = "A general wiring probe over the ACTIVE root"
executor = "in_thread"
expected_result_image = "New scripts/lib/hook_wiring.py answers, for a hook basename and a config root: is it wired at all, in which events/matchers, and does the script path it points at still exist on disk (the stale-worktree-path case hook-canon-guard-wired-check already handles). It scans EVERY event section (PreToolUse, PostToolUse, SessionStart, Stop, ...), not just PreToolUse. Critically it reads the settings CHAIN, not one file: the harness merges several members, so the probe enumerates them and returns ABSENT only when the basename appears in NONE of the readable members. THIS STAGE CREATES TWO NEW FILES (lib/hook_wiring.py and tests/test_hook_wiring.py) and its reverse-direction test greps the tree for block mechanisms — regexes, in a new module — so it mints crutch sites exactly as stage 5 does. It carries the task-wide staging invariant in full: git add both files, regenerate, re-stage the registry, and its verify command now runs verify-semantic-gates so the stage cannot report green over an obligation it created. A MISSING there is closed by regenerating AT THAT POINT, never by an implementation change. PRIOR ART, to be cited in hook_wiring.py's docstring rather than rediscovered: scripts/self-diagnose.py::default_settings_paths already enumerates six chain members using $CLAUDE_PROJECT_DIR else cwd. Note the asymmetry it exposes — the HOOK caller does receive CLAUDE_PROJECT_DIR from the harness and so COULD locate the project member, while the engine caller cannot (verified: CLAUDE_PROJECT_DIR is unset in the engine's environment). The decision below is therefore about what BOTH callers can answer identically, and the docstring should say so, leaving the project member as a documented extension for the day a project-wired gate-bearing hook actually appears. EXPLICIT MEMBERSHIP DECISION (this is a decision, not an omission): the chain is `<root>/settings.json`, `<root>/settings.local.json` and the managed-policy file — the USER-LEVEL members plus policy. Project-level `.claude/settings.json` is deliberately EXCLUDED, because neither caller can locate it honestly: the engine is invoked as `cd ~/claude-agent-instructions/scripts && python3 -m agentctl`, so a cwd-relative lookup inside gates.py resolves to `<repo>/scripts/.claude` and misses the real `<repo>/.claude/settings.local.json`, while the SessionStart hook runs with the session's own cwd — a third value again. Guessing that root is precisely how a false ABSENT gets manufactured. Consequently the ABSENT wording is QUALIFIED everywhere it surfaces: 'not registered in any user-level settings member of <root>', never an unqualified 'not registered'. Any member that is unreadable, or a settings shape the probe does not model, degrades the whole answer to UNKNOWN — never to ABSENT. The real merge order is CONFIRMED against the harness before implementing, and whatever is found is recorded in the module docstring; if it turns out one file governs after all, the chain logic collapses to a documented invariant rather than an assumption. The module also exposes the gate-bearing hook registry — the hooks whose absence silently disables ENFORCEMENT rather than merely dropping an advisory — as data, so a new gate-bearing hook is added in one place."
criterion_type = "measurable"
done_criterion = "pytest covers: wired-and-present; absent from every chain member -> ABSENT; absent from the primary file but WIRED in settings.local.json -> wired, not absent (the false-ABSENT case that would otherwise produce a diagnosis worse than today's refusal); one chain member unreadable while the others lack the hook -> UNKNOWN, never ABSENT; wired-but-script-missing; wired under a non-PreToolUse event; malformed settings -> UNKNOWN, never 'wired'. Plus registry coverage in BOTH directions: every basename in the registry exists as a file in scripts/, AND every hook script in scripts/ that is GATE-BEARING is either in the registry or in an explicit justified exemption list. The gate-bearing predicate is 'denies OR writes an artifact some gate requires' — NOT 'denies' alone. That widening is load-bearing rather than pedantic: hook-plan-delivery-gate, the very hook this task exists for, mostly does not deny — it WRITES the delivery stamp that gates.plan_presentation_blockers requires — so a deny-only predicate would omit the task's own subject from the report built to find omissions. The deny half must still cover both mechanisms, PreToolUse deny / exit(2) AND Stop {\"decision\":\"block\"}, or hook-turn-end-gate drops out the same way. THIRD direction, against the installer's intent: every registry entry must also appear in install-reminder-hooks.sh's DESIRED block — verify-agentctl.py already parses that block as the system's canonical hook-intent source, so the registry is a SECOND hand-maintained list over the same domain, and an entry present here but absent there would make stage 3 warn about a hook the system never intended to install, on every machine, forever. Assert the subset relation in the same test module"
verify_command = "set -o pipefail && python3 -m pytest scripts/tests/test_hook_wiring.py -q 2>&1 | tail -3 && python3 scripts/verify-semantic-gates.py"
expected_exit = 0
depends_on = [1]
output_artifacts = ["scripts/lib/hook_wiring.py", "scripts/tests/test_hook_wiring.py", "scripts/crutch_registry.toml"]
material = "scripts/hook-canon-guard-wired-check.py lines 39-80 — _guard_commands_for / _script_path / check — which already implement this logic for exactly one hook against exactly one event pair; this stage lifts that logic to the general form rather than writing it fresh."
means = "Edit + pytest in the delivery worktree"
method = "Extract and generalize, don't reinvent: parameterize the existing matcher/command scan over (settings dict, basename) and drop the hardcoded Edit/Bash matcher pair. FIRST establish the real chain — read the harness's own settings precedence (docs/components/settings-and-permissions.md and, if it does not settle the order, the installed client bundle) and write the finding into the docstring; the chain logic is only as good as that check. The registry is a module-level tuple with a one-line note per entry naming what enforcement dies when it is absent — the same 'name the difficulty' discipline the hooks themselves follow. The reverse-direction registry test discovers blocking hooks by grepping the scripts/ tree for both block mechanisms rather than from a hand list, so the coverage claim is mechanical."
conditions = "stage 1 available in the worktree"
invariants = "The probe is READ-ONLY and must never mutate any settings file — this task diagnoses, it does not install (the user's explicit scope decision). No import of agentctl from lib/: the probe is used by both a bare hook script and the engine, so it depends on neither. hook_wiring.py must NOT hardcode `Path.home() / \".claude\"` — it calls stage 1's accessor. This is a booby trap, not a style preference: _PY_ROOT_TARGET_RE in test_config_root.py matches that literal and the new module is not in _LEGACY_REF_ALLOWLIST, so a hardcode goes red in a module THIS stage's verify_command does not run, surfacing only at stage 6 with two stages of work in between. UNKNOWN is a first-class outcome and the ONLY safe answer under partial information: a false ABSENT would make stage 4 emit a confident causal claim ('the hook is not registered in <root>') from evidence that does not support it — strictly worse than today's honest generic refusal. Verified on this machine while planning: ~/.claude/settings.local.json and the managed-settings.json BOTH exist and today declare zero hooks, so a single-file read is accidentally right here and would be wrong on any machine that wires a hook in either — which is precisely why the chain is modelled rather than assumed away."
capability_required = "none beyond local repo access"

[stage.principle]
statement = "A wiring detector that reads a different root than the one being wired is not a detector"
source = "hook-canon-guard-wired-check.py's own docstring — 'the guard silently not-enforcing is the worst failure mode for a read-only guarantee: canon looks protected but isn't'"
derivation = "The detector names the exact failure it exists to prevent, then reproduces it one level up: it reports all-clear from the system root while the live root is unguarded, so 'canon looks protected but isn't' is now true OF THE DETECTOR. A check is only evidence about the root it read; generalizing the probe and pointing it at the active root is what restores the evidential link."
confidence = "high"
refutation = "if a machine ran the agent system only through the claude-agent / claude-task launchers, the roots would always coincide and the old reading would be harmless — this machine's own live state (39 vs 20 hooks, transcripts under ~/.claude) refutes that as the actual usage"

[[stage]]
index = 3
title = "Point the SessionStart check at the active root and widen it to the gate-bearing set"
executor = "in_thread"
expected_result_image = "hook-canon-guard-wired-check.py probes the ACTIVE harness root's settings chain instead of agent_home()/settings.json, and reports at session start EVERY gate-bearing hook from the registry that is missing from it — naming the root, the hooks, and what enforcement is consequently not running. It stays non-blocking and fail-open, as its docstring requires. Its $CLAUDE_CANON_GUARD_SETTINGS test seam is preserved, with its meaning made precise: the override designates the chain's PRIMARY member, and the remaining members are derived from that file's parent directory. This is what lets 'seam preserved' and 'chain modelled' both hold — today the seam is file-valued and all EIGHT existing test functions pass a file path (eight, not six — counted in test_canon_guard_wired_check.py), and under this reading every one of them is unaffected BY THE CHAIN CHANGE, because the sibling members simply do not exist beside their temp fixture. That is a narrower claim than 'they all still pass', and the difference matters to the executor: two of them assert stderr is EMPTY against a fixture that wires only the canon guard, so the moment the check WIDENS to the whole registry those fixtures legitimately produce warnings for every other registry hook and go red. That red means the FIXTURE needs widening to wire the full registry, NOT that the implementation is wrong — without this sentence the executor reads the red as its own bug and 'fixes' the widening back out. ONE-TIME ACCEPTANCE OBSERVATION, recorded here and NOT wired into the stage gate: run by hand against this machine's real ~/.claude root it must go from today's silent all-clear to naming hook-guard-canon-readonly and hook-plan-delivery-gate among the missing, and against ~/.claude-agent stay silent. That observation is environment-dependent — it stops holding on any other machine, and on this one the moment the personal root gains the hooks — so making it a verify_command clause would build a control that decays into a false red; it is evidence for the human at delivery, not a gate."
criterion_type = "measurable"
done_criterion = "pytest covers: a settings fixture missing several registry hooks -> all of them named in the warning; a fixture with everything wired -> silent; an unreadable settings file -> silent (fail-open, unchanged); a fixture where the hook is wired only in the chain's .local member -> silent (no false alarm); a MIXED fixture where one registry hook is ABSENT while another is UNKNOWN -> only the ABSENT one is named (UNKNOWN is never reported, consistent with the hook's fail-open contract — stated here so the executor does not pick a rule silently); the exit code is 0 in every case. The pytest run is the GATE. The live-machine check is recorded separately as a one-time acceptance observation, NOT as a gate clause — see the result image"
verify_command = "set -o pipefail && python3 -m pytest scripts/tests/test_canon_guard_wired_check.py -q 2>&1 | tail -3 && python3 scripts/verify-semantic-gates.py"
expected_exit = 0
depends_on = [2]
output_artifacts = ["scripts/hook-canon-guard-wired-check.py", "scripts/tests/test_canon_guard_wired_check.py", "scripts/crutch_registry.toml"]
material = "scripts/hook-canon-guard-wired-check.py (121 lines) and its existing test module; the hook's registration entry in install-reminder-hooks.sh, which must keep working unchanged."
means = "Edit + pytest in the delivery worktree"
method = "If verify-semantic-gates reds here, close it by rerunning gen_crutch_registry.py and re-staging — never by an implementation change and never by hand-editing the registry. Keep the file name and its installer registration — renaming ripples into install-reminder-hooks.sh, settings on two roots, and the config-root-refs allowlist for zero functional gain; widen the docstring instead so the name's narrowness is documented rather than churned. Cite install-reminder-hooks.sh's PRUNE_ONLY_SETTINGS=(\"$HOME/.claude/settings.json\") in that docstring — it is the strongest in-repo evidence that the personal root is prune-only BY DESIGN, and it is what makes 'report the gap, never close it automatically' a reading of the installer's intent rather than this task's preference. Keep the existing env seam as the settings override so the current tests keep their entry point."
conditions = "stage 2 available in the worktree"
invariants = "Non-blocking and fail-open by construction — a SessionStart hook that wedges startup is worse than the gap it reports; every error path returns 0 silently. The check must not warn about ADVISORY hooks missing from the personal root: divergence is deliberate, and warning about the 7 advisory `*-due` hooks every session would train the user to ignore the whole warning — the registry's gate-bearing scope is what keeps this signal worth reading."
capability_required = "none beyond local repo access"

[stage.principle]
statement = "An alarm that cries about deliberate divergence gets muted, and takes the real alarm with it"
source = "CLAUDE.md § Separate rule from perception — mechanize the decidable part, and the repo's own advisory/gate split across its hook suite"
derivation = "The two roots differ by design; 19 missing hooks is not 19 defects. Reporting all 19 would make the warning a session-start wall of noise whose rational response is to stop reading it — at which point the 2 or 3 entries that DO disable enforcement are invisible again, and the fix has reproduced the original silent failure through a different mechanism."
confidence = "medium"
refutation = "if a later audit shows some hook currently classed advisory actually carries enforcement, the registry — not the reporting rule — is what needs correcting, and that is a one-line change by construction"

[[stage]]
index = 4
title = "Make the delivery gate diagnose its own unsatisfiability"
executor = "in_thread"
expected_result_image = "gates.plan_presentation_blockers, on the no-stamp path, consults the wiring probe. When hook-plan-delivery-gate is confirmed NOT wired in the active harness root's settings chain, the blocker text names the true cause — the hook is not registered in any user-level settings member of <root>, so no automated proof can come from THAT evidence domain — and states both remedies. The qualification is load-bearing HERE too, not only in the probe's own vocabulary: the earlier phrasing 'so nothing can produce the automated proof' asserted a universal negative the probe's evidence does not reach, since the chain deliberately excludes project-level members: run the task under claude-task / claude-agent (where the hook IS wired), or take the human escape. When the hook IS wired, or the probe answers UNKNOWN, the message keeps today's wording verbatim, because then the generic refusal is the honest one. The VERDICT is unchanged in every case: this stage changes what the gate SAYS, never whether it blocks. FORWARD-REFERENCE DISCIPLINE: at this stage the escape sentence names NO enum value, because the typed reasons do not exist until stage 5 — an operator who followed a reason name printed here would hit an argparse error. Stage 5 updates this text to name hook_not_installed once the enum exists, and stage 5's done criterion covers that update."
criterion_type = "measurable"
done_criterion = "pytest covers: hook absent from every chain member -> blocker names the hook and the root and both remedies; hook present -> blocker text is byte-identical to today's; probe returns UNKNOWN -> today's wording; the probe RAISING -> today's wording (the plan asserted this degradation, so it must be tested, not merely stated); and in all four the gate still BLOCKS. A test asserts blocker count and allow/deny verdict are identical across all four, so the diff is provably message-only. Plus the test that actually pins 'off the hot path': with a valid `hook` stamp present the probe is NOT CONSULTED AT ALL (asserted by a probe double that fails the test if called) — the four-outcome verdict test does not establish this and cannot. AND the pre-existing module is kept green BY CONSTRUCTION, not by luck: test_plan_presentation.py:488 and :537 assert `'no delivery proof recorded' in blockers[0]` on the exact branch this stage rewrites, so the new message must still LEAD with that phrase and merely append the diagnosis — the phrase is now a pinned interface, not incidental prose. The probe must also be injectable in that module (a seam the tests can pin), because otherwise it consults the AMBIENT harness root and those two assertions become environment-dependent: on this machine the hook is genuinely absent so the ABSENT branch fires inside the existing suite, while on a machine where it is wired the same tests take the old branch. That is the R21 failure mode relocated into stage 4, and an injectable probe is what forecloses it"
verify_command = "set -o pipefail && python3 -m pytest scripts/tests/test_plan_delivery_gate_presentation.py scripts/tests/test_gates.py scripts/tests/test_plan_presentation.py -q 2>&1 | tail -3 && python3 scripts/verify-semantic-gates.py"
expected_exit = 0
depends_on = [2]
output_artifacts = ["scripts/agentctl/gates.py", "scripts/tests/test_plan_delivery_gate_presentation.py", "scripts/tests/test_plan_presentation.py", "scripts/crutch_registry.toml"]
material = "scripts/tests/test_plan_presentation.py — the PRE-EXISTING module that actually tests this function and that no stage originally ran; its :488/:537 assertions pin the blocker's leading phrase and its :605/:613/:626/:663 call sites construct args with a bare Namespace(**kw) carrying NO defaults (verified on disk while planning). scripts/agentctl/gates.py plan_presentation_blockers at line 322, which today emits 'no delivery proof recorded — the plan was presented but nothing confirms it reached the user; either let the delivery hook verify the turn's transcript, or run confirm-delivery --by <you>' — prose whose first branch is unreachable in the very situation that triggers it."
means = "Edit + pytest in the delivery worktree"
method = "If verify-semantic-gates reds here, close it by rerunning gen_crutch_registry.py and re-staging — never by an implementation change and never by hand-editing the registry. Consult the probe only on the branch that is already about to block, so the added filesystem read is off the hot path and cannot affect any passing case. Wrap the probe call so any exception degrades to today's wording — a gate that raises because settings.json is odd would be a worse failure than the message it was improving."
conditions = "stage 2 available in the worktree"
invariants = "FAIL-CLOSED IS PRESERVED. The gate must not allow approval merely because the hook is missing — that would convert a fail-closed gate into one that any machine disables by not installing a hook, which is strictly worse than the current honest-but-opaque refusal. The escape stays human-initiated and audit-trailed; only its diagnosis improves. gates.py must not import a hook script — it depends on lib/hook_wiring.py only. AND: crutch_registry.toml's entry 6b802bd6c3ae8553 records, as its why-safe ground, that hook-plan-delivery-gate.py is regex-free across its FULL TRANSITIVE IMPORT CLOSURE, naming agentctl.gates explicitly. This stage widens that closure with lib/hook_wiring.py. The test compares id SETS only, so it stays green either way — which is exactly the danger: if hook_wiring.py carries any regex, that recorded ground becomes FALSE while still reading as audited. Either keep hook_wiring.py regex-free (preferred — settings parsing is json.load plus dict walks, no pattern matching needed) or amend that entry's ground in the same change. This is the plan's own 'a green that means nobody looked' failure mode pointed at the plan's own manifest."
capability_required = "none beyond local repo access"

[stage.principle]
statement = "A fail-closed gate must be able to tell 'the proof is missing' from 'the prover is absent', or its refusal teaches nothing"
source = "cmd_confirm_delivery's docstring — the escape exists 'when the delivery hook is disabled, uninstalled, or otherwise cannot fire'"
derivation = "The escape's author enumerated three distinct causes and gave the operator one undifferentiated exit. The engine can decide the 'uninstalled' case mechanically from observable state — it is a rule-part, not a perception-part — so leaving it to the operator to guess is determinization missing at exactly the level CLAUDE.md names. The operator's guess is also the expensive kind of wrong: the observed remedy was to take the escape, which is right for 'uninstalled' and wrong for 'the plan genuinely never reached the user'."
confidence = "high"
refutation = "if the probe could be fooled by a settings layout it does not understand it would mis-diagnose — which is why UNKNOWN is a first-class outcome falling back to the old wording rather than asserting either answer"

[[stage]]
index = 5
title = "P2: type the escape reason, and inventory the rest"
executor = "in_thread"
expected_result_image = "confirm-delivery gains a REQUIRED --escape-reason from a closed set: hook_not_installed (absent from the active root), hook_not_fired (wired but produced no stamp), transcript_unverifiable (fired but could not verify the turn), delivered_out_of_band (the plan reached the user through a channel the hook cannot observe), other. --note stays required and free-text: the enum makes escapes countable, the note keeps them explicable. DeliveryStamp gains an escape_reason field AND from_dict reads it — both halves, because the dataclass default alone would let a stamp be written with the field and read back without it, silently and forever, so every stamp would report an empty reason and the report would show nothing. Stage 4's blocker text is updated here to name hook_not_installed, now that the value exists. --escape-reason is registered in cli.py's argv partition in this same change, per that table's stated OWNERSHIP RULE. New scripts/escape-hatch-report.py prints counts of delivery stamps by source and reason across the state dir, plus an inventory of the engine's other escape hatches driven by an explicit _ESCAPE_HATCH_ARGS structure whose exhaustiveness is test-enforced in both directions."
criterion_type = "measurable"
done_criterion = "pytest covers: confirm-delivery without --escape-reason is refused; an out-of-set value is refused; a valid value writes a stamp carrying it; --by hook is still rejected. Back-compat AND no-silent-drop, BOTH required: a fixture in the OLD on-disk shape (no escape_reason key) still loads, and read_stamp(write_stamp(x)).escape_reason == x.escape_reason for a non-empty value. The argv-partition tests in test_argv_text_call_sites.py stay green, including the one requiring a stated reason for each _ARG_DO_NOT_WRAP entry. The escape-hatch inventory is exhaustive in both directions by test: every _ESCAPE_HATCH_ARGS entry is a live parser argument, and every parser argument matching the hatch patterns (force / waiver / override / escape) is either registered or in an explicit justified exemption list. The report is asserted STRUCTURALLY, not against a live population: given a fixture state dir it parses every sidecar, groups by source and escape_reason, and prints a total — because this very session writes stamps into the real state dir while executing, so 'prints the known 5' would be self-invalidating by the time it ran. Its inventory includes reset --force, replan --coverage-waiver and replan --normalization-waiver — the waivers hang off REPLAN, not resolve (verified in cli.py: _RESOLVE_ROWS maps both to ('replan',) and the parser declares them under that subcommand at lines 4087/4090); the earlier wording would have made the executor either assert a flag that does not exist or quietly weaken the assertion until it passed. BOTH pre-existing surfaces that a new REQUIRED argument silently breaks are repaired in this same change, because a required field is not a local edit — it is an interface break: (a) the four direct cli.cmd_confirm_delivery(...) call sites in test_plan_presentation.py (:605, :613, :626, :663) build their args as a bare Namespace(**kw) with NO defaults, so each must gain escape_reason or the module goes red — and it is red in a module that, before this revision, NO stage's verify command ran, so stages 4 and 5 would both report PASS while breaking it and the first surfacing would be at final_verification, against a criterion demanding EXACTLY ONE failure; (b) the STALE-stamp branch at gates.py:401 prints the remedy '(or confirm-delivery --by <you> --note <reason>)', which becomes an instruction that REFUSES the moment --escape-reason is required — a gate printing an unexecutable remedy is precisely the defect class this whole task exists to remove, so BOTH remedy strings are updated, not only the no-stamp one. Note also that test_confirm_delivery.py and test_escape_hatch_report.py are NEW modules created by this stage (neither exists today — verified on disk), so they must be written before the verify command runs or pytest exits 4 on the missing path. AND the deferred stage-4 text edit is asserted here, not left to prose: with the hook absent from every chain member, the blocker now NAMES hook_not_installed — the one revision whose entire point was sequencing correctness must not itself be the unforced one"
verify_command = "set -o pipefail && python3 -m pytest scripts/tests/test_delivery_stamp.py scripts/tests/test_confirm_delivery.py scripts/tests/test_argv_text_call_sites.py scripts/tests/test_escape_hatch_report.py scripts/tests/test_plan_presentation.py scripts/tests/test_no_semantic_unguarded.py -q 2>&1 | tail -3 && python3 scripts/verify-semantic-gates.py && python3 scripts/verify-readme.py && python3 scripts/lint-hooks-executable.py"
expected_exit = 0
depends_on = [4]
output_artifacts = ["scripts/agentctl/delivery.py", "scripts/agentctl/cli.py", "scripts/agentctl/gates.py", "scripts/escape-hatch-report.py", "scripts/README.md", "scripts/crutch_registry.toml", "scripts/tests/test_plan_presentation.py", "scripts/hook-plan-delivery-gate.py", "scripts/tests/test_delivery_stamp.py", "scripts/tests/test_confirm_delivery.py", "scripts/tests/test_argv_text_call_sites.py", "scripts/tests/test_escape_hatch_report.py"]
material = "scripts/agentctl/delivery.py — the DeliveryStamp dataclass, atomic write_stamp (mkstemp+os.replace), fail-OPEN read_stamp, and from_dict, which already reads its optional fields as d.get('by','') / d.get('note',''), so escape_reason follows an established pattern rather than inventing one (read and confirmed while planning). cmd_confirm_delivery at cli.py:1655 already aggregates missing --by / --note into one refusal — the new required field joins that same aggregation. And cli.py's argument partition (the block above the parser, ~line 3649): an exhaustive three-way table over _ARG_RESOLVE / _ARG_FORWARD / _ARG_DO_NOT_WRAP, walked by test_argv_text_call_sites.py, which goes RED on an argument in none of them — verified while planning, along with its explicit OWNERSHIP RULE that the introducing change registers the argument. AND scripts/tests/test_plan_presentation.py — read it before editing: it is the PRE-EXISTING module this stage must repair, whose four cmd_confirm_delivery call sites (:605, :613, :626, :663) build args from a bare Namespace(**kw) with NO defaults, so the new required field turns every one of them red until it is threaded through."
