#   4 (in_thread)        Fix #3 quality-rating salience in CLAUDE.md + hook + guard test.
#   5 (in_thread)        Final verification: live settings, live spawn check, verify-all, pytest, commits.
#
# ## Dependency graph
#   1 -> 2 ; 1 -> 3 ; 1 -> 4 ; (2,3,4) -> 5
#
# ## Final verification
#   Stage 5's verify_command is the end-to-end gate: verify-all.py 16/16 AND full
#   pytest green (both against the worktree) AND a live spawned developer that ran
#   pytest without an approval prompt (captured output shows a pytest version and
#   no approval/PERMISSION-REQUEST). apply-settings.sh has pushed the allow entry
#   to live settings. The coordinator runs this gate before seeking resolution.
#   Task is not done until it passes; landing to main is a separate resolution act.
#
# ## Risks
#   - Bootstrap: Fix #1 is not live during this plan, so stages 2-3 must be
#     dispatched with the coordinator Bash cwd inside the worktree, or the
#     sandboxed child cannot write. Encoded as each spawn stage's Condition.
#   - Live settings drift: apply-settings.sh mutates live settings before landing;
#     reversible via .bak, and reconciled once the change lands to main.
#   - CLAUDE.md byte ceiling: only ~140 bytes of headroom under claude-md-max-bytes
#     (39000); the Fix #3 insertion must be a tight clause — lint-prose-length
#     (in stage 4's verify_command and verify-all) guards it.
#   - Permission-surface widening: `Bash(python3 -m pytest:*)` widens the allow
#     surface for ALL sessions — flagged here for the plan-review thinker.
