# Plan: spawn-dispatch cwd + pytest allowlist/hygiene + quality-rating salience
#
# Three empirically-validated self-improvement fixes, delivered on an isolated
# worktree of the Core instructions repo, landed to main only after a separate
# resolution-gate confirmation (NOT a stage here).
#
# ## Problem and done criteria
#   End result (plain language): (1) `agentctl dispatch` launches every spawned
#   specialist with its working directory pinned to the plan's delivery worktree
#   (or repo_root), so a hard-sandboxed child can actually write the tree it was
#   sent to change; (2) a spawned developer can run the pytest suite without an
#   approval prompt, and the developer spawn prompt tells it to invoke
#   verification as bare single commands; (3) the two resolution-salience
#   surfaces (CLAUDE.md resolution bullet + hook-resolution-reminder print) both
#   name the agent-proposed 1-5 quality rating that must ride the resolution
#   AskUserQuestion.
#   Overall done criterion (acceptance-review): the user inspects the diff on the
#   worktree branch and the Final-verification evidence (verify-all 16/16, full
#   pytest green, and the live post-edit spawn that runs pytest without approval)
#   and accepts it.

[meta]
task_id = "spawn-dispatch-cwd-pytest-quality-salience"
goal = "Pin dispatched-spawn cwd to the delivery worktree; allow + hygiene pytest in spawns; surface the 1-5 quality rating in both resolution salience surfaces."
done_criterion = "User accepts, on review, the worktree diff plus Final-verification evidence: verify-all.py 16/16, full pytest green, and a live spawned developer running pytest without an approval prompt."
criterion_type = "acceptance_review"
weight_class = "substantive"
# Canonical checkout: exists at submit time, stays frozen on main until landing.
# All existing-file reachability tokens resolve here; the CHANGE lives in the
# worktree, so every verify_command / final_check below uses absolute worktree
# paths (out of reachability scope, and observes the pre-landing tree).
repo_root = "/Users/the0/claude-agent-instructions"
# Deterministic worktree from `scripts/session-isolate.sh spawn-cwd-pytest-quality-fixes`
# => <parent>/<repo>-<slug> = /Users/the0/claude-agent-instructions-spawn-cwd-pytest-quality-fixes
delivery_worktree = "/Users/the0/claude-agent-instructions-spawn-cwd-pytest-quality-fixes"
external_research = "Not warranted beyond the local codebase: the three fixes were already empirically validated by three in-repo probes (spawn-cwd hard-sandbox, pytest approval-gate, quality-salience audit) captured in the task dossier; the implementation is against this repo's own agentctl engine, settings, and hook surfaces (no external API, library, or best-practice question is open). Prior-art within the tree was consulted — scripts/tests/test_verify_command_scope.py is reused as the injectable-runner test template, and settings/base.json already carries the sibling `Bash(python3 -m json.tool:*)` allow entry the pytest entry mirrors."

