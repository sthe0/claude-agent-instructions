capability_required = "Prose editing within byte ceilings; Python string editing; ability to run pytest and lint-prose-length."
expected_result_image = "`python3 -m pytest .../scripts/tests/test_quality_salience.py -q` exits 0 (both surfaces assert the quality rating) AND `python3 .../scripts/lint-prose-length.py` exits 0 (CLAUDE.md under both ceilings)."
criterion_type = "measurable"
done_criterion = "The salience guard test passes and lint-prose-length passes (CLAUDE.md within ceilings)."
verify_command = "python3 -m pytest /Users/the0/claude-agent-instructions-spawn-cwd-pytest-quality-fixes/scripts/tests/test_quality_salience.py -q && python3 /Users/the0/claude-agent-instructions-spawn-cwd-pytest-quality-fixes/scripts/lint-prose-length.py"
