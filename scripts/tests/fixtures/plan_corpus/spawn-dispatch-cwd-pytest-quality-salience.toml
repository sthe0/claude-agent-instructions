source = "CLAUDE.md § Verify the right axis (static import/test green does not establish runtime correctness for a behaviour that only manifests in a real run); task dossier Fix #2 explicit post-edit spawn requirement."
derivation = "The allowlist edit changes how the approval gate classifies a spawned child's command, a decision made only when a real `claude -p` child runs; a unit test asserting the JSON entry proves the entry exists but not that the gate honours it, so the end-to-end control must be a live spawn whose captured output shows pytest ran and no approval was requested."
