[[stage]]
index = 2
title = "Fix #1: pin dispatched-spawn cwd to the delivery worktree (+ test)"
executor = "spawn:developer"
depends_on = [1]
material = "scripts/agentctl/dispatch.py `subprocess_runner`/`dispatch_stage` (no cwd is passed to subprocess.run, so a child inherits the invoker cwd) and cli.py cmd_dispatch call site (~line 1868) where SessionState exposes delivery_worktree/repo_root."
means = "Existing dispatch call chain (build_argv/dispatch_stage/subprocess_runner) and the injectable-runner test seam; scripts/tests/test_verify_command_scope.py as the test-style template."
method = "Thread an optional `cwd: str | None = None` parameter through subprocess_runner (pass `cwd=cwd` to subprocess.run) and dispatch_stage; in cli.cmd_dispatch pass `cwd = state.delivery_worktree or state.repo_root` (None => inherit, byte-identical to today). Add scripts/tests/test_dispatch_cwd.py mirroring the scope-lint test's Namespace/injectable-runner style: assert (a) a plan with delivery_worktree set dispatches with that cwd, (b) delivery_worktree unset falls back to repo_root, (c) both unset => cwd None (back-compat). Do NOT add `--add-dir` (canon must stay read-only; cwd pinning is the whole fix)."
conditions = "Because Fix #1 is not yet live during this plan's own execution, the spawned developer inherits the dispatching process's cwd; the coordinator MUST invoke `agentctl dispatch` for this stage from within the worktree (Bash cwd = the worktree) so the child's allowed working directory covers the worktree it must edit."
invariants = "Default behaviour when neither delivery_worktree nor repo_root is set is unchanged (cwd None => inherit); the runner remains injectable so existing dispatch tests keep passing; no change to build_argv's spawn argv."
capability_required = "Python editing of the agentctl engine; ability to run pytest on the new test."
expected_result_image = "`python3 -m pytest .../scripts/tests/test_dispatch_cwd.py -q` exits 0; the three cwd cases (worktree / repo_root fallback / None back-compat) each assert the cwd passed to the injected runner."
criterion_type = "measurable"
done_criterion = "New dispatch-cwd test passes and the pre-existing dispatch tests still pass."
verify_command = "python3 -m pytest /Users/the0/claude-agent-instructions-spawn-cwd-pytest-quality-fixes/scripts/tests/test_dispatch_cwd.py /Users/the0/claude-agent-instructions-spawn-cwd-pytest-quality-fixes/scripts/tests/test_dispatch_semantics.py -q"
expected_exit = 0
output_artifacts = ["scripts/agentctl/dispatch.py", "scripts/agentctl/cli.py", "scripts/tests/test_dispatch_cwd.py"]

[stage.principle]
statement = "A hard-sandboxed spawned child can only write the tree it is launched in, so the dispatcher must set the child's cwd to the delivery venue rather than relying on the invoker's ambient cwd."
source = "Task dossier probe 3 (a spawned child is sandboxed to its launch-cwd git tree; absolute paths and bypassPermissions do NOT widen the boundary); mirror-the-working-caller memory leaf."
derivation = "Since subprocess.run currently receives no cwd, the child inherits whatever cwd the agentctl process happened to have; the probe proves writes outside that tree are denied, so correctness requires dispatch to compute the venue (delivery_worktree or repo_root) from durable state and pass it explicitly — not depend on an ambient value it does not control."
confidence = "high"
refutation = "Falsified if a dispatched child could write a path outside its launch-cwd tree (making the cwd pin unnecessary), or if passing cwd broke the back-compat None case — both are guarded by the new test's fallback/back-compat assertions."

