source = "quality-regression-investigation memory leaf (rating is agent-proposed and user-confirmed in the same resolution AskUserQuestion); task dossier Fix #3 audit finding both surfaces omit it."
derivation = "The resolution gate's cognition is driven by CLAUDE.md's resolution bullet and the hook reminder's printed text; since neither currently names the rating, the agent has no in-context prompt to include it, so making the norm effective means writing it onto exactly those two read-at-resolution surfaces and guarding it with a regression test."
confidence = "high"
refutation = "Falsified if the rating already reached the resolution ask reliably without either surface mentioning it (making the edit redundant), or if adding the CLAUDE.md clause pushed the file over a size ceiling (lint-prose-length fails)."

