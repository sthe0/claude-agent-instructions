[[stage]]
index = 3
title = "Fix #2: allow pytest in spawns + bare-command prompt hygiene (+ test)"
executor = "spawn:developer"
depends_on = [1]
material = "settings/base.json allow array (line 50 carries `Bash(python3 -m json.tool:*)`; no pytest entry) and scripts/spawn-specialist.py `assemble_prompt` (line 151) developer-path prompt text."
means = "Existing settings/base.json allow taxonomy and the assemble_prompt prompt-section builder; the pytest allow entry mirrors the sibling json.tool entry's shape."
method = "(a) Add `\"Bash(python3 -m pytest:*)\"` to the settings/base.json allow array next to the json.tool entry. (b) In assemble_prompt's developer branch, add a short hygiene instruction: run verification as BARE single commands — no `&&`/`;`/pipes (parsed as multiple-operations), no `$VAR` (simple_expansion), no `python3 -c` (requires approval); reference paths as absolute arguments inside the allowed cwd rather than `cd`. (c) Add scripts/tests/test_spawn_pytest_allowlist_hygiene.py asserting the base.json allow list contains the pytest entry AND assemble_prompt(developer) output contains the bare-command hygiene text."
conditions = "Same bootstrap condition as stage 2: dispatch this stage with the coordinator Bash cwd = the worktree so the spawned developer can write settings/base.json and spawn-specialist.py in the worktree. The live `apply-settings.sh` push of the new allow entry is deferred to Final verification (stage 5), not done here."
invariants = "The allow-array addition is additive (no existing entry removed); assemble_prompt's non-developer branches and the spawn argv are unchanged; base.json stays valid JSON (lint-settings-base must still pass)."
capability_required = "JSON + Python editing; ability to run pytest on the new test."
expected_result_image = "`python3 -m pytest .../scripts/tests/test_spawn_pytest_allowlist_hygiene.py -q` exits 0; base.json parses; the allow entry and the hygiene instruction are both asserted present."
criterion_type = "measurable"
done_criterion = "The new allowlist+hygiene test passes and base.json remains valid JSON."
verify_command = "python3 -m pytest /Users/the0/claude-agent-instructions-spawn-cwd-pytest-quality-fixes/scripts/tests/test_spawn_pytest_allowlist_hygiene.py -q"
expected_exit = 0
output_artifacts = ["settings/base.json", "scripts/spawn-specialist.py", "scripts/tests/test_spawn_pytest_allowlist_hygiene.py"]

[stage.principle]
statement = "A spawned specialist that cannot run the project's test command, or that is not told to invoke it as a bare single command, is blocked by the approval gate from verifying its own work — so both the allowlist and the prompt hygiene are required together."
source = "Task dossier probe 2 (pytest hit the requires-approval gate; compound/`$VAR`/`-c` forms each trip a distinct approval classifier); settings/base.json existing json.tool allow precedent."
derivation = "The approval gate matches literal command shapes, so adding `Bash(python3 -m pytest:*)` clears the bare-suite form, but a prompt that tells the child to chain commands would re-trip the multiple-operations/simple-expansion classifiers; hence the allowlist entry only pays off when paired with the bare-command instruction, and the test pins both halves against silent regression."
confidence = "high"
refutation = "Falsified if a spawned developer still hit an approval prompt on a bare `python3 -m pytest` after the allow entry (allowlist insufficient) — checked live in stage 5 — or if the hygiene text were absent from the developer prompt (test fails)."

