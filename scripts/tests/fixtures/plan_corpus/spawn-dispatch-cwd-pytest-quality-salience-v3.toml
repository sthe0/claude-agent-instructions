# ---------------------------------------------------------------------------
# ## Summary
#   1 (in_thread)        Create + enter the isolated worktree.
#   2 (spawn:developer)  Fix #1 dispatch cwd pinning + test.
#   3 (spawn:developer)  Fix #2 pytest exec-permission via spawn --settings injection (base.json reverted) + hygiene + test + memory leaf.
#   4 (in_thread)        Fix #3 quality-rating salience in CLAUDE.md + hook + guard test.
#   5 (in_thread)        Final verification: injection-only live spawn check, verify-all, pytest, commits.
#
# ## Dependency graph
#   1 -> 2 ; 1 -> 3 ; 1 -> 4 ; (2,3,4) -> 5
#
# ## Final verification
#   Stage 5's verify_command is the end-to-end gate: verify-all.py 16/16 (incl.
#   lint-settings-base green) AND a live spawned developer that ran pytest without
#   an approval prompt (captured output shows a pytest version and no
#   approval/PERMISSION-REQUEST) WHILE live global settings carry no pytest entry.
#   The coordinator runs this gate before seeking resolution. Task is not done
#   until it passes; landing to main is a separate resolution act.
#
# ## Risks
#   - Bootstrap: Fix #1 is not live during this plan, so stages 2-3 must be
#     dispatched with the coordinator Bash cwd inside the worktree, or the
#     sandboxed child cannot write. Encoded as each spawn stage's Condition.
#   - Attribution: stage 5 must launch the diagnostic via the WORKTREE's
#     spawn-specialist.py (carrying the injection) and with live settings free of a
#     pytest entry, or a pass could be mis-attributed to a stray global grant.
#   - CLAUDE.md byte ceiling: only ~60 bytes of headroom under claude-md-max-bytes
#     (39000; currently 38941); lint-prose-length (stage 4 verify + verify-all)
#     guards it. Any future CLAUDE.md growth needs an extraction, not an append.
#   - Permission-surface scope: the pytest exec-permission is now developer-spawn
#     scoped (injected into the developer child --settings), NOT in base.json, so it
#     does NOT widen the fleet-wide allow surface; lint-settings-base guards base.json.
#   - Merge-vs-replace (plan-review v2 finding): `claude -p --settings permissions.allow`
#     has unverified merge semantics. If it REPLACES the child's resolved allow-list, a
#     developer spawn would gain pytest but lose other allow-listed commands. Stage 5's
#     diagnostic now probes a SECOND pre-existing allow (json.tool) in the same injected
#     child (sentinel JSONTOOL_NOAPPROVAL=yes) to settle this empirically at ~zero cost;
#     a JSONTOOL_NOAPPROVAL=no result is a new difficulty (make the injection union-preserving
#     or use --allowedTools), not a pass.
