# Plan (v3, post-replan + plan-review): spawn-dispatch cwd + pytest exec-permission via spawn injection + quality-rating salience
#
# Three empirically-validated self-improvement fixes, delivered on an isolated
# worktree of the Core instructions repo, landed to main only after a separate
# resolution-gate confirmation (NOT a stage here).
#
# ## Replan rationale (v1 -> v2)
#   v1 stage 3 delivered Fix #2's pytest exec-permission by adding
#   `Bash(python3 -m pytest:*)` to settings/base.json. That FAILED final
#   verification: settings/base.json is merged fleet-wide on `git pull` without a
#   prompt, so by security invariant (lint-settings-base.py) it may hold ONLY
#   read-only entries — a code-executing allow like pytest is rejected. The
#   `json.tool` "sibling precedent" does not license pytest (json.tool is
#   lint-whitelisted read-only via READONLY_PYTHON3; pytest is not). Corrected
#   mechanism: inject the exec allow into the developer child's `--settings`
#   payload in spawn-specialist.py (developer-spawn-scoped, versioned, never
#   fleet-merged). base.json is reverted to read-only-only. See the new
#   memory leaf memory-global/leaves/system-knowledge/settings-permission-tiers.md.
#
# ## Problem and done criteria
#   End result (plain language): (1) `agentctl dispatch` launches every spawned
#   specialist with its working directory pinned to the plan's delivery worktree
#   (or repo_root), so a hard-sandboxed child can actually write the tree it was
#   sent to change; (2) a spawned developer can run the pytest suite without an
#   approval prompt (via a developer-scoped spawn-injected allow, NOT a base.json
#   entry), and the developer spawn prompt tells it to invoke verification as bare
#   single commands; (3) the two resolution-salience surfaces (CLAUDE.md
#   resolution bullet + hook-resolution-reminder print) both name the
#   agent-proposed 1-5 quality rating that must ride the resolution AskUserQuestion.
#   Overall done criterion (acceptance-review): the user inspects the diff on the
#   worktree branch and the Final-verification evidence (verify-all 16/16, full
#   pytest green, and the live post-edit spawn that runs pytest without approval
#   with the live global settings NOT carrying a pytest entry) and accepts it.

