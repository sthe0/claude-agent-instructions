[stage.principle]
statement = "A gate that raises items into a store must provide a CLI verb to disposition that same store; the fix mirrors the existing correct sibling (ledger-dispose) rather than overloading a command bound to a different store"
source = "premise deliberately does not reuse ledger.Candidate ('its claim field names the wrong referent', plugins_premise.py:15-18); ledger-dispose already implements the recorded|dismissed pattern correctly on its own bag['candidates']"
derivation = "question-enumerate is the only writer of bag['candidates'] and validate_question_candidates makes every 'raised' entry a hard blocker, so without a disposing verb the gate is un-satisfiable through the CLI. The questions and candidates stores have different entry shapes and disposition vocabularies, so overloading question-dispose would conflate two contracts; the ledger plugin already proves the clean parallel — a dedicated dispose verb per store. Therefore add the missing verb mirroring ledger-dispose."
confidence = "high"
refutation = "if bag['candidates'] and bag['questions'] were in fact one store with one disposition vocabulary, a single dispose verb would suffice and a second command would be redundant"

