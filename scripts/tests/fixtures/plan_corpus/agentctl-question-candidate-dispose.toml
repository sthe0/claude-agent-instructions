[meta]
task_id = "agentctl-question-candidate-dispose"
goal = "Fix the agentctl premise-plugin bug where question-enumerate raises candidates into bag['candidates'] (qenum-N, disposition 'raised') but NO CLI command can disposition them: question-dispose/question-retire only touch bag['questions'], a structurally different store with a different entry shape and disposition vocabulary. Because validate_question_candidates treats every 'raised' candidate as an unconditional plan_approval blocker, once question-enumerate has run any DIAGNOSING->replan is permanently wedged with no CLI route out (the workaround is hand-editing state.json). Compounding it, cmd_question_enumerate's own success message advises `question-dispose --id <qenum-N>`, which returns 'no such question' because that command searches only bag['questions']. Fix (approach A, mirrors the already-correct ledger-dispose): add a question-candidate-dispose command operating on premise bag['candidates'] with the same recorded|dismissed shape as ledger-dispose, and correct the enumerate advice string to point at it."
done_criterion = "A new `agentctl question-candidate-dispose --id <qenum-N> --as recorded --question <qid>` (or `--as dismissed --reason <text>`) sets the premise candidate's disposition in bag['candidates'], with the same validation as ledger-dispose (--question required+resolvable for recorded, --reason required for dismissed, error on unknown id); after dispositioning all candidates the premise plan_approval gate no longer blocks on them; cmd_question_enumerate's success message names question-candidate-dispose; new tests cover recorded/dismissed/error paths and the gate-unblock; verify-all.py stays 16/16 and the full pytest suite stays green; committed. Measurable gates resolution; the user gives final acceptance on review."
