[meta]
task_id = "the0-vpn-mts-mobile"
goal = "Make the0.fun VLESS/Reality VPN carry YouTube and Instagram from an iPhone (OneXray) on MTS mobile data without the reported stalls, and establish whether the intermittent Wi-Fi stalls share that cause. The words 'reliably' and 'remove' are deliberately not used as the criterion: an intermittent symptom cannot be shown absent by observation within one session, so what is gated is a single continuous clean session on both arms plus a dated follow-up — see done_criterion."
done_criterion = "BOTH network arms pass, because the user reported stalls on Wi-Fi as well as on mobile. Arm A, MTS mobile data with Wi-Fi off, VPN on: (1) Safari at ifconfig.me returns 81.22.132.183; (2) the YouTube app, with quality PINNED to 1080p in the player's own quality menu so adaptive bitrate cannot satisfy the check by silently downgrading, plays for >=3 minutes with no rebuffer stall; (3) the Instagram feed and Reels load and scroll; (4) Safari at fast.com reports >=10 Mbit/s. Arm B, the same four checks over home Wi-Fi. Then the freeze check: after 30 minutes of continuous VPN use on mobile data, checks 2-4 still pass — this is the only part that can catch the 120s/600s DPI freeze, which by construction does not show up in a short run. The threshold is 30 minutes. It is NOT lowered to 25 to match what was observed: the freeze model 600 s worst case would make 25 defensible on its own terms, but choosing it after seeing a 25-minute run is back-fitting, and the whole contraction of this plan rests on that run. So the record reads: threshold 30, observed 25, shortfall 5 minutes, knowingly accepted, and the +7-day follow-up supplying the coverage the missing 5 minutes would have bought. HONEST LIMIT: an INTERMITTENT symptom is not shown removed by one clean session, however long, and the original failing profile was NEVER re-tested under controlled conditions — the paired-trial control that would have done so was planned, reviewed and then removed on 2026-08-04 by user decision (reasoning in stage 2; it survives as standing lever R8). So the before/after pair this plan rests on is weeks apart, and intermittency explains that pair just as well as the configuration does. What this criterion establishes is exactly 'no stall observed in a continuous session on either network arm — 25 minutes against a 30-minute threshold, a recorded shortfall', and nothing about causation. Sustained absence needs a further week of ordinary use. That follow-up has a NAMED EXECUTOR and is not offloaded to the user: the agent schedules a +7-day wakeup at resolution time and runs the four checks then; recurrence inside that window reopens this task rather than opening a new one."
criterion_type = "acceptance-review"
weight_class = "substantive"
repo_root = "/Users/the0/projects/yandex-cloud"
external_research = "WebSearch RU+EN 2026-08-04. (1) Habr 1009542 'Как ТСПУ ловит VLESS в 2026 и почему XHTTP — следующий шаг': TSPU detection is 4-layer (signature / JA3-JA4 / active probing / behavioral); Reality's residual weakness is the post-handshake behavioral profile under load, and the recommended 2026 answer is VLESS+XHTTP+Reality with xPaddingBytes 100-1000 and a high-traffic SNI donor (github.com / twitch.tv / www.microsoft.com good; apple.com and niche sites bad because of cert-vs-ASN mismatch). (2) Same corpus: blocking outbound QUIC (udp/443) via a routing rule is the standard, widely-reported fix for 'YouTube buffers or will not load through the tunnel while ordinary TCP sites are fine' — the browser/app falls back to TCP+TLS. (3) onexray.com/docs: OneXray exposes Raw Edit / Xray Profiles / Full Config (replaces outbounds+routing+dns), real-time Access and Error logs, FakeDNS, DoT and On-Demand rules — but exposes NO TUN MTU setting, so an MTU hypothesis cannot be tested in-app and is deprioritised. (4) Project memory leaf project_vpn_setup.md (2026-06-30): confirmed-working combination is direct the0.fun:443 + Vision + fp=firefox; fp=ios is a named DPI signal; niche SNI ferzu.com is the unaddressed third signal. Reused: the memory leaf's confirmed link shape and the DPI three-signal model. NOTE, added at the 2026-08-04 contraction: the last sentence of this record described the PRE-CONTRACTION plan, which was to build a QUIC-block client profile and an XHTTP+Reality inbound. Neither was built — stage 1 selected no hypothesis and both stages were dropped. The research above is retained because it is what informed the discrimination, not because its remedies were adopted."

[[stage]]
index = 1
title = "Discriminate the failure mode on MTS mobile data"
executor = "in_thread"
expected_result_image = "A filled observation table that selects one hypothesis, or explicitly records that none was selected. Decision rule, applied in order: (a0) applied FIRST. If direct+Vision itself passes observation 3, (a0) does not apply at all — no profile failed, so nothing is attributable: skip to branch (e). Otherwise compare three profiles: direct+Vision, direct-Vision, YC-Vision. If direct+Vision fails observation 3 AND direct-Vision carries YouTube on MTS -> the cause is the Vision traffic profile, NOT the entry path: drop flow= on the shipped profile and continue with the remaining stages, R1 not confirmed. The two YC-involving outcomes below apply only if the YC profile's own observation 1 returns 81.22.132.183 (a different address means the YC profile is not tunnelling at all and its YouTube result is meaningless — re-import once; if the second import still does not egress 81.22.132.183, record R1 as UNTESTED-BY-THIS-PROBE and proceed to branches (a)-(e), the direct+Vision / direct-Vision contrast above being unaffected). If direct+Vision AND direct-Vision both fail AND YC-Vision carries YouTube -> the failure is ENTRY-PATH-ATTRIBUTABLE (destination IP / ASN 199058 matching OR plain RU->NL transit quality — this observation does not separate those two, and does not need to, since the remedy is the same), which is R1's practical case: re-shape the plan around a Russian entry point WHILE RETAINING the SNI-donor change and the QUIC-blocking routing rule — NEITHER of which is in the current plan, since the 2026-08-04 contraction removed both; see R5 (donor), R7 (QUIC rule) and R1 (entry point) for where each went and why. They are independent of the entry point and R1 explicitly requires the donor change so a YC path would carry one DPI signal instead of three. Residual confound that no client-side profile can remove: the YC path is forced onto port 8443 (port 443 on that VM is DNAT'd to MTProto), so a non-standard TLS port remains an uncontrolled difference; record it rather than treating the branch as clean. Conversely, if the YC path fails at least as badly, this rules out the YC ENTRY POINT AS A REMEDY but does NOT close R1: the YC subnet is itself DPI-blacklisted (Signal 1 in project memory), the profile drops Vision and sits on port 8443, so a joint failure is equally consistent with both paths being blocked for different reasons. Record R1 as UNTESTED-BY-THIS-PROBE, proceed with branches (a)-(e), and if those also come back inconclusive, testing R1 properly requires a clean Russian entry point that is not the blacklisted YC subnet; (a) Safari at ifconfig.me does NOT return 81.22.132.183 -> H2 routing/DNS leak; (b) fast.com reports >=10 Mbit/s WHILE the YouTube app stalls -> bandwidth through the tunnel is healthy, so the fault is protocol-specific, which selects H1 QUIC and rules out H3; (c) YouTube plays in Safari but stalls in the YouTube app, and/or the OneXray Access log shows repeated udp:443 entries with errors -> H1 confirmed; (d) fast.com is low AND large pages in Safari stall after the first seconds -> H3 MTU/fragmentation; (e) everything passes on this short run -> NO hypothesis is selected and H4 is NOT excluded: hold the tunnel under continuous load for 30 minutes and re-observe. THIS THRESHOLD IS LEFT AT 30, the figure that was in force when the branch ran, and the run reached 25: a 5-minute shortfall, recorded as a shortfall. An earlier revision lowered the threshold to 25 and justified the new figure as 2.5x the freeze model 600 s worst case. That justification is sound in the abstract and was still back-fitting, because the number was chosen after seeing the observation and the entire contraction of this plan rests on that one run. Either accept the shortfall explicitly, as done here, or hold the missing 5 minutes; do not move the line to where the ball landed. The 30-minute hold is what the freeze model demands: it predicts failure only after 120-600 seconds, so a shorter hold cannot see one. Recorded as a written verdict naming the hypothesis and the observation that selected it, or naming branch (e)."
criterion_type = "acceptance-review"
done_criterion = "User reports the observation set; agent records EITHER a single named hypothesis with the evidence that selected it, OR that a named branch of the decision rule fired and selected none. Both are a pass: the result image lists branch (e) — everything passes on a short run — as a legitimate outcome, and a criterion demanding a hypothesis would make the stage unpassable on exactly the branch that actually fired on 2026-08-04. What is NOT a pass is an unrecorded verdict."
verify_command = "user observation on MTS mobile data"
expected_exit = 0
depends_on = []
output_artifacts = ["written hypothesis verdict in the session"]
material = "iPhone with OneXray; existing profile 0-rpqowix2 (VLESS/Reality, flow=xtls-rprx-vision, fp=ios, sni=ferzu.com, host the0.fun); MTS mobile data"
means = "OneXray real-time Access and Error log viewer (Core > logs, per onexray.com/docs); Safari; the YouTube and Instagram apps; a second imported profile carrying the memory-confirmed parameter set (direct IP 81.22.132.183, fp=firefox, sni=www.ferzu.com) so the original profile is never mutated; plus a second diagnostic profile through the pre-existing Yandex Cloud entry point 178.154.253.38:8443 (verified live 2026-08-04: the wg-tunnel peer handshake was 25 s old, the DNAT rule 8443/tcp -> 81.22.132.183:443 is in place with 3.45M packets through it, and an openssl handshake with SNI ferzu.com through that path returns the same genuine CN=ferzu.com certificate as the direct path), plus a third control profile the0-diag-novision (direct, Vision dropped, all other fields identical) whose sole purpose is to remove the Vision confound from the YC comparison. NEITHER the YC NOR the no-Vision profile WAS ACTUALLY IMPORTED OR RUN: the (a0) guard fired on the first profile tested, which made both unnecessary by the plan's own rule. This paragraph describes what was provisioned, not what happened — see R1. Uncontrolled residual: the YC path can only be reached on port 8443, since port 443 on 178.154.253.38 is DNAT'd to MTProto."
method = "Import the corrected link as a NEW profile named the0-diag. Turn Wi-Fi off, mobile data on, connect the0-diag. Run six observations in this order and record each: (1) Safari https://ifconfig.me/ip; (2) Safari https://www.youtube.com play any video; (3) YouTube app play any video with quality pinned to 1080p; (4) Instagram app open feed then Reels; (5) Safari https://fast.com note the number; (6) open the OneXray Access and Error logs while step 3 runs and capture whether udp:443 lines and errors appear; (7) NOT EXECUTED, the (a0) guard fired first — import a SECOND diagnostic profile the0-diag-yc pointing at the Yandex Cloud entry point 178.154.253.38:8443, which DNATs to 81.22.132.183:443, WITHOUT flow=xtls-rprx-vision because Vision is broken by DNAT+MASQUERADE on that path, and repeat observations 1, 3 and 5 through it; (8) NOT EXECUTED, same reason — import a THIRD diagnostic profile the0-diag-novision — identical to the0-diag in every field (direct 81.22.132.183:443, fp=firefox, sni=www.ferzu.com, same uuid/pbk/sid) EXCEPT that flow=xtls-rprx-vision is dropped — and repeat observations 1, 3 and 5 through it. the0-diag-yc must likewise be identical to the0-diag except for address 178.154.253.38, port 8443 and the dropped flow, so that fp and sni are held constant across all three. Without this control the YC profile differs from the direct one in BOTH entry path and Vision, and the two cannot be told apart. Then apply the ordered decision rule in the expected result image. Prior from the user, recorded 2026-08-04: YouTube and Instagram either degraded a month or more ago, or never worked on mobile data at all while the profile's 809 GB accumulated over Wi-Fi. Both readings rule out a recent MTS policy change and raise H1 and H3 relative to H4, because a mobile network's higher loss and smaller MTU degrade UDP-in-tunnel far more than Wi-Fi does. This prior sets the order in which the fixes are attempted; it does not replace the observations."
conditions = "Wi-Fi genuinely off (iOS silently prefers Wi-Fi); no other VPN or iCloud Private Relay active; the original profile 0-rpqowix2 left in place untouched so a rollback needs no re-import"
invariants = "No server-side change in this stage; the existing 0-rpqowix2 profile and all seven client entries in x-ui stay exactly as they are"
capability_required = "physical access to the iPhone on MTS mobile data; ability to read the OneXray log view"

[stage.principle]
statement = "Six distinct causes (entry-path/destination matching, the Vision traffic profile, routing leak, QUIC over tunnel, MTU, DPI behavioral freeze) produce the same user-visible symptom, so a fix chosen before discrimination is a guess; the entry-path and Vision causes are separable only by holding every other client-side variable constant across three profiles, three more are separable by a short observation run, and the last is separable only by holding load"
source = "Habr 1009542 (behavioral layer), onexray.com/docs (log viewer and absent MTU control), project memory leaf project_vpn_setup.md (120s/600s freeze model)"
derivation = "Each hypothesis predicts a DIFFERENT joint outcome across the observation set — a routing leak changes the observed egress IP while QUIC failure does not; QUIC failure leaves measured throughput healthy while MTU failure does not; only the freeze model predicts a delayed total loss. So the observation set separates H1, H2 and H3 within a short run. The entry-path cause is separated not by any single observation but by a three-profile contrast (direct+Vision / direct-Vision / YC-Vision) in which entry path is the only variable between the last two; a two-profile contrast confounds entry path with Vision and cannot support the inference. H4 is deliberately NOT separable in a short run, which is why branch (e) exists: a clean short run is recorded as 'inconclusive, H4 open', never as 'no problem'."
confidence = "medium"
refutation = "If the observation set comes back mutually inconsistent — e.g. the egress IP is wrong AND Safari YouTube works fine — or if repeated runs of the SAME profile give different verdicts on observation 3, so that no observation set is stable enough to separate anything, the separation assumption is wrong and the stage must be re-run with a packet-level capture instead of app-level observation"


[[stage]]
index = 2
title = "Stop the panel emitting fp=ios"
executor = "in_thread"
expected_result_image = "Inbound id=1 on the0.fun has realitySettings.settings.fingerprint set to firefox rather than ios, and a before/after dump of that inbound stream_settings differs in exactly that one JSON path and in nothing else. This is a SEPARATE stage from the link distribution. An intermediate revision of this plan placed a paired-trial control between them — four alternating >=11-minute runs of the original profile against the corrected one — to test whether the three-field change was actually the operative variable. It was REMOVED on 2026-08-04, and the removal is a real evidential loss recorded as such rather than talked away: the attribution stays a hypothesis, exactly as clients/corrected-links.md already states in its header. ONE reason carries the removal, and the others are kept separate from it on purpose. THE CARRYING REASON: the control would have cost roughly 50 minutes of the user's attention, spent against a symptom that is not currently reproducing — and a trial run without a live symptom is close to powerless on its A arm, since a clean A run means only that nothing happened to be wrong that minute. Bad price, bad moment. TWO FURTHER FAULTS the same review found, which are NOT reasons to delete the instrument and are recorded as what they are so that nobody later reads them as having retired it: the gate sat in the wrong place, protecting the reversible half (handing out links, re-import optional per client, revertible by re-importing the old one) while the one irreversible act — this panel save, which restarts Xray-core for all seven clients — sat outside it; and a null result was wired to cancel the six-client distribution, which does not follow, because the fp=ios ground for reissuing comes from the 2026-06-30 DPI model and holds whatever a trial says. Those two argue for MOVING the gate and REWIRING the outcome, and the plan did both: the distribution stage is now ungated and the panel edit carries a runtime check. They do not argue for removing the trial, and no claim is made here about how the trial would most likely have come out — nobody knows. The paired trial survives as standing lever R8: it is the FIRST instrument to reach for if the symptom returns, and it is cheaper then, because a live symptom is what makes an A-arm run informative in the first place. The justification for it does not come from this session evidence at all: fp=ios is named as Signal 2 in the recorded three-signal DPI model from 2026-06-30, independently of whether the paired trial reproduces anything, and the panel will keep stamping ios into every link it issues until the field is changed. An earlier revision buried this edit inside the link-distribution stage, where a gate it was never meant to be under could have left the plan's one irreversible server operation executable with no stage, no gate, and no run of the checker that verifies it. Splitting it out is the fix, and it outlived the gate that prompted it."
criterion_type = "measurable"
done_criterion = "clients/check-inbound-diff.py exits 0: the canonicalised stream_settings fetched after the panel edit differs from clients/stream-settings.before.json in exactly one JSON path, realitySettings.settings.fingerprint ios->firefox, in nothing else beyond the tolerated class, AND the0.fun:443 still answers a TLS handshake afterwards. The runtime half is not decoration: the save restarts Xray-core, and a core that fails to come back leaves a perfectly correct database row while all seven clients are down — a DB diff alone would report green over a total outage. This is the plan's only irreversible server act and its only stage with no human watching the result, so it is the one that most needs a check on the axis that actually matters. The user re-reading the field they just typed is NOT the check either: a 3x-ui save re-serialises the whole blob, so privateKey, shortIds, serverNames and dest are precisely what must be proven unchanged. THE TOLERATED CLASS IS FIXED IN ADVANCE, in clients/check-inbound-diff.py itself, because once the panel has saved the pre-state is gone and any judgement made then is made against a sunk cost. A key that a differing 3x-ui version newly serialises (absent -> present) is tolerated and reported; a key that disappears, or an existing value that changes, never is — those are the shapes that silently rotate the keypair, drop a shortId or repoint dest. The script exits 2 with CANNOT VERIFY on an ssh or database failure, but exits 1 on a MISSING before-snapshot: that is not transient, and after the save it is unrecoverable, so retrying is the wrong response."
verify_command = "python3 /Users/the0/projects/yandex-cloud/clients/check-inbound-diff.py"
expected_exit = 0
depends_on = [1]
output_artifacts = ["clients/check-inbound-diff.py", "clients/stream-settings.before.json", "clients/stream-settings.after.json"]
material = "inbound id=1 stream_settings.realitySettings.settings.fingerprint on the0.fun, which currently reads ios"
means = "the 3x-ui web panel at https://the0.fun:2222/, executed BY THE USER, because the agent ssh account has no sudo password and a direct write to x-ui.db would be overwritten by the running panel, which holds the inbound in memory; unprivileged ssh plus sqlite3 against the world-readable /etc/x-ui/x-ui.db for the before and after READS"
method = "(1) CAPTURE THE BEFORE-STATE FIRST, before the user is given the panel path: ssh the0.fun sqlite3 select stream_settings from inbounds where id=1, canonicalised through json.dumps(sort_keys=True, indent=2) into clients/stream-settings.before.json. Once the user saves in the panel the pre-state is unrecoverable and this done criterion becomes permanently unsatisfiable, degrading silently back into the user re-reading their own typing. DONE 2026-08-04; the file exists. (2) Hand the user the panel path and the one field to change, with the instruction to do it at a low-usage moment. (3) Run clients/check-inbound-diff.py, which re-fetches, canonicalises identically and compares structurally — key order and whitespace differ across a 3x-ui re-serialisation, so a textual diff would report noise."
conditions = "Ungated on any traffic observation, because its justification is the 2026-06-30 DPI model rather than anything measured in this session — see the principle: editing a field Xray-core never reads cannot be validated or invalidated by a traffic result, so gating it on one would be a category error. Performed at a low-usage moment, since the SAVE restarts Xray-core and drops every live connection for a few seconds. HARD PRECONDITION: clients/stream-settings.before.json must already exist and hold fingerprint = ios BEFORE the user is given the panel path — verified present 2026-08-04. Once the panel saves, the pre-state is unrecoverable and this stage's done criterion becomes permanently unsatisfiable."
invariants = "The Reality keypair, shortIds, serverNames and dest are not touched, so no existing LINK is invalidated and no client needs to re-import on a deadline. That is NOT the same as no service interruption: a 3x-ui inbound save restarts Xray-core and drops every live connection for a few seconds, which is why this is timed rather than done on demand. MTProto on 8443 and the panel on 2222 are untouched."
capability_required = "the user executing one field change in the 3x-ui panel; ssh to the0.fun for the reads (held)"

[stage.principle]
statement = "Correcting the links without correcting the inbound fingerprint field leaves the panel free to regenerate the original defect on the next link it issues, so the edit is justified by the panel future behaviour rather than by any observation in this session — which is why it must not be gated on an observation"
source = "3x-ui realitySettings.settings block, which Xray-core does not consume server-side and which exists solely to generate client links; project memory leaf project_vpn_setup.md (2026-06-30) naming fp=ios as Signal 2"
derivation = "Because Xray-core ignores realitySettings.settings, editing it changes NOTHING about the running tunnel: it changes only what the panel writes into future links. So the edit cannot be validated or invalidated by a traffic observation, and gating it on one is a category error — the recurrence it prevents is a future link carrying fp=ios, not a current stall. The SAVE ACTION is a separate matter and does restart the core; see invariants."
confidence = "high"
refutation = "If the after-dump shows realitySettings.settings.fingerprint unchanged while the panel UI displays firefox, the field being edited is not the one that feeds link generation, and the panel is writing somewhere this plan has not located"


[[stage]]
index = 3
title = "Distribute the corrected links to the six untested clients"
executor = "in_thread"
expected_result_image = "File clients/corrected-links.md exists under the repo root and carries one VLESS link per client for all seven x-ui client entries. Every link differs from what the panel issues today in the fields that separate the profile which PASSED stage 1 from the profile the user reported failing BEFORE this session — a failure never re-observed under controlled conditions, so 'correction' is the intent of the change and not a demonstrated property of it — fp=firefox instead of fp=ios, and sni=www.ferzu.com instead of sni=ferzu.com. A third field differs for ONE client only: rpqowix2 carries the literal 81.22.132.183 because that is what the profile which actually passed carried, while the other six carry the0.fun, which is both what project memory records as the confirmed form and what keeps a future VPS-IP change from silently breaking all seven at once. Every link's flow= matches that client's server-side flow value EXACTLY (present only for rpqowix2, absent for the other six, whose stored flow is the empty string), and every link's uuid matches the client named in its own #fragment. The three fields are corrected TOGETHER and NO single-field attribution is claimed: fp=ios leads only because project memory names it Signal 2. AND the six have actually been handed their links: clients/distribution.md exists and carries, per client, a handover date, the channel it went through, an explicit record that the caveat travelled in that message, and the last four characters of the uuid actually sent. All four are gated by clients/check-distribution.py, so the result image names all four rather than the first two: an image weaker than the criterion invites a stage-boundary check that passes on an image nobody stated. That second half is part of the result image and not only of the criterion, because this plan says elsewhere that a link sitting in a repo is not a link a client has — a result image that stops at the generated file would let a stage-boundary check pass over seven links nobody received, which is the exact confusion the criterion was written to catch. The fingerprint half of what used to be this stage now lives in stage 2, which this stage neither depends on nor performs: nothing here reads the panel, the fp value is a constant in gen-links.py, and the links are handed out from a file. Sequencing the two is a convenience, not a dependency."
criterion_type = "acceptance-review"
done_criterion = "clients/check-links.py exits 0: it reads the live inbound over ssh and asserts, per link, that uuid and flow match that client stored row, that the endpoint is the0.fun:443 for the six and either form for rpqowix2 — the split is enforced by the checker, not merely described in prose — that sid and sni are in realitySettings.shortIds and realitySettings.serverNames, and that pbk equals the X25519 public key DERIVED from realitySettings.privateKey. Derivation, not a read of realitySettings.settings.publicKey: this plan own stage-2 principle states that Xray-core never consumes that nested block, which is also why the fingerprint edit is a separate stage, so comparing a link to it proves only that the link agrees with what the panel displays — the same non-check as a user re-reading what they just typed, which this plan rejects one sentence later for the fingerprint. A publicKey that has drifted from the private key fails the handshake for all seven at once with no diagnostic, and only derivation catches it. The X25519 implementation self-tests against the RFC 7748 section 6.1 vector on EVERY run, inside check-links.py, rather than having been checked once by hand: gen-links.py imports that same derivation, so a bug in it would write consistently wrong pbk values into the links AND pass the checker green — the silent all-seven handshake failure that reading the panel publicKey was rejected for, reintroduced through the shared-code shortcut. pbk is compared as decoded BYTES, not as a string, so a link written in the standard base64 alphabet is not misreported as a key mismatch. Recorded cross-check 2026-08-04: the derived key matched 3x-ui own independently computed publicKey, so panel and private key are in sync today; the private key is read into memory, never printed and never passed on a command line. security and type ARE asserted against the live stream_settings.security and stream_settings.network, with tcp and raw treated as one transport because Xray renamed it in v25.x while x-ui still stores the old spelling — leaving them constant would let seven links pass green against an inbound whose transport had been changed underneath them. Only TWO fields are compared to constants: the endpoint policy, which this plan defines rather than the server, and fp, which cannot be server-asserted because the live fingerprint field is itself the thing under repair and reads ios until the panel edit lands, so asserting the links against it would invert the check. AND clients/check-distribution.py exits 0: distribution.md records, for each of the six, a handover date, a channel, caveat-sent=yes and the uuid tail — not merely the client name, because a file listing all six as not-yet-sent would otherwise satisfy a name-only grep, and not merely a non-empty caveat cell, because one reading 'no' would then pass a check whose entire purpose is that the caveat travelled. That checker is a committed script with its own --self-test rather than an inline grep pattern: two defects (a caveat column that accepted 'no', a channel class that rejected Cyrillic and so would have failed a correct log written in the operator's own language) survived inside the quoting layers of the shell one-liner it replaces, which is what an untestable check buys. NOTE on transport, a deliberate asymmetry: check-links.py treats tcp and raw as one transport, while gen-links.py REFUSES to generate unless the live inbound reads raw. The checker must accept a correct link whatever spelling the server stores; the generator is choosing what to write and should stop rather than guess if the server no longer looks the way this plan assumes. The asymmetry is safe in the direction it fails. check-links.py exits 2 with CANNOT VERIFY on an ssh, schema or database failure, so an infrastructure outage is never readable as a link mismatch. A failed RFC 7748 self-test is deliberately NOT in that class and exits 1: it is deterministic and will fail identically forever, so retrying is the wrong response."
verify_command = "L=/Users/the0/projects/yandex-cloud/clients/corrected-links.md; test -f $L && test $(grep -c '^vless://' $L) -eq 7 && test $(grep -c '^vless://.*flow=' $L) -eq 1 && test $(grep -c '^vless://.*flow=xtls-rprx-vision' $L) -eq 1 && test $(grep -c '^vless://.*fp=firefox' $L) -eq 7 && test $(grep -c '^vless://.*sni=www[.]ferzu[.]com' $L) -eq 7 && ! grep -q '^vless://.*fp=ios' $L && python3 /Users/the0/projects/yandex-cloud/clients/check-distribution.py --self-test && python3 /Users/the0/projects/yandex-cloud/clients/check-distribution.py && python3 /Users/the0/projects/yandex-cloud/clients/check-links.py"
expected_exit = 0
depends_on = [1]
output_artifacts = ["clients/corrected-links.md", "clients/gen-links.py", "clients/distribution.md", "clients/check-links.py"]
material = "the seven client entries stored in inbound id=1 of /etc/x-ui/x-ui.db (rpqowix2 with flow=xtls-rprx-vision; ser6nzfgq, v1xlgcwj, e3ebuxsw, s1r2nxde, wfu2tc1m, mb7fi0ri all with flow set to the empty string)"
means = "unprivileged ssh to the0.fun plus sqlite3 against the world-readable /etc/x-ui/x-ui.db for READING the client table; the committed generator clients/gen-links.py, which reads the live inbound and emits the file, and which imports check-links.py server reader and key derivation rather than duplicating them, so generator and checker cannot drift apart"
method = "Three steps, and only the third leaves this machine. The before-snapshot capture that an earlier revision listed here as step (1) belongs to stage 2 and is not repeated: it was listed in both places while the artifacts were produced in one sitting, which is two places to keep in sync and one to forget. (1) Read the seven client rows (email, uuid, flow) from the inbound settings JSON and emit one link per client, asserting sid and sni against the live realitySettings and pbk against the key derived from realitySettings.privateKey, rather than against constants transcribed into the generator — a wrong pbk fails the handshake for all seven at once with no diagnostic. The generator clients/gen-links.py is committed rather than being a one-off inline script, so R3 documented repair (regenerate rpqowix2 against the hostname) is a one-line policy change plus a re-run, not a hand-edit of seven near-identical 200-character URLs, which is precisely how a uuid gets paired with the wrong client. Copy flow and uuid verbatim per client; use the literal IP only for rpqowix2. (2) Write the file with a header stating what was verified, on which client, and what was not, so the untested six do not read as covered by the tested one. (3) DISTRIBUTE the six other clients their links. Recorded in clients/distribution.md, one row per client — email, the date handed over, the channel, whether the caveat travelled in that message, and whether the client confirmed the new link connects. The caveat column exists because conditions call sending these out silently as 'the fix' the dishonest version of this stage, and a requirement with no carrier and no column is a requirement that quietly does not happen. Until that file exists the six have been given nothing, whatever corrected-links.md contains — a link sitting in a repo is not a link a client has, and conflating the two is how a distribution stage reports itself done without anyone having received anything. The panel write is stage 2 and is not performed here."
conditions = "UNGATED, and the reasoning that removed the gate is recorded in stage 2. Handing a client a link is reversible for that client alone — re-import is optional and at leisure, and the old profile stays on the phone as a working fallback — so the blast radius of being wrong is one re-import per person, not a broken window. What the six are told is therefore load-bearing, and it is set by the header of corrected-links.md: these links carry a change whose effect is a hypothesis, not a demonstrated fix, and the six have LESS evidence behind them than rpqowix2 does, because their stored flow is empty so they carry no Vision. Distributing them silently as 'the fix' would be the dishonest version of this stage. Stage 1 recorded that the profile which PASSED differs in three fields (host / fp / sni) from the profile the user reported failing before this session, and that branch (a0)->(e) selected NO hypothesis — so nothing was attributed to a single field, and no failure was reproduced. All three are corrected together; fp=ios leads only because project memory names it Signal 2, and R3 carries that limit. The x-ui client table is readable over the existing unprivileged ssh account."
invariants = "EACH CLIENT RECEIVES THEIR OWN LINK AND NOTHING ELSE. clients/corrected-links.md is NOT the delivery artifact and is never forwarded whole: a VLESS uuid IS the client's only authentication secret, and the file holds all seven alongside the shared pbk, sid and sni, so every line in it is a complete working credential. Sending the file to the six would hand every one of them everyone else's access, which destroys the only thing seven separate client entries buy — per-person accounting and per-person revocation — and it is not undoable: the sole remedy is rotating a uuid, i.e. a forced re-import with no working fallback, exactly the break R5 refuses to inflict for the SNI donor. It also removes the ground this stage stands on: conditions call the blast radius of being wrong 'one re-import per person, not a broken window', and that is true only of per-client delivery. Copy the one line whose #fragment names that client, and carry the caveat in the message body — the file header does not travel with a single copied line, so the honesty requirement in conditions has no carrier unless it is restated per message. No client's flow= is invented — a link may carry flow=xtls-rprx-vision only if that client's server-side flow field already holds it, because a mismatch between the link and the stored client entry breaks the connection outright. A link's uuid is never generalised across clients either: a mis-paired uuid still parses and still authenticates, so the error is silent, and pairing it with the wrong flow produces the hard mismatch above with nothing pointing at the cause. The Reality keypair, shortIds, serverNames and dest are not touched, so no existing LINK is invalidated and no client needs to re-import on a deadline. This stage performs NO server write at all: it hands out links. The Xray-core restart belongs to stage 2, the panel edit."
capability_required = "ssh to the0.fun for the reads (held); a channel to reach the six other clients"

[stage.principle]
statement = "A client link is only valid if every field it declares is consistent with the server-side entry it authenticates against, so flow must be copied from each client stored value rather than generalised from the one client that was tested"
source = "the live x-ui client table read 2026-08-04 (six of seven clients store an empty flow); Xray-core VLESS docs on flow matching"
derivation = "XTLS Vision is negotiated, not merely advertised: the server accepts the flow the client declares only if the matching client entry declares it too, so writing flow=xtls-rprx-vision into a link whose stored entry holds the empty string produces a connection failure rather than a downgrade. That makes per-client copying the only correct generation rule, and it is why the generator reads flow per client from the live table rather than taking a single flag."
confidence = "high"
refutation = "If a reissued link fails for a client whose flow was copied verbatim, the mismatch model is wrong and the difference lies in a field this stage held fixed — most likely uuid drift between the settings JSON and the live config, which would be visible as an auth failure in the server's Xray error log"

# ## Final verification
# Split deliberately into what is CHECKED at closure and what is already RECORDED, because
# an earlier revision listed both under one "Pass = all nine" and so asserted a pass over an
# item that no stage performs. An unperformed item silently reads as satisfied; that is the
# failure mode this split removes.
#
# CHECKED AT CLOSURE — the gate. All four must hold:
#  1. clients/check-links.py exits 0 against the live inbound (stage 3).
#  2. clients/check-inbound-diff.py exits 0 — exactly one JSON path changed AND the0.fun:443
#     still answers TLS afterwards, so the panel save did not leave Xray-core down (stage 2).
#  3. clients/distribution.md records a date and a channel for each of the six (stage 3).
#  4. A +7-day wakeup is scheduled and its identifier recorded, so the sustained-absence
#     half of meta.done_criterion has a named executor rather than sitting on the user.
# Anything less routes to overcome-difficulty, not to a close.
#
# ALREADY RECORDED, from the 2026-08-04 stage-1 run — evidence, not a gate, and not
# re-performed at closure:
#  - Safari https://ifconfig.me/ip returned 81.22.132.183; the YouTube app played pinned
#    1080p; the Instagram feed and Reels loaded; fast.com read 34 Mbit/s; the Wi-Fi arm
#    passed the same four.
#  - The continuous hold reached 25 minutes against a 30-minute threshold: a 5-minute
#    SHORTFALL, accepted knowingly. The threshold stays at 30 rather than being rewritten to
#    25 to match what was observed — 25 is defensible in the abstract as 2.5x the freeze
#    model's 600 s worst case, but choosing it after seeing the run is back-fitting. The
#    30-minute hold is therefore NOT satisfied and is NOT counted as satisfied. It is not in
#    the gate either: the item that would close it is the +7-day follow-up, whose
#    ordinary-use window covers the freeze model many times over, and that follow-up
#    is gate item 4. The rule is not "only stages may supply gate items" — gate item 4
#    is performed by the closing agent, not by a stage. The rule is that an item in
#    the gate must have a named executor and a check; the 30-minute hold has neither
#    at closure time, which is why it sits here as a recorded shortfall instead.
#  - The original profile 0-rpqowix2 was never re-tested. See meta.done_criterion and R8.
#
# ## Scope change recorded 2026-08-04
# The original stages 2, 3 and 4 (a QUIC-blocking client profile, an atomic SNI-donor
# cutover, and a second XHTTP+Reality inbound) were remedies for hypotheses H1-H4. Stage 1
# selected NONE of them: branch (a0)'s guard fired because direct+Vision passed observation
# 3 outright, the branch (e) hold was run and reached 25 minutes against its 30-minute
# threshold — a 5-minute shortfall, recorded rather than legislated away, and the symptom was
# provisionally attributed to the fp / host / sni triple separating the profile the user
# reported failing from the one that passed. Executing those three stages would have been
# repairing what is not broken, and the donor cutover would have broken all seven clients'
# links at once for no gain. The user approved the contraction on 2026-08-04 via
# AskUserQuestion, together with two decisions the link stage encodes: reissue the six other
# clients' links WITHOUT adding Vision server-side, and change the inbound fingerprint.
# That contraction did NOT reduce the evidential bar. It raised it: the thinker review of
# the contracted plan found that the original failing profile had never been re-tested, so
# the attribution rested on a weeks-apart before/after pair. A paired-trial control was
# therefore added as a full typed stage, gating the link distribution.
#
# ## Second contraction, recorded 2026-08-04
# That control stage was then REMOVED, and this is the plan's largest deliberate evidential
# concession, so it is recorded plainly rather than buried. It would have cost roughly 50
# minutes of the user's attention, and the sixth review pointed out what the plan had not:
# the plan had wired a negative result to CANCEL the six-client distribution the user had
# already approved — spending the user's attention to revoke their own decision on a task
# they had declared solved. Note what is NOT claimed here: that cancelling was the likely
# outcome. Nobody knows the odds, and the plan's own stage-2 reasoning cuts the other way
# — the fp=ios ground for reissuing the links comes from the 2026-06-30 DPI model and
# holds independently of any trial result, so a null result would have removed the causal
# attribution without removing the reason to reissue. The wiring was wrong, in other
# words, not merely expensive. The same review showed the gate was also in the wrong
# place — it protected the reversible half (optional per-client re-import, old profile still
# on the phone) while the one irreversible act, the panel save that restarts Xray-core for
# all seven clients, sat outside it. BOTH OF THOSE ARE FAULTS IN THE WIRING, NOT REASONS TO
# DELETE THE INSTRUMENT, and the plan fixed them as such: the distribution stage is now
# ungated and the panel edit carries a runtime check, which is what moved the scrutiny to
# where the irreversibility actually is. What removed the trial is the first reason alone —
# ~50 minutes of the user's attention spent against a symptom that is not reproducing, on
# which a paired trial has little power in either arm. Stage 2 states this split; it is
# repeated here because an appendix that still reads as "these three things justified the
# removal" is how a retracted argument comes back.
# WHAT IS LOST, stated so no later reader mistakes this plan for one that demonstrated a
# fix: the causal attribution to the fp/host/sni triple remains a HYPOTHESIS. The failing
# profile was never re-observed under controlled conditions; the before/after pair is weeks
# apart; intermittency explains it just as well. corrected-links.md carries this in its
# header, and the paired trial survives as standing lever R8.
#
# ## Risks
#  R1. MTS may be matching the destination IP or the WorldStream ASN 199058 rather than any
#      protocol signal. Recorded as UNTESTED-BY-THIS-PROBE: the (a0) guard made the YC and
#      no-Vision control profiles unnecessary, so they were deliberately not run. This is
#      not evidence against R1, only absence of evidence about it. If the symptom returns
#      on a network where the corrected link also fails, R1 is the first thing to test, and
#      the YC entry point at 178.154.253.38:8443 is the instrument — not the remedy, for
#      the three reasons in R1's earlier form (blacklisted subnet, no concealment of
#      the0.fun through eth0 DNAT+MASQUERADE, Vision broken by that path).
#  R2. The 25-minute run was measured on the0-diag — the profile built from the CORRECTED
#      rpqowix2 link, NOT the original 0-rpqowix2 the user reported failing — and it
#      carries Vision. The six reissued
#      links do not, because their stored flow is empty. They therefore carry the fix for
#      the leading candidate cause (fp=ios) but not the packet-length obfuscation the tested
#      profile had, and they are NOT covered by the evidence from stage 1. Accepted
#      knowingly by the user rather than mitigated; the file states it in its header.
#  R3. The attribution is not to a single field. Three fields changed together between the
#      failing profile and the working one — hostname vs literal IP, fp=ios vs fp=firefox,
#      sni=ferzu.com vs sni=www.ferzu.com. fp=ios is the one named as a DPI signal in
#      project memory, which is why it leads, but a single-field experiment was never run.
#      The IP literal specifically has NO direct evidence behind it and is not sold as a
#      "correction": project memory records the confirmed-working combination as "direct
#      the0.fun:443 + Vision + fp=firefox", i.e. with the HOSTNAME. Resolution, after the
#      round-2 review pointed out that the earlier justification was applied selectively:
#      the literal is kept ONLY on rpqowix2, where "it is what passed" is literally true,
#      and the six untested clients get the0.fun. They are untested either way, so this
#      costs nothing evidentially and cuts the silent-simultaneous-break radius from seven
#      to one. Residual on that one: if rpqowix2 stops connecting while the others still
#      work, suspect a VPS IP change first — check-links.py accepts either endpoint, so
#      regenerating it against the hostname does not fail verification.
#  R4. The agent has no sudo password and no 3x-ui panel credentials. The one write in this
#      plan is therefore executed by the user, in the panel, not by the agent.
#  R5. The niche SNI donor ferzu.com remains in place — the third signal in the recorded
#      DPI model, still unaddressed, exactly as it was on 2026-06-30. Deferred knowingly,
#      and the earlier reason given ("it breaks all seven clients at once") is only half of
#      it, since a six-client distribution is happening in stage 3 anyway. The reasons
#      that actually hold: (a) stage 3's re-import is OPTIONAL per client and can be taken
#      at leisure, whereas a donor change is a FORCED break with no working fallback link;
#      (b) there is no current symptom to justify it; (c) a donor swap injects a new,
#      untested variable into a configuration that just passed a 25-minute observation, and
#      a poorly chosen donor can be worse than ferzu.com. It remains the standing next lever
#      if the symptom returns, and it is the natural companion to R1 if a Russian entry
#      point is ever adopted.
#  R6. RETIRED 2026-08-04. It recorded that the whole change set rested on at most two
#      paired trials and was therefore weak evidence. It went out with the paired-trial
#      stage itself; the residual it named is now stated in stronger form by R8, since
#      the evidence is not two weak trials but zero. The number is kept rather than
#      reused so that a reader who finds R6 cited anywhere older lands here.
#  R7. The QUIC-blocking routing rule (udp/443 -> block in the client profile) was
#      dropped with the 2026-08-04 contraction and is recorded here so it remains a
#      named standing lever rather than surviving only as a line in a scope-change
#      comment. It was the remedy for H1, which stage 1 did not select — branch (a0)
#      fired and no hypothesis was chosen, so H1 was never excluded either. External
#      research names it the standard fix for the exact shape the user reported
#      ("YouTube stalls through the tunnel while ordinary sites are fine"). It is
#      client-side, costs nothing on the server, breaks no link, and is reversible per
#      profile, which makes it the CHEAPEST next lever if the symptom returns —
#      cheaper than R5 (donor cutover, breaks all seven at once) and than R1 (entry
#      point). Its cost is that QUIC dies for everything else in the tunnel, which is
#      narrowed by scoping the rule to the YouTube and Instagram domains.
#  R8. THE ATTRIBUTION IS UNTESTED, and this is the plan's principal residual risk. The
#      evidence is a single weeks-apart before/after pair: a failure reported before this
#      session on 0-rpqowix2, and a clean 25-minute run today on a profile differing from it
#      in three fields at once. Intermittency predicts that same pair equally well. The
#      instrument that would separate them was designed in full and then removed by user
#      decision (see the second contraction) — a paired trial on MTS mobile data, four runs
#      of >=11 minutes each, A being the untouched original profile and B the corrected one,
#      alternating so the network is held roughly constant across the two configurations.
#      Use B/A/A/B ordering, not A/B/A/B: with A in slots 1 and 3 a monotone network trend,
#      such as evening cell load, biases every A-vs-B comparison the same way, and the
#      balanced order removes the linear component for free. Any shortening rule needs a
#      floor on BOTH arms, not just A: the freeze model predicts loss out to 600 s, so runs
#      shortened below that on the B arm land inside the very blind spot the 11-minute
#      figure exists to clear. THIS IS THE FIRST LEVER IF THE SYMPTOM RETURNS, and it is
#      cheaper then than it is now, because a live symptom is what makes an A-arm run
#      informative at all — running it against a symptom that is not currently reproducing
#      is what made it a bad trade today.
#
