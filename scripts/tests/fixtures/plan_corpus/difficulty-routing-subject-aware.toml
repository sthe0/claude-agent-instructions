[meta]
task_id = "difficulty-routing-subject-aware"
goal = "Fix two coupled defects in difficulty-channel routing. (a) scripts/difficulty_channel/detect.py classifies a machine as strong-internal (-> startrek) SOLELY because the `skotty` binary is on PATH (detect.py:50-51 appends 'skotty' to strong_internal unconditionally), even with no ~/.tracker-token and a GitHub remote — it only warns 'writes may fail' and never re-routes, so difficulty reports are pointed at a Startrek queue this machine cannot write to. (b) The report's SUBJECT LAYER (Core-system vs project) is honored on ONE channel only: file-difficulty.py:106 calls resolve_project_queue(target) inside the `channel=='startrek'` branch (project target -> its project queue, e.g. DEEPAGENT; Core -> OOSEVENREPORT), but the `channel in ('github','external')` branch (file-difficulty.py:124-127) NEVER consults the subject — a project-scoped difficulty is silently dumped into the single public Core GitHub repo with the same label as a Core difficulty. Fix: (a) demote skotty so it forces startrek ONLY when backed by a writable credential (~/.tracker-token) or an unambiguous corp marker; (b) make the github/external branch subject-AWARE — if the target resolves a project queue (subject==project) it must NOT be filed into the public Core repo: refuse with a clear message (the honest 'don't route where the channel cannot deliver' outcome), leaving Core-subject difficulties routing to github exactly as today. NOTE: `--layer` (ADR precedence core|team|personal, port.py:48) is a DIFFERENT axis from the subject and is deliberately left untouched; no vocabulary reconciliation is performed (port.py:48 is already correct)."
done_criterion = "detect.py: a machine with skotty on PATH (or ~/.skotty) but NO ~/.tracker-token and none of {corp-hostname, arcadia-toolchain, /etc/yandex} resolves to 'github' (not 'startrek'); the unambiguous corp markers still force startrek; ~/.tracker-token alone still yields startrek. file-difficulty.py: on the github/external channel, a target that resolve_project_queue resolves to a project queue (subject==project) causes a clear non-zero refusal (not a silent Core-repo submission); a Core-subject target on github routes to the Core repo exactly as today; the startrek branch is unchanged; `--layer` handling and port.py:48 are unchanged. New/updated tests cover every branch; verify-all.py stays green (16/16) and the full pytest suite stays green; committed on the worktree branch. Measurable gates resolution; the user gives final acceptance on review."
criterion_type = "measurable"
weight_class = "substantive"
repo_root = "/Users/the0/cai-wt-droute"
external_research = "none"

[[stage]]
index = 1
title = "detect.py: skotty must not force an unwritable startrek channel"
executor = "spawn:developer"
expected_result_image = "scripts/difficulty_channel/detect.py's decision ladder is changed so the `skotty` signal (detect.py:50-51: `if path_exists('~/.skotty') or has_command('skotty'): strong_internal.append('skotty')`) no longer sits UNCONDITIONALLY in the strong_internal group that short-circuits to 'startrek'. New behavior: the three UNAMBIGUOUS corp markers — corp-hostname (.yandex.net/.yandex-team.ru), arcadia-toolchain (`has_command('ya') and has_command('arc')`), /etc/yandex — keep forcing startrek (with the existing no-tracker-token warning). skotty becomes an internal-but-not-authoritative signal that forces startrek ONLY when a writable credential is present (~/.tracker-token) OR one of those unambiguous markers is also present; when skotty is the ONLY internal signal and ~/.tracker-token is absent, the ladder falls through to the github-credential branch (a github cred -> 'github') else the default ('github'). skotty is still appended to `evidence` either way, and DetectResult's warnings still explain the choice. detect_channel keeps its four injected probes (hostname/has_command/path_exists/getenv) — NO new git-remote probe. test_detect.py is updated: the existing skotty-strong test (~test_detect.py:94-97) is REWORKED to assert skotty-alone-without-tracker-token -> 'github' (the load-bearing new guarantee); the corp-hostname/arcadia/etc-yandex tests and the both-tokens test (~test_detect.py:33-42) still pass unchanged. A skotty+tracker-token case may be asserted -> 'startrek' but is acknowledged as WEAK (tracker-token alone already yields startrek, so it proves skotty is not a blocker, not that skotty is load-bearing)."
criterion_type = "measurable"
done_criterion = "python3 -m pytest scripts/tests/test_detect.py -q is green; the reworked test asserts skotty-alone-no-token->github; corp markers and tracker-token-alone still ->startrek"
verify_command = "cd /Users/the0/cai-wt-droute && python3 -m pytest scripts/tests/test_detect.py -q && echo GATE_OK"
expected_exit = 0
depends_on = []
output_artifacts = ["scripts/difficulty_channel/detect.py", "scripts/tests/test_detect.py"]
material = "detect.py:44-83 (the ladder), detect.py:50-51 (the skotty append), the strong->startrek short-circuit + github/weak/default branches; test_detect.py:33-42 (both-tokens-strong-wins), test_detect.py:94-97 (skotty-strong test to rework); detect.py:7 header comment listing skotty as a STRONG signal (update it)"
means = "Edit, Write, Bash (pytest)"
method = "Move the skotty detection out of the unconditional strong_internal append. Keep corp-hostname, arcadia-toolchain (ya AND arc), and /etc/yandex as strong_internal (unambiguous 'this IS a corp machine'). Represent skotty as a separate internal signal that contributes to a startrek choice only when (~/.tracker-token present) OR (a strong marker is also present); otherwise let control reach the github-credential branch and then the default. Update the detect.py:7 header comment so it no longer lists skotty as unconditionally STRONG. Update test_detect.py accordingly. DESIGN RATIONALE (recommended; considered-and-rejected alternative recorded): a git-remote probe (gate skotty-only-strong on `git remote` != github) was CONSIDERED and REJECTED — it adds a new injected probe + a subprocess for the same outcome, because the only machines whose verdict changes are personal machines with skotty-but-no-token-and-no-corp-marker, for which 'github' is correct regardless of remote. The credential-writability gate ('never choose a channel you cannot write to') captures the intent more simply and is the same principle stage 2 applies on the github side."
conditions = "work happens in the worktree /Users/the0/cai-wt-droute (branch difficulty-routing-subject-aware, currently at fresh origin/main 8e6e84b); the canonical checkout /Users/the0/claude-agent-instructions stays read-only (mutated only by pull); detect_channel stays fully dependency-injected"
invariants = "all edits confined to the worktree; canon untouched; corp-hostname/arcadia-toolchain/etc-yandex remain strong-internal (still force startrek); tracker-token-alone still yields startrek; skotty stays in `evidence`; do NOT weaken the genuine strong markers; do NOT add a network/subprocess call to detect_channel; English-only; PRESERVE: the verify asserts test_detect.py green with skotty-alone-no-token->github AND corp-markers->startrek AND tracker-token-alone->startrek"
capability_required = "python + pytest + repo edit"

[stage.principle]
statement = "A router must not select a destination the caller cannot use: an ambient signal (a corp CLI merely installed) that only *suggests* a channel must not override the absence of the credential needed to write there; reserve the hard override for signals that unambiguously mean 'this machine belongs to that channel'."
source = "detect.py already emits 'startrek chosen but ~/.tracker-token not found; writes may fail' — it recognizes the unwritable-channel smell but only warns instead of re-routing; config.md difficulty-channel row documents startrek REQUIRES ~/.tracker-token"
derivation = "skotty is a corp certificate CLI a developer may install on a personal machine; its presence implies neither a Startrek write credential nor corp ownership. corp-hostname/arcadia-toolchain/etc-yandex DO imply corp ownership. Routing skotty-only machines to a token-less startrek guarantees a failed write; falling through to github (the org-neutral default) yields a usable channel. Therefore gate skotty's startrek-forcing on a writable credential or a genuine ownership marker."
confidence = "high"
refutation = "if skotty were only ever installed on machines that also hold ~/.tracker-token, the demotion would be a no-op and the original unconditional strong-signal would suffice"

[[stage]]
index = 2
title = "file-difficulty.py: github/external channel becomes subject-aware (refuse a project-subject difficulty it cannot deliver)"
executor = "spawn:developer"
expected_result_image = "scripts/file-difficulty.py's `channel in ('github','external')` branch (file-difficulty.py:124-127) becomes subject-aware. It resolves the subject the SAME way the startrek branch already does — project_q = resolve_project_queue(Path(args.target).resolve()) — and, when project_q is not None AND no explicit --queue override is given (subject==project on a channel whose project queues are Startrek-only and whose Core repo is public/org-neutral), it REFUSES with a clear non-zero message, e.g. 'error: this is a project-scoped difficulty (target resolves to project queue <Q>) and the github channel cannot deliver it to a project queue; file it against the project'\\''s own tracker, or if it is genuinely a Core difficulty, target a Core file (or pass --queue to file it explicitly)'. The message must NOT mention `--layer` (that axis does not gate this refusal — the path oracle does; mentioning it would falsely imply it lifts the refusal). A Core-subject target (project_q is None) on github routes to the Core repo EXACTLY as today (label difficulty/backlog by --stream). This refusal fires on --dry-run too (the preview shows the refusal, not a fake routing), mirroring the startrek fix-first guard's --dry-run behavior. The startrek branch, the author gate, the fix-first guard, and `--layer` handling are ALL unchanged; NO edits to port.py, the adapters, project_queue.py, or authority.py; port.py:48 ('core|team|personal') is intentionally left as-is (correct — that is the precedence axis, not the subject axis). test_file_difficulty.py is extended: a github-channel project-target refuses non-zero with the guidance message (submit-path and --dry-run); a github-channel Core-target still routes to the Core repo unchanged — the Core-target test uses a hermetic `tmp_path` target with NO up-tree `agent-project.json` (so it does not rely on the worktree's CWD happening to sit under no project); existing startrek/author/stream tests still pass. test_project_queue.py, test_difficulty_channel.py, test_difficulty_adapters.py stay green (no shape change to project_queue/port/adapters)."
criterion_type = "measurable"
done_criterion = "python3 -m pytest of test_file_difficulty.py + test_project_queue.py + test_difficulty_channel.py + test_difficulty_adapters.py is green; a github-channel project-target refuses non-zero (submit + dry-run); a github-channel Core-target routes to the Core repo unchanged; startrek branch behavior is unchanged"
verify_command = "cd /Users/the0/cai-wt-droute && python3 -m pytest scripts/tests/test_file_difficulty.py scripts/tests/test_project_queue.py scripts/tests/test_difficulty_channel.py scripts/tests/test_difficulty_adapters.py -q && echo GATE_OK"
expected_exit = 0
depends_on = [1]
output_artifacts = ["scripts/file-difficulty.py", "scripts/tests/test_file_difficulty.py"]
material = "file-difficulty.py:98-138 (channel resolution: startrek branch:101-123 incl. resolve_project_queue:106 and fix-first guard:113; github/external branch:124-127; dry-run block:132-138); project_queue.py:13-34 (resolve_project_queue); github adapter record_to_fields (labels built from the record — NOT extended here)"
means = "Edit, Write, Bash (pytest)"
method = "In the github/external branch, compute project_q = resolve_project_queue(Path(args.target).resolve()) exactly as the startrek branch does. If project_q is not None and not args.queue, print the guidance error to stderr and return non-zero (2, matching the fix-first guard's rc); the message must NOT reference --layer (only a Core target or --queue lifts the refusal). Ensure this refusal is reached on the --dry-run path too (place the check before the dry-run print, as the startrek fix-first guard is). Otherwise keep the existing github label/stream routing verbatim for Core-subject targets. Do NOT add a project label to the github issue (that would leak an internal Startrek queue name into the public org-neutral Core repo). Do NOT touch the startrek branch, --layer, port.py, the adapters, project_queue.py, or authority.py. Extend test_file_difficulty.py with the github project-target refusal (submit + dry-run) and the github Core-target unchanged-routing case (hermetic tmp_path target with no up-tree agent-project.json)."
conditions = "stage 1 done; work in the worktree; resolve_project_queue is the proven path-driven subject oracle already used by the startrek branch; the Core GitHub repo is PUBLIC and org-neutral (no internal queue names may leak into it)"
invariants = "all edits confined to the worktree; canon untouched; the startrek branch, author gate, fix-first guard, and --layer are byte-for-byte unchanged; NO edits to port.py / adapters / project_queue.py / authority.py; no internal queue name is written into a github issue; a Core-subject github filing behaves exactly as before this change; English-only; PRESERVE: the verify asserts a github project-target refuses non-zero (submit AND dry-run), a github Core-target routes unchanged, and the startrek tests stay green"
capability_required = "python + pytest + repo edit"

[stage.principle]
statement = "Route by the report's declared subject on EVERY channel using the one existing subject oracle; where the chosen channel cannot deliver a subject to its proper destination, refuse honestly rather than silently mis-file — and never leak a destination's internal identifiers into a different, public channel."
source = "file-difficulty.py:106 already resolves the project subject on the startrek branch; the github Core repo is public/org-neutral (github.py REPO='sthe0/claude-agent-instructions'); check-org-neutral.py exists to keep internal names out of the public venue"
derivation = "The subject oracle (resolve_project_queue) is already correct and channel-independent, but it is only consulted on startrek, so the github branch is subject-blind and dumps project difficulties into Core. Reusing the same oracle on the github branch makes routing subject-aware everywhere. Because project queues are Startrek-only and the Core github repo is public, the only honest github outcome for a project subject is refuse-with-guidance — labeling the public issue with the internal queue name would leak org-internal identifiers. This is the same 'do not route where the channel cannot deliver' principle stage 1 applies to detect.py."
confidence = "high"
refutation = "if projects declared a github-native difficulty destination (a repo/label) in agent-project.json, the github branch could positively route a project subject there instead of refusing — that is a heavier, separately-approved design (the 'project github destination' option), deliberately out of scope here"

