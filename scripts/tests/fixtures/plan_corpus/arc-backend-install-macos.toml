[[stage]]
index = 5
title = "Live end-to-end run: create a new arc project, enter it, tear it down clean"
executor = "in_thread"
expected_result_image = "Three halves, all observed. (0) Creation — this is the half the user's original order names: the --init selector runs on the arc backend and produces a NEW registered project, not merely a working copy of an existing one. The exact invocation is `CLAUDE_PROJECT_INIT_BASE=<chosen base dir> enter-task.sh --init <scratch-name> --workspace arc` — --init takes the name as its OWN argument (enter-task.sh:65), so `--init --name <scratch>` would bind the selector argument to the literal string '--name' and die with 'unknown argument'; the destination is explicit rather than defaulted, because enter-task.sh:264 otherwise resolves the new project to `$PWD/<name>`, i.e. wherever the shell happened to be; and `--workspace arc` is explicit too, because without it a record auto-detected from the cwd (:109) outranks the identity default (:150 above :151) and an inferred name that fails to resolve falls back to git SILENTLY at :193-195 — so run from inside any registered git project, the creation half would seal a git commit, report success, and never touch arc. With the flag, a resolution failure dies loudly at :198 instead. The base dir is chosen from stage 2's INITTARGET verdict. enter-task.sh:205-208 refuses this half outright unless the backend defines both backend_init_workspace and backend_seal_workspace, so stage 2's INIT: verdict decides whether it can run at all; INIT: absent makes it RED here and routes to R6, it does not license quietly skipping it. Note that the init path also commits: enter-task.sh:296 calls backend_seal_workspace, whose meaning for a monorepo backend is read out in stage 2's SEAL: verdict before this half runs — and enter-task.sh:298-300 registers the new project itself with workspace_backend=arc, so no hand-written record is needed for it. (1) Entry: `claude-task <name>` creates a real arc working copy on this Mac and launches the agent with that copy as its cwd — the user sees a shell/session rooted in the monorepo working copy, and `arc info` (or the equivalent the client provides) run inside it reports a live mount. (2) Teardown: the workspace is removed with `arc unmount --forget` (plus --force if the registry entry is stale), after which the arc mount listing shows no WARN line for it and no store remains under ~/.arc/stores/ for that workspace. A short evidence file records all three halves so the final verification can confirm them without re-running anything: the exact --init invocation with its CLAUDE_PROJECT_INIT_BASE, the created project's path, the path of the registry record enter-task.sh:298-300 wrote and its workspace_backend field, the user's confirmation of the launched session's cwd, and the mount listing before and after."
criterion_type = "acceptance-review"
done_criterion = "User confirms a NEW arc project was created through --init, that the agent launched inside a real arc working copy, and that the post-teardown mount listing is clean"
verify_command = "user observation: --init creates and registers a new arc project, claude-task entry lands in a live arc working copy, then a clean arc mount listing after unmount --forget"
expected_exit = 0
depends_on = [4]
output_artifacts = ["/Users/the0/.claude-agent/plans/arc-backend-install/e2e-run.md"]
material = "The registered arc project from stage 4; a throwaway task name for the workspace; an explicitly chosen creation base dir for the --init half (CLAUDE_PROJECT_INIT_BASE), taken from stage 2's INITTARGET verdict rather than from $PWD"
means = "claude-task itself (the whole point of the exercise); the arc mount listing and ~/.arc/mount-points as the residue observable; the overlay's teardown verb or arc-mounts-gc.sh if the inventory found one"
method = "Run the --init half first, with a scratch project name rather than a ticket, so no tracker write is attempted, and with CLAUDE_PROJECT_INIT_BASE set explicitly to the base dir stage 2's INITTARGET verdict prescribes — never relying on the $PWD default. If it dies with 'workspace backend arc does not support --init', stop and route to R6 rather than substituting the plain entry half and calling the stage green. Before running it, know from stage 2's SEAL verdict what the seal step commits and where, since enter-task.sh:296 invokes it unconditionally on this path. Confirm inside the launched session that the cwd is a live arc working copy and that the .claude wiring the backend's compose verb is responsible for is present. Exit, then tear down EVERY artifact this stage created — the entry working copy and, when the init verb materialized a separate one, the created project too, checking the mount listing against the pre-stage baseline rather than against memory — with the full verb — `arc unmount --forget`, not plain `arc unmount`, because plain unmount only detaches and leaves the store and the registry entry behind; that residue accumulated to 11 stale WARN entries and 6.3 GB on the reference machine before anyone noticed. Before forgetting, check the workspace has no unpushed branch and no dirty state. Capture the mount listing before and after into the evidence file."
conditions = "Stages 1-4 complete; stage 2's INIT: verdict reads supported (otherwise the creation half is blocked — R6); free disk measured at 231 GiB on 2026-08-04 against a GB-scale store, so the disk condition is quantified and non-binding for a single workspace"
invariants = "This stage can produce TWO arc artifacts — the project the --init half creates and the working copy the entry half creates (they coincide only if stage 2's INITTARGET verdict says the init verb materializes the same mount) — and BOTH are torn down before the stage is done, which is what makes Final-verification step 6's baseline comparison satisfiable. Everything this stage created is enumerated in its evidence file and each entry is accounted for as torn-down or deliberately kept. Any arc working copy that existed on the machine beforehand is left untouched, and no branch with unpushed commits is forgotten"
capability_required = "User present to confirm the launched session is inside the arc working copy (the acceptance half of the criterion)"

[stage.principle]
statement = "A workspace backend is only proven by a real mount plus a clean teardown, because the failure modes it is bought to avoid — a compose verb that does not wire .claude, and a mount lifecycle with no teardown — are both invisible to a dry run"
source = "memory leaf experience/2026-07-04-arc-task-mount-teardown-forget.md (plain unmount is a detach; stores and ~/.arc/mount-points entries persist by design; full teardown is unmount --forget, stale entries need --force)"
derivation = "That leaf records the exact residue class this stage checks for, and records that it went unnoticed for weeks precisely because nothing in the lifecycle looked at it — the mount succeeded, the work happened, and only an explicit listing revealed the accumulation. So the acceptance check has to name the listing as its observable, not the successful entry."
confidence = "high"
refutation = "If the macOS client turns out to have no persistent store/registry model at all (see stage 1's refutation), the teardown half degrades to whatever cleanup verb that mode has, and the residue check is replaced by a plain 'the working copy directory is gone'"

# ## Final verification
# Run by the manager after stage 5, in this order.
# NO step of this pass creates a workspace. The effectful create-enter-teardown run
# happens ONCE, inside stage 5, and this pass confirms its outcome from stage 5's
# evidence and from pure probes. Re-running --init here would create a second working
# copy AND commit (enter-task.sh:296 seals), which nothing would then tear down and
# which step 6's baseline comparison would fail on. Every step below is
# side-effect-free by construction: 1 and 4 are pure probes, 2 and 3 read artifacts,
# 5 and 6 are listings.
#   1. bash -c 'source ~/claude-agent-instructions/scripts/project_entry/registry.sh;
#        registry_resolve_workspace arc'      -> exits 0 (structural precondition;
#      pure name resolution, no backend verb runs)
#   2. Stage 5's evidence file records, for the ONE run it performed: the --init
#      invocation with its explicit CLAUDE_PROJECT_INIT_BASE, the created project's
#      path, the registry record enter-task.sh:298-300 wrote with
#      workspace_backend=arc, the user's confirmation that the agent launched inside
#      the working copy, and the mount listing before and after the teardown.
#      (Blocked by R6 if the overlay's backend lacks init+seal.)
#   3. The record from step 2 is present on disk and reads workspace_backend=arc.
#   4. The three dry-run selection probes of stage 4 still hold: arc-by-record,
#      arc-by-identity from /tmp, and git-by-record for the0.fun -> workspace=arc,
#      workspace=arc, workspace=git. The two arc-asserting probes pin
#      CLAUDE_PROJECT_PLUGIN_DIR at a nonexistent dir (and the record probe also pins
#      CLAUDE_AGENT_IDENTITY, so identity cannot supply the answer the record is
#      being tested for), so they assert on the enter-task.sh:170 log line and never
#      reach a backend verb; the git probe needs no pin (git.sh honours the dry run).
#   5. bash ~/claude-agent-instructions/scripts/enter-task.sh --list-projects
#        -> all four git rows still listed; ~/.claude-agent/projects.d still absent
#   6. The arc mount listing equals the one captured before stage 3's probe — i.e.
#      neither stage 3's probe nor stage 5's workspace left residue behind.
# Pass = all six. Anything less routes to overcome-difficulty, not to a close.
#
# ## Risks
#   R1 macOS FUSE prerequisite. An arc working copy is a FUSE mount; on macOS the
#      filesystem driver is security-gated and may need an approval plus a reboot.
#      Surfaces in stage 1; mitigation is the user's presence at the prompt.
#   R2 The overlay is Linux-shaped. It was written on a host with /home/the0 and a
#      ~/task-mounts anchor. setup-local.sh may no-op here (its toolchain detection
#      does not recognize this Mac) or backends/arc.sh may hardcode Linux paths.
#      Surfaces in stage 2's portability verdict, bites in stage 3. If it bites, the
#      fix is a port of the overlay (a developer spawn against the overlay repo,
#      NOT an edit to Core) — that is a substantive replan, not a silent extension.
#   R3 The reference machine is gone. the0.klg.yp-c.yandex.net no longer resolves,
#      so nothing can be copied from a known-good installation and every step is a
#      first-time install rather than a replication.
#   R4 Tracker asymmetry. Arming the internal tracker backend needs ~/.tracker-token,
#      absent here; stage 4 deliberately leaves tracker_backend=none, so ticket-keyed
#      entry (claude-task ABC-123) will NOT work until that token is added. This is a
#      known, stated scope limit of this plan, not an oversight.
#   R5 Disk. Materialized arc stores are GB-scale; without the teardown discipline of
#      stage 5 they accumulate silently (6.3 GB on the reference machine). Quantified:
#      231 GiB free on this Mac 2026-08-04, so the risk is accumulation over time,
#      not capacity for the single workspace this plan creates.
#   R6 The overlay's arc backend may not implement project CREATION. --init is gated
#      at enter-task.sh:205-208 on backend_init_workspace AND backend_seal_workspace;
#      a backend that only defines ensure_workspace + compose supports entering an
#      existing project and nothing more. Surfaces as stage 2's INIT: verdict, bites
#      in stage 5's half (0). If it bites, the user's actual order ("start a NEW
#      project in the arc layer") is unreachable without adding those two verbs to
#      the overlay — a developer spawn against the OVERLAY repo, never against Core,
#      and a substantive replan requiring approval, not a silent narrowing.
#   R7 The dry-run probe may not be side-effect-free. enter-task.sh calls
#      backend_ensure_workspace unconditionally (:305) and gates only compose on the
#      flag (:308-312); honouring CLAUDE_DRY_RUN inside ensure_workspace is a backend
#      obligation the git backend meets (git.sh:40/56/70) and the overlay's arc
#      backend may not. Surfaces as stage 2's DRYRUN: verdict; if not-honoured, every
#      "probe" in this plan creates a real mount, which is why stage 3 and Final
#      verification both carry an explicit before/after listing and a teardown.
#
# ## Operator questions
#   Q1 [assumption] The overlay lives under junk/<user>/agents/ in the monorepo, per
#      the teardown experience leaf. Stage 2 confirms by search; if it is elsewhere,
#      the path is a stage-2 finding, not a plan change.
#   Q2 [decided] tracker_backend stays none in this plan (see R4). Adding the token
#      and arming the internal tracker is a separate task.
#   Q3 [assumption] Nothing needs to be recovered from the old dev host. If it does,
#      that is a separate task blocked on restoring access to it. Bound to stage 2's
#      material, not to the plan goal: the old host would only ever have served as a
#      reference copy of the overlay installation stage 2 inventories.
#   Q4 [decided] Project CREATION is in scope, not just task entry. The user's order
#      was to start a NEW project in the arc layer, so --init is part of the done
#      criterion and stage 5 carries a creation half. See R6 for what happens if the
#      overlay cannot do it.
#   Q5 [open, answered by stage 2] Does the overlay's arc backend honour
#      CLAUDE_DRY_RUN inside ensure_workspace? Answered by the DRYRUN: verdict before
#      any probe runs; see R7.
#   Q6 [open, answered by stage 2] What does the arc backend's init verb do with the
#      target path enter-task.sh hands it, and what does its seal verb commit? The
#      INITTARGET: and SEAL: verdicts answer both before stage 5 invokes them; the
#      creation destination is then passed explicitly via CLAUDE_PROJECT_INIT_BASE
#      rather than left to the $PWD default at enter-task.sh:264.
#   Q7 [decided] The live registry root on this machine is ~/.claude/projects.d, not
#      the isolated-root path: projects.sh:29-40 falls back to it precisely because
#      ~/.claude-agent/projects.d does not exist. Stage 4 writes there and asserts the
#      isolated dir stays absent — creating it would hide all four git records.
#
# ## Residual weakness, stated rather than hidden
#   Stages 1-3 are controlled by marker greps over evidence files the executor writes
#   itself, so they are falsifiable only in the weak sense: an executor that fabricates
#   a marker gets a green stage. The citation requirement on stage 2's verdicts
#   ([file:line] per line) raises the cost of fabrication and makes review possible,
#   but does not eliminate it. The strong controls in this plan are stage 3's registry
#   resolution, stage 4's precedence probe and stage 5's user-observed run — those are
#   the ones that can fail on their own.
