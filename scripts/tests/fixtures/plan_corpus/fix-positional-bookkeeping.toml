[[stage]]
index = 1
title = "Add an optional content anchor to the pin grammar"
executor = "in_thread"
expected_result_image = "verify-config-root-refs.py accepts a third pin field: `path:line:<sha8>` where sha8 is the first 8 hex of sha256 over the referenced line's stripped text. The candidate set an anchor resolves against is the file's OCCURRENCE lines — the lines find_occurrences already emits — never all lines of the file; that is the mechanism's own domain and it keeps ambiguity rare. Five resolution outcomes, each covered by a test: (i) anchor matches at the pinned line -> covered, exactly as today; (ii) anchor does not match at the pinned line but matches EXACTLY ONE other occurrence line -> RELOCATED: covered, not stale, not unallowed, and a notice naming old->new line is printed on the DEFAULT run (not only under --repin), so a reference that travels a long way is visible in the check's own output; (iii) anchor matches no occurrence line -> stale, the existing hard failure; (iv) anchor matches MORE THAN ONE occurrence line -> ambiguous, hard failure naming the candidates, never a silent guess; (v) cross-entry: two entries for the same file resolving to the SAME occurrence -> hard failure, because otherwise one entry silently double-covers while the other occurrence surfaces as unallowed with no stated cause. A bare `path:line` entry keeps today's behaviour byte-identical. A `--repin` flag rewrites the allowlist in place with relocated line numbers and freshly-computed anchors, preserving each entry's reason text verbatim."
criterion_type = "measurable"
done_criterion = "pytest on the verifier's own test module passes — the five resolution-outcome tests, a back-compat test that an unanchored pin behaves as before, and the anti-vacuity test below — AND the real 87-entry allowlist still verifies green through the unchanged no-flag path"
verify_command = "set -o pipefail && python3 -m pytest -q scripts/tests/test_verify_config_root_refs.py::test_anchor_matches_at_pinned_line scripts/tests/test_verify_config_root_refs.py::test_anchor_relocates_to_single_other_occurrence scripts/tests/test_verify_config_root_refs.py::test_anchor_matching_no_occurrence_is_stale scripts/tests/test_verify_config_root_refs.py::test_anchor_matching_two_occurrences_is_ambiguous scripts/tests/test_verify_config_root_refs.py::test_two_entries_resolving_to_same_occurrence_fail scripts/tests/test_verify_config_root_refs.py::test_unanchored_pin_behaves_as_before scripts/tests/test_verify_config_root_refs.py::test_anchor_definition_matches_independent_literal && python3 scripts/verify-config-root-refs.py && python3 -m pytest scripts/tests/test_verify_config_root_refs.py -q 2>&1 | tail -3"
expected_exit = 0
depends_on = []
output_artifacts = ["scripts/verify-config-root-refs.py", "scripts/tests/test_verify_config_root_refs.py"]
material = "scripts/verify-config-root-refs.py (329 lines: parse_allowlist / _covers / find_stale_entries / scan) and its 199-line test module. Enumerated and confirmed this session: these two files are the ONLY readers of the pin grammar in the repo — no hook, generator or worklist parses the allowlist, so the grammar extension has exactly one consumer to keep honest."
means = "Edit + pytest in the delivery worktree"
method = "Extend the pin regex to an optional third `:<hex8>` group; compute anchors with a single _line_anchor(text) helper; resolve each anchored entry against the file's occurrence lines before find_unallowed/find_stale_entries run, so both consumers see the resolved line; add --repin writing through a parse-preserving rewrite. ANTI-VACUITY: because --repin writes anchors with _line_anchor and the validator reads them with _line_anchor, a self-consistently wrong helper (whitespace mismatch, or degenerately constant) would make every downstream green vacuously — so one test pins the anchor definition against an INDEPENDENTLY computed literal: a hard-coded hex constant in the test body for a known line text, obtained without calling _line_anchor."
conditions = "All edits in /Users/the0/claude-agent-instructions-anchor; the canonical checkout stays read-only"
invariants = "An unanchored `path:line` entry must behave EXACTLY as today — the migration must be opt-in at the grammar level, not a flag day. Relocation is only ever silent-safe when the line text is byte-identical; anything else fails loudly. Never auto-rewrite the allowlist outside explicit --repin, and --repin must not disturb the existing accepted-and-ignored --staged flag or the no-flag path verify-all.py invokes. --repin rewrites IN PLACE, not from parsed entries: the 12-line comment header (lines 1-12, with line 13 blank), every blank line, and the raw two-space separator before `#` all survive byte-identical, or stage 2's diff review is worthless and the file loses its own documentation. ACCEPTED NAMED LIMIT: a byte-identical line cut and pasted into a DIFFERENT section relocates silently while a section-scoped reason (guards.md:48, :50, autocompact-threshold-policy.md:60 are worded that way) quietly goes stale. Anchoring over `nearest preceding heading + line` was considered and rejected: most reasons here are section-independent boilerplate (26 identical `keep:harness-owned` lines), so heading-scoping would churn the many to guard the few. The default-run relocation notice is the mitigation, and the limit is stated in the header rather than left to be rediscovered."
capability_required = "none beyond local repo access"

[stage.principle]
statement = "A pin whose identity is positional must carry the content it points at, or it cannot tell 'the reference changed' from 'something above it moved'"
source = "the allowlist's own header — 'Prefer the line pin: a stale pin forces a human to re-read the reference'"
derivation = "The header states the pin's purpose is to force a re-read when the reference changes. A bare line number cannot observe the reference at all: it fires on any insertion above (no re-read value) and stays silent when the pinned line's text is rewritten while still matching the legacy pattern (re-read needed, none forced). Adding the content anchor makes the mechanism serve exactly the purpose the header claims for it, in both directions — which is why this is a strengthening, not a relaxation."
confidence = "high"
refutation = "if the repo wanted the pin to fire on ANY edit to the governing file, the anchor would defeat that intent — but the header names the reference, not the file, as the thing to re-read, and the whole-file escape form already exists for files where the ordinal is not the identity"

