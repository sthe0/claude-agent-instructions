[[final_check]]
label = "Non-clobber: install into a tmp root leaves ~/.claude byte-identical"
command = "bash -c 'b=$(find \"$HOME/.claude\" -maxdepth 3 2>/dev/null | sort | shasum -a 256); rm -rf /tmp/cc-e2e-root; CLAUDE_AGENT_HOME=/tmp/cc-e2e-root bash scripts/setup-symlinks.sh >/dev/null 2>&1; a=$(find \"$HOME/.claude\" -maxdepth 3 2>/dev/null | sort | shasum -a 256); [ -L /tmp/cc-e2e-root/CLAUDE.md ] && [ \"$b\" = \"$a\" ]'"
expected_exit = 0

[[final_check]]
label = "Isolation: a session on the tmp root writes its session/state there, not in ~/.claude"
command = "bash -c 'rm -rf /tmp/cc-e2e-root2; CLAUDE_CONFIG_DIR=/tmp/cc-e2e-root2 claude config list >/dev/null 2>&1; [ -e /tmp/cc-e2e-root2/.claude.json ]'"
expected_exit = 0

[[final_check]]
label = "Switch: launchers define claude-agent and inject CLAUDE_CONFIG_DIR"
command = "bash -c 'grep -q claude-agent scripts/claude-launchers.sh && grep -q CLAUDE_CONFIG_DIR scripts/claude-launchers.sh'"
expected_exit = 0

[[final_check]]
label = "No residual install-target hardcode + doc-length lints pass"
command = "bash -c 'python3 scripts/lint-prose-length.py && ! grep -REn \"[$]HOME/[.]claude/(CLAUDE.md|config.md|memory-global|skills|agents|settings.json)\" scripts/setup-symlinks.sh'"
expected_exit = 0
