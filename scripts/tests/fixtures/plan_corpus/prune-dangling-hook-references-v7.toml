executor = "spawn:developer"
expected_result_image = "Gap (a) — scripts/self-diagnose.py::_hook_script_path resolves the script behind an interpreter-prefixed command. It defines a module-level set named EXACTLY `_HOOK_INTERPRETER_BASENAMES` (this identifier is a binding contract: stage 5's landing instrument probes for it by name); when tokens[0]'s basename is in that set, or is `env` after skipping leading VAR=val assignments, the walk scans the remaining tokens for the first non-flag absolute path and returns it. Two fail-safe rules stay explicit: (i) a candidate token CONTAINING WHITESPACE is rejected and never treated as a path, so `bash -c '/abs/script.sh arg1'` does not resolve to the whole quoted payload and false-flag a working script; (ii) when tokens[0] is ITSELF an absolute path it is returned directly and the walk does not run, so the live `/Users/the0/.local/share/uv/tools/ccgram/bin/python -m ccgram.main hook` entry keeps today's behaviour. The preserved patch /tmp/cc-scratch/7a26998-interpreter-walk.patch carries a working implementation of exactly this, written against the pre-72b15f0 file; re-apply it as a fresh commit and adapt it to the current text rather than re-deriving it. Gap (b) — scripts/install-reminder-hooks.sh extends its PRUNE pass, and only its prune pass, to ~/.claude/settings.json. The script defines a shell array named EXACTLY `PRUNE_ONLY_SETTINGS` (also a binding contract, probed by name at stage 5) listing the files that receive prune-only treatment; today that is $HOME/.claude/settings.json. The ADD pass and the DESIRED table stay pointed at $CLAUDE_AGENT_HOME/settings.json alone — a prune-only file is never written to except to delete, never gains an entry, and is created if absent by nothing. Each prune-only file gets the same treatment the agent-home file already gets: backup to <path>.bak before any write, JSON validated before writing, edit_ledger.stamp on write, the unchanged ownership rule, and removal of a group emptied by its last deletion. A prune