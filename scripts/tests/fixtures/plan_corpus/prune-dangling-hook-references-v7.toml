# 1. Neither live settings file names hook-answer-delivery-reminder or hook-arc-mount-search-guard.
# 2. self-diagnose.py reports no broken-hook-registration finding on this machine; the three test
#    files plus test_hook_self_diagnose_due.py are green in the canonical checkout; verify-all.py
#    passes there too.
# 3. origin/main AND local main both contain _HOOK_INTERPRETER_BASENAMES in scripts/self-diagnose.py
#    and PRUNE_ONLY_SETTINGS in scripts/install-reminder-hooks.sh; the delivery worktree is removed.
# 4. Acceptance observable: an AskUserQuestion call completes with no PostToolUse hook error — the
#    symptom that opened this task. This cannot be asserted by a shell command and is confirmed at
#    the resolution gate by observation.
#
# NOTE on the DROPPED kind = "landed" final check. Earlier drafts kept it as corroboration. It is
# removed outright, because it is insensitive to the exact failure it appears to guard. With
# verify_venue = "repo_root" the engine's _freeze_delivered_head (cli.py:362-381) rev-parses HEAD in
# the CANONICAL checkout, and render_landed_command (state.py:1004-1053) then asserts
# `merge-base --is-ancestor <that commit> main` and `... origin/main`. Ancestry is monotone, so the
# assertion holds even if stage 5's `pull --ff-only` never ran: the frozen commit would then be the
# PRE-land main, which is still an ancestor of both refs afterwards. It therefore cannot detect a
# missed pull, carries no information the shell checks do not already carry, and adds a refusal
# surface for nothing. The load-bearing landing assertion is stage 5's content probe on the two
# contract identifiers, which is false today, is true only once the change reaches BOTH origin/main
# and local main, and is invariant under rebase.
