refutation = "If verify-all.py already contains a check that reads machine-local state, the machine-independence premise is false and the placement decision should be revisited."

# ---------------------------------------------------------------------------
# Stage 5 — LAND. Plain fast-forward: the branch was cut from origin/main, so
# no merge and no rebase is needed at all.
# ---------------------------------------------------------------------------
[[stage]]
index = 5
title = "Land hook-prune-two-file on main by fast-forward and remove the worktree"
executor = "in_thread"
expected_result_image = "All work is committed on hook-prune-two-file with a message naming the difficulty (a dangling hook registration survives an upstream hook removal because the reconciler's prune pass could neither see an interpreter-prefixed command nor reach ~/.claude/settings.json). The branch is a strict descendant of origin/main, so `git merge-base --is-ancestor origin/main hook-prune-two-file` exits 0 with no merge and no rebase. The full suite (the three test files plus scripts/lint-prose-length.py and scripts/verify-all.py) is green on the branch. The branch is pushed and landed on main by fast-forward via scripts/land-branch.py --remote-only; the canonical checkout is then brought to the landed commit with `git pull --ff-only` BEFORE this stage's result is recorded. origin/main and local main both contain the change; the worktree and the branch are gone locally and remotely."
criterion_type = "measurable"
verify_venue = "repo_root"
done_criterion = "both origin/main and local main carry the two named contract identifiers, and the delivery worktree is gone"
verify_command = '''cd /Users/the0/claude-agent-instructions && git fetch origin main -q && git grep -q _HOOK_INTERPRETER_BASENAMES origin/main -- scripts/self-diagnose.py && git grep -q _HOOK_INTERPRETER_BASENAMES main -- scripts/self-diagnose.py && git grep -q PRUNE_ONLY_SETTINGS origin/main -- scripts/install-reminder-hooks.sh && git grep -q PRUNE_ONLY_SETTINGS main -- scripts/install-reminder-hooks.sh && ! test -d /Users/the0/claude-agent-instructions-hook-prune'''
expected_exit = 0
depends_on = [3, 4]
output_artifacts = ["origin/main"]
material = "the worktree /Users/the0/claude-agent-instructions-hook-prune on branch hook-prune-two-file, forked from origin/main 7d0b9e0 by stage 1, and the canonical checkout sitting on main"
means = "Bash (git fetch, merge-base, push, pull --ff-only), scripts/land-branch.py (ref-only, fast-forward-only)"
method = "Commit any remaining work in the worktree. `git -C <worktree> fetch origin main` and assert landability against the REMOTE tip: `git -C <worktree> merge-base --is-ancestor origin/main hook-prune-two-file` must exit 0. Do NOT rely on `land-branch.py --check` for this: its assess() tests the LOCAL trunk (land-branch.py:122,133) and prints LANDABLE for a push that cannot succeed. If origin/main has moved since stage 1, rebase the branch onto the new tip and re-run the full suite — a rebase is SAFE in this plan because no instrument pins a commit SHA; every landing assertion is a content probe that survives a rewrite. Push the branch. Then `scripts/land-branch.py -C /Users/the0/claude-agent-instructions --branch hook-prune-two-file --trunk main --remote origin --remote-only`, with --check first; --remote-only is required because the canonical checkout has main checked out and `git branch -f` on a checked-out branch is refused (land-branch.py:252-263). Then, BEFORE record-result, `git -C /Users/the0/claude-agent-instructions pull --ff-only`, so local main carries the landed commit — the second and fourth git grep conjuncts exist precisely to catch a missed pull. land-branch.py performs the remote-branch, local-branch and worktree deletion itself; do not hand-roll any of them, and never build an rm from a variable path. This pull is the only mutation of the canonical checkout in the plan, and a pull is exactly what the read-only-to-session-edits rule permits."
conditions = "Stages 3 and 4 verified. The instructions repo is sole-maintained, so a fast-forward land is appropriate and no PR review gate applies. Because stage 1 forked from origin/main, the ordinary case needs no merge at all — the 39-commit merge the previous plan version required is gone with the discarded branch."
invariants = "Never hand-roll checkout / reset --hard / clean on the canonical tree, and never delete a path built from a variable. Leave any parallel-session WIP untouched. Push only this task's commits. Landability is asserted against origin/main, never against the local trunk. The landing instrument is a CONTENT probe on two identifiers this plan fixes by contract, not a pinned SHA, so it is invariant under rebase and states a condition that is false today and true only after landing. Plan-wide temporal invariant this stage is the main threat to, since it deletes the worktree the earlier stages ran in: every stage's verify_command was exercised the way the engine executes it - as bash -c with the engine's own cd <resolved venue> prefix - and in the state the final gate will re-run it in, namely after every later stage has already run. And, as the norm this whole replan closes: the plan's material model is refreshed from the authoritative remote immediately before authoring, and every capability the plan proposes to add is checked against that refreshed state rather than a local snapshot."
capability_required = "git, and the landing script's interface"

[stage.principle]
statement = "Committed work is not delivered until it reaches trunk; a personal branch is a checkpoint, not a terminal state."
source = "CLAUDE.md § On task resolution — landing discipline."
derivation = "The fix's whole purpose is that every future pull, on this and any other machine, inherits the widened reach; a branch that never lands is invisible to sync-instructions-repo.sh pull, so the class-closing property claimed by stage 2 would hold nowhere but this worktree."
confidence = "high"
refutation = "If the repo turns out to be review-gated by a distinct human reviewer, the land must go through a PR rather than a fast-forward."

