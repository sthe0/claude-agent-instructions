[stage.principle]
statement = """
The order-vs-plan rule is an EXTENSION of the existing 'an ask's options must \
span the full set your own analysis enumerated' rule to a second instance, not \
a new norm; and a mechanism whose documentation is not extended with it is a \
mechanism nobody can apply.
"""
source = "CLAUDE.md § Escalation to the user (the existing ask-options rule); planner SKILL.md § Research (the agent's own instructions & mechanisms are reuse material — extend or generalize before inventing, because a narrow single-purpose norm bloats the norm-set the user must hold in memory)."
derivation = """
The existing rule constrains one act (an ask) against one domain (the options \
the agent's own analysis enumerated), on the ground that a bound invented for \
internal economy must not silently become the boundary of the user's choice. \
The plan-against-the-order relation has the identical shape one level up: the \
plan is the act, the order is the domain, and a narrowing chosen for the \
agent's convenience silently becomes the boundary of what gets built. Same \
ground, same constraint — so the norm-set grows by one sentence in an existing \
section rather than by a new rule with its own heading, which is what the \
reuse-before-invent guidance prescribes.
"""
confidence = "high"
refutation = """
Refuted if the two cases turn out to need different handling in practice — e.g. \
if naming cuts in the essence turns out to require a structurally different \
discipline from spanning an ask's options (a standing register rather than a \
per-turn statement), in which case a single appended sentence under-specifies \
and the norm deserves its own place.
"""
