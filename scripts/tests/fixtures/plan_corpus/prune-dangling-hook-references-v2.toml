[meta]
task_id = "prune-dangling-hook-references"
goal = "Remove the two dangling hook registrations that make every AskUserQuestion emit a PostToolUse error (both point at scripts/hook-answer-delivery-reminder.py, deleted upstream in fdbc543), and close the class: make the reminder-hook reconciler able to DELETE its own stale entries, and make the self-diagnose scanner actually able to SEE them. Today apply-settings.sh is additive and install-reminder-hooks.sh is add-only, so every future upstream hook removal leaves the same landmine, surfacing only when the matcher next fires."
done_criterion = "No hook command in ~/.claude/settings.json or ~/.claude-agent/settings.json points at a nonexistent path; install-reminder-hooks.sh --check exits non-zero when a dangling owned entry is present and 0 when clean; self-diagnose.py's broken-hook-registration scan flags an interpreter-prefixed command and reads the agent config root; new/extended tests green; change landed on main."
criterion_type = "measurable"
weight_class = "substantive"
repo_root = "/Users/the0/claude-agent-instructions-prune-dangling-hooks"
external_research = "No external research warranted — this is a defect in this repo's own machinery, fully localized by reading scripts/self-diagnose.py, scripts/install-reminder-hooks.sh and scripts/sync-instructions-repo.sh. Two planner spawns established that both halves of the wanted mechanism already exist in-repo, so no prior art or third-party tool is in play. Upstream cause confirmed by git log: commit fdbc543 'retire-ask-split-crutch: remove turn-split hooks and scrub dangling references' deleted the script deliberately and left no successor."

# ---------------------------------------------------------------------------
# Stage 1 — DETECTION. Close the two enumeration gaps that made the existing
# scanner structurally blind to both live entries. Rule was fine; reach was not.
# ---------------------------------------------------------------------------
[[stage]]
index = 1
title = "Close the two enumeration gaps in self-diagnose.py's broken-hook-registration scan"
executor = "spawn:developer"
expected_result_image = "scripts/self-diagnose.py: (a) _hook_script_path() resolves the script behind an interpreter-prefixed command — when tokens[0]'s basename is a known interpreter (python, python3, bash, sh, zsh, and `env` after skipping VAR=val assignments), it scans the remaining tokens for the first non-flag absolute path and returns that. Two fail-safe rules are explicit: (i) a candidate token CONTAINING WHITESPACE is rejected and never treated as a path — this is what keeps `bash -c '/abs/script.sh arg1'` from resolving to the whole quoted payload and false-flagging a working script as missing; (ii) when tokens[0] is ITSELF an absolute path, it is returned directly and the interpreter walk does not run, even if its basename looks like an interpreter — so the live `/Users/the0/.local/share/uv/tools/ccgram/bin/python -m ccgram.main hook` entry keeps today's behaviour (resolved to the interpreter binary, which exists, hence unflagged) rather than silently changing class. (b) default_settings_paths() additionally enumerates the agent config root's settings.json and settings.local.json via lib/config_root.agent_home(), keeping the existing resolve()-based de-duplication so a symlinked file is still scanned once. Both live dangling entries now appear as broken-hook-registration findings. scripts/tests/test_self_diagnose.py extended with cases for: interpreter-prefixed absolute script that is missing (flagged), interpreter-prefixed script that exists (not flagged), `bash -c` inline shell text (not flagged), `bash -c '/abs/path/script.sh arg1'` where the script EXISTS (not flagged — the whitespace rule prevents the false positive), `env VAR=v python3 /abs/x.py` with the assignment skipped (flagged when missing), an already-absolute interpreter with module args such as `/abs/bin/python -m pkg.mod hook` (not flagged, per rule ii), bare `jq` (not flagged), and agent-config-root enumeration."
criterion_type = "measurable"
done_criterion = "test_self_diagnose.py passes including the new cases, and running the scanner against the real machine reports both dangling entries"
verify_command = "cd /Users/the0/claude-agent-instructions-prune-dangling-hooks && python3 -m pytest scripts/tests/test_self_diagnose.py -q && python3 scripts/self-diagnose.py --json | python3 -c \"import json,sys; d=json.load(sys.stdin); f=[x for x in d.get('difficulties',d if isinstance(d,list) else []) if 'hook-answer-delivery-reminder' in json.dumps(x)]; sys.exit(0 if len(f)>=2 else 1)\""
expected_exit = 0
depends_on = []
output_artifacts = ["scripts/self-diagnose.py", "scripts/tests/test_self_diagnose.py"]
material = "scripts/self-diagnose.py::_hook_script_path (takes shlex tokens[0] only, so `python3 /abs/x.py` resolves to the bare word `python3` and is discarded as non-absolute) and ::default_settings_paths (enumerates ~/.claude and the project dir, never the agent config root)"
means = "Read, Edit, Bash (pytest); scripts/self-diagnose.py, scripts/tests/test_self_diagnose.py, scripts/lib/config_root.py"
method = "Read the two functions and test_self_diagnose.py's existing fixture style. Add an interpreter-basename set and a token walk for the first non-flag absolute path; handle `env` by skipping leading VAR=val tokens. Extend the candidate list in default_settings_paths with agent_home()/settings.json and settings.local.json. Write the five test cases first, watch them fail, then make them pass."
conditions = "Work happens in the isolated worktree /Users/the0/claude-agent-instructions-prune-dangling-hooks (the canon checkout is read-only from a live session). The two dangling entries are still present on the machine, so the live-scan half of the verify command is meaningful only before stage 3 runs."
invariants = "self-diagnose.py NEVER edits anything — its docstring contract is load-bearing and hook-self-diagnose-due.py parses its stdout line shape and exit code; neither may change. Fail-safe direction preserved: an unresolvable command stays unflagged rather than false-flagged. No change to the Difficulty record shape."
capability_required = "python, pytest, reading an existing test suite's conventions"

[stage.principle]
statement = "A detector that already encodes the right rule but misses real instances has an enumeration defect, not a rule defect, and must be fixed by widening its reach rather than by adding a second detector."
source = "The observed failure: self-diagnose.py's broken-hook-registration scan exists, is SessionStart-wired via hook-self-diagnose-due.py, exits 1 on findings — and still reported neither live entry."
derivation = "Both misses trace to inputs the scan never received: _hook_script_path returned None for a command whose script sits at tokens[1], and default_settings_paths never opened the file holding the second entry. The predicate 'resolved absolute path does not exist' would have fired correctly on both had they reached it; therefore the corrective locus is the input enumeration, and adding a parallel detector would duplicate a rule that is already right."
confidence = "high"
refutation = "If after widening both enumerations the scan still misses either live entry, the defect is in the rule or the traversal after all, and a separate detector becomes justified."

# ---------------------------------------------------------------------------
# Stage 2 — REMEDIATION. Give the existing add-only reconciler the delete
# direction plus a report-only --check mode. No new executable.
# ---------------------------------------------------------------------------
[[stage]]
index = 2
title = "Add the prune direction and a --check mode to install-reminder-hooks.sh"
executor = "spawn:developer"
expected_result_image = "scripts/install-reminder-hooks.sh gains a prune pass and two flags. Ownership rule: an entry is OWNED iff its resolved script path lies inside $REPO/scripts/. The prune pass deletes an entry only when it is owned AND its script is missing; an unowned-and-missing entry is REPORTED to stderr and never deleted (a machine-local hook outside the repo is none of this script's business). A hook group left empty by a deletion is removed too, so no empty matcher stanza remains. The add pass keeps targeting the config root only; the prune pass runs over a HARD-CODED file list — the agent config root's settings.json/settings.local.json plus ~/.claude's — and deliberately does NOT reuse self-diagnose.py's default_settings_paths(), whose cwd-dependent project-local entry would let a prune run from an arbitrary cwd mutate an unrelated project's .claude/settings.local.json. Only the path-RESOLUTION helper from stage 1 is shared, never the file enumeration. The pass reuses the existing backup-before-write and JSON-validation path and the existing edit_ledger.stamp. Additionally this stage fixes the sibling defect in the installer's own basename_of(): it takes cmd.split()[0], so every interpreter-prefixed command resolves to the bare word `python3` instead of the script name, defeating the ADD pass's idempotency check — which is why duplicate hook entries have accumulated in both live files (measured: 5 duplicated (event, script) pairs of 39 entries in ~/.claude/settings.json, 3 of 45 in the agent config root). basename_of() is re-pointed at the shared stage-1 resolver so the add pass dedups correctly from now on. `--check` performs the same analysis, writes nothing, prints one line per dangling entry, and exits 1 if any owned dangling entry exists (0 when clean) so it can serve as a gate. Default invocation without flags stays behaviourally identical to today for the add direction. New scripts/tests/test_install_reminder_hooks_prune.py covers: owned+missing deleted, owned+present kept, unowned+missing reported-not-deleted, emptied group removed, --check exit codes both ways, backup written before mutation, basename_of() resolving an interpreter-prefixed command to the script name rather than to `python3`, and the add pass not re-adding an entry that is already present in interpreter-prefixed form."
criterion_type = "measurable"
done_criterion = "the new test file passes and --check exits 1 against a fixture containing an owned dangling entry, 0 against a clean fixture"
verify_command = "cd /Users/the0/claude-agent-instructions-prune-dangling-hooks && python3 -m pytest scripts/tests/test_install_reminder_hooks_prune.py -q"
expected_exit = 0
depends_on = [1]
output_artifacts = ["scripts/install-reminder-hooks.sh", "scripts/tests/test_install_reminder_hooks_prune.py"]
material = "scripts/install-reminder-hooks.sh: the DESIRED table (~45 tuples) as the canonical registry of repo-owned hooks, its existing backup + JSON-validation + edit_ledger.stamp path, and the REPO (ownership matching) vs STAMP_REPO (own location) seam"
means = "Read, Edit, Write, Bash (pytest, jq/python json); scripts/install-reminder-hooks.sh, scripts/tests/"
method = "Read the installer end to end, including how DESIRED is applied and where the settings file is read/written. Add an ownership predicate over resolved script paths. Add a prune pass that walks every hook entry in every discovered settings file, classifies it owned/unowned and present/missing, and acts per the rule above. Add flag parsing for --check (analyse only) and --prune. Author the test file against the installer's existing test conventions (temp HOME + fixture settings.json), red first, then green."
conditions = "Stage 1 landed the widened path resolution the ownership predicate should reuse rather than re-derive. Runs in the isolated worktree. The installer must remain runnable from a worktree copy against the canon repo via CLAUDE_INSTRUCTIONS_REPO=<canon>."
invariants = "NEVER delete an unowned entry — report only. Backup before any mutation and validate the JSON parses before writing. --check is read-only. The prune pass's file list is hard-coded, never cwd-derived. The DESIRED table's contents are unchanged. The only change to the add direction is basename_of()'s resolution fix, which makes its existing idempotency intent work rather than altering it. No new executable script is introduced. EXPLICITLY OUT OF SCOPE: removing the duplicate entries that the old basename_of() already accumulated — this stage stops new ones, and de-duplicating the existing ones is a separate decision about live state that the user has not been asked for."
capability_required = "bash, python, pytest, careful JSON manipulation"

[stage.principle]
statement = "The delete direction of a reconciliation belongs in the component that already owns the add direction and already runs at the event that creates the divergence."
source = "install-reminder-hooks.sh holds the DESIRED registry and is already invoked from sync-instructions-repo.sh:189 rewire_reminder_hooks — the exact point where a pull removes a hook script."
derivation = "Divergence between desired and live hook sets is created at pull time and is decidable only against the DESIRED registry, which this script alone holds; siting the delete direction anywhere else would require duplicating that registry and re-triggering at the same event, whereas siting it here reuses both, plus the existing backup/validation/stamp path. Placing it in self-diagnose.py is excluded independently by that script's never-edits contract."
confidence = "high"
refutation = "If ownership cannot be decided from $REPO/scripts/ containment — e.g. legitimate owned hooks are invoked through a path that does not resolve inside the repo — then the DESIRED table is not a sufficient registry and an explicit ownership marker per entry is needed instead."

# ---------------------------------------------------------------------------
# Stage 3 — THE SYMPTOM. Run the now-capable reconciler at the two live files.
# ---------------------------------------------------------------------------
[[stage]]
index = 3
title = "Prune every owned-and-missing live hook registration after backing up both settings files"
executor = "in_thread"
expected_result_image = "A full before-inventory of hook entries in both live settings files is captured. Both files are copied to <path>.pre-prune. The reconciler is run in --check mode FIRST and its proposed deletion list is surfaced to the user before any write. It is then run in prune mode from the worktree against the canon repo (CLAUDE_INSTRUCTIONS_REPO=/Users/the0/claude-agent-instructions). The work-list is whatever scripts/self-diagnose.py reports at run time, re-derived rather than recalled — the criterion is the PREDICATE 'owned by $REPO/scripts/ and missing on disk', not any fixed count. As of stage 1's delivery that predicate selects five entries, left by two separate upstream deletion commits: hook-answer-delivery-reminder.py (fdbc543) in ~/.claude/settings.json PostToolUse and ~/.claude-agent/settings.json PostToolUse; hook-arc-mount-search-guard.py (767e0df) in ~/.claude/settings.json PreToolUse and ~/.claude-agent/settings.json PreToolUse; hook-ask-text-split.py (fdbc543) in ~/.claude-agent/settings.json PreToolUse. Groups emptied by their last removal go with them; groups with surviving siblings keep them (the ~/.claude-agent PostToolUse group has a valid sibling). An after-inventory diff shows exactly the removals --check proposed and nothing else. Both files still parse as JSON. A post-run scan reports zero broken-hook-registration findings, and an AskUserQuestion call completes with no hook error."
criterion_type = "measurable"
done_criterion = "install-reminder-hooks.sh --check exits 0, both files parse as JSON, the post-run scan reports no broken-hook-registration finding, and the before/after inventory diff shows only the removals --check had proposed"
verify_command = "cd /Users/the0/claude-agent-instructions-prune-dangling-hooks && CLAUDE_INSTRUCTIONS_REPO=/Users/the0/claude-agent-instructions bash scripts/install-reminder-hooks.sh --check && python3 -c \"import json;[json.load(open(p)) for p in ['/Users/the0/.claude/settings.json','/Users/the0/.claude-agent/settings.json']]\" && SCAN=$(python3 scripts/self-diagnose.py || true) && case \"$SCAN\" in *broken-hook-registration*) exit 1;; esac"
expected_exit = 0
depends_on = [2]
output_artifacts = ["/Users/the0/.claude/settings.json", "/Users/the0/.claude-agent/settings.json", "/Users/the0/.claude/settings.json.pre-prune", "/Users/the0/.claude-agent/settings.json.pre-prune"]
material = "The two live settings files, and the set of registrations the fixed scanner selects in them at run time — NOT a remembered list. The set known at replan time is the five entries enumerated in the expected result image; the stage must re-derive it rather than trust that number, since the machine's live state can change between replan and execution."
means = "Bash (cp, python json), the stage-2 reconciler in --check then prune mode, scripts/self-diagnose.py as the independent post-check; no hand-editing of JSON"
method = "Capture the before-inventory as event/matcher/command triples for both files. Copy each file to <path>.pre-prune. Run the reconciler in --check mode and surface its proposed deletion list to the user before writing anything. Run the prune pass. Capture the after-inventory and diff it against the proposed list. Confirm both files parse. Confirm the surviving sibling in the agent-config-root PostToolUse group is intact by name. Re-run the scan and confirm it reports nothing."
conditions = "Stages 1-2 complete and their tests green. These are live user configuration files, not repo files, so the canon read-only guard does not apply — but a corrupted write would wedge the session, hence backup-first. The work-list is derived at run time; a count recorded in this plan is evidence, never the criterion."
invariants = "Ownership rule: an entry is deletable only if its resolved script path lies inside $REPO/scripts/ AND does not exist; unowned-and-missing entries are reported, never deleted (this is what protects the machine-local ccgram hooks). Both live settings files are backed up to <path>.pre-prune before any write, and each file must still parse as JSON afterwards. The live symptom is fixed by RUNNING the reconciler, not by hand-editing the settings files the reconciler exists to manage. A hook group emptied by removing its last entry is removed with it; a group with surviving siblings keeps them (the ~/.claude-agent PostToolUse group has a valid sibling). No unrelated hook entry changes."
capability_required = "shell, JSON inspection, and the judgement to abort on a diff that exceeds what --check proposed"

[stage.principle]
statement = "Fix the live symptom by running the new mechanism, not by hand-editing the artifact the mechanism exists to manage."
source = "CLAUDE.md § Separate rule from perception — mechanize the rule part structurally; a hand-applied fix leaves the mechanism unexercised."
derivation = "Hand-deleting the two entries would satisfy the visible done criterion while leaving the stage-2 prune pass untested against real-world data, so the first genuine exercise of the delete direction would happen unattended on some future pull. Routing the live fix through the reconciler makes this run the mechanism's acceptance test, converting an unverified path into a verified one at zero extra cost."
confidence = "high"
refutation = "If --check proposes a removal that is NOT both owned (resolved path inside $REPO/scripts/) and missing on disk, the ownership rule is over-selecting: abort, restore from .pre-prune, and return to stage 2. Likewise abort and restore if either file fails to parse as JSON afterwards, if the after-inventory diff exceeds what --check proposed, or if the post-run scan still reports a broken-hook-registration finding. A proposed-removal COUNT larger than the five entries known at replan time is NOT by itself a refutation — the criterion is the predicate, and an additional owned-and-missing entry is the mechanism working."

