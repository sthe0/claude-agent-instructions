[[unused_assumptions]]
id = "A14"
reason = "States a fixture constraint for order tests (2) and (6): the crossing is booked after the stage's last judging act before the act under test. It binds how stages 3 and 4 write those fixtures, not what the engine does or refuses, so no row rests on it."

[[unused_assumptions]]
id = "A28"
reason = "States how the done criterion's 'the full suite passes' is read (pytest exit 0 over scripts/tests/, final_check 2), a delivery check outside the per-stage test files; no engine rule rests on it."

[[exempt_sources]]
id = "K4"
reason = "K4 says the order binds the rules and the user's decisions, not the engine acts that carry them out, and routes a mechanic that would change a rule back to the order; it states no engine behaviour of its own. Its effect is the assumption_backed and realizes markers of this registry."
