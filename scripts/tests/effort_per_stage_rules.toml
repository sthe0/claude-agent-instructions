  { id = "r1-booking-by-write-time", sentence = "A booking belongs to the segment current at the time it is written, not at the time the parent ingests it, whatever stage index the row carries (the index is evidence only).", sources = ["R1", "A4"], stage = 3, test = "scripts/tests/test_effort_segments.py::test_row_books_to_the_arming_current_at_its_write_time", scales = "both", assumption_backed = "A4" },
  { id = "r1-late-row-joins-settled-stage", sentence = "A descendant's row written while a stage was live but ingested after it settled joins that stage's actual, updates its retier record (R4), creating the record if the row lifts the settled arming to the multiple, and raises no question.", sources = ["R1", "R4"], stage = 3, test = "scripts/tests/test_effort_per_stage_judging.py::test_late_row_joins_settled_stage_actual_and_raises_no_question", scales = "both" },
  { id = "r1-innermost-stage-owns", sentence = "The innermost current stage owns a booking, so a lazily unfolded parent that stays live while its sub-stages run owns nothing they book.", sources = ["R1"], stage = 3, test = "scripts/tests/test_effort_segments.py::test_unfolded_parent_owns_nothing_its_substages_book", scales = "both" },
