  { id = "r2-open-fire-refuses-self-approval", sentence = "While a fire is open on the live stage the engine refuses every self-approval.", sources = ["R2", "K3"], order_test = 9, stage = 3, test = "scripts/tests/test_effort_per_stage_judging.py::test_open_fire_refuses_every_self_approval", scales = "both" },
  { id = "r2-open-fire-refuses-self-grant", sentence = "While a fire is open on the live stage the engine refuses every self-grant.", sources = ["R2", "K3"], order_test = 9, stage = 3, test = "scripts/tests/test_effort_per_stage_judging.py::test_open_fire_refuses_every_self_grant", scales = "both" },
  { id = "r2-failing-result-under-open-fire", sentence = "A failing record-result under an open fire on the live stage is not refused: it goes through to DIAGNOSING with the fire still open on the stage, and the open fire is put to the customer together with the diagnosis, so the replan that follows is approved only by the customer.", sources = ["R2", "K3", "A8", "A18"], order_test = 9, stage = 3, test = "scripts/tests/test_effort_per_stage_judging.py::test_failing_record_result_under_open_fire_goes_to_diagnosing_with_fire_open", scales = "both", assumption_backed = "A8" },
  { id = "r2-running-descendant-not-stopped", sentence = "A descendant already running is not stopped, what it books meanwhile joins the stage's actual and the open fire's record, and the result it returns waits at the parent's record-result.", sources = ["R2"], stage = 3, test = "scripts/tests/test_effort_per_stage_judging.py::test_running_descendant_keeps_booking_into_the_open_fire_record", scales = "both" },
  { id = "r2-child-fire-is-norm-mismatch", sentence = "A linked child contour running its own plan judges its own stages in its own session while the parent judges its live stage on what the child books, and a child's fire reaches its parent as a norm divergence, never as a user question.", sources = ["R2", "A10", "A22"], stage = 3, test = "scripts/tests/test_effort_per_stage_judging.py::test_child_contour_fire_reaches_parent_as_norm_divergence_not_user_question", scales = "both", assumption_backed = "A10" },
  { id = "r2-open-fire-gate-holds-within-session", sentence = "The refusal of self-approval and self-grant while a fire is open holds within the session that holds the fire, and does not refuse a linked child contour's self-approval of its own in-norm plan.", sources = ["K3", "A22"], stage = 3, test = "scripts/tests/test_effort_per_stage_judging.py::test_open_fire_gate_holds_within_the_session_that_holds_the_fire", scales = "both", assumption_backed = "A22" },

  # ----------------------------------------------------------------------------------------- stage 3, R3
  { id = "r3-identity-assigned-at-creation", sentence = "Each stage carries an identity assigned when it is created.", sources = ["R3"], stage = 3, test = "scripts/tests/test_effort_segments.py::test_every_stage_gets_an_identity_at_creation", scales = "both" },
  { id = "r3-identity-survives-replan-reindexing", sentence = "A stage's identity survives replans and reindexing, so its booked actual and budget follow it.", sources = ["R3"], stage = 3, test = "scripts/tests/test_effort_segments.py::test_identity_with_actual_and_budget_survives_replan_and_reindexing", scales = "both" },
  { id = "r3-identity-survives-unfolding", sentence = "A stage's identity survives lazy unfolding, so its booked actual and budget follow it.", sources = ["R3"], stage = 3, test = "scripts/tests/test_effort_segments.py::test_identity_survives_lazy_unfolding", scales = "both" },
  { id = "r3-identity-survives-sessions", sentence = "A stage's identity survives the sessions of one order, so its booked actual and budget follow it.", sources = ["R3", "A15"], stage = 3, test = "scripts/tests/test_effort_segments.py::test_identity_survives_the_sessions_of_one_order", scales = "both" },
  { id = "r3-engine-carry-rule", sentence = "At a replan the engine's own carry rule matches the new plan's stages to the old ones, and a matched stage keeps its identity.", sources = ["R3"], stage = 3, test = "scripts/tests/test_effort_segments.py::test_match_identities_matches_by_identity_key_and_keeps_identity", scales = "both" },
  { id = "r3-carried-stage-unmatched-refused", sentence = "A replan that would leave the live stage unmatched is not self-approvable, so a later session's self-approval that leaves the live stage unmatched is refused.", sources = ["R3", "A15"], stage = 3, test = "scripts/tests/test_effort_segments.py::test_self_approval_leaving_the_live_stage_unmatched_in_a_later_session_is_refused", scales = "both", assumption_backed = "A15" },
  { id = "r3-arming-opens-at-selection", sentence = "An arming opens when the stage becomes current, with the budget of the tier the last user-approved plan version gives it, or for a stage no user-approved version carries yet the tier the agent declared when it created the stage.", sources = ["R1", "R3"], stage = 3, test = "scripts/tests/test_effort_segments.py::test_arming_opens_at_selection_with_the_user_approved_or_declared_tier", scales = "both" },
  { id = "r3-judged-quantity-current-arming", sentence = "The judged quantity is the current arming's actual against the current arming's budget.", sources = ["R3"], stage = 3, test = "scripts/tests/test_effort_per_stage_judging.py::test_judged_quantity_is_the_current_armings_actual_against_its_budget", scales = "both" },
  { id = "r3-settled-no-carry", sentence = "Once a stage settles, its overspend or its savings do not carry into any later stage's judgment: each later stage is judged from its own zero against its own budget, so the next stage is judged from its own zero.", sources = ["R2", "R3", "R4"], order_test = 2, stage = 3, test = "scripts/tests/test_effort_per_stage_judging.py::test_next_stage_is_judged_from_its_own_zero_after_a_settlement", scales = "both" },
  { id = "r3-fire-does-not-rebase-others", sentence = "A fire on one stage neither rebases nor consumes the budget of another.", sources = ["R3"], stage = 3, test = "scripts/tests/test_effort_per_stage_judging.py::test_a_fire_on_one_stage_neither_rebases_nor_consumes_another_stages_budget", scales = "both" },
  { id = "r3-replan-keeps-settled-actuals", sentence = "A replan does not erase the actuals booked to settled stages and does not reopen their judgment.", sources = ["R3"], stage = 3, test = "scripts/tests/test_effort_per_stage_judging.py::test_a_replan_keeps_settled_actuals_and_does_not_reopen_their_judgment", scales = "both" },
  { id = "r3-added-stage-from-zero", sentence = "A stage the replan adds starts from zero when it is created, so a lazily unfolded sub-plan gets its budgets at unfold time.", sources = ["R3", "R1"], stage = 3, test = "scripts/tests/test_effort_segments.py::test_a_stage_added_by_a_replan_starts_from_zero", scales = "both" },
  { id = "r3-arming-budget-review-terms-of-that-arming", sentence = "An arming's budget is its opener's budget plus only the review terms R1 adds during that arming; the terms of an earlier arming do not carry into it.", sources = ["R1", "R3", "A20"], order_test = 6, stage = 4, test = "scripts/tests/test_effort_armings_approvals.py::test_an_armings_budget_counts_only_the_review_terms_added_during_it", scales = "both", assumption_backed = "A20" },
  { id = "r3-fire-ack-or-agreement-renews-arming", sentence = "A fire acknowledgment by the user or an order agreement concerning the live stage renews its arming, opening the next arming from zero whose budget is the tier budget of the last user-approved plan version (for a stage no user-approved version carries yet, the tier the agent declared) plus only the review terms added during that new arming.", sources = ["R2", "R3", "A20"], order_test = 7, stage = 4, test = "scripts/tests/test_effort_armings_approvals.py::test_a_user_fire_acknowledgment_or_order_agreement_renews_the_live_stage_arming", scales = "both", assumption_backed = "A20" },
  { id = "r3-renewed-unfolded-parent-budget", sentence = "A renewal of an unfolded parent's arming before its sub-plan's approval opens the next arming at the budget the unfold gave it (the configuration fallback), not at its tier budget.", sources = ["R1", "R3", "A20"], stage = 4, test = "scripts/tests/test_effort_armings_approvals.py::test_renewed_unfolded_parent_arming_opens_at_the_unfold_budget", scales = "both", assumption_backed = "A20" },
  { id = "r3-renewed-planning-arming-before-agreement", sentence = "A user's acknowledgment of a planning fire before the order is agreed renews the planning arming from zero at the configuration fallback, neither at an agreed estimate nor with no budget, and its minutes count from the renewal.", sources = ["R1", "R3"], order_test = 4, stage = 4, test = "scripts/tests/test_effort_planning_segment.py::test_planning_arming_renewed_before_agreement_opens_from_zero_at_the_fallback", scales = "both" },
  { id = "r3-live-stage-without-approved-version-uses-declared-tier", sentence = "A renewal of the arming of a live stage that no user-approved plan version carries yet opens its next arming at the tier budget the agent declared.", sources = ["R3"], order_test = 7, stage = 4, test = "scripts/tests/test_effort_armings_approvals.py::test_renewal_for_a_stage_without_an_approved_version_uses_the_declared_tier", scales = "both" },
  { id = "r3-renewed-planning-budget-after-agreement", sentence = "A renewal of the planning segment's arming after the order agreement opens the next arming at the agreed planning estimate.", sources = ["R1", "R3", "A20"], order_test = 4, stage = 4, test = "scripts/tests/test_effort_planning_segment.py::test_renewed_planning_arming_opens_at_the_agreed_estimate", scales = "both", assumption_backed = "A20" },

  # ----------------------------------------------------------------------------------------- stage 3, R4
  { id = "r4-passing-record-result-settles", sentence = "A stage settles at its passing record-result.", sources = ["R4"], order_test = 2, stage = 3, test = "scripts/tests/test_effort_per_stage_judging.py::test_passing_record_result_settles_the_stage_without_judging", scales = "both" },
  { id = "r4-retier-at-multiple-no-floor", sentence = "An arming that settles with its actual at or above the multiple of its budget on either scale becomes a retier record, the floor of R5 notwithstanding, and below the multiple nothing is written.", sources = ["R4", "R5"], order_test = 2, stage = 3, test = "scripts/tests/test_effort_per_stage_judging.py::test_retier_record_at_the_multiple_on_either_scale_without_the_floor", scales = "both" },
  { id = "r4-retier-record-shape", sentence = "A retier record for a stage carries its declared and observed tier, its budget and its actual, and names the arming it covers, so a stage may carry several, one per arming.", sources = ["R4"], stage = 3, test = "scripts/tests/test_effort_per_stage_judging.py::test_retier_record_carries_tiers_budget_actual_and_arming_id", scales = "both" },
  { id = "r4-no-diagnosing-for-settled-overspend", sentence = "The session does not enter DIAGNOSING for an overspend found on a settled stage.", sources = ["R4"], order_test = 2, stage = 3, test = "scripts/tests/test_effort_per_stage_judging.py::test_settled_overspend_never_enters_diagnosing", scales = "both" },
  { id = "r4-closing-never-escalated", sentence = "The spend after the last stage settles (verify-final, landing, the resolution ask) is the closing segment: booked, disclosed under R6, never escalated, so verify-final never fires.", sources = ["R4"], stage = 3, test = "scripts/tests/test_effort_per_stage_judging.py::test_verify_final_never_fires_for_any_session", scales = "both", retires = ["scripts/tests/test_effort_trigger.py::test_verify_final_fires_when_late_cost_tips_the_ratio", "scripts/tests/test_effort_trigger.py::test_verify_final_failures_attach_a_live_divergence", "scripts/tests/test_effort_trigger.py::test_verify_final_venue_refusal_attaches_a_live_divergence", "scripts/tests/test_effort_trigger.py::test_kill_switch_suppresses_verify_final_clean_pass_fire_too", "scripts/tests/test_replan_counting_and_finished_work.py::test_fire_at_clean_verify_final_records_and_proceeds", "scripts/tests/test_replan_counting_and_finished_work.py::test_finished_work_fire_is_disclosed_at_verify_final"] },

  # ----------------------------------------------------------------------------------------- stage 3, R5
  { id = "r5-multiple-and-floor", sentence = "A segment, planning included, fires only when its arming's actual is at least effort-divergence-multiple times its budget and its excess over the budget is at least a named minimum in dollars (spend scale) or in active minutes (wall-clock scale).", sources = ["R5"], order_test = 8, stage = 3, test = "scripts/tests/test_effort_per_stage_judging.py::test_judge_needs_the_multiple_and_the_floor_on_each_scale", scales = "both" },
  { id = "r5-fire-point-later-of-two", sentence = "The fire point is where the later of the two conditions is met.", sources = ["R5"], order_test = 8, stage = 3, test = "scripts/tests/test_effort_per_stage_judging.py::test_fire_point_is_the_later_of_the_multiple_and_the_floor", scales = "both" },
  { id = "r5-floor-keys-in-config", sentence = "The two minimums are configuration keys, effort-fire-floor-usd and effort-fire-floor-minutes, read from config.md.", sources = ["R5"], stage = 3, test = "scripts/tests/test_effort_per_stage_judging.py::test_floor_keys_are_read_from_config_md", scales = "both" },
  { id = "r5-floor-initial-values", sentence = "The initial values of the floor are the large-tier budget (budget-large-usd, effort-stage-minutes-large) but the floor keys do not follow the tier keys: changing a tier key leaves the floor unchanged.", sources = ["R5"], stage = 3, test = "scripts/tests/test_effort_per_stage_judging.py::test_floor_initial_values_equal_the_large_tier_budget_and_do_not_follow_it", scales = "both" },
  { id = "r5-small-tier-neither-at-5x", sentence = "A small-tier stage with no review terms fires on neither scale at 5x.", sources = ["R5"], order_test = 8, stage = 3, test = "scripts/tests/test_effort_per_stage_judging.py::test_small_tier_stage_fires_on_neither_scale_at_5x", scales = "both" },
  { id = "r5-small-tier-wall-clock-at-7x", sentence = "A small-tier stage with no review terms fires on wall-clock alone at 7x, at 70 active minutes.", sources = ["R5"], order_test = 8, stage = 3, test = "scripts/tests/test_effort_per_stage_judging.py::test_small_tier_stage_fires_on_wall_clock_alone_at_7x", scales = "wall_clock" },
  { id = "r5-small-tier-spend-at-9x", sentence = "A small-tier stage with no review terms fires on spend alone at 9x spend with wall-clock held at 5x, at 9.00 USD.", sources = ["R5"], order_test = 8, stage = 3, test = "scripts/tests/test_effort_per_stage_judging.py::test_small_tier_stage_fires_on_spend_alone_at_9x_with_wall_clock_at_5x", scales = "spend" },
  { id = "r5-medium-large-unaffected", sentence = "Medium and large stages are unaffected by the floor: each fires at the multiple of its budget on either scale, a large-tier stage included.", sources = ["R5"], order_test = 8, stage = 3, test = "scripts/tests/test_effort_per_stage_judging.py::test_medium_and_large_tier_stages_fire_at_the_multiple_unaffected_by_the_floor", scales = "both" },

  # ----------------------------------------------------------------------------------------- stage 3, R7
  { id = "r7-v61-state-loads", sentence = "A session armed before the change keeps working: its state file loads through a schema migration.", sources = ["R7"], stage = 3, test = "scripts/tests/test_effort_segments.py::test_schema_61_state_loads_under_schema_62", scales = "both" },
  { id = "r7-migration-assigns-identities", sentence = "The migration assigns every stage of the pre-change plan the identity R3 requires.", sources = ["R7", "R3"], stage = 3, test = "scripts/tests/test_effort_segments.py::test_migration_assigns_every_stage_an_identity", scales = "both" },
  { id = "r7-migration-instant-stamped-once", sentence = "The migration instant is the instant the engine stamps on the state file when it first loads it under the new schema.", sources = ["R7", "A9"], stage = 3, test = "scripts/tests/test_effort_segments.py::test_migration_instant_is_stamped_at_the_first_saved_load_only", scales = "both" },
  { id = "r7-pre-approval-rows-to-planning-line", sentence = "The pre-approval rows and minutes of a migrated session, which the old window never counted, are booked to the same planning line, so R1's conservation clause holds for migrated sessions too.", sources = ["R7", "R1"], stage = 3, test = "scripts/tests/test_effort_segments.py::test_pre_approval_rows_of_a_migrated_session_book_to_the_planning_line", scales = "both" },
  { id = "r7-whole-window-function-retained", sentence = "A migrated session keeps its whole-window judgment through the retained whole-window function, which a session created under the new schema never calls.", sources = ["R7"], stage = 3, test = "scripts/tests/test_effort_per_stage_judging.py::test_whole_window_divergence_is_retained_for_migrated_sessions_only", scales = "both" },
  { id = "r7-still-planning-stretch-unjudged", sentence = "The spend and active minutes a still-planning session booked from classify to its migration instant go to its planning line as an unjudged stretch, counted in its actual and under no budget.", sources = ["R7"], stage = 3, test = "scripts/tests/test_effort_segments.py::test_migrated_planning_session_stretch_is_booked_and_never_judged", scales = "both" },
  { id = "r7-carried-fire", sentence = "A spend or wall-clock fire open at migration is carried by the planning segment, and while it is open the open-fire gate refuses self-approval.", sources = ["R7", "K3"], stage = 3, test = "scripts/tests/test_effort_per_stage_judging.py::test_v61_open_fire_is_carried_by_the_planning_segment", scales = "both" },

  # ----------------------------------------------------------------------------------------- stage 3, K1 and K3
  { id = "k1-replans-scale-fires-at-count", sentence = "The replans scale fires at its count, effort-replan-absolute, whatever the per-stage actuals are; the fire is raised at a judging act (a failing record-result, a dispatch, a replan act or the other acts of the live stage's judging set), and neither a passing record-result nor a clean verify-final is one of them: neither enters DIAGNOSING, the count still advances, and the fire is raised at the next judging act.", sources = ["K1", "R2"], order_test = 10, stage = 3, test = "scripts/tests/test_effort_per_stage_judging.py::test_replans_scale_fires_at_its_count_whatever_the_stage_actuals", scales = "replans", retires = ["scripts/tests/test_replan_counting_and_finished_work.py::test_replans_scale_fire_keeps_todays_routing", "scripts/tests/test_replan_counting_and_finished_work.py::test_replans_scale_fire_at_a_clean_verify_final_enters_diagnosing"] },
  { id = "k1-passing-record-result-never-diagnosing-on-replans", sentence = "A passing record-result never enters DIAGNOSING on any scale, the replans scale included: at the replans count it books the count and leaves the fire to the next judging act.", sources = ["K1", "R2"], order_test = 10, stage = 3, test = "scripts/tests/test_effort_per_stage_judging.py::test_passing_record_result_at_the_replans_count_does_not_enter_diagnosing", scales = "replans", retires = ["scripts/tests/test_replan_autonomy_boundary.py::test_replans_fire_without_difficulty_record_cannot_be_agent_acknowledged", "scripts/tests/test_replan_autonomy_boundary.py::test_agent_acknowledge_requires_difference_to_remove", "scripts/tests/test_replan_autonomy_boundary.py::test_agent_acknowledge_requires_normalize_record", "scripts/tests/test_replan_autonomy_boundary.py::test_agent_acknowledge_refuses_record_declared_before_fire", "scripts/tests/test_replan_autonomy_boundary.py::test_agent_cannot_acknowledge_with_continue_or_abandon", "scripts/tests/test_replan_autonomy_boundary.py::test_agent_replan_after_agent_ack_refuses_coverage_waiver", "scripts/tests/test_replan_autonomy_boundary.py::test_agent_replan_after_agent_ack_refuses_normalization_waiver", "scripts/tests/test_replan_autonomy_boundary.py::test_replans_fire_with_complete_planning_record_proceeds_without_user", "scripts/tests/test_replan_autonomy_boundary.py::test_agent_acknowledge_keeps_spend_baseline", "scripts/tests/test_replan_autonomy_boundary.py::test_e2e_agent_replan_cycle_without_user", "scripts/tests/test_review_exhaustion_reflection.py::test_agent_fire_acknowledge_refused_at_the_replan_backstop", "scripts/tests/test_review_exhaustion_reflection.py::test_agent_fire_acknowledge_admitted_just_below_the_replan_backstop", "scripts/tests/test_review_exhaustion_reflection.py::test_agent_renegotiation_continue_admitted_just_below_the_replan_backstop", "scripts/tests/test_review_exhaustion_reflection.py::test_agent_fire_acknowledge_refused_past_the_backstop_when_the_plan_does_not_load", "scripts/tests/test_review_exhaustion_reflection.py::test_agent_decisions_neither_reset_the_order_effort_window_nor_raise_its_estimate", "scripts/tests/test_review_exhaustion_reflection.py::test_no_backstop_crossing_recorded_below_the_backstop", "scripts/tests/test_review_exhaustion_reflection.py::test_fire_acknowledge_goes_through_the_shared_predicate", "scripts/tests/test_review_exhaustion_reflection.py::test_agent_fire_acknowledge_leaves_the_since_user_counters", "scripts/tests/test_review_exhaustion_reflection.py::test_user_fire_acknowledgement_zeroes_the_since_user_counters", "scripts/tests/test_review_exhaustion_reflection.py::test_a_refused_resolve_leaves_the_crossing_record_in_place", "scripts/tests/test_review_exhaustion_reflection.py::test_agent_fire_acknowledge_admitted_past_the_replan_backstop_inside_the_boundary", "scripts/tests/test_review_exhaustion_reflection.py::test_backstop_crossing_is_disclosed_after_the_session_is_reset_and_a_user_decision", "scripts/tests/test_review_exhaustion_reflection.py::test_backstop_crossing_is_disclosed_at_verify_final_and_resolve", "scripts/tests/test_review_exhaustion_reflection.py::test_backstop_crossing_is_disclosed_by_a_later_session_of_the_same_task", "scripts/tests/test_review_exhaustion_reflection.py::test_backstop_crossing_is_disclosed_to_a_session_with_no_history_of_its_own", "scripts/tests/test_review_exhaustion_reflection.py::test_backstop_crossing_is_recorded_once_with_its_axis_count_and_backstop", "scripts/tests/test_review_exhaustion_reflection.py::test_resolve_clears_the_crossings_it_disclosed_so_a_later_session_of_the_task_starts_clean", "scripts/tests/test_review_exhaustion_reflection.py::test_resolve_keeps_a_crossing_recorded_after_the_disclosure_snapshot", "scripts/tests/test_review_exhaustion_reflection.py::test_resolve_survives_a_fault_clearing_the_crossing_record"] },
  { id = "k1-replans-count-accumulates-across-sessions", sentence = "The replans count accumulates across the sessions of one task and fires on the combined total.", sources = ["K1"], order_test = 10, stage = 3, test = "scripts/tests/test_effort_per_stage_judging.py::test_replans_count_accumulates_across_sessions_and_fires_on_the_combined_total", scales = "replans" },
  { id = "k1-replans-scale-no-floor", sentence = "The replans scale is an absolute count, not divided per stage and not subject to the floor.", sources = ["K1"], order_test = 10, stage = 3, test = "scripts/tests/test_effort_per_stage_judging.py::test_replans_scale_is_not_divided_per_stage_and_ignores_the_floor", scales = "replans" },
  { id = "k3-fire-stays-open-until-acknowledged", sentence = "A spend or wall-clock fire stays open until the customer acknowledges it.", sources = ["K3"], stage = 3, test = "scripts/tests/test_effort_per_stage_judging.py::test_a_fire_stays_open_until_the_customer_acknowledges_it", scales = "both" },
  { id = "k3-open-fire-carries-into-later-session", sentence = "A spend or wall-clock fire open when a session ends stays open for that order in a later session of it: the later session's self-approval and self-grant are refused until the customer acknowledges it.", sources = ["K3", "R3", "A15"], stage = 3, test = "scripts/tests/test_effort_per_stage_judging.py::test_open_fire_carries_into_a_later_session_of_the_same_order", scales = "both" },

  # ----------------------------------------------------------------------------------------- stage 4, R1
  { id = "r1-review-term-derived", sentence = "A stage's budget is its tier budget plus the review terms of its own replans: the engine derives each term from the plan (one mandated review per replan at the review tier the estimate already prices), and the agent chooses no part of it.", sources = ["R1", "A5"], stage = 4, test = "scripts/tests/test_effort_armings_approvals.py::test_review_term_is_derived_from_the_plan_at_the_review_tier", scales = "both", assumption_backed = "A5", retires = ["scripts/tests/test_effort_trigger.py::test_approve_arms_and_derives_the_estimate", "scripts/tests/test_effort_trigger.py::test_no_change_replan_rederives_against_current_replan_count", "scripts/tests/test_effort_trigger.py::test_refinement_replan_rederives_the_estimate", "scripts/tests/test_effort_trigger.py::test_replan_rederive_counts_its_own_in_flight_replan_event", "scripts/tests/test_effort_trigger.py::test_substantive_replan_rederives_the_estimate_over_the_new_stage_list", "scripts/tests/test_replan_counting_and_finished_work.py::test_non_operative_replans_still_owe_a_review_in_the_spend_estimate"] },
  { id = "r1-replan-priced-at-term-never-fires", sentence = "The review term joins the budget of the live stage's current arming at the act that mandates the review, before any of that review's spend is booked, so that a stage cannot fire on the budgeted cost of its own re-planning.", sources = ["R1", "A5"], order_test = 6, stage = 4, test = "scripts/tests/test_effort_armings_approvals.py::test_replan_priced_at_exactly_its_review_term_never_fires_the_stage", scales = "both", assumption_backed = "A5" },
  { id = "r1-review-beyond-term-is-stage-overrun", sentence = "What a review costs beyond its term is the stage's own overrun: the cost booked beyond the review term counts toward the stage's fire.", sources = ["R1"], order_test = 6, stage = 4, test = "scripts/tests/test_effort_armings_approvals.py::test_review_cost_beyond_its_term_counts_toward_the_stages_fire", scales = "both" },
  { id = "r1-unfold-replaces-budget", sentence = "A lazily unfolded parent's tier budget is replaced at unfold time by the planning budget, which for a sub-plan is the configuration fallback, and the parent keeps its arming and the actual booked so far.", sources = ["R1", "A1", "A27"], stage = 4, test = "scripts/tests/test_effort_armings_approvals.py::test_unfold_keeps_the_parents_arming_and_actual_under_the_fallback_budget", scales = "both", assumption_backed = "A1" },
  { id = "r1-unfold-bound", sentence = "A sub-plan has no order agreement, and the unfold route replaces a budget only once per lazy parent, so the route cannot be repeated to reset a budget unseen.", sources = ["R1", "A27"], stage = 4, test = "scripts/tests/test_effort_armings_approvals.py::test_a_second_unfold_of_the_same_parent_replaces_nothing", scales = "both", assumption_backed = "A27" },
  { id = "r1-planning-live-until-approval", sentence = "Planning is a segment with a budget, live from classify until the plan's approval, by the user or by the agent's self-approval alike.", sources = ["R1"], stage = 4, test = "scripts/tests/test_effort_planning_segment.py::test_planning_arming_is_live_from_classify_until_either_approval", scales = "both" },
  { id = "r1-estimate-typed-field", sentence = "The planning estimate is recorded in the order draft as a typed field with two numbers and a derivation text, and printed in the order rendering with that derivation.", sources = ["R1", "A13"], order_test = 4, stage = 4, test = "scripts/tests/test_effort_planning_segment.py::test_planning_estimate_table_is_parsed_and_printed_with_its_derivation", scales = "both", assumption_backed = "A13" },
  { id = "r1-estimate-agreed-with-order", sentence = "The planning estimate becomes the planning segment's next arming's budget when a draft carrying an estimate with a derivation is agreed.", sources = ["R1"], order_test = 4, stage = 4, test = "scripts/tests/test_effort_planning_segment.py::test_agreed_estimate_becomes_the_next_planning_armings_budget", scales = "both" },
  { id = "r1-estimate-refused-before-approval", sentence = "Present-plan --kind order and order-agree refuse a draft agreed before the plan's first approval that is missing any of the three: the two estimate numbers and the derivation text.", sources = ["R1", "A13"], order_test = 4, stage = 4, test = "scripts/tests/test_effort_planning_segment.py::test_order_draft_without_estimate_or_derivation_is_refused_before_first_approval", scales = "both", assumption_backed = "A13", retires = ["scripts/tests/test_order_agreement.py::test_order_agree_records_the_agreement_on_a_confirmed_anchor", "scripts/tests/test_order_agreement.py::test_order_agree_anchors_on_a_hook_stamp", "scripts/tests/test_order_agreement.py::test_agreement_follows_a_changed_understanding_and_closes_open_challenges", "scripts/tests/test_order_agreement.py::test_submit_plan_accepts_the_agreed_understanding", "scripts/tests/test_order_agreement.py::test_the_agreement_records_the_anchor_time_and_the_rendering_digest", "scripts/tests/test_order_agreement.py::test_order_submit_accepts_a_staged_draft_after_the_agreement", "scripts/tests/test_order_phase.py::test_confirm_delivery_accepts_the_order_kind", "scripts/tests/test_replan_authorization.py::test_case11_marked_order_ask_stamps_order_receipt_despite_delivered_essence"] },
  { id = "r1-derivation-never-judged-by-engine", sentence = "The engine accepts any present derivation and never judges its meaning, neither by a lexical check nor otherwise; the model reviewer judges it.", sources = ["R1", "A13"], order_test = 4, stage = 4, test = "scripts/tests/test_effort_planning_segment.py::test_engine_accepts_any_present_derivation_without_judging_its_meaning", scales = "both", assumption_backed = "A13" },
  { id = "r1-agreement-after-approval-no-estimate", sentence = "An agreement after the first approval carries no estimate and is not refused for lacking one.", sources = ["R1"], order_test = 4, stage = 4, test = "scripts/tests/test_effort_planning_segment.py::test_order_agreement_after_the_first_approval_is_accepted_without_an_estimate", scales = "both" },
  { id = "r1-fallback-wall-clock", sentence = "Until the order is agreed the planning stretch is judged against a configuration fallback whose wall-clock part is the review-cycle-active-minutes value divided by effort-divergence-multiple, counted from classify, so that the fire point in minutes stays at that value.", sources = ["R1", "R5"], order_test = 4, stage = 4, test = "scripts/tests/test_effort_planning_segment.py::test_fallback_fires_on_wall_clock_at_review_cycle_minutes_counted_from_classify", scales = "wall_clock" },
  { id = "r1-fallback-spend", sentence = "The spend part of the planning fallback is the planner spawn plus the first review at the medium tier, 6.00 USD at today's values (budget-medium-usd of 3.00 twice).", sources = ["R1"], stage = 4, test = "scripts/tests/test_effort_planning_segment.py::test_fallback_spend_part_is_two_medium_budgets_and_follows_the_key", scales = "spend" },
  { id = "r1-order-revision-opens-no-arming", sentence = "An order revision before the order agreement opens no arming.", sources = ["R1"], stage = 4, test = "scripts/tests/test_effort_planning_segment.py::test_order_revision_opens_no_arming_and_judges_nothing", scales = "both" },
  { id = "r1-agreement-after-approval-live-stage", sentence = "An order agreement after the first approval concerns the live stage instead: it is a user approval concerning that stage and opens its next arming.", sources = ["R1", "R3"], stage = 4, test = "scripts/tests/test_effort_armings_approvals.py::test_order_agreement_after_first_approval_concerns_the_live_stage", scales = "both" },
  { id = "r1-agreement-after-closing-opens-nothing", sentence = "An order agreement after the last stage has settled concerns closing and opens nothing.", sources = ["R1"], stage = 4, test = "scripts/tests/test_effort_armings_approvals.py::test_order_agreement_after_the_last_settlement_opens_nothing", scales = "both" },
  { id = "r1-agreement-before-approval-opens-arming", sentence = "An order agreement before the plan's first approval is a user approval concerning planning and opens its next arming with the agreed estimate as the budget, so the stretch before it stays under the fallback and the estimate is not charged with it.", sources = ["R1", "R3"], order_test = 4, stage = 4, test = "scripts/tests/test_effort_planning_segment.py::test_order_agreement_before_first_approval_closes_the_fallback_arming_and_opens_the_estimate_arming", scales = "both" },

  # ----------------------------------------------------------------------------------------- stage 4, R2
  { id = "r2-planning-judged-at-submit-plan", sentence = "Planning is judged at submit-plan.", sources = ["R2", "A6"], order_test = 5, stage = 4, test = "scripts/tests/test_effort_planning_segment.py::test_submit_plan_judges_planning", scales = "both", assumption_backed = "A6" },
  { id = "r2-planning-judged-at-plan-review", sentence = "Planning is judged at plan-review.", sources = ["R2", "A6"], order_test = 5, stage = 4, test = "scripts/tests/test_effort_planning_segment.py::test_plan_review_judges_planning", scales = "both", assumption_backed = "A6" },
  { id = "r2-planning-judged-at-present-plan", sentence = "Planning is judged at present-plan.", sources = ["R2", "A6"], order_test = 5, stage = 4, test = "scripts/tests/test_effort_planning_segment.py::test_present_plan_judges_planning", scales = "both", assumption_backed = "A6" },
  { id = "r2-planning-judged-at-stamp", sentence = "Planning is judged at the prompt-boundary stamps while the session is planning, and for in-thread drafting before any submit-plan that act is the first stamp after the crossing.", sources = ["R2", "A6", "A7", "A24"], order_test = 5, stage = 4, test = "scripts/tests/test_effort_planning_segment.py::test_prompt_boundary_stamp_judges_in_thread_planning_at_the_first_stamp_after_the_crossing", scales = "both", assumption_backed = "A7" },
  { id = "r2-planning-judged-at-planner-acts", sentence = "Planning is judged at a spawned planner's engine acts, so a planner's next engine act after the crossing judges the parent's planning.", sources = ["R2", "A6", "A7"], order_test = 5, stage = 4, test = "scripts/tests/test_effort_planning_segment.py::test_spawned_planners_engine_acts_judge_the_parents_planning", scales = "both", assumption_backed = "A7" },
  { id = "r2-planning-judged-at-planner-run-end", sentence = "Planning is judged at the end of a spawned planner's run, unlike a stage's run end: the end books the planner's rows and minutes and judges the parent's planning at that act.", sources = ["R2", "A6", "A7"], order_test = 5, stage = 4, test = "scripts/tests/test_effort_planning_segment.py::test_spawned_planners_run_end_books_and_judges_the_parents_planning", scales = "both", assumption_backed = "A7" },
  { id = "r2-planning-approve-by-agent-fires-refused", sentence = "The agent's self-approval of a plan (approve --by agent) judges first, raises the fire when planning is at R5's fire point and is then refused under K3, and settles planning only when it raises none.", sources = ["R2", "K3", "A7", "A19"], order_test = 5, stage = 4, test = "scripts/tests/test_effort_planning_segment.py::test_approve_by_agent_at_the_planning_fire_point_fires_and_is_refused", scales = "both", assumption_backed = "A19" },
  { id = "r2-planning-fire-point-fires", sentence = "An overspend while planning fires at a pre-approval engine act, wall-clock at the planning fallback's fire point and spend at its own.", sources = ["R2", "K3"], order_test = 5, stage = 4, test = "scripts/tests/test_effort_planning_segment.py::test_planning_overspend_fires_at_a_pre_approval_engine_act", scales = "both" },
  { id = "r2-review-cycle-minutes-limit-retired", sentence = "Planning's wall-clock budget takes the place of the review-cycle-active-minutes limit, so the retired limit no longer routes PLAN_READY into DIAGNOSING on its own.", sources = ["R2"], order_test = 5, stage = 4, test = "scripts/tests/test_effort_planning_segment.py::test_retired_cycle_minutes_limit_no_longer_routes_plan_ready_into_diagnosing", scales = "wall_clock", retires = ["scripts/tests/test_review_trigger.py::test_minutes_trigger_fires_at_its_row_not_below", "scripts/tests/test_review_trigger.py::test_minutes_are_the_booked_delta_and_child_runs_are_not_added", "scripts/tests/test_review_trigger.py::test_a_fired_minutes_trigger_stays_quiet_for_the_cycle", "scripts/tests/test_review_trigger.py::test_acts_and_minutes_need_an_open_cycle_but_the_streak_does_not", "scripts/tests/test_review_trigger.py::test_a_new_sha_opens_a_cycle_and_resets_acts_and_the_minutes_anchor"] },
  { id = "r2-review-cycle-acts-and-streak-stay", sentence = "review-cycle-acts stays as the absolute count it is and review-stage-nonpass-streak stays unchanged.", sources = ["R2"], stage = 4, test = "scripts/tests/test_effort_planning_segment.py::test_review_cycle_acts_and_stage_nonpass_streak_routes_are_unchanged", scales = "both" },
  { id = "r2-planning-no-replans-scale-fire", sentence = "Planning carries spend and wall-clock fires only: the replans scale of K1 is judged only where a plan is armed, and planning is not armed.", sources = ["R2", "K1"], stage = 4, test = "scripts/tests/test_effort_planning_segment.py::test_planning_carries_spend_and_wall_clock_fires_only", scales = "both" },
  { id = "r2-approval-overspend-is-retier", sentence = "An overspend the engine finds on an arming at a user approval is a retier record under R4 and never a fire.", sources = ["R2", "R4"], order_test = 7, stage = 4, test = "scripts/tests/test_effort_armings_approvals.py::test_overspend_found_at_a_user_approval_is_a_retier_record_not_a_fire", scales = "both" },
  { id = "r2-approval-closes-open-fire", sentence = "A fire already open on the arming closes at a user approval concerning the segment as acknowledged, with the ask showing it.", sources = ["R2", "K3"], order_test = 7, stage = 4, test = "scripts/tests/test_effort_armings_approvals.py::test_open_fire_closes_as_acknowledged_at_a_user_approval", scales = "both" },
  { id = "r2-approval-opens-arming-from-zero", sentence = "The arming a user approval opens, if any, is judged from its own zero.", sources = ["R2", "R3"], order_test = 7, stage = 4, test = "scripts/tests/test_effort_armings_approvals.py::test_arming_opened_by_a_user_approval_is_judged_from_its_own_zero", scales = "both" },
  { id = "r2-approvals-that-concern-a-segment", sentence = "Every user approval that concerns a segment (the plan's approval, an order agreement, the approval of a replan, the acknowledgment of a spend or wall-clock fire on that segment) is a deciding act.", sources = ["R2"], order_test = 7, stage = 4, test = "scripts/tests/test_effort_armings_approvals.py::test_each_listed_user_approval_is_a_deciding_act", scales = "both" },
  { id = "r2-replans-ack-opens-no-arming", sentence = "The acknowledgment of a replans-scale fire concerns the replans counter and closes that fire and nothing else: it opens no arming and closes no arming.", sources = ["R2", "K1", "A12"], stage = 4, test = "scripts/tests/test_effort_armings_approvals.py::test_replans_scale_acknowledgment_opens_closes_and_switches_nothing", scales = "replans", assumption_backed = "A12" },
  { id = "r2-ask-shows-figures", sentence = "Every approval ask shows the closing arming's actual against its budget, fire or no fire, and an open fire with its record.", sources = ["R2"], order_test = 7, stage = 4, test = "scripts/tests/test_effort_armings_approvals.py::test_directive_data_carries_closing_arming_figures_with_or_without_a_fire", scales = "both", retires = ["scripts/tests/test_plan_presentation.py::test_present_plan_essence_stamps_receipt", "scripts/tests/test_plan_presentation.py::test_present_plan_full_directive_detail_unchanged", "scripts/tests/test_present_plan_replan_diff.py::test_replan_diff_allowed_after_reviewing_the_candidate_directive_shape"] },
  { id = "r2-replan-cycle-fire-stays-open", sentence = "A fire raised at a replan act or during its review cycle stays open through the cycle and is put to the customer in the replan's approval ask, with no separate question before it.", sources = ["R2", "K3"], order_test = 6, stage = 4, test = "scripts/tests/test_effort_armings_approvals.py::test_fire_raised_in_a_replan_cycle_stays_open_until_the_replans_approval", scales = "both" },
  { id = "r2-user-approved-skip-settles", sentence = "A user-approved skip is a user approval concerning the segment, so an overspend found on its arming is a retier record and never a fire, an open fire closes as acknowledged and the arming it opens, if any, is judged from its own zero, and it settles the stage with a retier record when its arming is at the multiple.", sources = ["R2", "R4", "A23"], order_test = 9, stage = 4, test = "scripts/tests/test_effort_armings_approvals.py::test_user_approved_skip_of_an_overspending_stage_settles_with_a_retier_record", scales = "both", assumption_backed = "A23" },
  { id = "r2-planning-estimate-owner-moves", sentence = "A planning fire refuses self-approval while open, so a pre-approval wall-clock overrun is owned by the user and not by the agent.", sources = ["R2", "K3"], stage = 4, test = "scripts/tests/test_effort_planning_segment.py::test_planning_fire_refuses_self_approval_until_the_user_decides", scales = "both" },
  { id = "r2-user-reopens-after-fire-ack", sentence = "The acknowledgment of a spend or wall-clock fire by the user closes the fired arming and opens a new one from zero, a fired stage continuing from the fire point under a fresh arming.", sources = ["R2", "R3", "K3"], stage = 4, test = "scripts/tests/test_effort_armings_approvals.py::test_user_fire_acknowledgment_opens_a_fresh_arming_from_the_fire_point", scales = "both" },
  { id = "r2-agent-ack-opens-nothing", sentence = "An agent's acknowledgment of a spend or wall-clock fire closes nothing and opens nothing.", sources = ["R2", "R3", "K3"], order_test = 7, stage = 4, test = "scripts/tests/test_effort_armings_approvals.py::test_agent_acknowledgment_leaves_the_arming_open", scales = "both" },

  # ----------------------------------------------------------------------------------------- stage 4, R3 and R4
  { id = "r3-self-approved-replan-keeps-arming", sentence = "A self-approved replan opens no arming: the matched live stage keeps its arming, its actual and the tier part of its budget, and the only change is the engine-derived review term.", sources = ["R3", "A5"], order_test = 6, stage = 4, test = "scripts/tests/test_effort_armings_approvals.py::test_self_approved_replan_keeps_the_arming_and_adds_only_the_review_term", scales = "both", assumption_backed = "A5" },
  { id = "r3-user-approved-replan-opens-arming", sentence = "A user-approved replan opens a new arming for the live stage, with the budget of the tier the approved version gives it plus the review terms added during the new arming.", sources = ["R1", "R3", "A20"], order_test = 6, stage = 4, test = "scripts/tests/test_effort_armings_approvals.py::test_user_approved_replan_opens_a_new_arming_at_the_approved_tier", scales = "both", assumption_backed = "A20" },
  { id = "r3-tier-raised-by-self-approved-replan", sentence = "A tier raised in a self-approved replan takes effect only once a user-approved version carries it.", sources = ["R3"], stage = 4, test = "scripts/tests/test_effort_armings_approvals.py::test_tier_raised_in_a_self_approved_replan_waits_for_a_user_approved_version", scales = "both" },
  { id = "r3-unmatched-live-stage-refused", sentence = "A self-approved replan that leaves a live stage no continuation is routed to PLAN_READY whatever its class and refused at approve --by agent, so the removal of a live stage goes to the user.", sources = ["R3"], order_test = 6, stage = 4, test = "scripts/tests/test_effort_armings_approvals.py::test_removal_of_live_stage_refused", scales = "both" },
  { id = "r3c-continuation-by-own-outputs", sentence = "A self-approved replan carries the live stage's identity and arming whole to its continuation, found by its own outputs, when the stage is reworded.", sources = ["R3"], order_test = 6, stage = 4, test = "scripts/tests/test_effort_armings_approvals.py::test_continuation_by_own_outputs_after_rewording", scales = "both" },
  { id = "r3c-continuation-revised-supplier", sentence = "A self-approved replan that revises a supplier of the live stage keeps the live stage's identity, arming, budget and actual through its continuation.", sources = ["R3"], order_test = 6, stage = 4, test = "scripts/tests/test_effort_armings_approvals.py::test_continuation_after_revised_supplier", scales = "both" },
  { id = "r3c-continuation-inserted-stage", sentence = "A self-approved replan that inserts a stage the live stage's next version depends on keeps the live stage's identity, arming, budget and actual through its continuation and is not refused at approve --by agent.", sources = ["R1", "R3"], order_test = 6, stage = 4, test = "scripts/tests/test_effort_armings_approvals.py::test_continuation_after_inserted_stage", scales = "both" },
  { id = "r3c-continuation-another-stage-changed", sentence = "A self-approved replan that changes another stage leaves the live stage's continuation, identity and arming untouched.", sources = ["R3"], order_test = 6, stage = 4, test = "scripts/tests/test_effort_armings_approvals.py::test_continuation_when_another_stage_changes", scales = "both" },
  { id = "r3c-continuation-shared-output-rewording", sentence = "A self-approved replan that rewords an output the live stage shares with another stage keeps the live stage's continuation found by its remaining own outputs.", sources = ["R3"], order_test = 6, stage = 4, test = "scripts/tests/test_effort_armings_approvals.py::test_continuation_after_shared_output_rewording", scales = "both" },
  { id = "r3c-continuation-definition-rule", sentence = "A live stage with no own outputs is carried to its continuation by the definition rule, and its self-approved replan is accepted.", sources = ["R3"], order_test = 6, stage = 4, test = "scripts/tests/test_effort_armings_approvals.py::test_continuation_by_definition_rule_without_own_outputs", scales = "both" },
  { id = "r3c-split-claiming-own-outputs-refused", sentence = "A self-approved replan that splits the live stage so that more than one stage claims its own outputs is refused at approve --by agent and routed to PLAN_READY.", sources = ["R3"], order_test = 6, stage = 4, test = "scripts/tests/test_effort_armings_approvals.py::test_split_claiming_own_outputs_refused", scales = "both" },
  { id = "r3c-claimant-respelled-refused", sentence = "A self-approved replan whose claimant of the live stage's own output respells its path is refused at approve --by agent and routed to PLAN_READY.", sources = ["R3"], order_test = 6, stage = 4, test = "scripts/tests/test_effort_armings_approvals.py::test_claimant_by_respelled_path_refused", scales = "both" },
  { id = "r3c-claimant-path-prefix-refused", sentence = "A self-approved replan whose claimant of the live stage's own output is found only by a path prefix is refused at approve --by agent and routed to PLAN_READY.", sources = ["R3"], order_test = 6, stage = 4, test = "scripts/tests/test_effort_armings_approvals.py::test_claimant_by_path_prefix_refused", scales = "both" },
  { id = "r3c-claimant-beside-matched-refused", sentence = "A self-approved replan with a claimant of the live stage's own output beside a matched live stage is refused at approve --by agent and routed to PLAN_READY.", sources = ["R3"], order_test = 6, stage = 4, test = "scripts/tests/test_effort_armings_approvals.py::test_claimant_beside_matched_live_stage_refused", scales = "both" },
  { id = "r3c-carry-matched-sole-claimant-refused", sentence = "A self-approved replan whose sole claimant of the live stage's own output is the one the carry rule matched is refused at approve --by agent and routed to PLAN_READY.", sources = ["R3"], order_test = 6, stage = 4, test = "scripts/tests/test_effort_armings_approvals.py::test_carry_matched_sole_claimant_refused", scales = "both" },
  { id = "r3c-rename-of-own-output-refused", sentence = "A self-approved replan that renames an own output of the live stage is refused at approve --by agent and routed to PLAN_READY.", sources = ["R3"], order_test = 6, stage = 4, test = "scripts/tests/test_effort_armings_approvals.py::test_rename_of_own_output_refused", scales = "both" },
  { id = "r3c-narrowing-of-own-outputs-refused", sentence = "A self-approved replan whose next version of the live stage narrows its own outputs is refused at approve --by agent and routed to PLAN_READY.", sources = ["R3"], order_test = 6, stage = 4, test = "scripts/tests/test_effort_armings_approvals.py::test_narrowing_of_own_outputs_refused", scales = "both" },
  { id = "r3c-widening-onto-other-output-refused", sentence = "A self-approved replan whose next version of the live stage widens onto another stage's output is refused at approve --by agent and routed to PLAN_READY.", sources = ["R3"], order_test = 6, stage = 4, test = "scripts/tests/test_effort_armings_approvals.py::test_widening_onto_other_stage_output_refused", scales = "both" },
  { id = "r3c-drop-with-rewired-consumer-refused", sentence = "A self-approved replan that drops the live stage and rewires its consumer is refused at approve --by agent and routed to PLAN_READY.", sources = ["R3"], order_test = 6, stage = 4, test = "scripts/tests/test_effort_armings_approvals.py::test_drop_with_rewired_consumer_refused", scales = "both" },
  { id = "r3c-no-change-narrowing-routes", sentence = "A replan of the no_change class that narrows the live stage's own outputs is routed to PLAN_READY whatever its class.", sources = ["R3"], order_test = 6, stage = 4, test = "scripts/tests/test_effort_armings_approvals.py::test_no_change_class_narrowing_routes_to_plan_ready", scales = "both" },
  { id = "r3c-no-change-claim-routes", sentence = "A replan of the no_change class that breaks the claim check is routed to PLAN_READY whatever its class.", sources = ["R3"], order_test = 6, stage = 4, test = "scripts/tests/test_effort_armings_approvals.py::test_no_change_class_claim_routes_to_plan_ready", scales = "both" },
  { id = "r3c-refinement-removing-outputs-routes", sentence = "A refinement replan opened in DIAGNOSING that removes all the live stage's own outputs is routed to PLAN_READY whatever its class.", sources = ["R3"], order_test = 6, stage = 4, test = "scripts/tests/test_effort_armings_approvals.py::test_refinement_removing_all_own_outputs_in_diagnosing_routes_to_plan_ready", scales = "both" },
  { id = "r3c-unchanged-resubmission-refused-again", sentence = "An unchanged resubmission of a replan that was refused for self-approval is decided again and refused again.", sources = ["R3"], order_test = 6, stage = 4, test = "scripts/tests/test_effort_armings_approvals.py::test_unchanged_resubmission_refused_again", scales = "both" },
  { id = "r3c-breach-edited-in-at-plan-ready-refused", sentence = "A breach of the claim check edited into the plan at PLAN_READY is decided at the next approve --by agent and refused for self-approval.", sources = ["R3"], order_test = 6, stage = 4, test = "scripts/tests/test_effort_armings_approvals.py::test_breach_edited_in_at_plan_ready_refused", scales = "both" },
  { id = "r3c-parked-plan-edit-keeps-arming", sentence = "A plan edit made while a live stage is parked that inserts a stage keeps the parked stage's arming with its continuation.", sources = ["R1", "R3"], order_test = 6, stage = 4, test = "scripts/tests/test_effort_armings_approvals.py::test_parked_plan_edit_inserting_stage_keeps_arming_with_continuation", scales = "both" },
  { id = "r3c-check-changed-flag", sentence = "A next version whose done_criterion or verify_command changed is flagged check_changed in the replan's event and in the prompt of the review mandated for that replan.", sources = ["R3"], order_test = 6, stage = 4, test = "scripts/tests/test_effort_armings_approvals.py::test_check_changed_flag_in_replan_event_and_review_prompt", scales = "both" },
  { id = "r3c-continuation-in-pushed-subplan-frame", sentence = "The continuation and the claim check of a live stage inside a pushed sub-plan are searched among that sub-plan's stages and against its approved snapshot.", sources = ["R3"], order_test = 6, stage = 4, test = "scripts/tests/test_effort_armings_approvals.py::test_continuation_searched_in_pushed_subplan_frame", scales = "both" },
  { id = "r3c-parked-arming-books-nothing", sentence = "A parked live stage's arming books no row written while it is parked and is judged at no act.", sources = ["R1", "R3"], order_test = 6, stage = 4, test = "scripts/tests/test_effort_armings_approvals.py::test_parked_arming_books_nothing_and_is_not_judged", scales = "both" },
  { id = "r3c-parked-stage-resumes-no-new-arming", sentence = "A parked live stage resumes its same arming when the stage ahead of it settles, and its re-selection opens no new arming.", sources = ["R1", "R3"], order_test = 6, stage = 4, test = "scripts/tests/test_effort_armings_approvals.py::test_parked_stage_resumes_with_no_new_arming", scales = "both" },
  { id = "r3c-user-approval-while-parked", sentence = "A user approval made while a live stage is parked closes and reopens the arming of each live stage, the parked one staying parked.", sources = ["R2", "R3"], order_test = 7, stage = 4, test = "scripts/tests/test_effort_armings_approvals.py::test_user_approval_while_parked_rearms_each_live_stage_parked_stays_parked", scales = "both" },
  { id = "r3c-replan-while-parked-checks-each-live-stage", sentence = "A replan made while a live stage is parked checks the continuation and the claim of each live stage, so it can leave neither the current nor the parked stage without a continuation.", sources = ["R3"], order_test = 6, stage = 4, test = "scripts/tests/test_effort_armings_approvals.py::test_replan_while_parked_checks_each_live_stage", scales = "both" },
  { id = "r3-user-drop-settles-with-retier", sentence = "At the user's approval of a replan that drops the live stage, that stage settles as dropped, as a retier record when its arming is at the multiple, its actual and budget kept under its identity (the stage a migrated session's switching approval drops is the exception: it gets no line, R7).", sources = ["R3", "R4", "R7", "A9"], assumption_backed = "A9", order_test = 6, stage = 4, test = "scripts/tests/test_effort_armings_approvals.py::test_user_approved_drop_at_the_multiple_settles_with_a_retier_record", scales = "both" },
  { id = "r3-user-drop-below-multiple-no-record", sentence = "A user-approved drop of a stage whose arming is below the multiple writes no retier record and keeps only its R6 line (a migrated session's switching approval excepted, R7), while the stage current next starts its own judgment.", sources = ["R3", "R4", "R7"], order_test = 6, stage = 4, test = "scripts/tests/test_effort_armings_approvals.py::test_user_approved_drop_below_the_multiple_writes_no_retier_record", scales = "both" },
  { id = "r3-subplan-approval-settles-parent-arming", sentence = "A sub-plan's approval, by the user or by the agent, settles the lazily unfolded parent's planning arming.", sources = ["R3", "R4"], stage = 4, test = "scripts/tests/test_effort_armings_approvals.py::test_subplan_approval_settles_the_unfolded_parents_planning_arming", scales = "both" },
  { id = "r3-subplan-agent-approve-judges-first", sentence = "The agent's approve --by agent on a sub-plan judges first and refuses on a fire exactly as for the top-level plan.", sources = ["R3", "R2", "A19"], stage = 4, test = "scripts/tests/test_effort_armings_approvals.py::test_subplan_agent_approve_at_fire_point_fires_and_refuses", scales = "both", assumption_backed = "A19" },
  { id = "r3-subplan-user-approval-no-arming", sentence = "A sub-plan's user approval opens no further arming of the parent.", sources = ["R3"], stage = 4, test = "scripts/tests/test_effort_armings_approvals.py::test_subplan_user_approval_opens_no_further_arming_of_the_parent", scales = "both" },
  { id = "r4-parent-settles-with-last-substage", sentence = "The parent stage itself settles when its last sub-stage settles, and the parent is judged at no later act.", sources = ["R4"], stage = 4, test = "scripts/tests/test_effort_armings_approvals.py::test_parent_settles_when_its_last_substage_settles_and_is_judged_no_later", scales = "both" },
  { id = "r4-planning-settles-at-approval", sentence = "Planning settles at approval.", sources = ["R4"], stage = 4, test = "scripts/tests/test_effort_planning_segment.py::test_planning_settles_at_the_plans_first_approval", scales = "both" },
  { id = "r4-no-declared-tier-names-source", sentence = "A retier record for a segment with no declared tier (planning, an unfolded parent) names the budget's source in place of the declared tier and derives its observed tier from its actual.", sources = ["R4", "A11"], stage = 4, test = "scripts/tests/test_effort_planning_segment.py::test_retier_record_without_a_declared_tier_names_the_budget_source", scales = "both", assumption_backed = "A11" },
  { id = "r4-retier-on-live-segment-approval", sentence = "A retier record arises on a live segment too, when a user approval closes its arming at or above the multiple.", sources = ["R4", "R2"], order_test = 7, stage = 4, test = "scripts/tests/test_effort_armings_approvals.py::test_user_approval_at_the_multiple_writes_a_retier_record_on_the_live_segment", scales = "both" },
  { id = "r4-below-multiple-no-record-at-approval", sentence = "An approval of an arming below the multiple writes nothing.", sources = ["R4"], order_test = 7, stage = 4, test = "scripts/tests/test_effort_armings_approvals.py::test_user_approval_below_the_multiple_writes_no_retier_record", scales = "both" },
  { id = "r1-late-row-after-approval-closed-arming", sentence = "A descendant row written while one arming of a live stage was open but ingested after a user approval closed that arming belongs to the closed arming, updates or creates that arming's retier record, and never counts toward, or fires, the arming the approval opened.", sources = ["R1", "A16"], stage = 4, test = "scripts/tests/test_effort_armings_approvals.py::test_row_ingested_after_a_user_approval_belongs_to_the_closed_arming", scales = "both", assumption_backed = "A16" },

  # ----------------------------------------------------------------------------------------- stage 4, R6
  { id = "r6-verify-final-discloses-total", sentence = "The verify-final directive reports the sum of every segment's actual (planning, each stage, closing) against the sum of the budget lines of planning and the stages.", sources = ["R6"], order_test = 13, stage = 4, test = "scripts/tests/test_effort_disclosure_migration.py::test_verify_final_directive_carries_total_and_each_segments_actual_and_budget_line", scales = "both" },
  { id = "r6-resolve-discloses-total", sentence = "The resolve directive reports the sum of every segment's actual against the sum of the budget lines of planning and the stages.", sources = ["R6"], order_test = 13, stage = 4, test = "scripts/tests/test_effort_disclosure_migration.py::test_resolve_directive_carries_total_and_each_segments_actual_and_budget_line", scales = "both" },
  { id = "r6-quality-row-carries-lines", sentence = "The quality-ledger row carries that total together with each segment's actual and budget line.", sources = ["R6"], order_test = 13, stage = 4, test = "scripts/tests/test_effort_disclosure_migration.py::test_quality_row_carries_total_and_each_segments_actual_and_budget_line", scales = "both", retires = ["scripts/tests/test_effort_trigger.py::test_quality_row_carries_both_effort_vectors"] },
  { id = "r6-line-sums-armings-with-count", sentence = "A segment's line is the sum of its actuals over all its armings against the sum of its armings' budgets, with the count of its armings beside it on the directives and the ledger row (R7's two migrated planning lines are the stated exceptions).", sources = ["R6", "R3"], order_test = 13, stage = 4, test = "scripts/tests/test_effort_disclosure_migration.py::test_a_line_sums_actuals_and_budgets_over_its_armings_with_their_count", scales = "both" },
  { id = "r6-dropped-keeps-line-pending-none", sentence = "A stage settled as dropped keeps its line (except a stage the switching approval of a migrated session drops, R7, which gets none), while a pending stage that a replan drops before it ever became current carries no line, so the total budget counts no stage that never ran.", sources = ["R6", "R7"], order_test = 3, stage = 4, test = "scripts/tests/test_effort_disclosure_migration.py::test_dropped_stage_keeps_its_line_and_a_never_current_stage_has_none", scales = "both" },
  { id = "r6-planning-one-line", sentence = "Planning is one segment whose armings all sum into its one line.", sources = ["R6"], order_test = 3, stage = 4, test = "scripts/tests/test_effort_disclosure_migration.py::test_planning_armings_sum_into_one_line", scales = "both" },
  { id = "r6-budget-lines-follow-on-replanned-fixture", sentence = "On a replanned, lazily unfolded fixture each stage's line is its tier budget plus its review terms, planning's line is its planning budget, and an unfolded parent's line carries the planning budget R1 gives it.", sources = ["R1", "R6"], order_test = 3, stage = 4, test = "scripts/tests/test_effort_disclosure_migration.py::test_budget_lines_follow_r6_on_a_replanned_lazily_unfolded_fixture", scales = "both" },

  # ----------------------------------------------------------------------------------------- stage 4, R7
  { id = "r7-window-judgment-kept-until-switch", sentence = "A migrated session with an approved plan keeps its whole-window judgment until its next user approval or, when no user approval follows, until resolve.", sources = ["R7"], order_test = 12, stage = 4, test = "scripts/tests/test_effort_disclosure_migration.py::test_migrated_session_keeps_whole_window_judgment_until_its_switch", scales = "both" },
  { id = "r7-self-approval-does-not-switch", sentence = "An agent self-approval does not count as the switch, so a self-approved replan cannot move the accumulated window off the live judgment.", sources = ["R7"], order_test = 12, stage = 4, test = "scripts/tests/test_effort_disclosure_migration.py::test_agent_self_approval_does_not_switch_a_migrated_session", scales = "both" },
  { id = "r7-window-fires-at-failing-result", sentence = "Until the switch the retained whole-window function may still fire at a failing record-result.", sources = ["R7"], order_test = 12, stage = 4, test = "scripts/tests/test_effort_disclosure_migration.py::test_migrated_session_fires_at_a_failing_record_result_before_the_switch", scales = "both" },
  { id = "r7-window-never-at-passing-result", sentence = "A passing record-result before the switch books its spend into the window without judging, so a migrated session's passing result is never a question.", sources = ["R7", "R2"], order_test = 12, stage = 4, test = "scripts/tests/test_effort_disclosure_migration.py::test_migrated_session_never_fires_at_a_passing_record_result", scales = "both" },
  { id = "r7-window-never-at-verify-final", sentence = "Verify-final before the switch books its spend into the window without judging, so closing is never a question for a migrated session.", sources = ["R7", "R4"], order_test = 12, stage = 4, test = "scripts/tests/test_effort_disclosure_migration.py::test_migrated_session_never_fires_at_verify_final", scales = "both" },
  { id = "r7-switch-books-window-to-planning-line", sentence = "At the switch the window total, everything booked since approve whatever baseline reset an earlier fire left behind, is booked to the order's planning segment as that line's actual.", sources = ["R7", "A9"], order_test = 12, stage = 4, test = "scripts/tests/test_effort_disclosure_migration.py::test_switch_books_the_window_total_to_the_planning_line", scales = "both" },
  { id = "r7-switch-budget-arithmetic", sentence = "The planning line's budget at the switch is the whole-plan estimate the window was judged against minus the tier budgets the estimate priced for the stages pending or live at the switch, never negative.", sources = ["R7", "A9"], order_test = 12, stage = 4, test = "scripts/tests/test_effort_disclosure_migration.py::test_switch_budget_is_the_estimate_minus_pending_and_live_tier_budgets_never_negative", scales = "both", assumption_backed = "A9" },
  { id = "r7-switch-budget-dropped-stage", sentence = "A stage the switching approval drops gets no line and no subtraction from the planning line's budget.", sources = ["R7", "A9"], order_test = 12, stage = 4, test = "scripts/tests/test_effort_disclosure_migration.py::test_switch_budget_dropped_stage_gets_no_line_and_no_subtraction", scales = "both", assumption_backed = "A9" },
  { id = "r7-switch-budget-added-stage", sentence = "A stage the switching approval adds subtracts nothing from the planning line's budget and gets its own line later, when it becomes current.", sources = ["R7", "A9"], order_test = 12, stage = 4, test = "scripts/tests/test_effort_disclosure_migration.py::test_switch_budget_added_stage_subtracts_nothing_and_gets_its_own_line_later", scales = "both", assumption_backed = "A9" },
  { id = "r7-switch-budget-retiered-stage", sentence = "A stage the switching approval re-tiers counts once at each value: its old tier budget is subtracted once and its new tier budget forms its own line once.", sources = ["R7", "A9"], order_test = 12, stage = 4, test = "scripts/tests/test_effort_disclosure_migration.py::test_switch_budget_retiered_stage_counts_once_at_each_value", scales = "both", assumption_backed = "A9" },
  { id = "r7-no-stage-inherits-window", sentence = "Stages settled before the switch carry no segment line and no stage inherits the window.", sources = ["R7"], order_test = 12, stage = 4, test = "scripts/tests/test_effort_disclosure_migration.py::test_no_stage_inherits_the_window_and_settled_stages_carry_no_line", scales = "both" },
  { id = "r7-directives-carry-migrated-flag", sentence = "The directives and the ledger row carry the planning line, the total and a migrated flag, so that calibration excludes the row.", sources = ["R7", "R6"], order_test = 12, stage = 4, test = "scripts/tests/test_effort_disclosure_migration.py::test_directives_and_quality_row_carry_the_planning_line_total_and_migrated_flag", scales = "both" },
  { id = "r7-per-stage-rule-from-then-on", sentence = "The per-stage rule applies from the switch on.", sources = ["R7"], order_test = 12, stage = 4, test = "scripts/tests/test_effort_disclosure_migration.py::test_per_stage_rule_applies_from_the_switch_on", scales = "both" },
  { id = "r7-switch-acts", sentence = "The switch is a user approval that concerns a segment in R2's list, and the acknowledgment of a replans-scale fire is not.", sources = ["R7", "R2", "A12"], order_test = 12, stage = 4, test = "scripts/tests/test_effort_disclosure_migration.py::test_the_switch_is_a_user_approval_concerning_a_segment_and_not_a_replans_scale_acknowledgment", scales = "both", assumption_backed = "A12" },
  { id = "r7-order-agreement-after-last-settlement-no-switch", sentence = "An order agreement after the last stage has settled does not switch a migrated session; resolve remains its switch.", sources = ["R7", "A9"], stage = 4, test = "scripts/tests/test_effort_disclosure_migration.py::test_order_agreement_after_the_last_settlement_does_not_switch_a_migrated_session", scales = "both", assumption_backed = "A9" },
  { id = "r7-resolve-is-switch", sentence = "A migrated session with no user approval since its migration reaches resolve, where its window total is booked to the planning line, verify-final showing the line as the switch will book it.", sources = ["R7", "R6", "A21"], order_test = 12, stage = 4, test = "scripts/tests/test_effort_disclosure_migration.py::test_verify_final_projects_the_planning_line_and_resolve_books_it", scales = "both", assumption_backed = "A21" },
  { id = "r7-fire-carried-closes-at-ack-or-switch", sentence = "A spend or wall-clock fire open at migration or raised before the switch is carried by the planning segment and closes at the user's acknowledgment or at the next user approval, either being the switch.", sources = ["R7", "K3"], order_test = 12, stage = 4, test = "scripts/tests/test_effort_disclosure_migration.py::test_carried_fire_closes_at_the_users_acknowledgment_or_the_switch", scales = "both" },
  { id = "r7-planning-session-fallback-from-instant", sentence = "A session still planning when the change lands is judged against the fallback counted from its migration instant on both scales rather than from classify.", sources = ["R7"], order_test = 12, stage = 4, test = "scripts/tests/test_effort_disclosure_migration.py::test_still_planning_session_is_judged_against_the_fallback_from_its_migration_instant", scales = "both" },
  { id = "r7-planning-session-first-act-no-fire", sentence = "No migrated session fires at its first act after migration for minutes or dollars that no limit counted before the change.", sources = ["R7"], order_test = 12, stage = 4, test = "scripts/tests/test_effort_disclosure_migration.py::test_no_migrated_session_fires_at_its_first_act_for_work_no_limit_counted", scales = "both" },
  { id = "r7-agreed-before-migration-no-estimate", sentence = "A session whose order was agreed before its migration instant carries no planning estimate and is judged against the fallback counted from its migration instant until its plan's first approval or its next order agreement, whichever comes first.", sources = ["R7", "A25"], stage = 4, test = "scripts/tests/test_effort_planning_segment.py::test_order_agreed_before_migration_is_judged_on_the_fallback_from_its_migration_instant_with_no_estimate", scales = "both", assumption_backed = "A25" },
  { id = "r7-unagreed-order-until-agreement", sentence = "A migrated session whose order is not yet agreed is judged against the fallback until its order agreement, which opens the planning arming the agreed estimate budgets, as for any session.", sources = ["R7"], stage = 4, test = "scripts/tests/test_effort_planning_segment.py::test_migrated_session_with_an_unagreed_order_is_refused_without_the_table_and_judged_on_the_fallback", scales = "both" },
  { id = "r7-planning-quality-row-flag", sentence = "A still-planning migrated session's quality-ledger row carries the migrated flag as an armed session's does.", sources = ["R7", "R6"], stage = 4, test = "scripts/tests/test_effort_disclosure_migration.py::test_still_planning_migrated_session_quality_row_carries_the_migrated_flag", scales = "both" },
  { id = "r5-planning-fallback-fires-at-multiple", sentence = "The planning fallback fires at its multiple (77 minutes, excess 61.6), the floor lying just under it.", sources = ["R5"], order_test = 4, stage = 4, test = "scripts/tests/test_effort_planning_segment.py::test_planning_fallback_fires_at_its_multiple_with_the_floor_just_under_it", scales = "wall_clock" },
  { id = "r5-floor-not-binding-planning-spend", sentence = "On the spend scale the planning fallback of 6.00 USD has an excess of 24.00 USD at the multiple, three times the floor, so the floor does not bind there.", sources = ["R5", "R1"], stage = 4, test = "scripts/tests/test_effort_planning_segment.py::test_floor_does_not_bind_the_planning_fallbacks_spend", scales = "spend" },
  { id = "r1-planning-estimate-digest-stable", sentence = "The typed planning estimate enters the understanding digest only when present, so every digest agreed before the change keeps its value.", sources = ["R1", "A25"], stage = 4, test = "scripts/tests/test_effort_planning_segment.py::test_understanding_digest_is_unchanged_for_an_order_without_the_table", scales = "both", assumption_backed = "A25" },

  # ----------------------------------------------------------------------------------------- stage 4, K3
  { id = "k3-user-approval-is-acknowledgment", sentence = "The customer's acknowledgment is the explicit acknowledgment act or any user approval that closes the fired arming (the plan's approval, an order agreement, the approval of a replan), whose ask shows the open fire.", sources = ["K3", "R2"], order_test = 7, stage = 4, test = "scripts/tests/test_effort_armings_approvals.py::test_any_user_approval_closing_the_fired_arming_acknowledges_the_fire_and_its_ask_shows_it", scales = "both" },

  # ----------------------------------------------------------------------------------------- stage 5, R5, R6, K2
  { id = "r5-floor-keys-documented", sentence = "The two minimums are configuration keys in config.md, effort-fire-floor-usd and effort-fire-floor-minutes, with their basis stated in the config rationale document.", sources = ["R5", "K2"], order_test = 14, stage = 5, test = "scripts/tests/test_effort_per_stage_docs.py::test_floor_keys_exist_in_config_md_with_a_basis_entry_each", scales = "both" },
  { id = "r5-anchor-planning-fire-point", sentence = "The config rationale document carries a named anchor for the remark that the planning fire point on wall-clock stays at review-cycle-active-minutes, counted from classify.", sources = ["R5", "K2"], order_test = 14, stage = 5, test = "scripts/tests/test_effort_per_stage_docs.py::test_rationale_anchor_planning_fire_point_wall_clock", scales = "wall_clock" },
  { id = "r5-anchor-floor-not-binding", sentence = "The config rationale document carries a named anchor for the remark that the floor does not bind the planning fallback's spend.", sources = ["R5", "K2"], order_test = 14, stage = 5, test = "scripts/tests/test_effort_per_stage_docs.py::test_rationale_anchor_floor_not_binding_planning_spend", scales = "spend" },
  { id = "r5-anchor-floor-keys-not-following", sentence = "The config rationale document carries a named anchor for the remark that the floor keys are separate keys whose initial values equal the large-tier budgets and do not follow them, and that a later raise of effort-fire-floor-minutes above the planning fallback's excess would move the planning fire point.", sources = ["R5", "K2"], order_test = 14, stage = 5, test = "scripts/tests/test_effort_per_stage_docs.py::test_rationale_anchor_floor_keys_not_following_tier_keys", scales = "both" },
  { id = "k2-readme-per-stage-section", sentence = "The engine README carries a named section for the per-stage rule.", sources = ["K2"], order_test = 14, stage = 5, test = "scripts/tests/test_effort_per_stage_docs.py::test_readme_has_a_per_stage_section", scales = "both" },
  { id = "k2-leaf-per-stage-section", sentence = "The effort-divergence-trigger leaf carries a named section for the per-stage rule, and its accumulation clause is superseded by the per-stage form.", sources = ["K2", "K3"], order_test = 14, stage = 5, test = "scripts/tests/test_effort_per_stage_docs.py::test_trigger_leaf_has_a_per_stage_section", scales = "both" },
  { id = "k2-config-entries-of-changed-keys", sentence = "The config.md entries of review-cycle-active-minutes and effort-divergence-multiple exist beside the floor keys, their meaning being judged by the user and not by this presence check.", sources = ["K2", "R5"], order_test = 14, stage = 5, test = "scripts/tests/test_effort_per_stage_docs.py::test_changed_config_keys_keep_their_entries", scales = "both" },
  { id = "k2-planner-policy-paragraph", sentence = "The planner policy gains one paragraph naming the typed planning estimate and its derivation in the same delivery, because present-plan --kind order starts refusing drafts without it.", sources = ["K2", "R1", "A26"], stage = 5, test = "scripts/tests/test_effort_per_stage_docs.py::test_planner_policy_names_the_planning_estimate_and_the_lazy_field", scales = "both", assumption_backed = "A26" },
  { id = "r6-readme-names-disclosure", sentence = "The engine README's disclosure item says that the closing line carries its actual only, with the migrated flag, as the directives and the ledger row show it.", sources = ["R6", "K2"], stage = 5, test = "scripts/tests/test_effort_per_stage_docs.py::test_readme_disclosure_item_names_the_closing_line_and_the_migrated_flag", scales = "both" },

  # ----------------------------------------------------------------------------------------- mechanics, stage 3
  { id = "m3-two-session-carry", mechanic = "two_session_carry", realizes = ["R3", "A15"], sentence = "A later session's plan approval matches its stages against the order's identity table, and a matched unsettled stage adopts its identity and arming with the carried actual in the arming's carried part.", stage = 3, test = "scripts/tests/test_effort_segments.py::test_two_session_carry_keeps_identity_budget_and_actual_and_counts_each_row_once" },
  { id = "m3-reindexing", mechanic = "reindexing", realizes = ["R3"], sentence = "A replan that inserts a stage ahead of both the live stage and its supplier leaves the live stage with its identity, arming, budget and actual, and its self-approval is not refused for leaving it unmatched.", stage = 3, test = "scripts/tests/test_effort_segments.py::test_replan_inserting_a_stage_ahead_keeps_the_live_stage_matched" },
  { id = "m3-late-row-retier-update", mechanic = "late_row_retier_update", realizes = ["R1", "R4", "A2", "A16"], sentence = "A row written while an arming was current and booked after it closed updates that arming's retier record per closed budgeted arming, or creates it when the late row lifts the arming to the multiple, and never fires.", stage = 3, test = "scripts/tests/test_effort_per_stage_judging.py::test_late_row_updates_retier_record_per_closed_budgeted_arming" },
  { id = "m3-migration-armings", mechanic = "migration_armings", realizes = ["R7"], sentence = "At the saved load that stamps the instant, a not-armed session gets an unjudged stretch arming and an unbudgeted planning arming opened at the instant, and an armed session gets one unbudgeted window arming.", stage = 3, test = "scripts/tests/test_effort_segments.py::test_migration_opens_stretch_and_planning_armings" },
  { id = "m3-migration-seed", mechanic = "migration_seed", realizes = ["R7", "R1"], sentence = "The arming that owns pre-instant work receives, as booked and never as carried, the accumulated actuals of the state and of every pushed frame plus the child-run minutes at the instant, once.", stage = 3, test = "scripts/tests/test_effort_segments.py::test_migration_seeds_premigration_actuals_as_booked" },
  { id = "m3-closed-arming-late-booking", mechanic = "closed_arming_late_booking", realizes = ["R1", "R7"], sentence = "A booking written while an arming was current and ingested after it closed books to that closed arming, since closed_at is not a seal.", stage = 3, test = "scripts/tests/test_effort_segments.py::test_book_accepts_a_late_row_on_a_closed_arming" },
  { id = "m3-pre-switch-booking-owner", mechanic = "pre_switch_booking_owner", realizes = ["R7"], sentence = "While a window arming is open it owns every booking whatever stage is current, pre-approval rows included.", stage = 3, test = "scripts/tests/test_effort_segments.py::test_migration_window_arming_owns_bookings_before_switch" },
  { id = "m3-stamp-time-bound", mechanic = "stamp_time_bound", realizes = ["R2", "A24"], sentence = "A prompt-boundary stamp that books rows loads only the spawners with a row at or after the earliest opened_at, so it finishes inside the hook's time limit.", stage = 3, test = "scripts/tests/test_effort_per_stage_judging.py::test_stamp_refresh_loads_only_spawners_since_lower_bound" },
  { id = "m3-bounded-refresh-books-row-once", mechanic = "bounded_refresh_books_row_once", realizes = ["R1", "R3"], sentence = "A bounded refresh that excluded a spawner leaves that spawner's older row out of totals and watermarks, so a later own row books once in full and the older row once; over a session reset with its plan path kept, the pre-floor row books nothing, no fire follows, and the order total counts each row once.", stage = 3, test = "scripts/tests/test_effort_per_stage_judging.py::test_bounded_then_unbounded_refresh_books_older_descendant_row_once" },
  { id = "m3-migrated-stamp-leaves-rows", mechanic = "migrated_stamp_leaves_rows", realizes = ["R2", "R7", "A24"], sentence = "A stamp on a migrated session books its gap and no row, leaving the rows to the next engine act that books.", stage = 3, test = "scripts/tests/test_effort_per_stage_judging.py::test_migrated_stamp_leaves_rows_to_next_act" },
  { id = "m3-window-arming-blocks-stage-armings", mechanic = "window_arming_blocks_stage_armings", realizes = ["R7"], sentence = "While a window arming is open, neither selection nor settlement opens a stage or closing arming.", stage = 3, test = "scripts/tests/test_effort_segments.py::test_window_arming_open_blocks_stage_and_closing_armings" },
  { id = "m3-v61-open-fire-carrier", mechanic = "v61_open_fire_carrier", realizes = ["R7", "K3"], sentence = "A schema 61 state with an open fire loads with the fire carried in the planning-segment arming, and self-approval stays refused.", stage = 3, test = "scripts/tests/test_effort_per_stage_judging.py::test_v61_open_fire_carried_refuses_self_approval" },
  { id = "m3-session-floor", mechanic = "session_floor", realizes = ["R1", "R3", "A15"], sentence = "Two sessions on the same plan path with a carried arming count an interval row once, the later session's booking floor being its own classify time, whatever the adopted arming's opened_at.", stage = 3, test = "scripts/tests/test_effort_segments.py::test_two_sessions_same_plan_path_carried_arming_counts_interval_row_once" },
  { id = "m3-parked-arming-resume", mechanic = "parked_arming_resume", realizes = ["R1", "R3"], sentence = "A parked arming owns the rows written before parking and none written while parked, and resumes on the stage that parked it.", stage = 3, test = "scripts/tests/test_effort_segments.py::test_parked_arming_spans_own_rows_by_write_time" },

  # ----------------------------------------------------------------------------------------- mechanics, stage 4
  { id = "m4-unfold-budget-lazy-parent", mechanic = "unfold_budget_lazy_parent", realizes = ["R1", "A1", "A20"], sentence = "Unfolding a parent the user approved as lazy replaces its tier budget by the planning fallback on both scales and keeps the actual so far.", stage = 4, test = "scripts/tests/test_effort_armings_approvals.py::test_unfold_replaces_tier_with_fallback_keeps_actual" },
  { id = "m4-unfold-budget-unmarked-parent", mechanic = "unfold_budget_unmarked_parent", realizes = ["R1", "A27"], sentence = "Unfolding a parent with no user-approved lazy mark replaces its budget on each scale by the smaller of its tier and the fallback, so no agent act loosens a budget.", stage = 4, test = "scripts/tests/test_effort_armings_approvals.py::test_unfold_unmarked_parent_caps_budget_at_fallback" },
  { id = "m4-unfold-past-new-fire-point", mechanic = "unfold_past_new_fire_point", realizes = ["R1", "A1", "A27"], sentence = "A parent whose kept actual is already past the new budget's fire point fires at the next judging act, unless a deciding act comes first and writes a retier record and no fire.", stage = 4, test = "scripts/tests/test_effort_armings_approvals.py::test_unfold_past_new_fire_point_fires_at_next_judging_act" },
  { id = "m4-unfolded-parent-rearm-budget", mechanic = "unfolded_parent_rearm_budget", realizes = ["R1", "R6", "A20"], sentence = "A user re-arming of an unfolded parent before its sub-plan's approval reopens at the budget the unfold gave it, never at its tier.", stage = 4, test = "scripts/tests/test_effort_armings_approvals.py::test_user_rearm_of_unfolded_parent_keeps_unfold_budget" },
  { id = "m4-unfolded-parent-line", mechanic = "unfolded_parent_line", realizes = ["R1", "R6", "A1"], sentence = "An unfolded parent has its own line beside its sub-stages' lines, carrying the planning-type budget its unfold gave it with its budget source named.", stage = 4, test = "scripts/tests/test_effort_disclosure_migration.py::test_unfolded_lazy_parent_line_carries_fallback" },
  { id = "m4-planner-run-end-planning-act", mechanic = "planner_run_end_planning_act", realizes = ["R2", "A6", "A7"], sentence = "A spawned planner's rows that its run end did not book are booked at the parent's next planning act, which books them first and fires when planning is past the fire point.", stage = 4, test = "scripts/tests/test_effort_planning_segment.py::test_planner_run_end_judged_at_next_submit_plan" },
  { id = "m4-planner-run-end-deciding-act", mechanic = "planner_run_end_deciding_act", realizes = ["R2", "R4", "A7"], sentence = "A spawned planner's rows at a deciding act count toward the closing planning arming, ending as a retier record and never a fire.", stage = 4, test = "scripts/tests/test_effort_planning_segment.py::test_planner_run_end_then_approve_by_user_writes_retier_no_fire" },
  { id = "m4-booking-before-judging-planning-acts", mechanic = "booking_before_judging_planning_acts", realizes = ["R1", "R2", "A2"], sentence = "Every act of the planning set books the session's own rows and its subtree's rows before it judges.", stage = 4, test = "scripts/tests/test_effort_planning_segment.py::test_late_reviewer_rows_fire_at_approve_by_agent" },
  { id = "m4-booking-before-judging-subplan-approve", mechanic = "booking_before_judging_subplan_approve", realizes = ["R1", "R2", "A2"], sentence = "The approve --by agent of a sub-plan books the session's and its subtree's rows before it judges the parent's arming.", stage = 4, test = "scripts/tests/test_effort_armings_approvals.py::test_subplan_agent_approve_books_late_rows_before_judging" },
  { id = "m4-booking-before-closing", mechanic = "booking_before_closing", realizes = ["R1", "R2", "R4", "A2"], sentence = "Every act that closes an arming first books the session's own rows and its subtree's rows and only then closes it, so the retier record counts every row written before the act.", stage = 4, test = "scripts/tests/test_effort_armings_approvals.py::test_late_rows_crossing_multiple_booked_at_approve_by_user" },
  { id = "m4-planning-stamp-time-bound", mechanic = "planning_stamp_time_bound", realizes = ["R2", "A24"], sentence = "The planning stamp loads only the spawners since classify on a session created at schema 62, and a migrated still-planning session's stamp loads none, books no row and still judges.", stage = 4, test = "scripts/tests/test_effort_planning_segment.py::test_planning_stamp_loads_only_spawners_since_classify" },
  { id = "m4-closing-arming-on-drop", mechanic = "closing_arming_on_drop", realizes = ["R1", "R4"], sentence = "A user-approved drop that settles the last stage with no stage pending opens the closing arming in the same act.", stage = 4, test = "scripts/tests/test_effort_armings_approvals.py::test_user_approved_drop_of_last_stage_opens_closing_arming" },
  { id = "m4-migrated-planning-arming-budget", mechanic = "migrated_planning_arming_budget", realizes = ["R7"], sentence = "At the stamping load the planning arming opened at the instant of a still-planning migrated session gets the fallback budget.", stage = 4, test = "scripts/tests/test_effort_disclosure_migration.py::test_migrated_planning_session_judged_against_fallback_from_instant" },
  { id = "m4-switch-closes-window-arming", mechanic = "switch_closes_window_arming", realizes = ["R7", "A9"], sentence = "The switch books first, closes the window arming with the budget A9's arithmetic gives it and writes no retier record, and opens the live stage's arming from zero.", stage = 4, test = "scripts/tests/test_effort_disclosure_migration.py::test_switch_closes_window_arming_with_a9_budget" },
  { id = "m4-pre-answer-figures", mechanic = "pre_answer_figures", realizes = ["R2"], sentence = "The directive that puts the question carries the closing arming's actual against its budget after that act's booking, and a next_steps entry that prints them and tells the coordinator to state them in the ask.", stage = 4, test = "scripts/tests/test_effort_armings_approvals.py::test_present_plan_data_shows_closing_arming_figures_before_approve" },
  { id = "m4-cycle-minutes-route-kept-under-window", mechanic = "cycle_minutes_route_kept_under_window", realizes = ["R2", "R7"], sentence = "The review_trigger cycle_minutes route is retired except while a window arming is open, where a migrated armed session keeps today's route until its switch.", stage = 4, test = "scripts/tests/test_effort_planning_segment.py::test_cycle_minutes_route_kept_while_window_arming_open" },
  { id = "m4-resolve-books-before-quality-row", mechanic = "resolve_books_before_quality_row", realizes = ["R1", "R6"], sentence = "Resolve books the session's and subtree's rows before it builds its directive's lines and writes the quality row, which is written once.", stage = 4, test = "scripts/tests/test_effort_disclosure_migration.py::test_resolve_books_before_quality_row" },
  { id = "m4-pre-switch-no-line", mechanic = "pre_switch_no_line", realizes = ["R7", "A9"], sentence = "A stage settled before the switch has no line, the live stage has one arming and the total counts each tier once.", stage = 4, test = "scripts/tests/test_effort_disclosure_migration.py::test_stage_settled_before_switch_has_no_line" },
  { id = "m4-carried-line-versus-total", mechanic = "carried_line_versus_total", realizes = ["R3", "R6"], sentence = "A line shows the carried part adopted from an earlier session while the session total sums the booked part only, so each figure is counted once across sessions.", stage = 4, test = "scripts/tests/test_effort_disclosure_migration.py::test_carried_arming_line_shows_carried_total_counts_booked" },
  { id = "m4-continuation-frame", mechanic = "continuation_frame", realizes = ["R3"], sentence = "The continuation and the claim check of a live stage inside a pushed sub-plan are searched among that sub-plan's stages and against its approved snapshot.", stage = 4, test = "scripts/tests/test_effort_armings_approvals.py::test_continuation_searched_in_pushed_subplan_frame" },
  { id = "m4-continuation-rematch", mechanic = "continuation_rematch", realizes = ["R3"], sentence = "A plan edit made while a live stage is parked that inserts a stage matches the parked stage again by its continuation and keeps its arming.", stage = 4, test = "scripts/tests/test_effort_armings_approvals.py::test_parked_plan_edit_inserting_stage_keeps_arming_with_continuation" },
  { id = "m4-parked-two-live-protection", mechanic = "parked_two_live_protection", realizes = ["R1", "R3"], sentence = "A replan made while a stage is parked checks both live stages, so it leaves neither the current nor the parked stage without a continuation.", stage = 4, test = "scripts/tests/test_effort_armings_approvals.py::test_replan_while_parked_checks_each_live_stage" },
  { id = "m4-user-approval-while-parked", mechanic = "user_approval_while_parked", realizes = ["R3", "A20"], sentence = "A user approval made while a stage is parked closes and reopens the arming of each live stage, the parked one staying parked.", stage = 4, test = "scripts/tests/test_effort_armings_approvals.py::test_user_approval_while_parked_rearms_each_live_stage_parked_stays_parked" },

