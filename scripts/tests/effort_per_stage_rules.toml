# Rule-to-test registry of the per-stage effort order (Core issue #558).
#
# One row per rule: a sentence that says what the engine does or refuses, its sources among the order's
# R1-R7, K1-K4 and the adopted assumptions A1-A28, the order test (1)-(14) it serves, the stage that
# implements it and the pytest node id that tests it. test_effort_rule_registry.py reads this file:
# test_registry_structure checks the registry's shape and coverage, test_rules_of_stage_have_tests[stageN]
# checks that every row of stage N names a test that exists (red until that stage lands).
#
# Row keys: id, sentence, sources, order_test (1-14, optional), stage (3-5), test, scales (spend,
# wall_clock, both; replans for the replans scale of K1, which is neither), assumption_backed (the
# assumption the row rests on, optional), retires (existing tests the rule supersedes, optional).
# A row with `mechanic` is a plan mechanic that carries out an order clause: it has `realizes` (the ids it
# carries out) in place of sources and no order_test, and never counts toward serving an R or K id or an
# order test, so it cannot stand in for a missing rule.
#
# The sentences quote the order text; a row adds no rule the order does not state.

rows = [
  # ----------------------------------------------------------------------------------------- stage 3, R1
