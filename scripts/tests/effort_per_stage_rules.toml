  { id = "r1-replan-one-owner", sentence = "Every replan books to exactly one owner: the live stage while one is live, whatever opened the replan; otherwise planning before the first approval and closing after the last stage settles.", sources = ["R1"], stage = 3, test = "scripts/tests/test_effort_segments.py::test_every_replan_books_to_exactly_one_owner", scales = "both" },
  { id = "r1-closing-unbudgeted", sentence = "The closing segment has no budget: its actual enters the task total as excess, and it is disclosed as its own line carrying its actual only (R6).", sources = ["R1"], stage = 3, test = "scripts/tests/test_effort_segments.py::test_closing_arming_opens_at_last_settlement_without_a_budget", scales = "both" },
  { id = "r1-closing-cannot-fire", sentence = "Since the diagnosis and replan after the last settlement book to closing, they cannot fire on spend or wall-clock, there being no budget to exceed.", sources = ["R1", "R4"], stage = 3, test = "scripts/tests/test_effort_per_stage_judging.py::test_closing_segment_never_fires", scales = "both" },
