  { id = "r1-handoff-resumes-parked-arming", sentence = "The interval between a stage's passing record-result and the next dispatch, and the handoff of a parked arming back to its stage, run through the engine's own acts, so a parked arming resumes without a new arming opened.", sources = ["R1", "A3"], stage = 3, test = "scripts/tests/test_effort_segments.py::test_handoff_resumes_parked_arming_through_engine_acts", scales = "both", assumption_backed = "A3" },
  { id = "r1-parked-arming-spans-own-rows", sentence = "A booking belongs to the segment current at the time it is written, so a row written before parking and booked during it books to the parked stage, and a row written during parking and booked after the resume books to the stage current then.", sources = ["R1", "A4"], stage = 3, test = "scripts/tests/test_effort_segments.py::test_parked_arming_spans_own_rows_by_write_time", scales = "both", assumption_backed = "A4" },
  { id = "r1-user-drop-closes-armed-stage-arming", sentence = "At the user's approval of a replan that drops an armed live stage, its arming closes at that instant and hands the interval on, rows written before and after it each book once, and no arming of the dropped identity stays open.", sources = ["R1"], stage = 3, test = "scripts/tests/test_effort_per_stage_judging.py::test_user_approved_drop_of_armed_stage_closes_its_arming", scales = "both" },
