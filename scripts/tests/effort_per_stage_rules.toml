  { id = "r1-stage-live-from-selection", sentence = "A stage is live from the moment the engine's own next-stage selection makes it current (the first stage at the plan's approval, each later one at the settlement of the one before it, a stage a replan adds after the last stage has settled at that replan's approval) until it settles.", sources = ["R1"], stage = 3, test = "scripts/tests/test_effort_segments.py::test_stage_arming_opens_at_the_engines_selection", scales = "both" },
